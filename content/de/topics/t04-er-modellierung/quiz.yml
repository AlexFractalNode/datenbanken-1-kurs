- id: t04-q012
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [rekursion, minmax]
  type: single
  question: |-
    Eine Gärtnerei erfasst, welche Pflanze aus welcher Mutterpflanze als Ableger gezogen wurde: rekursive Beziehung `Pflanze stammt ab von Pflanze` mit den Rollen Mutterpflanze und Ableger. Jede Pflanze stammt von höchstens einer Mutterpflanze, gekaufte Pflanzen von keiner. Eine Mutterpflanze kann beliebig viele Ableger haben. Welche (min,max)-Angabe gehört an die Rolle **Ableger**?
  options:
    - text: "(0,1)"
      correct: true
      explain: "Eine Pflanze nimmt in der Rolle Ableger an höchstens einer Beziehung teil, gekaufte Pflanzen an keiner."
    - text: "(0,n)"
      correct: false
      explain: "Das ist die Angabe für die Rolle Mutterpflanze."
    - text: "(1,1)"
      correct: false
      explain: "Dann müsste jede Pflanze eine erfasste Mutterpflanze haben. Es gäbe keine erste Pflanze, nur endlose Ketten oder Zyklen. Dass die Rolle Mutterpflanze schon min = 0 hat, ändert daran nichts: Bei hierarchischen Rekursionen brauchen beide Rollen min = 0."
    - text: "(1,n)"
      correct: false
      explain: "Weder Pflicht noch mehrfach: Keine Pflanze stammt von mehreren Mutterpflanzen."
