- id: t10-s028
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [extremwert, unterabfrage, skalar, max, gleichstand]
  db: musikschule
  kind: query
  prompt: |-
    Welches **Blasinstrument** hat die höchste Leihgebühr? Teilen sich mehrere Blasinstrumente den Höchstwert, sollen **alle** erscheinen. Verwende eine Unterabfrage mit `MAX`.

    Spalten: `bezeichnung`, `leihgebuehr`.
  solution: |-
    SELECT bezeichnung, leihgebuehr
    FROM instrument
    WHERE familie = 'Blas'
      AND leihgebuehr = (SELECT MAX(i2.leihgebuehr)
                         FROM instrument i2
                         WHERE i2.familie = 'Blas');
  ordered: false
  dialect_note: "`SELECT FIRST 1 … ORDER BY leihgebuehr DESC` (PostgreSQL: `LIMIT 1`) liefert immer genau eine Zeile und verliert bei Gleichstand die übrigen. Der Vergleich mit der MAX-Unterabfrage läuft in beiden Systemen gleich."
  hints:
    - "Ein Aggregat darf nicht direkt im WHERE stehen, wohl aber in einer Unterabfrage."
    - "Die Familie muss außen **und** in der Unterabfrage gefiltert werden; sonst vergleichst du mit dem Höchstwert aller Instrumente."
    - "Mit `FIRST 1` und `ORDER BY` bekämst du bei Gleichstand nur eine Zeile."
  paper_mode: write
- id: t10-s029
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, select-liste, korreliert, count]
  db: musikschule
  kind: query
  prompt: |-
    Gib für **jede** Lehrkraft an, wie viele Vertretungen sie **übernommen** hat, also wie oft sie als Vertreter eingetragen ist. Lehrkräfte ohne übernommene Vertretung sollen 0 zeigen. Löse die Aufgabe mit einer **Unterabfrage in der SELECT-Liste**, ohne GROUP BY. Sortiere nach `person_id`.

    Spalten: `person_id`, `nachname`, `vertretungen`.
  solution: |-
    SELECT l.person_id, p.nachname,
           (SELECT COUNT(*)
            FROM vertretung v
            WHERE v.vertreter_id = l.person_id) AS vertretungen
    FROM lehrkraft l
    JOIN person p ON p.person_id = l.person_id
    ORDER BY l.person_id;
  ordered: true
  hints:
    - "Der Nachname steht in `person`, die Rolle Lehrkraft in `lehrkraft`."
    - "Die Unterabfrage ist skalar und korreliert: Sie zählt für die gerade betrachtete Lehrkraft."
    - "`COUNT(*)` über keine Zeile ergibt 0, nicht NULL."
  paper_mode: write
- id: t10-s030
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, abgeleitete-tabelle, aggregat, dialekt]
  db: musikschule
  kind: query
  prompt: |-
    Wie viele Kurse gibt eine Lehrkraft **höchstens** (`hoechstens`), und wie viele **im Durchschnitt** (`durchschnitt`)? Gezählt werden nur Lehrkräfte, die mindestens einen Kurs geben. Zähle zuerst die Kurse je Lehrkraft in einer **abgeleiteten Tabelle** im FROM und werte diese dann aus.

    Spalten: `hoechstens`, `durchschnitt`.
  solution: |-
    SELECT MAX(t.anzahl) AS hoechstens,
           AVG(CAST(t.anzahl AS DOUBLE PRECISION)) AS durchschnitt
    FROM (SELECT lehrkraft_id, COUNT(*) AS anzahl
          FROM kurs
          GROUP BY lehrkraft_id) t;
  ordered: false
  dialect_note: "Firebird würde den Durchschnitt über die ganzzahlige Spalte `anzahl` abschneiden, deshalb der Cast auf DOUBLE PRECISION. Auf Papier genügt `AVG(t.anzahl)` mit dem Hinweis, dass ein genauer Wert gemeint ist."
  hints:
    - "`MAX(COUNT(*))` ist nicht erlaubt: Ein Aggregat darf kein Aggregat enthalten."
    - "In den Beispieldaten gibt jede Lehrkraft mindestens einen Kurs. Die Einschränkung ändert hier also nichts; mit `COUNT(*)` über `kurs` gruppiert erfüllst du sie in jedem Fall."
    - "Gib der Unterabfrage im FROM einen Alias, z. B. `t`, und sprich ihre Spalten als `t.anzahl` an. Der SQL-Standard verlangt den Alias; Firebird 3 und PostgreSQL ab Version 16 kämen auch ohne aus."
  paper_mode: write
- id: t10-s031
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, any, "null"]
  db: musikschule
  kind: query
  prompt: |-
    Gesucht sind alle Instrumente, deren Leihgebühr **niedriger ist als mindestens eine** Leihgebühr der Familie `'Blas'`. Verwende `ANY`.

    Spalten: `bezeichnung`, `familie`, `leihgebuehr`.
  solution: |-
    SELECT bezeichnung, familie, leihgebuehr
    FROM instrument
    WHERE leihgebuehr < ANY (SELECT i2.leihgebuehr
                             FROM instrument i2
                             WHERE i2.familie = 'Blas');
  ordered: false
  hints:
    - "`< ANY (...)` ist wahr, sobald der Wert kleiner ist als wenigstens ein Wert der Unterabfrage. Hier entspricht das „kleiner als das Maximum“."
    - "Auch Blasinstrumente selbst können dazugehören, wenn ein anderes Blasinstrument teurer ist."
    - "Instrumente ohne Leihgebühr fallen heraus: `NULL < x` ist UNKNOWN."
  paper_mode: write
