    - text: "`ALTER TABLE zimmer ADD (balkon BOOLEAN, etage SMALLINT);`"
      correct: false
      explain: "Die Klammerform stammt aus anderen Dialekten. Firebird lehnt Klammern um die Spaltendefinition ab."
    - text: "`ALTER TABLE zimmer ADD COLUMN balkon BOOLEAN, ADD COLUMN etage SMALLINT;`"
      correct: false
      explain: "In PostgreSQL gültig. Firebird 3 kennt `COLUMN` hinter `ADD` nicht."
