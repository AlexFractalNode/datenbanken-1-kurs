  question: |-
    Musikschul-Datenbank: `kurs.raum_id` und `termin.raum_id` dürfen beide NULL sein. Die PostgreSQL-Anfrage `SELECT raum_id FROM kurs INTERSECT SELECT raum_id FROM termin;` und die Firebird-Ausweichform `SELECT DISTINCT k.raum_id FROM kurs k WHERE EXISTS (SELECT 1 FROM termin t WHERE t.raum_id = k.raum_id);` liefern **immer** dasselbe Ergebnis.
  options:
    - text: "wahr"
      correct: false
      explain: "INTERSECT behandelt zwei NULL-Werte als gleich und liefert dann eine NULL-Zeile. Der Vergleich `t.raum_id = k.raum_id` ist bei NULL nie wahr, die EXISTS-Variante liefert diese Zeile nicht."
    - text: "falsch"
      correct: true
      explain: "Richtig: Sobald beide Spalten NULL enthalten, weichen die Ergebnisse um eine NULL-Zeile ab. Ohne NULL-Werte sind beide gleich."
