- id: t11-q001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [insert, default, "null"]
  type: single
  question: "Eine Tabelle ist so definiert: `CREATE TABLE gast (gast_id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, name VARCHAR(30) NOT NULL, vegetarisch BOOLEAN DEFAULT FALSE NOT NULL, allergien VARCHAR(60))`. Was steht nach `INSERT INTO gast (name) VALUES ('Ole')` in der neuen Zeile?"
  options:
    - text: "`gast_id` = nächster Zählerwert, `vegetarisch` = FALSE, `allergien` = NULL"
      correct: true
      explain: "Die Identity-Spalte bekommt den nächsten Wert, `vegetarisch` seinen Default und `allergien` hat keinen Default, also NULL."
    - text: "`gast_id` = NULL, `vegetarisch` = FALSE, `allergien` = NULL"
      correct: false
      explain: "Eine Identity-Spalte wird nie NULL. Fehlt sie im INSERT, vergibt das DBMS den nächsten Wert."
    - text: "`vegetarisch` = NULL, weil die Spalte nicht genannt wurde"
      correct: false
      explain: "Fehlende Spalten bekommen zuerst ihren Default. NULL gibt es nur, wenn kein Default definiert ist."
    - text: "Das INSERT wird abgewiesen, weil nicht alle Spalten genannt sind"
      correct: false
      explain: "Mit Spaltenliste muss man nur die Spalten nennen, die keinen Default haben und NOT NULL sind. Das ist hier nur `name`."
- id: t11-q002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [insert, mehrere-zeilen, dialekt]
  type: truefalse
  question: "In Firebird 3 kann man mit `INSERT INTO t (a, b) VALUES (1, 'x'), (2, 'y')` zwei Zeilen in einer Anweisung einfügen."
  options:
    - text: "Wahr"
      correct: false
      explain: "Das ist PostgreSQL-Syntax. In Firebird 3 liefert `VALUES` genau eine Zeile, die Anweisung ist dort ein Syntaxfehler."
    - text: "Falsch"
      correct: true
      explain: "Richtig. In Firebird 3 schreibt man je Zeile ein INSERT oder verwendet `INSERT … SELECT`."
- id: t11-q003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [insert-select]
  type: multi
  question: "Welche Aussagen über `INSERT INTO ziel (a, b) SELECT x, y FROM quelle WHERE …` sind richtig?"
  options:
    - text: "Es werden so viele Zeilen eingefügt, wie die Abfrage liefert, auch 0 Zeilen."
      correct: true
      explain: "Jede Ergebniszeile wird zu einer neuen Zeile. Liefert die Abfrage nichts, wird nichts eingefügt, und das ist kein Fehler."
    - text: "Die SELECT-Liste muss so viele Spalten haben wie die Spaltenliste, mit passenden Typen."
      correct: true
      explain: "Die Werte werden der Reihe nach den genannten Spalten zugeordnet."
    - text: "Zwischen Spaltenliste und SELECT gehört das Wort `VALUES`."
      correct: false
      explain: "`VALUES` gibt es nur bei festen Werten. Bei einer Abfrage folgt das SELECT direkt."
    - text: "In der SELECT-Liste dürfen Konstanten wie `DATE '2025-01-01'` stehen."
      correct: true
      explain: "Jede Zeile bekommt dann denselben festen Wert in dieser Spalte."
    - text: "Verletzt eine einzige Zeile einen Constraint, werden die übrigen trotzdem eingefügt."
      correct: false
      explain: "Eine Anweisung wirkt ganz oder gar nicht. Scheitert eine Zeile, wird die ganze Anweisung abgewiesen."
- id: t11-q004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [update, where]
  type: single
  question: "Was bewirkt `UPDATE artikel SET preis = preis * 1.1;`?"
  options:
    - text: "Alle Zeilen der Tabelle bekommen einen um 10 % höheren Preis."
      correct: true
      explain: "Ohne WHERE gilt das UPDATE für jede Zeile. Das DBMS fragt nicht nach."
    - text: "Nur die zuletzt eingefügte Zeile wird geändert."
      correct: false
      explain: "SQL kennt keine „aktuelle Zeile“. Ohne Bedingung sind alle Zeilen betroffen."
    - text: "Die Anweisung ist ungültig, weil WHERE fehlt."
      correct: false
      explain: "WHERE ist optional. Gerade deshalb ist ein vergessenes WHERE gefährlich."
    - text: "Es passiert nichts, weil `preis` auf beiden Seiten steht."
      correct: false
      explain: "Rechts steht der alte Wert, links die Spalte, die den neuen Wert bekommt. Das ist erlaubt und üblich."
- id: t11-q005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [update, berechneter-wert]
  type: single
  question: "Eine Zeile hat `a = 1` und `b = 2`. Welche Werte hat sie nach `UPDATE t SET a = b, b = a`?"
  options:
    - text: "`a = 2`, `b = 1`"
      correct: true
      explain: "Alle Ausdrücke rechts verwenden die alten Werte der Zeile. Die Werte werden also getauscht. So verlangt es der Standard, und so arbeiten PostgreSQL und Firebird seit 2.5."
    - text: "`a = 2`, `b = 2`"
      correct: false
      explain: "Das wäre eine schrittweise Auswertung, bei der `b = a` schon den neuen Wert von `a` sieht. Das entspricht nicht dem SQL-Standard."
    - text: "`a = 1`, `b = 1`"
      correct: false
      explain: "Dafür müsste zuerst `b = a` ausgeführt werden. Die Reihenfolge im SET spielt aber keine Rolle."
    - text: "Fehler, weil eine Spalte rechts und links vorkommt"
      correct: false
      explain: "Das ist erlaubt. Die rechten Seiten werden mit den Werten vor der Änderung berechnet."
- id: t11-q006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [update, unterabfrage, aggregat, "null"]
  type: single
  question: "Eine Kletterhalle führt `route (route_id, name, begehungen)` und `begehung (begehung_id, route_id, datum)`. Es läuft `UPDATE route SET begehungen = (SELECT COUNT(*) FROM begehung b WHERE b.route_id = route.route_id)`. Welchen Wert bekommt `begehungen` bei einer neuen Route, für die es noch keine Begehung gibt?"
  options:
    - text: "0"
      correct: true
      explain: "`COUNT(*)` über keine Zeilen liefert 0. Die Unterabfrage gibt also genau eine Zeile mit dem Wert 0 zurück."
    - text: "NULL"
      correct: false
      explain: "NULL käme bei `SUM`, `MAX`, `MIN` oder `AVG` über keine Zeilen heraus. `COUNT` ist die Ausnahme und liefert 0."
    - text: "Der alte Wert bleibt erhalten."
      correct: false
      explain: "Ohne WHERE wird jede Zeile geändert, auch diese. Sie bekommt das Ergebnis der Unterabfrage."
    - text: "Die Anweisung bricht mit einem Fehler ab."
      correct: false
      explain: "Ein Fehler entsteht nur, wenn die Unterabfrage mehr als eine Zeile liefert. Ein Aggregat ohne GROUP BY liefert immer genau eine."
- id: t11-q007
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [delete, truncate, drop]
  type: multi
  question: "Welche Aussagen über `DELETE FROM kunde`, `TRUNCATE TABLE kunde` und `DROP TABLE kunde` sind richtig?"
  options:
    - text: "Nach `DELETE FROM kunde` existiert die Tabelle noch, sie ist nur leer."
      correct: true
      explain: "DELETE entfernt Zeilen, nicht die Tabelle."
    - text: "Nach `DROP TABLE kunde` kann man sofort wieder `INSERT INTO kunde …` ausführen."
      correct: false
      explain: "DROP entfernt die Tabelle samt Struktur. Ein INSERT scheitert, bis sie neu angelegt wird."
    - text: "`TRUNCATE` erlaubt keine WHERE-Bedingung."
      correct: true
      explain: "TRUNCATE leert immer die ganze Tabelle. Wer auswählen will, braucht DELETE mit WHERE."
    - text: "Firebird 3 kennt `TRUNCATE TABLE`."
      correct: false
      explain: "Firebird 3 hat keinen TRUNCATE-Befehl. Dort leert man eine Tabelle mit `DELETE FROM`."
    - text: "`DROP TABLE` gehört zur DDL, `DELETE` zur DML."
      correct: true
      explain: "DROP ändert das Schema, DELETE den Inhalt."
    - text: "In PostgreSQL löst `TRUNCATE TABLE kunde` für jede Zeile die `ON DELETE`-Trigger und referenziellen Aktionen aus, genau wie `DELETE`."
      correct: false
      explain: "TRUNCATE arbeitet nicht zeilenweise. ON-DELETE-Trigger laufen nicht, und verweisen Fremdschlüssel anderer Tabellen auf `kunde`, wird es abgewiesen (außer mit `CASCADE`, das diese Tabellen vollständig mitleert)."
- id: t11-q008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, set-null]
  type: single
  question: "`termin.raum_id` verweist mit `ON DELETE SET NULL` auf `raum`. Raum 4 wird in 12 Terminen benutzt. Was passiert bei `DELETE FROM raum WHERE raum_id = 4`?"
  options:
    - text: "Raum 4 wird gelöscht, die 12 Termine bleiben mit `raum_id = NULL`."
      correct: true
      explain: "SET NULL lässt die Kindzeilen stehen und leert nur ihren Fremdschlüssel. Das setzt voraus, dass `raum_id` NULL-fähig ist."
    - text: "Raum 4 und die 12 Termine werden gelöscht."
      correct: false
      explain: "Das wäre CASCADE."
    - text: "Das DELETE wird abgewiesen, weil noch Termine auf den Raum verweisen."
      correct: false
      explain: "Das wäre NO ACTION, der Standard ohne Angabe."
    - text: "Die Termine bekommen den nächstkleineren Raum."
      correct: false
      explain: "Eine solche Aktion gibt es nicht. Die referenziellen Aktionen sind NO ACTION, CASCADE, SET NULL und SET DEFAULT (PostgreSQL zusätzlich RESTRICT). Keine davon sucht einen „ähnlichen“ Ersatzwert."
- id: t11-q009
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, mehrstufig, no-action]
  type: single
  question: "`bestellung → kunde` hat `ON DELETE CASCADE`, `position → bestellung` hat `ON DELETE CASCADE`, `reklamation → position` hat keine Aktion. Kunde 7 hat zwei Bestellungen, zu einer Position gibt es eine Reklamation. Was bewirkt `DELETE FROM kunde WHERE kunde_id = 7`?"
  options:
    - text: "Nichts. Die ganze Anweisung wird abgewiesen."
      correct: true
      explain: "Die Kaskade würde die Position mit Reklamation löschen. Dort greift NO ACTION, und eine Anweisung wirkt ganz oder gar nicht."
    - text: "Kunde, Bestellungen und Positionen werden gelöscht, nur die Position mit Reklamation bleibt."
      correct: false
      explain: "Teilweise Wirkung gibt es nicht. Scheitert ein Schritt der Kaskade, wird alles zurückgenommen."
    - text: "Alles wird gelöscht, auch die Reklamation."
      correct: false
      explain: "Dafür bräuchte `reklamation → position` ebenfalls CASCADE."
    - text: "Nur der Kunde wird gelöscht, Bestellungen bleiben ohne Kunde."
      correct: false
      explain: "Das wäre SET NULL beim Fremdschlüssel `bestellung → kunde`."
- id: t11-q010
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [identity, returning, dialekt]
  type: multi
  question: "Welche Aussagen über automatische Schlüsselwerte beim Einfügen sind richtig?"
  options:
    - text: "Man lässt die Identity-Spalte in der Spaltenliste weg."
      correct: true
      explain: "Dann vergibt das DBMS den nächsten Zählerwert."
    - text: "Nach `DELETE` der Zeile mit der höchsten ID vergibt das DBMS diese Nummer beim nächsten INSERT neu."
      correct: false
      explain: "Der Zähler läuft nur vorwärts. Gelöschte Nummern bleiben Lücken."
    - text: "`INSERT … RETURNING id` liefert die vergebene Nummer an die Anwendung."
      correct: true
      explain: "Firebird 3 und PostgreSQL kennen beide `RETURNING`."
    - text: "In Firebird 3 kann `INSERT … SELECT … RETURNING id` die IDs vieler eingefügter Zeilen liefern."
      correct: false
      explain: "In Firebird 3 darf eine Anweisung mit RETURNING höchstens eine Zeile betreffen. Mehrere Zeilen führen zu einem Fehler. PostgreSQL liefert dagegen alle."
    - text: "Ein ROLLBACK gibt eine bereits vergebene Nummer zurück, sodass keine Lücke entsteht."
      correct: false
      explain: "Generatoren und Sequenzen stehen außerhalb der Transaktion. Der verbrauchte Wert bleibt verbraucht."
- id: t11-q011
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [transaktion, rollback]
  type: single
  question: "In einer offenen Transaktion laufen `UPDATE konto SET stand = stand - 50 WHERE konto_id = 1` und `UPDATE konto SET stand = stand + 50 WHERE konto_id = 2`. Danach folgt `ROLLBACK`. Welchen Zustand haben die Konten?"
  options:
    - text: "Beide haben wieder ihren Stand von vor der Transaktion."
      correct: true
      explain: "ROLLBACK verwirft alle Änderungen der Transaktion. Genau dafür fasst man zusammengehörige Änderungen in einer Transaktion zusammen."
    - text: "Nur das zweite UPDATE ist zurückgenommen."
      correct: false
      explain: "ROLLBACK nimmt nicht nur die letzte Anweisung zurück, sondern alles seit Beginn der Transaktion (bzw. bis zu einem SAVEPOINT, wenn man ihn nennt)."
    - text: "Beide Änderungen bleiben, ROLLBACK wirkt nur auf DDL."
      correct: false
      explain: "ROLLBACK wirkt auf DML genauso. In Firebird und PostgreSQL sogar auf DDL."
    - text: "Konto 1 ist um 50 kleiner, Konto 2 unverändert."
      correct: false
      explain: "Eine Transaktion wirkt ganz oder gar nicht. Nach ROLLBACK bleibt keine ihrer Änderungen."
- id: t11-q012
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [update-or-insert, upsert, dialekt]
  type: single
  question: "In Firebird läuft `UPDATE OR INSERT INTO lager (artikel_nr, menge) VALUES ('A17', 30) MATCHING (artikel_nr)`. Eine Zeile mit `artikel_nr = 'A17'` und `menge = 12` existiert bereits. Was ist danach gespeichert?"
  options:
    - text: "Eine Zeile `('A17', 30)`"
      correct: true
      explain: "Findet Firebird über die MATCHING-Spalten eine Zeile, ändert es sie und setzt alle genannten Spalten auf die neuen Werte."
    - text: "Eine Zeile `('A17', 42)`"
      correct: false
      explain: "Es wird nicht addiert. Die Menge wird durch den neuen Wert ersetzt. Wer addieren will, schreibt ein UPDATE mit `menge = menge + 30`."
    - text: "Zwei Zeilen `('A17', 12)` und `('A17', 30)`"
      correct: false
      explain: "Eingefügt wird nur, wenn keine passende Zeile existiert."
    - text: "Fehler, weil die Zeile schon existiert"
      correct: false
      explain: "Genau diesen Fall fängt UPDATE OR INSERT ab. Ein einfaches INSERT würde bei einem Primärschlüssel auf `artikel_nr` scheitern."
- id: t11-q013
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [insert, constraints, abweisung, check, fremdschluessel]
  type: multi
  question: "Gegeben sind `stellplatz (stellplatz_id PRIMARY KEY, ort)` mit den Zeilen 1 und 2 sowie `CREATE TABLE fahrrad (rahmen_nr VARCHAR(12) NOT NULL PRIMARY KEY, code VARCHAR(10) UNIQUE, gaenge SMALLINT CHECK (gaenge BETWEEN 1 AND 30), stellplatz_id INTEGER REFERENCES stellplatz (stellplatz_id))`. `fahrrad` enthält schon die Zeile `('R-100', NULL, 21, 1)`. Welche der folgenden Anweisungen werden **abgewiesen**? Jede läuft für sich auf diesem Stand."
  options:
    - text: "`INSERT INTO fahrrad VALUES ('R-200', NULL, 7, 2)`"
      correct: false
      explain: "Gelingt. `code` ist zwar UNIQUE, aber NULL darf in einer einspaltigen UNIQUE-Spalte mehrfach vorkommen."
    - text: "`INSERT INTO fahrrad VALUES ('R-300', 'K-77', NULL, 1)`"
      correct: false
      explain: "Gelingt. Bei `gaenge = NULL` ergibt die CHECK-Bedingung UNKNOWN, und abgewiesen wird nur bei FALSE."
    - text: "`INSERT INTO fahrrad VALUES ('R-400', 'K-78', 0, 1)`"
      correct: true
      explain: "`0 BETWEEN 1 AND 30` ist FALSE, die CHECK-Bedingung ist verletzt."
    - text: "`INSERT INTO fahrrad VALUES ('R-500', 'K-79', 5, 9)`"
      correct: true
      explain: "Einen Stellplatz 9 gibt es nicht. Der Fremdschlüssel wäre verletzt."
    - text: "`INSERT INTO fahrrad VALUES ('R-600', 'K-80', 3, NULL)`"
      correct: false
      explain: "Gelingt. Ein Fremdschlüssel darf NULL sein, das Rad hat dann noch keinen Stellplatz."
- id: t11-q014
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, set-default]
  type: single
  question: "`teilnahme.gruppe_id INTEGER DEFAULT 0 NOT NULL` verweist mit `ON DELETE SET DEFAULT` auf `gruppe (gruppe_id)`. In `gruppe` gibt es die Zeilen 0 („ohne Gruppe“), 1 und 2. Zwei Teilnahmen gehören zu Gruppe 2. Was bewirkt `DELETE FROM gruppe WHERE gruppe_id = 2`?"
  options:
    - text: "Gruppe 2 wird gelöscht, die beiden Teilnahmen bleiben und zeigen auf Gruppe 0."
      correct: true
      explain: "SET DEFAULT setzt den Fremdschlüssel auf den Default 0. Weil es die Elternzeile 0 gibt, bleibt die referenzielle Integrität erhalten."
    - text: "Das DELETE wird abgewiesen, weil `gruppe_id` NOT NULL ist."
      correct: false
      explain: "NOT NULL wäre nur bei SET NULL ein Problem. SET DEFAULT setzt 0, nicht NULL."
    - text: "Gruppe 2 und die beiden Teilnahmen werden gelöscht."
      correct: false
      explain: "Das wäre CASCADE."
    - text: "Gruppe 2 wird gelöscht, die Teilnahmen behalten den Wert 2."
      correct: false
      explain: "Dann zeigten sie auf eine nicht vorhandene Gruppe. Das lässt ein Fremdschlüssel nicht zu. Die Teilnahmen bekommen ihren Default."
- id: t11-q015
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, set-null, mehrstufig]
  type: single
  question: "`projekt.leiter_id` (NULL-fähig) verweist mit `ON DELETE SET NULL` auf `person`. `meilenstein.projekt_id` verweist mit `ON DELETE CASCADE` auf `projekt`. Person 4 leitet Projekt 9, das drei Meilensteine hat. Was bewirkt `DELETE FROM person WHERE person_id = 4`?"
  options:
    - text: "Person 4 wird gelöscht, Projekt 9 bleibt mit `leiter_id = NULL`, die drei Meilensteine bleiben unverändert."
      correct: true
      explain: "SET NULL ändert nur die FK-Spalte in `projekt`. Das Projekt wird nicht gelöscht, also greift das CASCADE von `meilenstein` gar nicht."
    - text: "Person 4, Projekt 9 und die drei Meilensteine werden gelöscht."
      correct: false
      explain: "Dafür müsste `projekt → person` CASCADE haben. SET NULL beendet die Kette."
    - text: "Person 4 wird gelöscht, die Meilensteine bekommen `projekt_id = NULL`."
      correct: false
      explain: "Die Meilensteine verweisen auf das Projekt, und das existiert weiter. Ihr Fremdschlüssel bleibt gültig."
    - text: "Das DELETE wird abgewiesen, weil das Projekt noch Meilensteine hat."
      correct: false
      explain: "Die Meilensteine hängen am Projekt, nicht an der Person. Das Projekt wird nicht gelöscht."
