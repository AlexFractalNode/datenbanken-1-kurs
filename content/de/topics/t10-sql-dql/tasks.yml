  prompt: |-
    Eine Eisdiele führt ihre Sorten in einer Tabelle:

    `sorte`

    | sid | name | art | preis |
    | --- | --- | --- | --- |
    | 1 | Vanille | Milch | 1.80 |
    | 2 | Mango | Frucht | 2.20 |
    | 3 | Maracuja | Frucht | 2.20 |
    | 4 | Zitrone | Frucht | 1.60 |
    | 5 | Mokka | Milch | 2.00 |

    Gib das Ergebnis jeder Abfrage an (Firebird 3).

    **A** (2 P)

    ```sql
    SELECT name FROM sorte
    WHERE preis = (SELECT MAX(preis) FROM sorte);
    ```

    **B** (1 P)

    ```sql
    SELECT FIRST 1 name FROM sorte
    ORDER BY preis DESC, sid;
    ```

    **C** (2 P) Gib das Ergebnis an und begründe, warum es sich nicht eindeutig angeben lässt.

    ```sql
    SELECT FIRST 1 name FROM sorte
    ORDER BY preis DESC;
    ```

    **D** (2 P)

    ```sql
    SELECT s.art, s.name
    FROM sorte s
    WHERE s.preis = (SELECT MAX(x.preis) FROM sorte x
                     WHERE x.art = s.art)
    ORDER BY s.art, s.sid;
    ```

    **E** (3 P)

    ```sql
    SELECT s.name,
           (SELECT COUNT(*) FROM sorte x WHERE x.preis > s.preis) + 1 AS rang
    FROM sorte s
    ORDER BY rang, s.sid;
    ```
  solution: |-
    **A** Mango und Maracuja (2 Zeilen). Die Unterabfrage liefert 2.20; beide Sorten haben diesen Preis.

    **B** Mango. Bei Gleichstand entscheidet `sid`, und Mango hat die kleinere.

    **C** Mango **oder** Maracuja, eine einzige Zeile. Beide haben den höchsten Preis, und ohne zweite Sortierspalte ist die Reihenfolge gleichwertiger Zeilen nicht festgelegt. `FIRST 1` nimmt dann irgendeine davon.

    **D**

    | art | name |
    | --- | --- |
    | Frucht | Mango |
    | Frucht | Maracuja |
    | Milch | Mokka |

    Die Unterabfrage ist korreliert: Für jede Zeile wird das Maximum der **eigenen** Art bestimmt (Frucht 2.20, Milch 2.00). Wer stattdessen mit dem Gesamtmaximum 2.20 vergleicht, verliert Mokka.

    **E**

    | name | rang |
    | --- | --- |
    | Mango | 1 |
    | Maracuja | 1 |
    | Mokka | 3 |
    | Vanille | 4 |
    | Zitrone | 5 |

    Die Unterabfrage in der SELECT-Liste zählt je Sorte, wie viele Sorten teurer sind. Gleich teure Sorten teilen sich den Rang, danach wird ein Rang übersprungen (kein Rang 2).
  rubric:
    - criterion: "A: beide Sorten Mango und Maracuja"
      points: 2
    - criterion: "B: Mango"
      points: 1
    - criterion: "C: eine Zeile, Mango oder Maracuja"
      points: 1
    - criterion: "C: Begründung: Gleichstand ohne weitere Sortierspalte, Reihenfolge nicht festgelegt"
      points: 1
    - criterion: "D: Frucht mit beiden Sorten Mango und Maracuja"
      points: 1
    - criterion: "D: Milch mit Mokka (Maximum der eigenen Art, nicht des Gesamtmaximums)"
      points: 1
    - criterion: "E: Ränge 1, 1 für Mango und Maracuja"
      points: 1
    - criterion: "E: Ränge 3, 4, 5 für Mokka, Vanille, Zitrone"
      points: 1
    - criterion: "E: Reihenfolge der Zeilen korrekt (Mango vor Maracuja über sid)"
      points: 1
