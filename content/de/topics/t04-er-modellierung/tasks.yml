- id: t04-p012
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [erm-modellierung, aggregation, generalisierung]
  type: erm-model
  difficulty: 2
  points: 9
  minutes: 9
  prompt: |-
    > Eine Volkssternwarte erfasst ihre Teleskope mit Inventarnummer und Bezeichnung. Jedes Teleskop ist entweder ein Linsenteleskop (zusätzlich: Objektivdurchmesser) oder ein Spiegelteleskop (zusätzlich: Spiegeldurchmesser, Bauart); andere Arten gibt es nicht.
    > Ein Teleskop besteht aus genau einer Montierung (Montierungsnummer, Typ, Traglast). Jede Montierung gehört zu höchstens einem Teleskop; Ersatzmontierungen stehen im Lager.
    > Zu einem Teleskop gehört außerdem ein Satz Okulare (Okularnummer, Brennweite), der auch leer sein kann. Jedes Okular gehört zu höchstens einem Teleskop.

    a) Erstelle ein ER-Diagramm in **Chen-Notation** mit der is-a-Hierarchie und ihren Eigenschaften sowie den Teil-Ganzes-Beziehungen (is-part-of) mit Chen-Kardinalität und (min,max)-Angaben. (6 P.)
    b) Ordne die beiden Teil-Ganzes-Beziehungen als Rollen- bzw. Mengenaggregation ein und begründe. (2 P.)
    c) Warum wäre „Okular is-a Teleskop“ falsch? (1 P.)
  solution: |-
    a)
    - `Teleskop`: <u>Inventarnummer</u>, Bezeichnung
    - is-a (disjunkt, total) zu `Linsenteleskop` (Objektivdurchmesser) und `Spiegelteleskop` (Spiegeldurchmesser, Bauart), ohne eigene Schlüssel.
    - `Montierung`: <u>Montierungsnummer</u>, Typ, Traglast
    - `Okular`: <u>Okularnummer</u>, Brennweite
    - Teleskop ⟨is-part-of: Montierung⟩ Montierung: Chen 1 bei Teleskop, 1 bei Montierung (1:1); (min,max) Teleskop (1,1), Montierung (0,1).
    - Teleskop ⟨is-part-of: Okulare⟩ Okular: Chen 1 bei Teleskop, n bei Okular; (min,max) Teleskop (0,n), Okular (0,1).
    Ein Lösungsdiagramm liegt in `diagrams/t04-p012.dot`.

    b) Die Montierung ist eine **Rollenaggregation**: eine Komponente mit eigener Rolle, je Teleskop genau eine. Die Okulare sind eine **Mengenaggregation**: beliebig viele gleichartige Teile eines Ganzen.

    c) is-a würde bedeuten, dass jedes Okular selbst ein Teleskop ist (Teilmenge) und Inventarnummer, Bezeichnung und die Subtypen erbt. Ein Okular ist aber nur ein **Teil** eines Teleskops.
