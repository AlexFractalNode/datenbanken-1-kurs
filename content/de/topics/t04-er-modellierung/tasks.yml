- id: t04-p011
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [erm-modellierung, generalisierung, beispieldaten]
  type: erm-model
  difficulty: 3
  points: 12
  minutes: 13
  prompt: |-
    Die Bergwacht Hochtal führt bisher drei Listen. Die folgenden Auszüge sind repräsentativ. „–“ bedeutet „trifft nicht zu“.

    EINSATZKRAFT
    | Pers-Nr | Name | Eintritt | Hundename | Hundeprüfung gültig bis | Sanitätsqualifikation |
    |---|---|---|---|---|---|
    | 11 | Berger | 2015 | Asta | 03/2027 | – |
    | 12 | Kofler | 2019 | – | – | Rettungssanitäter:in |
    | 13 | Huber | 2010 | Bruno | 11/2026 | Notfallsanitäter:in |
    | 14 | Moser | 2022 | – | – | – |

    EINSATZ
    | Einsatz-Nr | Datum | Ort | Einsatzleitung (Pers-Nr) |
    |---|---|---|---|
    | 501 | 12.01. | Nordkar | 13 |
    | 502 | 12.01. | Talstation | 12 |
    | 503 | 03.02. | Nordkar | 13 |

    MITWIRKUNG
    | Einsatz-Nr | Pers-Nr | Stunden |
    |---|---|---|
    | 501 | 11 | 4 |
    | 501 | 13 | 5 |
    | 502 | 12 | 2 |
    | 503 | 11 | 3 |
    | 503 | 14 | 3 |

    Zusatzangaben: Einsatzkräfte mit Hund sind Hundeführer:innen, Einsatzkräfte mit Sanitätsqualifikation sind Sanitäter:innen. Jeder Einsatz hat genau eine Einsatzleitung, die eine Einsatzkraft ist. An jedem Einsatz wirkt mindestens eine Einsatzkraft mit. Neue Einsatzkräfte haben noch an keinem Einsatz mitgewirkt und noch keinen geleitet. Über Hunde ist nur der Name bekannt.

    a) Leite ein ER-Diagramm in **Chen-Notation** ab: Entitätstypen mit Schlüsseln und Attributen, eine Spezialisierung mit ihren Eigenschaften sowie alle Beziehungen mit Chen-Kardinalität und (min,max)-Angaben. Trage keine Fremdschlüssel ein. (10 P.)
    b) Belege die beiden Eigenschaften deiner Spezialisierung mit je einer konkreten Zeile aus den Tabellen. (1 P.)
    c) Begründe, ob der Hund ein Attribut oder ein eigener Entitätstyp ist. (1 P.)
  solution: |-
    a)
    - `Einsatzkraft`: <u>Pers-Nr</u>, Name, Eintritt
    - Spezialisierung (is-a) in `Hundeführer:in` (Hundename, Hundeprüfung gültig bis) und `Sanitäter:in` (Sanitätsqualifikation), ohne eigene Schlüssel. Eigenschaften: **überlappend** und **partiell** (Eigenschaften der Spezialisierung, nicht der Teilnahme).
    - `Einsatz`: <u>Einsatz-Nr</u>, Datum, Ort. Die Spalte „Einsatzleitung (Pers-Nr)“ ist ein Fremdschlüssel und wird zur Beziehung, nicht zum Attribut.
    - `Einsatzkraft` ⟨leitet⟩ `Einsatz`: Chen 1 bei Einsatzkraft, n bei Einsatz; (min,max) Einsatzkraft (0,n), Einsatz (1,1).
    - `Einsatzkraft` ⟨wirkt mit⟩ `Einsatz` (aus Tabelle MITWIRKUNG): Chen m bei Einsatzkraft, n bei Einsatz, Attribut **Stunden** an der Raute; (min,max) Einsatzkraft (0,n), Einsatz (1,n).

    b) Überlappend: Zeile 13 (Huber) hat Hund **und** Sanitätsqualifikation. Partiell: Zeile 14 (Moser) hat keins von beiden.

    c) Attribut des Subtyps Hundeführer:in, weil vom Hund nur der Name bekannt ist und er an keiner eigenen Beziehung teilnimmt. Ein eigener Entitätstyp `Hund` wäre vertretbar, sobald weitere Hundedaten (z. B. Rasse, Chipnummer) oder Hundewechsel erfasst werden sollen.
  rubric:
    - criterion: "a) Einsatzkraft mit unterstrichener Pers-Nr sowie Name und Eintritt"
      points: 1
    - criterion: "a) Zwei Subtypen mit den richtigen Zusatzattributen (je 0,5 pro Subtyp) und ohne eigenen Schlüssel (1)"
      points: 2
    - criterion: "a) is-a-Symbol verbindet Einsatzkraft mit beiden Subtypen"
      points: 0.5
    - criterion: "a) Spezialisierung als überlappend (0,5) und partiell (0,5) gekennzeichnet"
      points: 1
    - criterion: "a) Einsatz mit unterstrichener Einsatz-Nr, Datum und Ort; Einsatzleitung nicht als Attribut"
      points: 1
    - criterion: "a) leitet als Beziehung: Chen 1 bei Einsatzkraft, n bei Einsatz (1); (min,max) Einsatzkraft (0,n), Einsatz (1,1) (1)"
      points: 2
    - criterion: "a) wirkt mit als m:n-Raute (0,5) mit Stunden an der Raute (1); (min,max) Einsatzkraft (0,n), Einsatz (1,n) (1). n, m und * sind gleichwertig"
      points: 2.5
    - criterion: "b) Je Eigenschaft eine passende Zeile als Beleg (je 0,5)"
      points: 1
    - criterion: "c) Nachvollziehbare Entscheidung mit Begründung (nur Name bekannt bzw. weitere Daten)"
      points: 1
