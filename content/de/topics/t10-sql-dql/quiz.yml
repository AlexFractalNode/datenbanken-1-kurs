- id: t10-q012
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [mengenoperationen, union]
  type: single
  question: |-
    `a(x)` enthält 1, 2, 2 und `b(x)` enthält 2, 3. Wie viele Zeilen liefern `SELECT x FROM a UNION SELECT x FROM b` und `… UNION ALL …`?
  options:
    - text: "3 und 5"
      correct: true
      explain: "UNION entfernt alle Duplikate, auch die innerhalb von a: {1, 2, 3}. UNION ALL hängt einfach alle 3 + 2 Zeilen aneinander."
    - text: "4 und 5"
      correct: false
      explain: "UNION entfernt Duplikate im Gesamtergebnis, nicht nur zwischen den beiden Teilen. Die doppelte 2 aus a bleibt also nicht stehen."
    - text: "3 und 3"
      correct: false
      explain: "UNION ALL entfernt keine Duplikate."
    - text: "1 und 5"
      correct: false
      explain: "Eine Zeile wäre die Schnittmenge {2} (INTERSECT), nicht die Vereinigung."
- id: t10-q013
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [mengenoperationen, dialekt]
  type: single
  question: "Wie formuliert man „Kunden-IDs aus `bestellung`, die nicht in `reklamation` vorkommen“ in Firebird 3 am sichersten?"
  options:
    - text: "`SELECT DISTINCT b.kunde_id FROM bestellung b WHERE NOT EXISTS (SELECT 1 FROM reklamation r WHERE r.kunde_id = b.kunde_id)`"
      correct: true
      explain: "NOT EXISTS ersetzt EXCEPT und ist unempfindlich gegen NULL in `reklamation`. DISTINCT bildet die Duplikatentfernung von EXCEPT nach."
    - text: "`SELECT kunde_id FROM bestellung EXCEPT SELECT kunde_id FROM reklamation`"
      correct: false
      explain: "EXCEPT gibt es in PostgreSQL, Firebird 3 meldet einen Syntaxfehler."
    - text: "`SELECT DISTINCT kunde_id FROM bestellung WHERE kunde_id NOT IN (SELECT kunde_id FROM reklamation)`"
      correct: false
      explain: "Läuft zwar, liefert aber ein leeres Ergebnis, sobald `reklamation.kunde_id` einmal NULL ist."
    - text: "`SELECT b.kunde_id FROM bestellung b JOIN reklamation r ON r.kunde_id <> b.kunde_id`"
      correct: false
      explain: "Dieser Join liefert alle Paare mit verschiedenen IDs, also fast jede Kunden-ID, die auch selbst reklamiert haben kann."
- id: t10-q014
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, all, any]
  type: multi
  question: |-
    Ein Zoo hat die Tabellen `ticket(ticket_id, preis)` und `aktion(saison, preis)`. In `SELECT * FROM ticket t WHERE …` wird die Unterabfrage `(SELECT a.preis FROM aktion a WHERE a.saison = 'Winter')` verwendet. Sie liefert **keine** Zeile, und `ticket.preis` ist nie NULL. Welche Aussagen gelten für jede Zeile von `ticket`?
  options:
    - text: "`t.preis > ALL (…)` ist TRUE."
      correct: true
      explain: "ALL über eine leere Menge ist wahr: Es gibt keinen Wert, der die Bedingung verletzt."
    - text: "`t.preis > ANY (…)` ist FALSE."
      correct: true
      explain: "ANY verlangt mindestens einen passenden Wert; bei leerer Menge gibt es keinen."
    - text: "`t.preis > (SELECT MAX(a.preis) FROM aktion a WHERE a.saison = 'Winter')` ist TRUE."
      correct: false
      explain: "MAX über keine Zeile ist NULL, der Vergleich also UNKNOWN. ALL und MAX sind bei leerer Menge nicht gleichwertig, ebenso wenig bei NULL-Werten in der Unterabfrage: MAX übergeht NULL, ALL wird dadurch höchstens UNKNOWN."
    - text: "`EXISTS (…)` ist UNKNOWN."
      correct: false
      explain: "EXISTS ist nie UNKNOWN. Bei leerer Unterabfrage ist es FALSE."
- id: t10-q015
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, korreliert]
  type: single
  question: "Woran erkennt man eine korrelierte Unterabfrage?"
  options:
    - text: "Sie verwendet eine Spalte einer Tabelle aus der äußeren Abfrage."
      correct: true
      explain: "Durch diesen Bezug hängt ihr Ergebnis von der gerade geprüften äußeren Zeile ab."
    - text: "Sie steht im FROM und hat einen Alias."
      correct: false
      explain: "Das ist eine abgeleitete Tabelle (Derived Table). Sie ist in der Regel nicht korreliert."
    - text: "Sie enthält eine Aggregatfunktion."
      correct: false
      explain: "`(SELECT AVG(preis) FROM kurs)` enthält ein Aggregat, ist aber unkorreliert und liefert für alle Zeilen denselben Wert."
    - text: "Sie liefert genau einen Wert."
      correct: false
      explain: "Das macht eine Unterabfrage skalar, nicht korreliert. Beides kann zusammen vorkommen, muss aber nicht."
- id: t10-q016
