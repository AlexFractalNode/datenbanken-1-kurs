  ordered: false
  hints:
    - "Eine offene Ausleihe hat kein Rückgabedatum."
    - "`IN` prüft nur, ob die ID in der Liste vorkommt; Duplikate in der Liste vervielfachen die Person nicht."
  paper_mode: write
- id: t10-s021
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, not-exists, korreliert]
  db: musikschule
  kind: query
  prompt: |-
    Welche Instrumente werden **weder in einem Kurs unterrichtet noch wurden sie je ausgeliehen**? Verwende `NOT EXISTS`.

    Spalte: `bezeichnung`.
  solution: |-
    SELECT i.bezeichnung
    FROM instrument i
    WHERE NOT EXISTS (SELECT 1 FROM kurs k WHERE k.instrument_id = i.instrument_id)
      AND NOT EXISTS (SELECT 1 FROM ausleihe a WHERE a.instrument_id = i.instrument_id);
  ordered: false
  hints:
    - "`EXISTS` ist wahr, sobald die Unterabfrage mindestens eine Zeile liefert; was sie auswählt, ist egal."
    - "Die Unterabfrage bezieht sich auf das Instrument der äußeren Abfrage (korreliert)."
  paper_mode: write
- id: t10-s022
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, not-in, "null", dreiwertige-logik]
  db: musikschule
  kind: query
  prompt: |-
    Eine Kollegin will die Instrumente finden, zu denen es keinen Kurs gibt, und schreibt:

    ```sql
    SELECT bezeichnung
    FROM instrument
    WHERE instrument_id NOT IN (SELECT instrument_id FROM kurs);
    ```

    a) Sage das Ergebnis dieser Abfrage **vorher**, bevor du sie ausführst. Beachte: In `kurs` ist `instrument_id` bei Musiktheorie und Chor NULL. Begründe das Ergebnis mit der dreiwertigen Logik.

    b) Schreibe eine korrigierte Abfrage mit `NOT EXISTS`, die wirklich alle Instrumente ohne Kurs liefert. (Die automatische Prüfung vergleicht diese korrigierte Abfrage.)

    Spalte: `bezeichnung`.
  solution: |-
    -- a) Die Abfrage der Kollegin liefert KEINE Zeile (leeres Ergebnis).
    --    Die Unterabfrage enthält NULL. x NOT IN (1, 2, NULL) bedeutet
    --    x <> 1 AND x <> 2 AND x <> NULL. Der letzte Vergleich ist UNKNOWN,
    --    die UND-Kette also hoechstens UNKNOWN und nie TRUE.
    --    WHERE behaelt nur TRUE, daher faellt jede Zeile heraus.
    -- b) Korrektur mit NOT EXISTS:
    SELECT i.bezeichnung
    FROM instrument i
    WHERE NOT EXISTS (SELECT 1
                      FROM kurs k
                      WHERE k.instrument_id = i.instrument_id);
  ordered: false
  hints:
    - "`x NOT IN (a, b, NULL)` bedeutet `x <> a AND x <> b AND x <> NULL`."
    - "`x <> NULL` ist UNKNOWN. TRUE AND UNKNOWN ergibt UNKNOWN, und WHERE behält nur TRUE."
    - "Für b): `NOT EXISTS` fragt nur, ob es eine passende Zeile gibt. NULL in `kurs.instrument_id` passt zu keinem Instrument und stört deshalb nicht."
  paper_mode: write
- id: t10-s023
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, all]
  db: musikschule
  kind: query
  prompt: |-
    Welche Kurse kosten im Monat **mehr als jeder einzelne Kurs** des Niveaus `'Anfaenger'`? Verwende `ALL`.

    Spalten: `kurs_id`, `titel`, `gebuehr_monat`.
  solution: |-
    SELECT kurs_id, titel, gebuehr_monat
    FROM kurs
    WHERE gebuehr_monat > ALL (SELECT k2.gebuehr_monat
                               FROM kurs k2
                               WHERE k2.niveau = 'Anfaenger');
  ordered: false
  hints:
    - "`> ALL (...)` ist wahr, wenn der Wert größer ist als jeder Wert der Unterabfrage."
    - "Hier liefert `> (SELECT MAX(...) ...)` dasselbe, weil die Unterabfrage Zeilen hat und `gebuehr_monat` nie NULL ist. Allgemein sind beide nicht gleichwertig: Bei leerer Unterabfrage ist ALL TRUE, der MAX-Vergleich UNKNOWN. Bei einem NULL-Wert in der Unterabfrage ist ALL höchstens UNKNOWN, während MAX den NULL-Wert übergeht."
  paper_mode: write
- id: t10-s024
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, skalar, avg, dialekt]
  db: musikschule
  kind: query
  prompt: |-
    Welche Kurse sind **teurer als der Durchschnitt** aller Kurse (bezogen auf die Monatsgebühr)?

    Spalten: `kurs_id`, `titel`, `gebuehr_monat`.
  solution: |-
    SELECT kurs_id, titel, gebuehr_monat
    FROM kurs
    WHERE gebuehr_monat > (SELECT AVG(CAST(gebuehr_monat AS DOUBLE PRECISION))
                           FROM kurs);
  ordered: false
  dialect_note: "Firebird schneidet `AVG` über `NUMERIC(8,2)` auf zwei Stellen ab. Für dieses Ergebnis ist der Cast trotzdem nicht nötig: Bei Werten mit zwei Nachkommastellen ist `x > abgeschnittener Durchschnitt` gleichbedeutend mit `x > genauer Durchschnitt`. Die Lösung ohne Cast zählt auf Papier voll; der Cast zeigt nur die neutrale Schreibweise für Fälle, in denen der Durchschnitt selbst ausgegeben wird."
  hints:
    - "Aggregatfunktionen sind im WHERE verboten, in einer Unterabfrage aber erlaubt."
    - "Die Unterabfrage liefert genau einen Wert (skalare Unterabfrage)."
  paper_mode: write
- id: t10-s025
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, korreliert, avg, "null"]
  db: firma
  kind: query
  prompt: |-
    Wer verdient **mehr als der Durchschnitt der eigenen Abteilung**? Verwende eine korrelierte Unterabfrage.

    Spalten: `mitarbeiter_id`, `nachname`, `abteilung_id`, `gehalt`.
  solution: |-
    SELECT m.mitarbeiter_id, m.nachname, m.abteilung_id, m.gehalt
    FROM mitarbeiter m
    WHERE m.gehalt > (SELECT AVG(CAST(m2.gehalt AS DOUBLE PRECISION))
                      FROM mitarbeiter m2
                      WHERE m2.abteilung_id = m.abteilung_id);
  ordered: false
  dialect_note: "Firebird schneidet `AVG` über `NUMERIC(9,2)` auf zwei Stellen ab. Für dieses Ergebnis ist der Cast nicht nötig: Bei Gehältern mit zwei Nachkommastellen ist `x > abgeschnittener Durchschnitt` gleichbedeutend mit `x > genauer Durchschnitt`. Die Lösung ohne Cast zählt auf Papier voll."
  hints:
    - "Die Unterabfrage wird gedanklich für jede Zeile der äußeren Abfrage neu ausgewertet."
    - "Verbinde innen und außen über die Abteilung: `m2.abteilung_id = m.abteilung_id`."
    - "Der Werkstudent ohne Abteilung: `m2.abteilung_id = NULL` trifft nie zu, der Durchschnitt ist NULL, der Vergleich UNKNOWN."
