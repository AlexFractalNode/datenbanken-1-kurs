- id: t10-p008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [mengenoperationen, intersect-ersatz, except-ersatz, not-in, dialekt]
  type: sql-write
  difficulty: 3
  points: 8
  minutes: 8
  prompt: |-
    Eine Musikschule speichert unter anderem:

    - `belegung(schueler_id, kurs_id, angemeldet_am, …)` mit dem Primärschlüssel (`schueler_id`, `kurs_id`); eine Person kann mehrere Kurse belegen,
    - `ausleihe(ausleihe_id, instrument_id, schueler_id, ausgabe, rueckgabe)`; eine Person kann mehrmals ausleihen,
    - `lehrkraft(person_id, …)` und `vertretung(vertretung_id, lehrkraft_id, vertreter_id, von, bis)`; `vertreter_id` ist NOT NULL,
    - `instrument(instrument_id, bezeichnung, …)`; in `lehrkraft` gibt es zusätzlich die Spalte `hauptinstrument_id` (Fremdschlüssel auf `instrument`), die NULL ist, wenn eine Lehrkraft kein Hauptinstrument hat.

    Die beiden folgenden Abfragen laufen in PostgreSQL, aber **nicht in Firebird 3**:

    ```sql
    -- (1) Schülerinnen und Schüler, die einen Kurs belegt UND ein Instrument ausgeliehen haben
    SELECT schueler_id FROM belegung
    INTERSECT
    SELECT schueler_id FROM ausleihe;

    -- (2) Lehrkräfte, die noch nie jemanden vertreten haben
    SELECT person_id FROM lehrkraft
    EXCEPT
    SELECT vertreter_id FROM vertretung;
    ```

    a) Formuliere (1) gleichwertig ohne `INTERSECT`. Achte darauf, dass das Ergebnis genau dieselben Zeilen enthält. (3 P)

    b) Formuliere (2) gleichwertig ohne `EXCEPT` mit `NOT EXISTS`. (3 P)

    c) In (2) würde auch `WHERE person_id NOT IN (SELECT vertreter_id FROM vertretung)` funktionieren. Warum ist das hier unbedenklich? Nenne eine Abfrage auf den oben genannten Tabellen, bei der `NOT IN` ein falsches (leeres) Ergebnis liefern würde, und begründe. (2 P)
  solution: |-
    a)

    ```sql
    SELECT DISTINCT b.schueler_id
    FROM belegung b
    WHERE EXISTS (SELECT 1 FROM ausleihe a
                  WHERE a.schueler_id = b.schueler_id);
    ```

    Gleichwertig: `SELECT DISTINCT schueler_id FROM belegung WHERE schueler_id IN (SELECT schueler_id FROM ausleihe)`. Das `DISTINCT` ist hier nötig: `INTERSECT` entfernt Duplikate, und wer zwei Kurse belegt, steht zweimal in `belegung`. Ohne `DISTINCT` erschiene diese Person doppelt. Ein Join `belegung JOIN ausleihe` bräuchte ebenfalls `DISTINCT`, weil er Kurse und Ausleihen miteinander kombiniert.

    b)

    ```sql
    SELECT l.person_id
    FROM lehrkraft l
    WHERE NOT EXISTS (SELECT 1 FROM vertretung v
                      WHERE v.vertreter_id = l.person_id);
    ```

    `DISTINCT` ist hier nicht nötig, weil `person_id` in `lehrkraft` Primärschlüssel ist.

    c) `vertreter_id` ist NOT NULL, die Unterabfrage enthält also nie NULL. Falsch wäre z. B. „Instrumente, die niemandes Hauptinstrument sind“ mit `SELECT i.bezeichnung FROM instrument i WHERE i.instrument_id NOT IN (SELECT hauptinstrument_id FROM lehrkraft)`: Eine Lehrkraft ohne Hauptinstrument liefert NULL in der Liste. Dann ist `x <> NULL` für jedes Instrument UNKNOWN, die UND-Verknüpfung höchstens UNKNOWN, und das Ergebnis ist leer, obwohl es solche Instrumente gibt. Richtig: `NOT EXISTS` oder `WHERE hauptinstrument_id IS NOT NULL` in der Unterabfrage.
  rubric:
    - criterion: "a) EXISTS bzw. IN prüft dieselbe Person in ausleihe (korrekt verknüpft)"
      points: 2
    - criterion: "a) Duplikate ausgeschlossen: DISTINCT ergänzt oder die äußere Abfrage läuft über eine Tabelle mit eindeutiger Personen-ID (z. B. `schueler` mit zwei EXISTS)"
      points: 1
    - criterion: "b) NOT EXISTS mit korrekter Korrelation vertreter_id = person_id"
      points: 2
    - criterion: "b) äußere Abfrage auf lehrkraft, Ausgabe person_id"
      points: 1
    - criterion: "c) hier unbedenklich, weil vertreter_id NOT NULL ist"
      points: 1
    - criterion: "c) Beispiel mit einer NULL-fähigen Spalte aus den genannten Tabellen (z. B. lehrkraft.hauptinstrument_id) und Begründung über UNKNOWN → leeres Ergebnis"
      points: 1
