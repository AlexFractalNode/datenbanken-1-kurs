- id: t04-p007
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [zeitbezug]
  type: erm-model
  difficulty: 2
  points: 8
  minutes: 8
  prompt: |-
    Im ER-Modell eines Tierheims gilt bisher:

    ```
    Tier (Tier-Nr., Name)  —n—  ⟨ist untergebracht in⟩  —1—  Gehege (Gehege-Nr., Größe)
    ```

    Künftig soll nachvollziehbar sein, **wann** welches Tier in welchem Gehege war. Ein Tier kann auch mehrfach in dasselbe Gehege zurückkehren. Jedes Tier wird bei der Aufnahme sofort einem Gehege zugewiesen. Gehege können auch leer stehen.

    a) Erkläre, warum das bisherige Modell dafür nicht ausreicht. (1,5 P.)
    b) Modelliere die Historie in Chen-Notation mit Schlüsseln, Chen-Kardinalitäten und (min,max)-Angaben. (4,5 P.)
    c) Woran erkennt man in deinem Modell die aktuelle Unterbringung eines Tiers? (1 P.)
    d) Nenne eine fachliche Regel zur Historie, die das Diagramm nicht ausdrücken kann. (1 P.)
  solution: |-
    a) Die n:1-Beziehung speichert je Tier nur **ein** Gehege, also nur den aktuellen Zustand. Beim Umzug wird die Zuordnung überschrieben, frühere Gehege und die Zeiträume gehen verloren.

    b) Musterlösung (Variante A):
    - Neuer Entitätstyp `Unterbringung`: <u>Unterbringungs-Nr.</u> (künstlicher Schlüssel), von, bis.
    - `Tier` —1— ⟨hat⟩ —n— `Unterbringung`: (min,max) Tier (1,n), Unterbringung (1,1)
    - `Gehege` —1— ⟨beherbergt⟩ —n— `Unterbringung`: (min,max) Gehege (0,n), Unterbringung (1,1)
    - Die alte direkte Beziehung Tier–Gehege entfällt.
    Das Paar (Tier-Nr., Gehege-Nr.) reicht nicht als Schlüssel, weil ein Tier mehrfach in dasselbe Gehege zurückkehren kann.

    Gleichwertige Varianten:
    - **B:** `Unterbringung` als schwacher Entitätstyp von Tier (doppelter Rahmen, identifizierende doppelte Raute ⟨hat⟩) mit partiellem Schlüssel *von*. Die Tier-Nr. erscheint dabei **nicht** als Attribut an Unterbringung, sie kommt über die identifizierende Beziehung hinzu. Kardinalitäten wie in A.
    - **D:** Zeit als eigener Entitätstyp in einer ternären Beziehung:
      - `Zeitraum`: <u>Zeitraum-Nr.</u> (künstlicher Schlüssel, weil *bis* bei der aktuellen Unterbringung leer ist), von, bis
      - ternäre Raute ⟨ist untergebracht in⟩ zwischen `Tier`, `Gehege` und `Zeitraum`; die alte binäre Beziehung entfällt
      - Chen (je feste Kombination der beiden anderen): **1 bei Gehege** (ein Tier ist in einem Zeitraum in genau einem Gehege), **n bei Tier** (in einem Gehege können im selben Zeitraum mehrere Tiere sein), **m bei Zeitraum** (dasselbe Tier kann in mehreren Zeiträumen im selben Gehege gewesen sein)
      - (min,max): Tier (1,n) (sofort zugewiesen, später weitere Unterbringungen), Gehege (0,n) (kann leer stehen), Zeitraum (1,n) (ein Zeitraum wird nur erfasst, wenn er verwendet wird, und kann für mehrere Tiere gelten)
      - Eine Rückkehr ergibt ein neues Tupel (Tier, Gehege, anderer Zeitraum). Identifiziert wird eine Unterbringung durch (Tier-Nr., Zeitraum-Nr.).

    Nicht gleichwertig (**Variante C**): eine m:n-Beziehung ⟨ist untergebracht in⟩ mit von und bis als Attributen an der Raute. In der Mengensicht ist eine Beziehung durch das Paar (Tier, Gehege) bestimmt, ein Attribut kann eine Rückkehr ins selbe Gehege nicht als zweite Beziehung unterscheiden. Nur wenn ausdrücklich als vereinfachende Notationserweiterung vereinbart wird, dass *von* zum Beziehungsschlüssel gehört, gibt es dafür Teilpunkte.

    c) An der Unterbringung, deren **bis leer** ist (offener Gültigkeitszeitraum).

    d) Beispiele: Die Zeiträume eines Tiers dürfen sich nicht überschneiden. *von* muss vor *bis* liegen. Je Tier gibt es höchstens eine Unterbringung mit leerem *bis*.
  rubric:
    - criterion: "a) Erklärt, dass nur der aktuelle Zustand gespeichert und beim Wechsel überschrieben wird"
      points: 1.5
    - criterion: "b) Zeitbezug mit von und bis über einen eigenen Entitätstyp modelliert: Unterbringung (Variante A/B) oder Zeitraum in ternärer Beziehung (D). Variante C (nur Attribute an einer m:n-Raute) höchstens 0,5, und nur mit ausdrücklich vereinbarter Notationserweiterung"
      points: 1.5
    - criterion: "b) Identifikation unterscheidet Rückkehr ins selbe Gehege: künstlicher Schlüssel, schwacher Typ mit partiellem Schlüssel von, oder bei D ein Zeitraum-Entitätstyp mit eigenem Schlüssel als dritter Partner. Nicht ausreichend: nur (Tier, Gehege). Kein Attribut Tier-Nr. an Unterbringung (wäre ein Fremdschlüssel)"
      points: 1
    - criterion: "b) Kardinalitäten passend zur gewählten Variante. A/B: Tier–Unterbringung mit Chen 1 bei Tier, n bei Unterbringung (0,5) und (min,max) Tier (1,n), Unterbringung (1,1) (0,5); Gehege–Unterbringung mit Chen 1 bei Gehege, n bei Unterbringung (0,5) und (min,max) Gehege (0,n), Unterbringung (1,1) (0,5). D: Chen 1 bei Gehege (0,5); n bei Tier und m bei Zeitraum (0,5); (min,max) Tier (1,n) (0,5); Gehege (0,n) und Zeitraum (1,n) (0,5). n, m und * sind gleichwertig"
      points: 2
    - criterion: "c) Aktuelle Unterbringung über leeres bis erkannt"
      points: 1
    - criterion: "d) Eine zutreffende, im Diagramm nicht darstellbare Regel genannt"
      points: 1
  space: box:110
- id: t04-p008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [kardinalitaet, umrechnung]
  type: define-example
  difficulty: 1
  points: 9
  minutes: 9
  prompt: |-
    Gib für jeden der Kardinalitätstypen **1:1**, **1:n** und **m:n** ein **eigenes** Beispiel an, das nicht aus den Kursmaterialien stammt.
    Zeichne jedes Beispiel als kleine Chen-Skizze (Entitätstypen, Raute, Kardinalitäten an den Kanten). Formuliere je Beispiel einen Satz pro Leserichtung mit Unter- und Obergrenze und gib die (min,max)-Angaben an.
  solution: |-
    Musterlösung (andere passende Beispiele gleichwertig):

    **1:1:** `Land —1— ⟨hat als Hauptstadt⟩ —1— Stadt`
    - Jedes Land hat genau eine Hauptstadt. Eine Stadt ist Hauptstadt von höchstens einem Land, die meisten von keinem.
    - (min,max): Land (1,1), Stadt (0,1)

    **1:n:** `Wetterstation —1— ⟨liefert⟩ —n— Messwert`
    - Jeder Messwert stammt von genau einer Wetterstation. Eine Station liefert keinen bis beliebig viele Messwerte (neue Stationen noch keinen).
    - (min,max): Wetterstation (0,n), Messwert (1,1)

    **m:n:** `Wanderer:in —m— ⟨besteigt⟩ —n— Gipfel`
    - Eine Wanderer:in besteigt keinen bis beliebig viele Gipfel. Ein Gipfel wird von keiner bis beliebig vielen Wanderer:innen bestiegen.
    - (min,max): Wanderer:in (0,n), Gipfel (0,m)
  rubric:
    - criterion: "Je Kardinalitätstyp ein eigenes, fachlich passendes Beispiel, dessen Obergrenzen wirklich 1:1, 1:n bzw. m:n sind (je 1)"
      points: 3
    - criterion: "Je Chen-Skizze die Kardinalitäten auf der richtigen Seite (look-across) (je 1)"
      points: 3
    - criterion: "Je Beispiel zwei Sätze mit Unter- und Obergrenze (0,5) und dazu passende (min,max)-Angaben auf der eigenen Seite (0,5). n, m und * sind gleichwertig"
      points: 3
  space: box:120
- id: t04-p009
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [generalisierung, rekursion, n-aer]
  type: define-example
  difficulty: 2
  points: 12
  minutes: 12
  prompt: |-
    Erkläre die folgenden Begriffe und gib zu jedem ein **eigenes** Beispiel mit kleiner Chen-Skizze an (nicht aus den Kursmaterialien):
    a) **Generalisierung/Spezialisierung**: Skizze mit Schlüssel und je einem Zusatzattribut pro Subtyp; gib an, ob dein Beispiel total oder partiell und disjunkt oder überlappend ist (4 P.)
    b) **rekursive Beziehung**: Skizze mit Rollennamen, Chen-Kardinalitäten und (min,max)-Angaben (4 P.)
    c) **n-äre (hier ternäre) Beziehung**: Skizze mit einem Attribut an der Raute und Chen-Kardinalitäten; begründe, warum sie nicht in binäre Beziehungen zerlegt werden sollte (4 P.)
  solution: |-
    Musterlösung (andere passende Beispiele gleichwertig):

    a) **Generalisierung** fasst gemeinsame Eigenschaften mehrerer Entitätstypen in einem Obertyp zusammen (bottom-up), **Spezialisierung** leitet Subtypen mit Zusatzeigenschaften ab (top-down). Subtypen sind Teilmengen des Obertyps und erben dessen Schlüssel.
    Beispiel: `Gewässer` (<u>Gewässer-ID</u>, Name) is-a `Fluss` (Länge) und `See` (Fläche). Der Schlüssel steht nur am Obertyp, die Subtypen tragen nur ihre Zusatzattribute. **Disjunkt** (nichts ist zugleich Fluss und See) und **partiell** (Weiher werden nur als Gewässer geführt).

    b) Eine **rekursive Beziehung** verbindet einen Entitätstyp mit sich selbst; die beiden Kanten werden durch Rollen unterschieden.
    Beispiel: `Gipfel` ⟨ist Nebengipfel von⟩ `Gipfel` mit den Rollen Hauptgipfel (Chen 1) und Nebengipfel (Chen n). (min,max): Hauptgipfel (0,n), Nebengipfel (0,1). Beide Untergrenzen sind 0. Hätte die Rolle Nebengipfel min = 1, müsste jeder Gipfel einem anderen untergeordnet sein, es gäbe keinen obersten Gipfel, nur endlose Ketten oder Zyklen. Hätte die Rolle Hauptgipfel min = 1, bräuchte jeder Gipfel einen Nebengipfel, und es gäbe keinen untersten.

    c) Eine **n-äre Beziehung** verbindet drei oder mehr Entitätstypen über eine Raute; die Tatsache entsteht erst aus der Kombination aller Partner.
    Beispiel: eine ternäre Raute ⟨bereitet zu⟩ zwischen `Köch:in` (<u>Personal-Nr.</u>), `Gericht` (<u>Gericht-Nr.</u>) und `Veranstaltung` (<u>Veranstaltungs-Nr.</u>), Attribut Portionen an der Raute. Chen je feste Kombination der beiden anderen: n bei Köch:in (ein Gericht für eine Veranstaltung kann von mehreren gekocht werden), m bei Gericht (eine Köch:in kocht für eine Veranstaltung mehrere Gerichte), p bei Veranstaltung (eine Köch:in kocht dasselbe Gericht für mehrere Veranstaltungen). Begründung: Die Portionen gehören zur Dreierkombination. Aus den Paaren Köch:in–Gericht, Gericht–Veranstaltung und Köch:in–Veranstaltung lässt sich nicht ablesen, wer welches Gericht für welche Veranstaltung gekocht hat. Die Zerlegung ist nicht verlustfrei.
  rubric:
    - criterion: "a) Begriffe korrekt erklärt inkl. Vererbung bzw. Teilmenge (1), eigenes passendes Beispiel mit is-a-Skizze (1), unterstrichener Schlüssel nur am Obertyp (0,5) und je ein Zusatzattribut an jedem Subtyp (0,5), Eigenschaften total/partiell (0,5) und disjunkt/überlappend (0,5) richtig angegeben"
      points: 4
    - criterion: "b) Begriff korrekt erklärt (1), Skizze mit beiden Rollennamen am selben Rechteck (1), Chen-Kardinalität je Rolle korrekt platziert (1), (min,max)-Angaben je Rolle passend (0,5) mit min = 0 an beiden Rollen bei einer hierarchischen Rekursion (0,5); bei einer symmetrischen Rekursion zählt min ≥ 1 nur mit fachlicher Begründung"
      points: 4
    - criterion: "c) Begriff korrekt erklärt (1), Skizze mit einer Raute zu drei Entitätstypen und Attribut an der Raute (1), Chen-Angaben an allen drei Kanten mit „je feste Kombination der anderen“ passend zum Beispiel (1), Begründung gegen die Zerlegung (Kombination bzw. nicht verlustfrei) (1)"
      points: 4
  space: box:220
- id: t04-p010
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [notation, chen]
  type: explain
  difficulty: 1
  points: 7
  minutes: 7
  prompt: |-
    Ein Chen-Diagramm enthält die folgenden grafischen Elemente. Benenne für jedes, was es darstellt.

    1. Rechteck mit einfachem Rahmen
    2. Rechteck mit doppeltem Rahmen
    3. Raute mit einfachem Rahmen
    4. Raute mit doppeltem Rahmen
    5. Ellipse mit durchgezogen unterstrichenem Namen
    6. Ellipse mit gestrichelt unterstrichenem Namen
    7. Ellipse mit doppeltem Rand
    8. Ellipse mit gestricheltem Rand
    9. Ellipse, an der weitere Ellipsen hängen
    10. Doppellinie zwischen einem Rechteck und einer Raute
    11. Dreieck mit der Beschriftung „is-a“, verbunden mit einem Rechteck oben und zwei Rechtecken unten
    12. Zwei beschriftete Kanten von derselben Raute zum selben Rechteck

    Gib zusätzlich an, welche (min,max)-Untergrenze Element 10 für den angeschlossenen Entitätstyp bedeutet. (1 P.)
  solution: |-
    1. Entitätstyp (stark)
    2. schwacher Entitätstyp
    3. Beziehungstyp
    4. identifizierende Beziehung (zu einem schwachen Entitätstyp)
    5. Schlüsselattribut (Teil des Primärschlüssels)
    6. partieller Schlüssel eines schwachen Entitätstyps
    7. mehrwertiges Attribut
    8. abgeleitetes Attribut
    9. zusammengesetztes Attribut mit Teilattributen
    10. totale Teilnahme (Pflichtteilnahme) des Entitätstyps an der Beziehung
    11. Generalisierung/Spezialisierung: Obertyp oben, Subtypen unten
    12. rekursive Beziehung, die Beschriftungen sind Rollennamen

    Zusatz: Element 10 bedeutet min ≥ 1 (z. B. (1,1) oder (1,n)) für den Entitätstyp an der Doppellinie.
  rubric:
    - criterion: "Zwölf Elemente korrekt benannt (je 0,5)"
      points: 6
    - criterion: "Zusatz: Doppellinie bedeutet Untergrenze mindestens 1"
      points: 1
