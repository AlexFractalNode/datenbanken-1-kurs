- id: t04-p013
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [erm-lesen, fehler-finden, redundanz]
  type: erm-read
  difficulty: 2
  points: 8
  minutes: 9
  prompt: |-
    Für einen Gemeinschaftsgarten gilt: Jede Gärtner:in gehört zu genau einer Gruppe. Jedes Beet wird von genau einer Gruppe bewirtschaftet; zuständig für ein Beet sind genau die Mitglieder dieser Gruppe. Auf einem Beet wachsen mehrere Sorten, für jede Pflanzung wird das Pflanzdatum festgehalten. Gärtner:innen tauschen untereinander Saatgut. Gruppen verwalten Gartengeräte.

    Ein Entwurf in Chen-Notation enthält (Attribute von Gerät weggelassen):

    ```
    [Gärtner:in]  Ellipsen: Mitglieds-Nr. (unterstrichen), Name, Gruppen-Nr.
    [Gärtner:in] —n— <gehört zu> —1— [Gruppe]
    [Gruppe]      Ellipsen: Gruppen-Nr. (unterstrichen), Name
    [Gruppe] —1— <hat> —n— [Beet]
    [Beet] —n— <hat> —1— [Gruppe]          (zweite Raute, Attribut an der Raute: seit)
    [Beet]        Ellipsen: Beet-Nr. (unterstrichen), Fläche
    [Gärtner:in] —m— <ist zuständig für> —n— [Beet]
    [Beet] ———————— [Sorte]                (direkte Linie, keine Raute)
    [Sorte]       Ellipsen: Sorten-Nr. (unterstrichen), Bezeichnung
    Ellipse Pflanzdatum: verbunden mit [Beet] und mit [Sorte]
    <tauscht Saatgut>: genau eine Kante zu [Gärtner:in], ohne Beschriftung
    [Gruppe] —1— <hat> —n— [Gerät]
    ```

    a) Finde sechs Modellierungsfehler. Begründe jeden kurz und gib die Korrektur an. Was nur eine Stilempfehlung ist, zählt nicht als Fehler. (6 P.)
    b) Unter welcher Bedingung wäre eine Beziehung zwischen Gärtner:in und Beet **nicht** redundant? Nenne ein Beispiel. (2 P.)
  solution: |-
    a)
    1. **Gruppen-Nr. an Gärtner:in:** ein Fremdschlüssel ohne Auftrag; die Beziehung ⟨gehört zu⟩ drückt das schon aus. → Attribut entfernen.
    2. **⟨ist zuständig für⟩ ist redundant:** Laut Text sind genau die Gruppenmitglieder zuständig. Das folgt aus ⟨gehört zu⟩ und ⟨hat⟩ (Zyklus). → Beziehung entfernen.
    3. **Beet und Sorte direkt verbunden:** Zwei Entitätstypen dürfen nicht direkt verbunden werden. → Raute ⟨ist bepflanzt mit⟩ einfügen (m:n, denn eine Sorte wächst auch auf mehreren Beeten).
    4. **Pflanzdatum hat zwei Verbindungen:** Ein Attribut hat genau eine Verbindung, und das Datum gehört zur Kombination Beet–Sorte. → an die neue Raute ⟨ist bepflanzt mit⟩ hängen.
    5. **⟨tauscht Saatgut⟩ hat nur eine Kante:** Ein Beziehungstyp braucht mindestens zwei Kanten. → rekursive Beziehung mit zwei Kanten zu Gärtner:in und Rollennamen (z. B. gibt ab / erhält), m:n.
    6. **Zwei Rauten ⟨hat⟩ zwischen denselben Entitätstypen Gruppe und Beet:** Ein Beziehungstyp ist über Name plus verbundene Entitätstypen eindeutig. Zwei gleichnamige Rauten zwischen denselben Partnern verletzen das und modellieren denselben Sachverhalt doppelt. → zweite Raute entfernen, das Attribut seit an die verbleibende Raute hängen (am besten umbenannt in ⟨bewirtschaftet⟩).

    Kein Fehler: ⟨hat⟩ zwischen Gruppe und Gerät. Gleichnamige Rauten zwischen verschiedenen Entitätstypen sind erlaubt; ein sprechender Name wie ⟨verwaltet⟩ ist nur eine Empfehlung. Wer das als Fehler nennt, bekommt dafür keinen Punkt, aber auch keinen Abzug.

    b) Nicht redundant ist eine Beziehung Gärtner:in–Beet, wenn sie etwas **anderes** bedeutet als die Gruppenzugehörigkeit oder Fälle erfasst, die der Umweg nicht abdeckt. Beispiel: ⟨hat Gießdienst für⟩, wenn je Woche einzelne Personen (auch aus anderen Gruppen) für bestimmte Beete eingeteilt werden.
  rubric:
    - criterion: "a) Sechs Fehler erkannt und begründet (je 0,5); die gleichnamige Raute zwischen Gruppe und Gerät zählt nicht als Fehler"
      points: 3
    - criterion: "a) Zu jedem Fehler eine passende Korrektur (je 0,5)"
      points: 3
    - criterion: "b) Bedingung genannt: eigene Bedeutung bzw. nicht ableitbare Fälle (1) und passendes Beispiel (1)"
      points: 2
  space: lines:18
