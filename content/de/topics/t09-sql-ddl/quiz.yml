  type: single
  question: "In Firebird 3 soll der bestehende Constraint `ck_zimmer_betten CHECK (betten BETWEEN 1 AND 4)` künftig bis 6 Betten erlauben. Welcher Weg ist richtig?"
  options:
    - text: "`DROP CONSTRAINT ck_zimmer_betten`, danach `ADD CONSTRAINT ck_zimmer_betten CHECK (betten BETWEEN 1 AND 6)`"
      correct: true
      explain: "Eine Bedingung lässt sich nicht direkt ändern. Man löscht den Constraint und legt ihn neu an."
    - text: "`ALTER CONSTRAINT ck_zimmer_betten CHECK (betten BETWEEN 1 AND 6)`"
      correct: false
      explain: "Diese Form gibt es in Firebird 3 nicht. PostgreSQL kennt `ALTER CONSTRAINT` nur für Eigenschaften von Fremdschlüsseln."
    - text: "Einen zweiten Constraint `ck_zimmer_betten2 CHECK (betten BETWEEN 1 AND 6)` hinzufügen"
      correct: false
      explain: "Beide Constraints gelten dann gleichzeitig. 5 und 6 Betten bleiben wegen des alten Constraints verboten."
    - text: "`ALTER COLUMN betten TYPE SMALLINT CHECK (betten BETWEEN 1 AND 6)`"
      correct: false
      explain: "`ALTER COLUMN … TYPE` ändert nur den Datentyp und nimmt keinen CHECK auf."
