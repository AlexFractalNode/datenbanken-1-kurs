  type: single
  question: |-
    Welche Aussage zum **Grad** eines Beziehungstyps ist richtig?
  options:
    - text: "Er gibt an, wie viele Entitätstypen an dem Beziehungstyp beteiligt sind."
      correct: true
      explain: "Binär = 2, ternär = 3. Eine rekursive Beziehung hat nach dieser Zählung Grad 1, zählt man die Rollen, kommt man auf 2."
    - text: "Er ist dasselbe wie die Kardinalität, z. B. 1:n."
      correct: false
      explain: "Die Kardinalität beschreibt Obergrenzen je Partner. Manche Quellen nennen sie „Grad“ oder „Komplexität“, darauf muss man achten. Gemeint ist aber etwas anderes als die Zahl der Partner."
    - text: "Er gibt die Zahl der Attribute an der Raute an."
      correct: false
      explain: "Die Zahl der Beziehungsattribute spielt für den Grad keine Rolle."
