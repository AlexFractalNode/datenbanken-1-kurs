- id: t10-q001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [dreiwertige-logik]
  type: single
  question: "Welchen Wert hat in SQL der Ausdruck `FALSE OR UNKNOWN`?"
  options:
    - text: "UNKNOWN"
      correct: true
      explain: "FALSE entscheidet ein OR nicht. Das Ergebnis hängt vom unbekannten Operanden ab und bleibt deshalb UNKNOWN."
    - text: "FALSE"
      correct: false
      explain: "Das gilt für `FALSE AND UNKNOWN`. Beim OR entscheidet nur TRUE das Ergebnis sicher."
    - text: "TRUE"
      correct: false
      explain: "TRUE ergäbe sich nur, wenn einer der Operanden TRUE wäre."
    - text: "NULL wird als FALSE behandelt, also FALSE."
      correct: false
      explain: "SQL setzt UNKNOWN nicht mit FALSE gleich. Erst WHERE verwirft Zeilen mit UNKNOWN, im Ausdruck selbst bleibt es UNKNOWN."
- id: t10-q002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: ["null", where]
  type: single
  question: |-
    Die Tabelle `artikel(id, farbe)` enthält die Zeilen (1, 'rot'), (2, 'blau'), (3, NULL). Wie viele Zeilen liefert `SELECT id FROM artikel WHERE farbe <> 'rot'`?
  options:
    - text: "1"
      correct: true
      explain: "Nur Zeile 2. Für Zeile 3 ist `NULL <> 'rot'` UNKNOWN, und WHERE behält nur TRUE."
    - text: "2"
      correct: false
      explain: "Hier wäre Zeile 3 mitgezählt. NULL ist aber nicht „ungleich rot“, sondern unbekannt."
    - text: "0"
      correct: false
      explain: "Zeile 2 erfüllt die Bedingung eindeutig: `'blau' <> 'rot'` ist TRUE."
    - text: "3"
      correct: false
      explain: "Zeile 1 hat genau die Farbe rot und fällt sicher heraus."
- id: t10-q003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [aggregat, count, "null"]
  type: single
  question: |-
    Die Spalte `note` einer Tabelle mit fünf Zeilen enthält die Werte 2, NULL, 4, 4, NULL. Welche Werte liefern `COUNT(*)`, `COUNT(note)` und `COUNT(DISTINCT note)`?
  options:
    - text: "5, 3, 2"
      correct: true
      explain: "COUNT(*) zählt Zeilen, COUNT(note) nur Werte ungleich NULL (2, 4, 4), DISTINCT davon die verschiedenen (2, 4)."
    - text: "5, 5, 3"
      correct: false
      explain: "COUNT(spalte) übergeht NULL, und NULL wird auch bei COUNT(DISTINCT …) nicht als eigener Wert gezählt."
    - text: "3, 3, 2"
      correct: false
      explain: "COUNT(*) zählt alle Zeilen, unabhängig von NULL-Werten."
    - text: "5, 3, 3"
      correct: false
      explain: "Die verschiedenen Werte ungleich NULL sind nur 2 und 4. NULL zählt bei COUNT(DISTINCT …) nicht mit."
- id: t10-q004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [aggregat, avg, "null"]
  type: single
  question: |-
    Die Spalte `punkte` enthält 10, 20, NULL, 30. Was liefert `AVG(punkte)` (bei exakter Rechnung)?
  options:
    - text: "20"
      correct: true
      explain: "AVG übergeht NULL: (10 + 20 + 30) / 3 = 20."
    - text: "15"
      correct: false
      explain: "Das wäre 60 / 4, also NULL als Zeile mitgezählt. AVG teilt durch die Zahl der Werte ungleich NULL."
    - text: "NULL"
      correct: false
      explain: "Ein einzelner NULL-Wert macht das Aggregat nicht NULL. NULL kommt nur heraus, wenn alle Werte NULL sind oder keine Zeile da ist."
    - text: "Fehler, weil NULL nicht addiert werden kann"
      correct: false
      explain: "Aggregatfunktionen sind gerade dafür gebaut, NULL-Werte zu übergehen."
- id: t10-q005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [where-vs-having]
  type: multi
  question: "Welche Aussagen zu WHERE und HAVING sind richtig?"
  options:
    - text: "WHERE filtert einzelne Zeilen vor dem Gruppieren."
      correct: true
      explain: "WHERE wird logisch direkt nach FROM ausgewertet, also vor GROUP BY."
    - text: "HAVING filtert Gruppen und darf Aggregatfunktionen enthalten."
      correct: true
      explain: "Nach GROUP BY gibt es je Gruppe Aggregatwerte; genau darauf prüft HAVING."
    - text: "`WHERE COUNT(*) > 3` ist erlaubt, wenn die Abfrage ein GROUP BY hat."
      correct: false
      explain: "Aggregate sind im WHERE nie erlaubt, weil dort noch nicht gruppiert ist. Richtig: `HAVING COUNT(*) > 3`."
    - text: "Im HAVING darf man in Firebird den Alias einer Aggregatspalte aus der SELECT-Liste verwenden."
      correct: false
      explain: "Firebird und PostgreSQL verlangen im HAVING den Ausdruck, z. B. `HAVING SUM(menge) > 50`. In der Standardsicht liegt das daran, dass HAVING logisch vor SELECT ausgewertet wird. In Darstellungen mit SELECT vor GROUP BY gilt das Verbot trotzdem, dort ist es eine Regel der Systeme."
- id: t10-q006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [auswertungsreihenfolge]
  type: single
  question: "In welcher logischen Reihenfolge wertet SQL diese Klauseln **nach dem SQL-Standard** aus (so beschreibt es auch PostgreSQL), wenn der SELECT-Schritt das Berechnen der Ausgabewerte bedeutet?"
  options:
    - text: "FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY"
      correct: true
      explain: "Erst wird die Zwischentabelle gebildet und gefiltert, dann gruppiert, dann die Ausgabe berechnet und zuletzt sortiert. Hinweis: Manche Lehrmaterialien setzen SELECT als Spaltenauswahl schon vor GROUP BY (FROM → WHERE → SELECT → GROUP BY → HAVING → ORDER BY) oder als abschließende Projektion ganz ans Ende, nach ORDER BY. Das sind andere Darstellungen derselben Abfrage, kein anderes Ergebnis. Gefragt war hier die Standardsicht."
    - text: "SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY"
      correct: false
      explain: "Das ist die Schreibreihenfolge. Logisch kann nichts berechnet werden, bevor FROM die Zwischentabelle liefert; deshalb kennt WHERE auch keine Aliase."
    - text: "FROM → GROUP BY → WHERE → HAVING → SELECT → ORDER BY"
      correct: false
      explain: "WHERE filtert Zeilen vor dem Gruppieren, sonst bräuchte man HAVING nicht."
    - text: "FROM → WHERE → HAVING → GROUP BY → SELECT → ORDER BY"
      correct: false
      explain: "HAVING prüft Bedingungen an Gruppen, meist mit Aggregaten. Dafür müssen die Gruppen schon gebildet sein; HAVING kommt deshalb in jeder Darstellung nach GROUP BY."
- id: t10-q007
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [order-by, "null", dialekt]
  type: single
  question: |-
    Die Spalte `budget` enthält 100, NULL und 50. Welche Reihenfolge liefert `ORDER BY budget` (ohne weitere Angabe) in **Firebird 3**?
  options:
    - text: "NULL, 50, 100"
      correct: true
      explain: "Firebird 3 stellt NULL bei aufsteigender Sortierung an den Anfang."
    - text: "50, 100, NULL"
      correct: false
      explain: "So sortiert PostgreSQL, das NULL als größer als jeden Wert behandelt. Portabel wird es erst mit `NULLS FIRST`/`NULLS LAST`."
    - text: "100, 50, NULL"
      correct: false
      explain: "Ohne DESC wird aufsteigend sortiert."
    - text: "Fehler, weil NULL nicht verglichen werden kann"
      correct: false
      explain: "Sortieren mit NULL ist erlaubt; die Systeme legen nur unterschiedlich fest, wo NULL landet."
- id: t10-q008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [ergebnisbegrenzung, dialekt]
  type: multi
  question: "Welche Formulierungen liefern in **Firebird 3** die Zeilen 6 bis 10 einer nach `id` sortierten Tabelle `t`?"
  options:
    - text: "`SELECT FIRST 5 SKIP 5 * FROM t ORDER BY id`"
      correct: true
      explain: "SKIP 5 überspringt die ersten fünf, FIRST 5 nimmt die nächsten fünf."
    - text: "`SELECT * FROM t ORDER BY id OFFSET 5 ROWS FETCH NEXT 5 ROWS ONLY`"
      correct: true
      explain: "Die Standardsyntax gibt es ab Firebird 3; sie läuft auch in PostgreSQL."
    - text: "`SELECT * FROM t ORDER BY id ROWS 6 TO 10`"
      correct: true
      explain: "ROWS ist eine Firebird-Erweiterung, die Zeilennummern beginnen bei 1."
    - text: "`SELECT * FROM t ORDER BY id LIMIT 5 OFFSET 5`"
      correct: false
      explain: "LIMIT ist PostgreSQL-, MySQL- und SQLite-Syntax; Firebird 3 kennt es nicht."
- id: t10-q009
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [join, outer-join, count]
  type: single
  question: |-
    `team(tid)` hat die Zeilen 1, 2, 3; `spiel(sid, tid)` hat (10, 1), (11, 1), (12, 2). Was liefert `SELECT t.tid, COUNT(*) FROM team t LEFT JOIN spiel s ON s.tid = t.tid GROUP BY t.tid` für Team 3?
  options:
    - text: "1"
      correct: true
      explain: "Der LEFT JOIN erzeugt für Team 3 eine Zeile mit NULL in `s`. COUNT(*) zählt diese Zeile. Richtig für „Anzahl Spiele“ wäre `COUNT(s.sid)` mit Ergebnis 0."
    - text: "0"
      correct: false
      explain: "Das liefert `COUNT(s.sid)`, weil es NULL übergeht. COUNT(*) zählt dagegen die Zeile selbst."
    - text: "NULL"
      correct: false
      explain: "COUNT liefert nie NULL, sondern mindestens 0."
    - text: "Team 3 erscheint nicht."
      correct: false
      explain: "Das wäre beim inneren Join so. Der LEFT JOIN behält jede Zeile der linken Tabelle."
- id: t10-q010
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [join, outer-join, on-vs-where]
  type: single
  question: |-
    Was ist der Unterschied zwischen
    (A) `FROM kurs k LEFT JOIN belegung b ON b.kurs_id = k.kurs_id AND b.rabatt_prozent > 0` und
    (B) `FROM kurs k LEFT JOIN belegung b ON b.kurs_id = k.kurs_id WHERE b.rabatt_prozent > 0`?
  options:
    - text: "A behält alle Kurse, B nur Kurse mit mindestens einer rabattierten Belegung."
      correct: true
      explain: "In A wählt die Bedingung nur die Partner aus, Kurse ohne passenden Partner bleiben mit NULL. In B ist `NULL > 0` für sie UNKNOWN, WHERE entfernt sie."
    - text: "Kein Unterschied, ON und WHERE sind austauschbar."
      correct: false
      explain: "Das gilt nur beim inneren Join. Beim äußeren Join entscheidet die Stelle, ob linke Zeilen erhalten bleiben."
    - text: "B behält alle Kurse, A nur Kurse mit Rabatt."
      correct: false
      explain: "Genau umgekehrt: Das ON eines LEFT JOIN entfernt nie linke Zeilen."
    - text: "A ist ein Syntaxfehler, weil ON nur Gleichheitsbedingungen erlaubt."
      correct: false
      explain: "Im ON darf jede Bedingung stehen, auch mit AND und anderen Vergleichen."
- id: t10-q011
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [join, natural-join]
