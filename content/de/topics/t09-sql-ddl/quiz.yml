      explain: "SET DEFAULT würde die Artikel auf 0 setzen. Weil es keine Kategorie 0 gibt, verletzt das den Fremdschlüssel, und die ganze Anweisung wird abgewiesen. Abhilfe ist eine Platzhalter-Kategorie 0."
    - text: "Die Artikel bekommen `kategorie_id = 0`, die Kategorie 4 wird gelöscht."
      correct: false
      explain: "Das passiert nur, wenn es die Platzhalter-Zeile mit Schlüssel 0 gibt."
    - text: "Die Artikel bekommen NULL."
      correct: false
