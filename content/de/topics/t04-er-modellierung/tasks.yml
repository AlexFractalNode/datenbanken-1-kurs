- id: t04-p001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [schwache-entitaet]
  type: define-example
  difficulty: 1
  points: 7
  minutes: 7
  prompt: |-
    Erkläre die Begriffe **schwacher Entitätstyp**, **identifizierende Beziehung** und **partieller Schlüssel**.
    Gib dazu ein **eigenes** Beispiel an. Es darf nicht aus den Kursmaterialien stammen (Zusammenfassung, Karteikarten, Quiz, Fehlerliste), also z. B. nicht Durchsicht/Bienenvolk, Route/Kletterwand oder Parzelle/Kleingartenanlage. Skizziere es in Chen-Notation mit Schlüsseln, Kardinalität und Teilnahme.
  solution: |-
    - **Schwacher Entitätstyp:** Seine Entitäten sind **existenzabhängig** von einem anderen, starken Entitätstyp (Besitzer). Sie lassen sich nicht allein durch eigene Attribute eindeutig identifizieren, sondern nur zusammen mit dem Schlüssel des Besitzers. Einen eigenen vollständigen Primärschlüssel haben sie nicht.
    - **Identifizierende Beziehung:** der Beziehungstyp zwischen schwachem Entitätstyp und Besitzer, über den der fehlende Schlüsselteil „geliehen“ wird. Jede schwache Entität hat genau einen Besitzer.
    - **Partieller Schlüssel:** Attribut(e) des schwachen Entitätstyps, die nur **innerhalb eines Besitzers** eindeutig sind. Vollständiger Schlüssel = Besitzerschlüssel + partieller Schlüssel.

    Beispiel (Musterlösung, andere passende Beispiele gleichwertig): Ein Podcast-Verzeichnis führt Podcasts mit Podcast-ID. Die Folgen werden **je Podcast** ab 1 durchnummeriert; Folge 7 gibt es also bei vielen Podcasts. Ohne ihren Podcast gibt es keine Folge.

    Skizze (Chen):
    `Podcast` (Rechteck, Schlüssel <u>Podcast-ID</u>, Attribut Titel) —1— ⟨enthält⟩ (doppelte Raute) —n— `Folge` (doppelter Rahmen) mit partiellem Schlüssel Folgen-Nr. (gestrichelt unterstrichen) und den Attributen Titel und Dauer. Die Linie zwischen Folge und ⟨enthält⟩ ist doppelt (totale Teilnahme), (min,max) bei Folge (1,1).
    Vollständiger Schlüssel einer Folge: (Podcast-ID, Folgen-Nr.).
  rubric:
    - criterion: "Schwacher Entitätstyp erklärt: Existenzabhängigkeit (0,5) und Identifikation nur mit dem Schlüssel des Besitzers (0,5)"
      points: 1
    - criterion: "Identifizierende Beziehung korrekt erklärt"
      points: 1
    - criterion: "Partieller Schlüssel korrekt erklärt (nur innerhalb des Besitzers eindeutig)"
      points: 1
    - criterion: "Eigenes, nicht aus den Kursmaterialien stammendes, fachlich passendes Beispiel mit korrekt angegebenem vollständigem Schlüssel"
      points: 1
    - criterion: "Skizze: doppelter Rahmen (0,5) und doppelte Raute (0,5)"
      points: 1
    - criterion: "Skizze: partieller Schlüssel gestrichelt unterstrichen (0,5) und totale Teilnahme des schwachen Typs als Doppellinie oder (1,1) (0,5)"
      points: 1
    - criterion: "Skizze: Kardinalität 1:n richtig platziert (1 beim Besitzer, n beim schwachen Typ)"
      points: 1
  space: box:110
- id: t04-p002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [schluessel]
  type: define-example
  difficulty: 2
  points: 8
  minutes: 8
  prompt: |-
    Erkläre die Begriffe **Superschlüssel**, **Schlüsselkandidat**, **Primärschlüssel**, **künstlicher Schlüssel** und **Nichtschlüsselattribut**.
    Wähle einen **eigenen** Entitätstyp mit mindestens fünf Attributen und gib für jeden Begriff ein konkretes Beispiel daraus an. Begründe die Wahl deines Primärschlüssels.
  solution: |-
    - **Superschlüssel:** eine Attributmenge, die jede Entität eindeutig identifiziert. Sie darf überflüssige Attribute enthalten.
    - **Schlüsselkandidat:** ein **minimaler** Superschlüssel. Entfernt man ein Attribut, ist er nicht mehr eindeutig. Es kann mehrere geben.
    - **Primärschlüssel:** der aus den Kandidaten ausgewählte Schlüssel, der im Modell zur Identifikation verwendet wird. Die übrigen Kandidaten sind Alternativschlüssel.
    - **Künstlicher Schlüssel (Surrogatschlüssel):** ein zusätzlich eingeführtes Attribut ohne fachliche Bedeutung, z. B. eine fortlaufende Nummer.
    - **Nichtschlüsselattribut:** ein Attribut, das in keinem Schlüsselkandidaten vorkommt.

    Beispiel (Musterlösung): Entitätstyp `Spiel` eines Escape-Room-Anbieters mit Spiel-ID, Raum-Nr., Beginn (Datum und Uhrzeit), Teamname, Preis. In einem Raum beginnt zu einem Zeitpunkt höchstens ein Spiel; Teamnamen und Preise wiederholen sich.
    - Superschlüssel: {Raum-Nr., Beginn, Preis} (eindeutig, aber Preis ist überflüssig)
    - Schlüsselkandidaten: {Raum-Nr., Beginn} und {Spiel-ID}
    - Künstlicher Schlüssel: Spiel-ID
    - Nichtschlüsselattribute: Teamname, Preis
    - Primärschlüssel: Spiel-ID. Begründung: kurz, einteilig und vor allem stabil, wenn ein Spiel in einen anderen Raum oder auf eine andere Uhrzeit verlegt wird. (Raum-Nr., Beginn) bleibt als Alternativschlüssel eindeutig.
  rubric:
    - criterion: "Superschlüssel: Definition (1) und passendes Beispiel (0,5)"
      points: 1.5
    - criterion: "Schlüsselkandidat: Definition mit Minimalität (1) und passendes Beispiel (0,5)"
      points: 1.5
    - criterion: "Primärschlüssel: als ausgewählter Kandidat erklärt (1) und im Beispiel benannt (0,5)"
      points: 1.5
    - criterion: "Künstlicher Schlüssel: Definition ohne fachliche Bedeutung (1) und im Beispiel verwendet (0,5)"
      points: 1.5
    - criterion: "Nichtschlüsselattribut: Definition (in keinem Kandidaten enthalten) (0,5) und korrektes Beispiel, kein Attribut eines Alternativschlüssels (0,5)"
      points: 1
    - criterion: "Wahl des Primärschlüssels nachvollziehbar begründet (z. B. Stabilität, Kürze)"
      points: 1
  space: lines:20
- id: t04-p003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [erm-modellierung, generalisierung, rekursion]
  type: erm-model
  difficulty: 3
  points: 18
  minutes: 18
  prompt: |-
    Erstelle zum folgenden Text ein ER-Diagramm in **Chen-Notation** mit allen Attributen und Schlüsseln. Gib an jeder Beziehung die Chen-Kardinalität **und** die (min,max)-Angaben an. Kennzeichne bei der Spezialisierung, ob sie total oder partiell und ob sie disjunkt oder überlappend ist. Gemeint sind hier die Eigenschaften der is-a-Hierarchie, nicht die Teilnahme an einer Beziehung.

    > Die Kletterhalle „Griffig“ erfasst Personen mit Personennummer, Name (Vor- und Nachname) und Geburtsdatum. Das Alter soll angezeigt, aber nicht gespeichert werden. Personen können Mitglieder sein (zusätzlich: Eintrittsdatum, Tarif) und/oder Trainer:innen (zusätzlich: Lizenzstufe). Auch Tagesgäste, die weder Mitglied noch Trainer:in sind, werden als Person erfasst.
    > Trainer:innen leiten Kurse (Kursnummer, Titel, Schwierigkeitsgrad). Jeder Kurs wird von genau einer Trainer:in geleitet. Eine Trainer:in kann beliebig viele Kurse leiten, auch keinen.
    > Mitglieder können Kurse buchen, dabei wird das Buchungsdatum festgehalten. Ein Kurs hat höchstens 8 Teilnehmende und darf auch ohne Buchungen angelegt werden.
    > Ein Mitglied kann von einem anderen Mitglied geworben worden sein (höchstens von einem). Ein Mitglied kann beliebig viele andere werben.
  solution: |-
    **Entitätstypen und Attribute**
    - `Person`: <u>Personennummer</u>, Name (zusammengesetzt aus Vorname, Nachname), Geburtsdatum, Alter (abgeleitet, gestrichelte Ellipse)
    - `Mitglied` (Subtyp von Person): Eintrittsdatum, Tarif. Kein eigener Schlüssel, erbt Personennummer.
    - `Trainer:in` (Subtyp von Person): Lizenzstufe. Kein eigener Schlüssel.
    - `Kurs`: <u>Kursnummer</u>, Titel, Schwierigkeitsgrad

    **Spezialisierung** Person → Mitglied, Trainer:in (is-a, Dreieck oder gleichwertiges Symbol): **überlappend** (eine Person kann beides sein) und **partiell** (Tagesgäste gehören zu keinem Subtyp).

    **Beziehungstypen**
    | Beziehung | Chen | (min,max) |
    |---|---|---|
    | Trainer:in ⟨leitet⟩ Kurs | 1 bei Trainer:in, n bei Kurs | Trainer:in (0,n), Kurs (1,1) |
    | Mitglied ⟨bucht⟩ Kurs, Attribut Buchungsdatum an der Raute | 8 (bzw. m) bei Mitglied, n bei Kurs | Mitglied (0,n), Kurs (0,8) |
    | Mitglied ⟨wirbt⟩ Mitglied (rekursiv), Rollen Werber:in / Geworbene:r | 1 an Rolle Werber:in, n an Rolle Geworbene:r | Werber:in (0,n), Geworbene:r (0,1) |

    Hinweise: `bucht` und `wirbt` hängen am Subtyp `Mitglied`, `leitet` am Subtyp `Trainer:in`, nicht an `Person`. Das Buchungsdatum gehört zur Beziehung, weil es erst durch die Kombination Mitglied–Kurs entsteht. Die Obergrenze 8 ist in (min,max) am Kurs sichtbar, in Chen steht sie gegenüber am Mitglied. Bei ⟨wirbt⟩ haben beide Rollen die Untergrenze 0, sonst könnte das erste Mitglied nie angelegt werden.
  rubric:
    - criterion: "Person: unterstrichene Personennummer (1), Name als zusammengesetztes Attribut (1), Geburtsdatum (0,5), Alter als abgeleitetes Attribut (0,5)"
      points: 3
    - criterion: "Subtypen mit ihren Zusatzattributen Eintrittsdatum, Tarif, Lizenzstufe (je 0,5) und ohne eigenen Schlüssel (0,5); das bloße Wiederholen des geerbten Schlüssels am Subtyp wird nicht abgezogen"
      points: 2
    - criterion: "is-a-Symbol verbindet Person korrekt mit beiden Subtypen"
      points: 1
    - criterion: "Spezialisierung als überlappend (0,5) und partiell (0,5) gekennzeichnet"
      points: 1
    - criterion: "Kurs mit unterstrichener Kursnummer (0,5) sowie Titel und Schwierigkeitsgrad (0,5)"
      points: 1
    - criterion: "leitet zwischen Trainer:in (nicht Person) und Kurs (0,5); Chen 1 bei Trainer:in, n bei Kurs (1); (min,max) Trainer:in (0,n), Kurs (1,1) (1). n, m und * sind gleichwertig"
      points: 2.5
    - criterion: "bucht zwischen Mitglied (nicht Person) und Kurs (0,5); Buchungsdatum an der Raute (1); Chen 8 bzw. m bei Mitglied, n bei Kurs (1)"
      points: 2.5
    - criterion: "bucht mit (min,max) Mitglied (0,n) (0,5) und Kurs (0,8) (0,5)"
      points: 1
    - criterion: "wirbt als rekursive Beziehung an Mitglied (1) mit beiden Rollennamen an den Kanten (1)"
      points: 2
    - criterion: "wirbt: Chen 1 bei Werber:in, n bei Geworbene:r (1); (min,max) Werber:in (0,n), Geworbene:r (0,1) (1)"
      points: 2
  space: box:200
- id: t04-p004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [erm-modellierung, attribute]
  type: erm-model
  difficulty: 2
  points: 15
  minutes: 15
  prompt: |-
    Erstelle zum folgenden Text ein ER-Diagramm in **Chen-Notation** mit allen Attributen und Schlüsseln. Gib an jeder Beziehung die Chen-Kardinalität **und** die (min,max)-Angaben an.

    > Der Kammerchor „Vielstimmig“ verwaltet seine Konzerte. Von jeder Sängerin und jedem Sänger werden Mitgliedsnummer, Name, Stimmlage und eine oder mehrere Telefonnummern gespeichert. Jedes Konzert hat eine Konzertnummer, ein Datum und einen Titel. Die Gesamtdauer des Programms soll angezeigt, aber nicht gespeichert werden; sie ergibt sich aus den aufgeführten Werken.
    > Werke des Repertoires haben eine Werknummer, einen Titel, eine Komponistin bzw. einen Komponisten und eine Dauer in Minuten. Ein Konzert umfasst mindestens ein Werk, dabei wird die Position im Programm festgehalten. Ein Werk kann in vielen Konzerten aufgeführt werden; neu ins Repertoire aufgenommene Werke wurden noch nie aufgeführt.
    > An einem Konzert wirken mindestens 12 Sänger:innen mit. Eine Sänger:in kann an beliebig vielen Konzerten mitwirken; neue Mitglieder haben noch an keinem teilgenommen.
    > Jedes Konzert findet in genau einer Spielstätte (Spielstättennummer, Name, Sitzplätze) statt. Spielstätten werden auch erfasst, bevor dort ein Konzert stattfindet. Jedes Konzert wird von genau einer Dirigentin bzw. einem Dirigenten (Personalnummer, Name) geleitet. Dirigent:innen werden erst erfasst, wenn sie ihr erstes Konzert übernehmen.
  solution: |-
    **Entitätstypen und Attribute**
    - `Sänger:in`: <u>Mitgliedsnummer</u>, Name, Stimmlage, Telefon (mehrwertig, doppelte Ellipse)
    - `Konzert`: <u>Konzertnummer</u>, Datum, Titel, Programmdauer (abgeleitet, gestrichelte Ellipse)
    - `Werk`: <u>Werknummer</u>, Titel, Komponist:in, Dauer
    - `Spielstätte`: <u>Spielstättennummer</u>, Name, Sitzplätze
    - `Dirigent:in`: <u>Personalnummer</u>, Name

    **Beziehungstypen**
    | Beziehung | Chen | (min,max) |
    |---|---|---|
    | Konzert ⟨umfasst⟩ Werk, Attribut Position an der Raute | m bei Konzert, n bei Werk | Konzert (1,n), Werk (0,n) |
    | Sänger:in ⟨wirkt mit in⟩ Konzert | m bei Sänger:in, n bei Konzert | Sänger:in (0,n), Konzert (12,n) |
    | Spielstätte ⟨ist Ort von⟩ Konzert | 1 bei Spielstätte, n bei Konzert | Spielstätte (0,n), Konzert (1,1) |
    | Dirigent:in ⟨dirigiert⟩ Konzert | 1 bei Dirigent:in, n bei Konzert | Dirigent:in (1,n), Konzert (1,1) |

    Hinweise: Die Position gehört zur Beziehung ⟨umfasst⟩, denn dasselbe Werk steht in verschiedenen Konzerten an verschiedenen Stellen. Die Untergrenze 12 steht in (min,max) am Konzert, weil jedes Konzert an mindestens 12 Beziehungen ⟨wirkt mit in⟩ teilnimmt. Dirigent:in hat min 1, weil sie erst mit dem ersten Konzert erfasst wird (wechselseitige Existenzabhängigkeit). Keine Fremdschlüssel im ER-Diagramm. Komponist:in ist ein Attribut, weil nur der Name bekannt ist. Als eigener Entitätstyp mit korrekt angebundener Beziehung wird sie nicht abgezogen.
  rubric:
    - criterion: "Fünf Entitätstypen mit je korrekt unterstrichenem Schlüssel (je 0,5)"
      points: 2.5
    - criterion: "Übrige Attribute vollständig und am richtigen Typ: Name, Stimmlage; Datum, Titel; Titel, Komponist:in, Dauer; Name, Sitzplätze; Name (je fehlendes oder falsch zugeordnetes Attribut −0,5, mindestens 0)"
      points: 2
    - criterion: "Telefon als mehrwertiges (0,5) und Programmdauer als abgeleitetes Attribut (0,5)"
      points: 1
    - criterion: "umfasst als m:n (0,5), Position an der Raute (1), (min,max) Konzert (1,n) und Werk (0,n) (1). n, m und * sind gleichwertig"
      points: 2.5
    - criterion: "wirkt mit in als m:n (0,5), (min,max) Sänger:in (0,n) (0,5) und Konzert (12,n) (1)"
      points: 2
    - criterion: "ist Ort von: Chen 1 bei Spielstätte, n bei Konzert (1); (min,max) Spielstätte (0,n), Konzert (1,1) (1)"
      points: 2
    - criterion: "dirigiert: Chen 1 bei Dirigent:in, n bei Konzert (1); (min,max) Dirigent:in (1,n), Konzert (1,1) (1)"
      points: 2
    - criterion: "Keine Fremdschlüssel als Attribute und keine überflüssigen oder redundanten Beziehungen"
      points: 1
  space: box:180
- id: t04-p005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [erm-lesen, umrechnung]
  type: erm-read
  difficulty: 2
  points: 11
  minutes: 11
  prompt: |-
    Gegeben ist das folgende ER-Diagramm eines Fotowettbewerbs (Attribute weggelassen). Die ersten drei Beziehungen sind in **reiner Chen-Notation**, die vierte in **(min,max)-Notation** angegeben:

    ```
    Fotograf:in       —1—    ⟨reicht ein⟩     —n—    Foto
    Foto              —n—    ⟨bewertet⟩       —m—    Jurymitglied     (Attribut an ⟨bewertet⟩: Punkte)
    Wettbewerbsjahr   —1—    ⟨kürt⟩           —1—    Foto             (Siegerfoto)
    Foto              (1,1)  ⟨gehört zu⟩      (0,n)  Kategorie
    ```

    Zusätzlich ist bekannt: Jedes Foto wird von genau einer Fotograf:in eingereicht, anonyme Einsendungen gibt es nicht. Jede erfasste Fotograf:in hat mindestens ein Foto eingereicht. Fotos, die gegen die Regeln verstoßen, werden von niemandem bewertet; jedes Jurymitglied bewertet mindestens ein Foto. In jedem Wettbewerbsjahr wird genau ein Siegerfoto gekürt. Ein Foto wird höchstens einmal Siegerfoto, die meisten nie.

    a) Formuliere für ⟨reicht ein⟩ und ⟨bewertet⟩ je zwei Sätze, einen pro Leserichtung, mit Unter- und Obergrenze. (2 P.)
    b) Gib für ⟨reicht ein⟩, ⟨bewertet⟩ und ⟨kürt⟩ die (min,max)-Angaben an beiden Entitätstypen an. (3 P.)
    c) Rechne ⟨gehört zu⟩ in Chen-Notation um und nenne die Information, die dabei verloren geht. (2 P.)
    d) Erkläre, warum bei binären Beziehungen die Obergrenzen in Chen und (min,max) „vertauscht“ erscheinen. (1 P.)
    e) Neue Regel: Ein Foto wird von **höchstens 5** Jurymitgliedern bewertet. An welcher Kante und wie ändert sich die Angabe in Chen und in (min,max)? (2 P.)
    f) Angenommen, die Zusatzangaben zu ⟨kürt⟩ fehlen. Welche (min,max)-Angaben ergeben sich dann nach der Standardkonvention für reine Chen-Kardinalitäten, und warum? (1 P.)
  solution: |-
    a)
    - ⟨reicht ein⟩: Jedes Foto wird von **genau einer** Fotograf:in eingereicht. Eine Fotograf:in reicht **mindestens ein, beliebig viele** Fotos ein.
    - ⟨bewertet⟩: Ein Foto wird von **keinem bis beliebig vielen** Jurymitgliedern bewertet. Ein Jurymitglied bewertet **mindestens ein, beliebig viele** Fotos.

    b)
    - ⟨reicht ein⟩: Fotograf:in (1,n), Foto (1,1)
    - ⟨bewertet⟩: Foto (0,n), Jurymitglied (1,n)
    - ⟨kürt⟩: Wettbewerbsjahr (1,1), Foto (0,1)

    c) Das max bei Foto (1) kommt zur Kategorie, das max bei Kategorie (n) kommt zum Foto: `Kategorie —1— ⟨gehört zu⟩ —n— Foto`, also 1:n. Verloren gehen die Untergrenzen: Das Diagramm zeigt nicht mehr, dass jedes Foto zu einer Kategorie gehören **muss** (min 1) und dass eine Kategorie leer sein **darf** (min 0). Hier stimmen beide zufällig mit dem Kursstandard für 1:n überein (Detail (1,1), Master (0,*)). Dürfte ein Foto ohne Kategorie sein, wäre diese Abweichung in reiner Chen-Notation nicht mehr erkennbar.

    d) Chen beantwortet an der Kante bei A die Frage „Wie viele A gehören zu einem B?“ (look-across). (min,max) beantwortet bei A die Frage „An wie vielen Beziehungen nimmt ein A teil?“ Bei einer binären Beziehung gehört zu jeder Beziehung genau ein Partner. „Wie viele B hat ein A“ steht deshalb in (min,max) bei A und in Chen bei B.

    e) Die Obergrenze betrifft die Zahl der Jurymitglieder je Foto.
    - (min,max): am **Foto**, (0,n) wird zu (0,5).
    - Chen: an der Kante beim **Jurymitglied**, m wird zu 5.

    f) Wettbewerbsjahr (0,1), Foto (0,1). Die Obergrenzen folgen aus 1:1. Bei 1:1 ist keine Seite als Detail ausgezeichnet, deshalb setzt der Kursstandard ohne Text oder Doppellinie auf beiden Seiten min = 0 an. (Nur bei 1:n erhält die Detail-Seite standardmäßig (1,1).)
  rubric:
    - criterion: "a) Vier korrekte Sätze mit Unter- und Obergrenze (je 0,5)"
      points: 2
    - criterion: "b) Sechs (min,max)-Angaben korrekt (je 0,5). n, m und * sind gleichwertig"
      points: 3
    - criterion: "c) Chen-Umrechnung korrekt (1 bei Kategorie, n bei Foto)"
      points: 1
    - criterion: "c) Verlust der Untergrenzen benannt (Pflicht bei Foto 0,5; optional bei Kategorie 0,5)"
      points: 1
    - criterion: "d) Unterschied der Fragestellung (look-across vs. Teilnahme am eigenen Typ) erklärt"
      points: 1
    - criterion: "e) (min,max) am Foto zu (0,5) geändert"
      points: 1
    - criterion: "e) Chen-Angabe beim Jurymitglied zu 5 geändert"
      points: 1
    - criterion: "f) (0,1) an beiden Seiten (0,5) mit Begründung über den Kursstandard für 1:1 (keine Detail-Seite, daher min = 0) (0,5)"
      points: 1
  space: lines:24
- id: t04-p006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [n-aer, umrechnung]
  type: erm-model
  difficulty: 3
  points: 11
  minutes: 11
  prompt: |-
    > Bei einem Tanzturnier bewerten Wertungsrichter:innen (Lizenznummer, Name) die Paare (Startnummer, Verein) in mehreren Tänzen (Kürzel, Bezeichnung). Jede Richter:in vergibt je Paar und Tanz **höchstens eine** Punktzahl. Ein Paar wird in jedem Tanz, den es tanzt, von **genau 5** Richter:innen gewertet. Jede eingesetzte Richter:in gibt mindestens eine Wertung ab. Paare, die kurzfristig absagen, bleiben ohne Wertung. Ein Tanz kann im Programm stehen, ohne bereits gewertet worden zu sein.

    a) Modelliere den Sachverhalt in Chen-Notation mit einer **ternären** Beziehung (Schlüssel, Attribute, Chen-Kardinalitäten). Begründe jede Chen-Angabe mit der Frage, die sie beantwortet. (6 P.)
    b) Gib zusätzlich die (min,max)-Angaben an. Erkläre am Beispiel der Zahl 5, warum sich die (min,max)-Angaben bei dieser ternären Beziehung nicht durch Vertauschen aus den Chen-Angaben ergeben. (3 P.)
    c) Begründe, warum drei binäre Beziehungen (Richter:in–Paar, Paar–Tanz, Richter:in–Tanz) den Sachverhalt nicht korrekt abbilden. (2 P.)
  solution: |-
    a)
    - `Wertungsrichter:in`: <u>Lizenznummer</u>, Name
    - `Paar`: <u>Startnummer</u>, Verein
    - `Tanz`: <u>Kürzel</u>, Bezeichnung
    - Ternäre Raute ⟨wertet⟩, verbunden mit allen drei Entitätstypen, Attribut **Punkte** an der Raute.
    - Chen (je feste Kombination der beiden anderen Partner):
      - bei Wertungsrichter:in **5**: zu einem festen Paar in einem festen Tanz gehören höchstens 5 Richter:innen,
      - bei Paar **n**: eine feste Richter:in wertet in einem festen Tanz viele Paare,
      - bei Tanz **p**: eine feste Richter:in wertet ein festes Paar in vielen Tänzen.
      Also 5:n:p.

    b) (min,max): Wertungsrichter:in (1,n), Paar (0,n), Tanz (0,n).
    Die 5 zählt Richter:innen **je Kombination** aus Paar und Tanz. (min,max) zählt dagegen, an wie vielen Wertungen **eine** Entität teilnimmt. Ein Paar, das vier Tänze tanzt, steckt in 4 · 5 = 20 Wertungen; die 5 taucht als Obergrenze bei keinem Entitätstyp auf. Eine Richter:in kann ebenfalls viele Wertungen abgeben, also (1,n) statt 5. Ein Vertauschen der Chen-Angaben ergäbe hier keine sinnvolle (min,max)-Angabe.

    c) Die Punkte gehören zur Dreierkombination (Richter:in, Paar, Tanz) und keiner Zweierkombination allein. Aus den drei Paarbeziehungen lässt sich außerdem nicht rekonstruieren, welche Dreierkombinationen tatsächlich vorkamen. Beispiel: Richter:in R hat Paar P gewertet, P hat Tango getanzt und R hat Tango gewertet. Daraus folgt nicht, dass R das Paar P im Tango gewertet hat. Die Zerlegung ist nicht verlustfrei.
  rubric:
    - criterion: "a) Drei Entitätstypen mit korrekt unterstrichenem Schlüssel und Attributen"
      points: 2
    - criterion: "a) Eine ternäre Raute zu allen drei Entitätstypen, Punkte als Attribut der Raute"
      points: 2
    - criterion: "a) Chen-Angaben 5 bei Wertungsrichter:in, n bei Paar, p bei Tanz (je 0,5) und mindestens eine Angabe mit „je feste Kombination der anderen“ begründet (0,5)"
      points: 2
    - criterion: "b) (min,max) korrekt: Richter:in (1,n), Paar (0,n), Tanz (0,n) (je 0,5). n, m und * sind gleichwertig"
      points: 1.5
    - criterion: "b) Erklärung: 5 zählt je Kombination (0,5), (min,max) zählt Teilnahmen einer Entität (0,5), die 5 erscheint deshalb bei keinem (min,max)-max (0,5)"
      points: 1.5
    - criterion: "c) Begründung: Punkte hängen an der Dreierkombination (1), Kombinationen aus Paarbeziehungen nicht rekonstruierbar (1)"
      points: 2
