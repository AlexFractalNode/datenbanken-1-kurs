- id: t09-q016
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [default, firebird, syntax]
  type: single
  question: "Welche Spaltendefinition ist in Firebird 3 gültig?"
  options:
    - text: "`zustand VARCHAR(10) DEFAULT 'neu' NOT NULL`"
      correct: true
      explain: "In Firebird steht DEFAULT vor den Constraints wie NOT NULL."
    - text: "`zustand VARCHAR(10) NOT NULL DEFAULT 'neu'`"
      correct: false
      explain: "In PostgreSQL gültig, in Firebird ein Syntaxfehler: DEFAULT muss vor NOT NULL stehen."
    - text: "`zustand VARCHAR DEFAULT 'neu' NOT NULL`"
      correct: false
      explain: "In Firebird ist die Längenangabe bei VARCHAR Pflicht."
    - text: "`zustand VARCHAR(10) DEFAULT neu NOT NULL`"
      correct: false
      explain: "Ein Text-Default muss in einfachen Anführungszeichen stehen, sonst wird `neu` als Bezeichner gelesen."
- id: t09-q017
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [default, firebird]
  type: multi
  question: "Welche Angaben sind in Firebird 3 als `DEFAULT` einer Spalte erlaubt?"
  options:
    - text: "`DEFAULT 0`"
      correct: true
      explain: "Ein Literal ist immer erlaubt."
    - text: "`DEFAULT CURRENT_DATE`"
      correct: true
      explain: "CURRENT_DATE ist eine Kontextvariable und damit erlaubt."
    - text: "`DEFAULT NULL`"
      correct: true
      explain: "NULL ist ausdrücklich erlaubt (und ohnehin der Standard)."
    - text: "`DEFAULT NEXT VALUE FOR seq_nr`"
      correct: false
      explain: "Firebird lässt als Default nur Literal, NULL oder Kontextvariable zu. Für Sequenzwerte nimmt man Identity oder einen Trigger. PostgreSQL erlaubt dagegen `DEFAULT nextval('seq_nr')`."
    - text: "`DEFAULT (SELECT MAX(nr) + 1 FROM beleg)`"
      correct: false
      explain: "Unterabfragen sind als Default nicht erlaubt, auch nicht in PostgreSQL. Bei gleichzeitigen Zugriffen gäbe es ohnehin doppelte Nummern."
- id: t09-q018
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [constraints, primary-key, zusammengesetzter-schluessel]
  type: single
  question: "Eine Tabelle `einsatz` soll den Primärschlüssel aus `helfer_id` und `schicht_id` bekommen. Welche Formulierung ist richtig?"
  options:
    - text: "Ein Tabellen-Constraint `CONSTRAINT pk_einsatz PRIMARY KEY (helfer_id, schicht_id)`"
      correct: true
      explain: "Ein zusammengesetzter Schlüssel nennt mehrere Spalten und geht deshalb nur als Tabellen-Constraint."
    - text: "`PRIMARY KEY` hinter beiden Spaltendefinitionen"
      correct: false
      explain: "Das wären zwei Primärschlüssel. Die Tabelle wird abgewiesen, weil es höchstens einen PK gibt."
    - text: "`UNIQUE` hinter beiden Spalten"
      correct: false
      explain: "Das macht jede Spalte für sich eindeutig. Ein Helfer könnte dann nur eine einzige Schicht haben."
    - text: "`PRIMARY KEY` nur hinter `helfer_id`"
      correct: false
      explain: "Dann wäre jeder Helfer nur einmal erlaubt. Gemeint ist aber die Eindeutigkeit der Kombination."
- id: t09-q019
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [alter-table, alter-column, firebird]
  type: single
  question: "In Firebird 3 soll die Spalte `email VARCHAR(60) UNIQUE` auf `VARCHAR(100)` verlängert werden. Was passiert bei `ALTER TABLE kunde ALTER COLUMN email TYPE VARCHAR(100)`?"
  options:
