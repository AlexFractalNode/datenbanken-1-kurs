- id: t10-s009
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [order-by, first-skip, ergebnisbegrenzung, dialekt]
  db: musikschule
  kind: query
  prompt: |-
    Der teuerste Kurs nach Monatsgebühr ist ein neu geplanter Kurs. Für einen Flyer werden die **drei folgenden** Plätze der Preisliste gebraucht, also die Plätze 2 bis 4 nach Monatsgebühr absteigend. Bei gleicher Gebühr entscheidet die kleinere `kurs_id`. Schreibe die Lösung mit `FIRST`/`SKIP` (Firebird).

    Spalten: `kurs_id`, `titel`, `gebuehr_monat`.
  solution: |-
    SELECT FIRST 3 SKIP 1 kurs_id, titel, gebuehr_monat
    FROM kurs
    ORDER BY gebuehr_monat DESC, kurs_id;
  solution_pg: |-
    SELECT kurs_id, titel, gebuehr_monat
    FROM kurs
    ORDER BY gebuehr_monat DESC, kurs_id
    LIMIT 3 OFFSET 1;
  ordered: true
  dialect_note: "`FIRST n SKIP m` steht in Firebird direkt hinter `SELECT`, `LIMIT n OFFSET m` in PostgreSQL am Ende. Die Standardform `OFFSET 1 ROWS FETCH NEXT 3 ROWS ONLY` am Ende der Abfrage läuft in beiden Systemen."
  hints:
    - "Ohne `ORDER BY` ist nicht festgelegt, welche Zeilen „die ersten“ sind."
    - "`SKIP 1` überspringt eine Zeile, `FIRST 3` nimmt danach drei."
