      correct: true
      explain: "Firebird ändert den Typ von Spalten in PRIMARY KEY-, UNIQUE- oder FOREIGN KEY-Constraints nicht. Man muss den Constraint vorher entfernen und danach neu anlegen."
    - text: "Die Spalte wird verlängert, weil kein Datenverlust droht."
