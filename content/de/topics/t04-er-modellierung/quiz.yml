- id: t04-q028
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [pruefen, redundanz]
  type: single
  question: |-
    Ein ERD enthält `Lehrkraft —1— leitet —n— Klasse`, `Klasse —1— hat —n— Schüler:in` und zusätzlich `Lehrkraft —1— ist Klassenleitung von —n— Schüler:in`. Die letzte Beziehung soll nur ausdrücken, wer die Klasse der Schüler:in leitet. Wie ist sie zu bewerten?
  options:
    - text: "Redundant, weil sie sich über Klasse vollständig ableiten lässt; sie sollte entfallen."
      correct: true
      explain: "Mit der gemeinten Bedeutung folgt sie aus dem Zyklus. Gespeichert müsste sie bei jedem Klassenwechsel mitgepflegt werden und könnte widersprechen."
    - text: "Notwendig, weil man sonst nicht weiß, wer eine Schüler:in betreut."
      correct: false
      explain: "Das weiß man über den Weg Schüler:in, Klasse, Lehrkraft."
    - text: "Erlaubt, weil Zyklen in ER-Diagrammen grundsätzlich verboten sind und diese Beziehung einen Zyklus auflöst."
      correct: false
      explain: "Zyklen sind nicht grundsätzlich verboten. Problematisch ist nur eine Beziehung, die nichts Neues ausdrückt. Hier erzeugt sie den Zyklus erst."
    - text: "Sie wäre nur dann redundant, wenn sie eine andere Kardinalität hätte."
      correct: false
      explain: "Redundanz hängt an der Bedeutung, nicht an der Kardinalität. Hätte sie eine eigene Bedeutung (z. B. Mentor:in), wäre sie nicht redundant."
