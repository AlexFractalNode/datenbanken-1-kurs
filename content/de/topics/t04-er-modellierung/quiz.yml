  question: |-
    Entitätstyp `Route` mit den Attributen Routen-ID, Wand-Nr., Routen-Nr., Name, Schwierigkeit. Eindeutig sind Routen-ID allein und die Kombination (Wand-Nr., Routen-Nr.), aber weder Wand-Nr. noch Routen-Nr. allein. Namen und Schwierigkeiten können sich wiederholen. Welche Attributmenge ist ein **Schlüsselkandidat**?
