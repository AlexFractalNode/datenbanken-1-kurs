    - text: "Gartengerät mit Inventarnummer, das von vielen Pächter:innen ausgeliehen wird"
      correct: false
      explain: "Viele Beziehungen machen einen Typ nicht schwach. Das Gerät existiert unabhängig von jeder Ausleihe und hat mit der Inventarnummer einen eigenen Schlüssel. Es fehlen also Existenzabhängigkeit und geliehene Identifikation."
