    - text: "Ternäre Beziehungen brauchen weniger Platz im Diagramm."
      correct: false
      explain: "Platz ist kein fachliches Kriterium. Es geht um Ausdrucksstärke."
    - text: "Binäre Beziehungen dürfen keine Attribute haben."
      correct: false
