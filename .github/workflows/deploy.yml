name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build PDFs, diagrams and Anki decks
        run: |
          uv run tools/pdf.py
          node tools/render_diagrams.mjs --out dist/diagrams
          uv run tools/anki_export.py --per-topic --diagrams dist/diagrams

      - name: Package zip
        run: |
          mkdir -p dist/package
          git archive --format=zip --prefix="datenbanken-1-kurs-${GITHUB_REF_NAME}/" \
            -o "dist/package/datenbanken-1-kurs-${GITHUB_REF_NAME}.zip" HEAD

      - name: Extract changelog section
        run: uv run tools/changelog_extract.py "$GITHUB_REF_NAME" --out dist/release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/anki/*.apkg
            dist/pdf/*.pdf
            dist/package/*.zip
