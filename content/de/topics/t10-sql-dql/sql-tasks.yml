- id: t10-s026
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [mengenoperationen, intersect-ersatz, exists, dialekt]
  db: firma
  kind: query
  prompt: |-
    Wer arbeitet **sowohl** im Projekt 2 **als auch** im Projekt 4 mit? In PostgreSQL ginge das mit `INTERSECT`, Firebird 3 kennt `INTERSECT` aber nicht. Formuliere die Schnittmenge mit `EXISTS`.

    Spalte: `mitarbeiter_id`.
  solution: |-
    SELECT m1.mitarbeiter_id
    FROM mitarbeit m1
    WHERE m1.projekt_id = 2
      AND EXISTS (SELECT 1
                  FROM mitarbeit m2
                  WHERE m2.mitarbeiter_id = m1.mitarbeiter_id
                    AND m2.projekt_id = 4);
  solution_pg: |-
    SELECT mitarbeiter_id FROM mitarbeit WHERE projekt_id = 2
    INTERSECT
    SELECT mitarbeiter_id FROM mitarbeit WHERE projekt_id = 4;
  ordered: false
  dialect_note: "Die EXISTS-Form läuft in beiden Systemen. `INTERSECT` gibt es nur in PostgreSQL. Duplikate entstehen hier nicht, weil (`mitarbeiter_id`, `projekt_id`) Primärschlüssel ist; sonst bräuchte die EXISTS-Form ein `DISTINCT`."
  hints:
    - "`WHERE projekt_id = 2 AND projekt_id = 4` ist für jede einzelne Zeile falsch."
    - "Prüfe für jede Zeile aus Projekt 2, ob es zur selben Person eine Zeile aus Projekt 4 gibt."
  paper_mode: write
- id: t10-s027
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [mengenoperationen, except-ersatz, not-exists, dialekt]
  db: firma
  kind: query
  prompt: |-
    Welche Mitarbeitenden arbeiten in **keinem** Projekt mit? In PostgreSQL ginge das mit `EXCEPT`. Formuliere die Differenz Firebird-tauglich mit `NOT EXISTS` und gib zusätzlich den Nachnamen aus.

    Spalten: `mitarbeiter_id`, `nachname`.
  solution: |-
    SELECT m.mitarbeiter_id, m.nachname
    FROM mitarbeiter m
    WHERE NOT EXISTS (SELECT 1
                      FROM mitarbeit ma
                      WHERE ma.mitarbeiter_id = m.mitarbeiter_id);
  ordered: false
  dialect_note: "In PostgreSQL wäre `SELECT mitarbeiter_id FROM mitarbeiter EXCEPT SELECT mitarbeiter_id FROM mitarbeit` möglich, liefert aber nur die ID. Firebird 3 kennt `EXCEPT` nicht."
  hints:
    - "Eine Differenz A − B entspricht: Zeilen aus A, zu denen es in B keinen Partner gibt."
    - "Alternativ ginge ein LEFT JOIN mit `WHERE ma.mitarbeiter_id IS NULL`."
