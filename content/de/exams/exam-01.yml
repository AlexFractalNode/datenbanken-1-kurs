      ref: "JOIN; Aggregatfunktionen; Unterabfragen"
    - id: wp-dreiwertige-logik
      ref: "NULL-Vergleiche (UNKNOWN)"
  tags: [select, join, group-by, having, not-exists, "null"]
  type: sql-write
  difficulty: 3
  points: 11
  minutes: 10
  prompt: |-
    Gegeben ist das Schema der Jungpflanzenbörse (Firebird 3):

    ```
    mitglied     (mitglied_nr, vorname, nachname, beitritt, email)
    angebot      (angebot_nr, anbieter_nr → mitglied, pflanze, stueck, preis,
                  eingestellt_am)
    reservierung (angebot_nr → angebot, mitglied_nr → mitglied, stueck,
                  abgeholt_am)
    ```

    - `email` kann NULL sein. `preis` ist NULL bei Tauschangeboten.
    - Primärschlüssel von `reservierung` ist (`angebot_nr`, `mitglied_nr`). `reservierung.stueck` ist die reservierte Stückzahl, `abgeholt_am` ist NULL, solange nicht abgeholt wurde.

    Schreibe die Abfragen in SQL.

    a) Alle Tauschangebote: Angebotsnummer, Pflanze, Stückzahl und Nachname der Anbieter:in, die zuletzt eingestellten zuerst. (3 P)
    b) Überbuchte Angebote: Angebotsnummer, Pflanze, angebotene Stückzahl und Summe der reservierten Stück, und zwar nur für Angebote, bei denen insgesamt mehr Stück reserviert als angeboten sind. (4 P)
    c) Angebote, die vor dem 1. Mai 2025 eingestellt wurden und noch **keine** Reservierung haben: Angebotsnummer, Pflanze und Nachname der Anbieter:in. Verwende für „keine Reservierung“ eine Unterabfrage. (4 P)
  solution: |-
    a)
    ```sql
    SELECT a.angebot_nr, a.pflanze, a.stueck, m.nachname
    FROM angebot a
    JOIN mitglied m ON m.mitglied_nr = a.anbieter_nr
    WHERE a.preis IS NULL
    ORDER BY a.eingestellt_am DESC;
    ```
    `a.preis = NULL` wäre falsch: Der Vergleich ergibt UNKNOWN und liefert keine Zeile.

    b)
    ```sql
    SELECT a.angebot_nr, a.pflanze, a.stueck, SUM(r.stueck) AS reserviert
    FROM angebot a
    JOIN reservierung r ON r.angebot_nr = a.angebot_nr
    GROUP BY a.angebot_nr, a.pflanze, a.stueck
    HAVING SUM(r.stueck) > a.stueck;
    ```
    Alle nicht aggregierten Spalten der SELECT-Liste stehen im `GROUP BY`; deshalb darf `a.stueck` auch im `HAVING` stehen. Die Bedingung auf die Summe gehört ins `HAVING`, nicht ins `WHERE`.

    c)
    ```sql
    SELECT a.angebot_nr, a.pflanze, m.nachname
    FROM angebot a
    JOIN mitglied m ON m.mitglied_nr = a.anbieter_nr
    WHERE a.eingestellt_am < DATE '2025-05-01'
      AND NOT EXISTS (
        SELECT 1
        FROM reservierung r
        WHERE r.angebot_nr = a.angebot_nr
      );
    ```
    Gleichwertig: `a.angebot_nr NOT IN (SELECT angebot_nr FROM reservierung)`. Das ist hier sicher, weil `reservierung.angebot_nr` als Teil des Primärschlüssels nie NULL ist. Für das Datum sind `DATE '2025-05-01'`, `'2025-05-01'` und in Firebird auch `'01.05.2025'` gleichwertig; die ISO-Form mit `DATE` ist portabel.
  rubric:
    - criterion: "a) Join angebot–mitglied über anbieter_nr"
      points: 1
    - criterion: "a) preis IS NULL (nicht = NULL)"
      points: 1
    - criterion: "a) Spaltenliste (0,5) und ORDER BY eingestellt_am DESC (0,5)"
      points: 1
    - criterion: "b) Join angebot–reservierung"
      points: 1
    - criterion: "b) GROUP BY mit allen nicht aggregierten Spalten"
      points: 1
    - criterion: "b) SUM(r.stueck) in der Ausgabe"
      points: 0.5
    - criterion: "b) HAVING SUM(r.stueck) > a.stueck"
      points: 1
    - criterion: "b) richtige Spalten, Stückzahlen von angebot und reservierung nicht verwechselt"
      points: 0.5
    - criterion: "c) NOT EXISTS bzw. NOT IN als Unterabfrage (1); richtige Verknüpfung über angebot_nr, korreliert bei EXISTS (1)"
      points: 2
    - criterion: "c) Datumsbedingung; DATE '2025-05-01', '2025-05-01' oder in Firebird '01.05.2025' gleichwertig"
      points: 0.5
    - criterion: "c) Join auf mitglied für den Nachnamen"
      points: 1
    - criterion: "c) kein innerer Join auf reservierung in der äußeren Abfrage, richtige Spalten"
      points: 0.5
  space: lines:28
- id: e01-p012
  topic: t11
  status: reviewed
  reviews: [fach, aufgaben, leak]
  sources:
    - id: firebird-30-language-reference
      ref: "Kap. 6 DML: INSERT, UPDATE, DELETE"
    - id: wp-referentielle-integritaet
      ref: "Löschweitergabe, Kaskadierung"
  tags: [dml, insert, update, delete, unterabfrage, kaskade]
  type: sql-write
  difficulty: 2
  points: 4
  minutes: 4
  prompt: |-
    Schema wie in der vorigen Aufgabe. Die Fremdschlüssel wirken beim Löschen so:
    - `angebot → mitglied`: Angebote werden mit ihrem Mitglied gelöscht (wie in Aufgabe 10 a) gefordert).
    - `reservierung → angebot`: Reservierungen werden mit ihrem Angebot gelöscht.
    - `reservierung → mitglied`: keine Löschaktion.

    Schreibe die Anweisungen in Firebird-3-SQL.

    a) Mitglied 31 reserviert 2 Stück von Angebot 108. (1 P)
    b) Mitglied 31 holt diese Reservierung am 3. Mai 2025 ab. (1 P)
    c) Lösche alle noch nicht abgeholten Reservierungen zu Angeboten, die vor dem 1. April 2025 eingestellt wurden. (1 P)
    d) Mitglied 12 hat zwei Angebote; zu einem davon hat Mitglied 40 eine Reservierung. Mitglied 12 selbst hat nichts reserviert. Was bewirkt `DELETE FROM mitglied WHERE mitglied_nr = 12;`? (1 P)
  solution: |-
    a)
    ```sql
    INSERT INTO reservierung (angebot_nr, mitglied_nr, stueck)
    VALUES (108, 31, 2);
    ```
    `abgeholt_am` bleibt NULL.

    b)
    ```sql
    UPDATE reservierung
    SET abgeholt_am = DATE '2025-05-03'
    WHERE angebot_nr = 108 AND mitglied_nr = 31;
    ```
    Beide Spalten des Primärschlüssels gehören in die Bedingung, sonst träfe die Änderung alle Reservierungen von Angebot 108 bzw. von Mitglied 31.

    c)
    ```sql
    DELETE FROM reservierung
    WHERE abgeholt_am IS NULL
      AND angebot_nr IN (SELECT angebot_nr FROM angebot
                         WHERE eingestellt_am < DATE '2025-04-01');
    ```
    Für die Datumswerte sind `DATE '2025-04-01'`, `'2025-04-01'` und in Firebird auch `'01.04.2025'` gleichwertig.

    d) Mitglied 12 wird gelöscht. Seine beiden Angebote werden mitgelöscht. Dadurch wird auch die Reservierung von Mitglied 40 zu diesem Angebot gelöscht, weil die Löschung über `angebot` weiter auf `reservierung` wirkt (zweistufige Kaskade). Mitglied 40 selbst bleibt erhalten.
  rubric:
    - criterion: "a) INSERT mit Spaltenliste und passenden Werten"
      points: 1
    - criterion: "b) UPDATE mit Datumswert (DATE '2025-05-03', '2025-05-03' oder in Firebird '03.05.2025' gleichwertig) und beiden PK-Spalten in der Bedingung"
      points: 1
    - criterion: "c) abgeholt_am IS NULL (0,5) und Unterabfrage bzw. gleichwertige Bedingung auf eingestellt_am (0,5); Datumsformen wie in b) gleichwertig"
      points: 1
    - criterion: "d) Angebote von Mitglied 12 mitgelöscht (0,5); Reservierung von Mitglied 40 über die zweite Stufe mitgelöscht (0,5)"
      points: 1
  space: lines:14
- id: e01-p013
  topic: t12
  status: reviewed
  reviews: [fach, aufgaben, leak]
  sources:
    - id: wp-datenbanktrigger
      ref: "BEFORE/AFTER-Trigger"
    - id: firebird-30-language-reference
      ref: "Kap. 7 Procedural SQL (PSQL) Statements: Trigger, EXCEPTION"
  tags: [trigger, check, tabellenuebergreifend, prozedurale-integritaet, ausloeseereignisse]
  type: explain
  difficulty: 3
  points: 3
  minutes: 3
  prompt: |-
    In der Börse darf niemand ein eigenes Angebot reservieren: `reservierung.mitglied_nr` darf nicht gleich der `anbieter_nr` des zugehörigen Angebots sein.

    a) Warum lässt sich diese Regel nicht zuverlässig mit einem `CHECK` in `reservierung` sichern? (1 P)
    b) Die Regel soll mit Triggern vollständig gelten. Gib an, **auf welchen Tabellen** und **bei welchen Ereignissen** ein Trigger nötig ist, und beschreibe jeweils kurz, was er prüft. (2 P)
  solution: |-
    a) Ein `CHECK` bezieht sich auf die Werte der eigenen Zeile. Die `anbieter_nr` steht aber in einer anderen Tabelle. PostgreSQL verbietet Unterabfragen im CHECK. Firebird erlaubt sie, prüft sie aber nur, wenn sich die Reservierungszeile ändert. Die Regel kann aber auch von der anderen Seite verletzt werden (siehe b).

    b)
    - **reservierung, BEFORE INSERT und BEFORE UPDATE** (von `angebot_nr` oder `mitglied_nr`): Der Trigger liest die `anbieter_nr` des Angebots `NEW.angebot_nr` und löst eine Exception aus, wenn sie gleich `NEW.mitglied_nr` ist.
    - **angebot, BEFORE UPDATE** (von `anbieter_nr`): Der Trigger prüft, ob es zu diesem Angebot eine Reservierung des neuen Anbieters gibt (`mitglied_nr = NEW.anbieter_nr`), und bricht dann ab.

    Einfügen eines neuen Angebots und Löschen sind unkritisch: Ein neues Angebot hat noch keine Reservierungen, und Löschen kann die Regel nicht verletzen. Ein AFTER-Trigger mit Exception ist gleichwertig, weil die Exception die Anweisung zurücknimmt; BEFORE ist der übliche Zeitpunkt für Prüfungen.
  rubric:
    - criterion: "a) CHECK sieht nur die eigene Zeile bzw. die Regel betrifft eine andere Tabelle (mit Unterabfrage unvollständig bzw. in PostgreSQL verboten)"
      points: 1
    - criterion: "b) Trigger auf reservierung bei INSERT und UPDATE, der anbieter_nr nachliest und bei Gleichheit abbricht (AFTER mit Exception gleichwertig)"
      points: 1
    - criterion: "b) Trigger auf angebot bei UPDATE von anbieter_nr, der vorhandene Reservierungen des neuen Anbieters prüft"
      points: 1
  space: lines:9
- id: e01-p014
  topic: t13
  status: reviewed
  reviews: [fach, aufgaben, leak]
  sources:
    - id: wp-sql-injection
      ref: "Funktionsweise; Gegenmaßnahmen"
    - id: wp-prepared-statement
      ref: "Parametrisierte Anweisungen"
    - id: sqlite-documentation
      ref: "Prepared Statements (sqlite3_prepare, Parameterbindung)"
  tags: [sql-injection, prepared-statement, update]
  type: explain
  difficulty: 2
  points: 1
  minutes: 1
  prompt: |-
    In der Vereins-App kann ein Mitglied seine E-Mail-Adresse ändern. Der Code setzt die Eingabe direkt in den SQL-Text ein (Pseudocode, `nr` ist die Nummer des angemeldeten Mitglieds):

    ```
    sql = "UPDATE mitglied SET email = '" + eingabe + "' WHERE mitglied_nr = " + nr
    ```

    Mitglied 31 gibt `x@beispiel.de' --` ein. Beschreibe die Wirkung und nenne die Gegenmaßnahme. Den entstehenden SQL-Text musst du nicht aufschreiben. (1 P)
  solution: |-
    Beim DBMS kommt an (zur Erläuterung):
    ```sql
    UPDATE mitglied SET email = 'x@beispiel.de' --' WHERE mitglied_nr = 31
    ```
    Das Apostroph der Eingabe schließt das Literal, `--` macht den Rest der Zeile zum Kommentar. Die `WHERE`-Bedingung fällt weg: **Alle** Mitglieder erhalten diese E-Mail-Adresse.

    Gegenmaßnahme: ein **Prepared Statement** (Parameterbindung), `UPDATE mitglied SET email = ? WHERE mitglied_nr = ?`, beide Werte als Parameter übergeben. Die Eingabe wird dann nie als SQL-Text interpretiert, sondern nur als Wert eingesetzt.
  rubric:
    - criterion: "Wirkung: Literal geschlossen, WHERE auskommentiert, alle Mitglieder erhalten die Adresse"
      points: 0.5
    - criterion: "Prepared Statement bzw. Parameterbindung mit Platzhaltern"
      points: 0.5
  space: lines:6
