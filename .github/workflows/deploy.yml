name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    # The same checks as on every push/PR; nothing is published unless they pass.
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    # Pages are published from main only; tag runs just build and release.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/typst
          key: typst-${{ runner.os }}-${{ hashFiles('tools/typst/**', 'tools/pdf.py') }}
          restore-keys: typst-${{ runner.os }}-

      - name: Validate with total minimum counts
        run: uv run tools/validate.py --strict

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build PDFs, diagrams and Anki decks
        run: |
          node tools/render_diagrams.mjs --out dist/diagrams
          uv run tools/pdf.py --diagrams dist/diagrams
          uv run tools/anki_export.py --per-topic --diagrams dist/diagrams

      - name: Package zip
        run: |
          mkdir -p dist/package
          git archive --format=zip --prefix="datenbanken-1-kurs-${GITHUB_REF_NAME}/" \
            -o "dist/package/datenbanken-1-kurs-${GITHUB_REF_NAME}.zip" HEAD

      - name: Extract changelog section
        run: uv run tools/changelog_extract.py "$GITHUB_REF_NAME" --out dist/release-notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/anki/*.apkg
            dist/pdf/*.pdf
            dist/package/*.zip
