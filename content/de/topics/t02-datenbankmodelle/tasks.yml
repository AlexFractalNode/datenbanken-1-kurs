- id: t02-p008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [ansi-sparc, datenunabhaengigkeit]
  type: explain
  difficulty: 2
  points: 6
  minutes: 6
  prompt: |-
    Ein Tierheim betreibt eine relationale Datenbank für Tiere, Pflegestellen und Vermittlungen.
    a) Erläutere die drei Ebenen der ANSI-SPARC-Architektur. Gib für jede Ebene ihre Aufgabe und ein typisches Schemaobjekt aus dem Tierheim an, jeweils mit der Art der SQL-Anweisung, mit der es angelegt wird.
    b) Erkläre, was die Abbildungen zwischen den Ebenen leisten und welches Ziel die Architektur damit verfolgt.
  solution: |-
    a) Musterlösung (andere passende Objekte gleichwertig):
    - **Externe Ebene:** Aufgabe: jeder Benutzergruppe bzw. Anwendung nur ihren Ausschnitt der Daten in passender Form zeigen. Beispiel: Sicht für die Website mit Name, Art, Alter und Foto aller vermittelbaren Tiere, ohne Pflegekosten (`CREATE VIEW`).
    - **Konzeptionelle Ebene:** Aufgabe: die eine, vollständige und anwendungsneutrale Gesamtbeschreibung aller Daten, ihrer Zusammenhänge und Integritätsbedingungen. Beispiel: tier(<u>tier_nr</u>, name, art, aufnahme_am, status) mit Primärschlüssel und Fremdschlüssel aus vermittlung (`CREATE TABLE`). In der weiten Lesart gehört hierher zusätzlich das ER-Schema, aus dem die Tabellen abgeleitet sind.
    - **Interne Ebene:** Aufgabe: festlegen, wie und wo die Daten gespeichert werden, damit der Zugriff schnell ist. Beispiel: Index auf tier(status) (`CREATE INDEX`); ebenso Dateiorganisation, Seitengröße, Speicherort.

    b) Die **Abbildungen** übersetzen zwischen extern ↔ konzeptionell und konzeptionell ↔ intern: Anfragen an eine Sicht werden nach unten in Zugriffe auf Tabellen und Speicherstrukturen übersetzt, Ergebnisse nach oben in die Form der Sicht gebracht. **Ziel:** Datenunabhängigkeit. Ändert sich die interne Ebene, passt man nur die untere Abbildung an (physische Datenunabhängigkeit); ändert sich das konzeptionelle Schema, nur die obere (logische Datenunabhängigkeit). Anwendungen bleiben unverändert.
  rubric:
    - criterion: "Externe Ebene: Aufgabe richtig (1 Punkt) und passende Sicht mit CREATE VIEW (0,5 Punkte)"
      points: 1.5
    - criterion: "Konzeptionelle Ebene: Aufgabe richtig (1 Punkt) und Tabelle mit CREATE TABLE (0,5 Punkte); ein zusätzlich genanntes ER-Schema ist zulässig, wenn die Tabellen ebenfalls hier eingeordnet sind"
      points: 1.5
    - criterion: "Interne Ebene: Aufgabe richtig (1 Punkt) und Index mit CREATE INDEX oder andere Speicherstruktur (0,5 Punkte)"
      points: 1.5
    - criterion: "b) Abbildungen als Übersetzung zwischen den Ebenen erklärt"
      points: 0.5
    - criterion: "b) Ziel Datenunabhängigkeit genannt und physische bzw. logische der richtigen Abbildung zugeordnet"
      points: 1
  space: lines:18
