  tags: [left-join, coalesce, not-exists, korrelierte-unterabfrage, having]
  type: sql-write
  difficulty: 3
  points: 10
  minutes: 9
  prompt: |-
    Gegeben ist das (vereinfachte) Ticketschema von „Klangwerk“ in Firebird 3. Je Veranstaltung ist nur der Hauptact erfasst.

    ```
    spielstaette  (st_id PK, name, stadt, kapazitaet)
    kuenstler     (k_id PK, name, genre)
    veranstaltung (va_id PK, titel, datum DATE, st_id → spielstaette, k_id → kuenstler)
    kategorie     (va_id → veranstaltung, kat_code, bezeichnung, preis, kontingent)
                  PK (va_id, kat_code)
    kunde         (kd_id PK, vorname, nachname, email, stadt)
    bestellung    (best_id PK, kd_id → kunde, best_datum DATE, status)
    ticket        (ticket_id PK, best_id → bestellung, va_id, kat_code, barcode,
                   preis_bezahlt, eingelassen BOOLEAN)
                  (va_id, kat_code) → kategorie
    ```
    `bestellung.kd_id` ist NULL bei Barverkäufen ohne Kundenkonto. `status` ist nie NULL und hat einen der Werte 'offen', 'bezahlt', 'storniert'. `preis_bezahlt` ist nie NULL.

    Schreibe die Abfragen von Hand in Firebird-3-Syntax.

    a) Für jede Veranstaltung im Dezember 2025: Titel, Datum und Umsatz (`umsatz`, Summe von `preis_bezahlt` aller Tickets der Veranstaltung, unabhängig vom Bestellstatus). Veranstaltungen ohne Tickets erscheinen mit Umsatz 0. Höchster Umsatz zuerst. (3 P)

    b) Vor- und Nachname aller Kund:innen, die noch **nie** ein Ticket für eine Veranstaltung in einer Spielstätte der Stadt 'Leipzig' hatten, unabhängig vom Bestellstatus. Kund:innen ganz ohne Bestellung gehören dazu. Vervollständige das Gerüst. (3 P)

    ```sql
    SELECT k.vorname, k.nachname
    FROM kunde k
    WHERE NOT EXISTS (SELECT *
                      FROM bestellung b
                      JOIN ticket t ON t.best_id = b.best_id
                      -- hier ergänzen
                     );
    ```

    c) Gesucht sind die **ausverkauften** Veranstaltungen mit Titel, Datum und `verkauft`, der Zahl der Tickets aus **nicht stornierten** Bestellungen. Ausverkauft heißt: `verkauft` ist mindestens so groß wie die Summe der Kontingente aller Kategorien der Veranstaltung. Ergänze das Gerüst um `WHERE`, `GROUP BY` und `HAVING`. (4 P)

    ```sql
    SELECT v.titel, v.datum, COUNT(*) AS verkauft
    FROM veranstaltung v
    JOIN ticket t     ON t.va_id = v.va_id
    JOIN bestellung b ON b.best_id = t.best_id
    -- hier ergänzen
    ```
  solution: |-
    **a)**
    ```sql
    SELECT v.titel, v.datum,
           COALESCE(SUM(t.preis_bezahlt), 0) AS umsatz
    FROM veranstaltung v
    LEFT JOIN ticket t ON t.va_id = v.va_id
    WHERE v.datum BETWEEN DATE '2025-12-01' AND DATE '2025-12-31'
    GROUP BY v.va_id, v.titel, v.datum
    ORDER BY umsatz DESC;
    ```
    Der `LEFT JOIN` erhält Veranstaltungen ohne Tickets. Für sie ergibt `SUM` NULL, `COALESCE` macht daraus 0. Gleichwertig: `EXTRACT(YEAR …) = 2025 AND EXTRACT(MONTH …) = 12`, `ORDER BY 3 DESC` oder eine korrelierte Unterabfrage `COALESCE((SELECT SUM(…) FROM ticket t WHERE t.va_id = v.va_id), 0)` in der SELECT-Liste.

    **b)** Ergänzung im Gerüst:
    ```sql
                      JOIN veranstaltung v ON v.va_id = t.va_id
                      JOIN spielstaette s  ON s.st_id = v.st_id
                      WHERE b.kd_id = k.kd_id
                        AND s.stadt = 'Leipzig'
    ```
    Die Bedingung auf Leipzig muss **in** der Unterabfrage stehen. Kund:innen ohne Bestellung liefern dort keine Zeile und erscheinen deshalb im Ergebnis.

    **c)** Ergänzung im Gerüst:
    ```sql
    WHERE b.status <> 'storniert'
    GROUP BY v.va_id, v.titel, v.datum
    HAVING COUNT(*) >= (SELECT SUM(k.kontingent)
                        FROM kategorie k
                        WHERE k.va_id = v.va_id);
    ```
    Die Kontingentsumme kommt aus einer korrelierten Unterabfrage. Ein zusätzlicher Join mit `kategorie` im Hauptteil würde jedes Ticket mit jeder Kategorie seiner Veranstaltung verbinden und beide Zahlen verfälschen.
  rubric:
    - criterion: "a) LEFT JOIN veranstaltung–ticket (Veranstaltungen ohne Tickets bleiben erhalten)"
      points: 1
    - criterion: "a) COALESCE(SUM(preis_bezahlt), 0) oder gleichwertig"
      points: 1
    - criterion: "a) WHERE auf Dezember 2025 und GROUP BY über die Veranstaltung samt titel und datum"
      points: 0.5
    - criterion: "a) ORDER BY umsatz absteigend"
      points: 0.5
    - criterion: "b) Joins auf veranstaltung und spielstaette in der Unterabfrage korrekt ergänzt (oder gleichwertig, z. B. IN- bzw. EXISTS-Unterabfrage auf veranstaltung/spielstaette)"
      points: 1
    - criterion: "b) Korrelation b.kd_id = k.kd_id"
      points: 1
    - criterion: "b) Bedingung stadt = 'Leipzig' innerhalb der Unterabfrage"
      points: 1
    - criterion: "c) WHERE b.status <> 'storniert'"
      points: 0.5
    - criterion: "c) GROUP BY über die Veranstaltung samt titel und datum"
      points: 1
    - criterion: "c) HAVING COUNT(*) >= Unterabfrage"
      points: 0.5
    - criterion: "c) Unterabfrage mit SUM(kontingent) aus kategorie"
      points: 1
    - criterion: "c) Unterabfrage korreliert über k.va_id = v.va_id (gleichwertig: Join mit abgeleiteter Tabelle je va_id)"
      points: 1
  space: lines:30
- id: e02-p011
  topic: t10
  status: reviewed
  reviews: [fach, aufgaben, leak]
  sources:
    - id: wp-dreiwertige-logik
      ref: "Kleene-Logik (SQL: TRUE/FALSE/UNKNOWN)"
  tags: [dreiwertige-logik, "null", where-auswertung, is-distinct-from]
  type: 3vl
  difficulty: 2
  points: 2
  minutes: 2
  prompt: |-
    Gegeben ist die Tabelle `bestellung` (Auszug):

    | best_id | kd_id | status |
    |---|---|---|
    | 1 | 5 | bezahlt |
    | 2 | NULL | storniert |
    | 3 | NULL | offen |
    | 4 | 7 | offen |

    ```sql
    SELECT best_id FROM bestellung
    WHERE NOT (kd_id = 7) OR status = 'storniert';
    ```

    a) Gib für jede Zeile den Wahrheitswert der WHERE-Bedingung an (TRUE, FALSE oder UNKNOWN) und welche Zeilen die Abfrage liefert. (1,5 P)

    b) Gemeint waren alle Bestellungen, die nicht von Kund:in 7 stammen, sowie alle stornierten. Ändere die Bedingung so, dass auch Bestellung 3 geliefert wird. (0,5 P)
  solution: |-
    **a)**
    | best_id | NOT (kd_id = 7) | status = 'storniert' | Bedingung |
    |---|---|---|---|
    | 1 | NOT FALSE = TRUE | FALSE | **TRUE** |
    | 2 | NOT UNKNOWN = UNKNOWN | TRUE | **TRUE** |
    | 3 | NOT UNKNOWN = UNKNOWN | FALSE | **UNKNOWN** |
    | 4 | NOT TRUE = FALSE | FALSE | **FALSE** |

    `WHERE` behält nur TRUE. Ergebnis: Bestellungen **1 und 2**.

    **b)** Eine davon, andere korrekte Formulierungen gleichwertig:
    - `WHERE kd_id IS DISTINCT FROM 7 OR status = 'storniert'`
    - `WHERE NOT (kd_id = 7) OR kd_id IS NULL OR status = 'storniert'`
    - `WHERE COALESCE(kd_id, 0) <> 7 OR status = 'storniert'` (sofern 0 keine Kundennummer ist)
  rubric:
    - criterion: "a) Wahrheitswerte TRUE, TRUE, UNKNOWN, FALSE (je 0,25)"
      points: 1
    - criterion: "a) Ergebnis Bestellungen 1 und 2"
      points: 0.5
    - criterion: "b) korrigierte Bedingung mit IS DISTINCT FROM, IS NULL oder gleichwertig korrekt"
      points: 0.5
  space: lines:8
- id: e02-p012
  topic: t11
  status: reviewed
  reviews: [fach, aufgaben, leak]
  sources:
    - id: firebird-30-language-reference
      ref: "Kap. 6 Data Manipulation (DML) Statements (INSERT, UPDATE, DELETE)"
    - id: postgresql-17-docs-sql
      ref: "Kap. 6 Data Manipulation (INSERT, UPDATE, DELETE)"
  tags: [insert, update, unterabfrage, delete, referenzielle-aktionen, kaskade]
  type: sql-write
  difficulty: 2
  points: 5
  minutes: 5
  prompt: |-
    Es gilt das Ticketschema aus Aufgabe e02-p010 (Auszug):

    ```
    spielstaette  (st_id PK, name, stadt, kapazitaet)
    veranstaltung (va_id PK, titel, datum DATE, st_id → spielstaette, k_id)
    kategorie     (va_id → veranstaltung, kat_code, bezeichnung, preis, kontingent)
                  PK (va_id, kat_code)
    bestellung    (best_id PK, kd_id → kunde, best_datum DATE, status)
    ticket        (ticket_id PK, best_id → bestellung, va_id, kat_code, barcode,
                   preis_bezahlt, eingelassen)
    ```
    Für `kategorie` und `bestellung` gelten die Anforderungen aus Aufgabe e02-p009. Fremdschlüssel von `ticket`: `best_id → bestellung` mit `ON DELETE CASCADE`, `(va_id, kat_code) → kategorie` ohne Aktion. Per Fremdschlüssel verweist nur `kategorie` auf `veranstaltung`.

    a) Lege für die vorhandene Kund:in 42 eine neue Bestellung an. Nummer, Datum und Status sollen automatisch bzw. mit ihren Standardwerten belegt werden. (1 P)

    b) Für alle Veranstaltungen des Jahres 2026 in Spielstätten der Stadt 'Dresden' soll der Preis der Kategorie 'A' um 5,00 € steigen. (2 P)

    c) Gib für jede Anweisung an, ob sie gelingt und was danach in `veranstaltung`, `kategorie`, `bestellung` und `ticket` fehlt. (2 P)
    1. `DELETE FROM veranstaltung WHERE va_id = 12;` (Veranstaltung 12 hat die Kategorien A und B. Für Kategorie B gibt es verkaufte Tickets.)
    2. `DELETE FROM bestellung WHERE best_id = 900;` (Bestellung 900 hat drei Tickets.)
  solution: |-
    **a)**
    ```sql
    INSERT INTO bestellung (kd_id) VALUES (42);
    ```
    Nicht genannte Spalten erhalten den Identity-Wert bzw. ihren Standardwert. `best_id` gibt man nicht selbst an.

    **b)**
    ```sql
    UPDATE kategorie
    SET preis = preis + 5.00
    WHERE kat_code = 'A'
      AND va_id IN (SELECT v.va_id
                    FROM veranstaltung v
                    JOIN spielstaette s ON s.st_id = v.st_id
                    WHERE s.stadt = 'Dresden'
                      AND v.datum BETWEEN DATE '2026-01-01' AND DATE '2026-12-31');
    ```
    Gleichwertig mit `EXISTS` statt `IN`.

    **c)**
    1. **Wird abgewiesen.** Die Kategorien sollen nach e02-p009 a) mit ihrer Veranstaltung verschwinden (CASCADE). Die Kaskade würde aber Kategorie B löschen, auf die noch Tickets verweisen. Für diesen Fremdschlüssel gilt NO ACTION, also scheitert die ganze Anweisung. Es fehlt nichts, auch Kategorie A und Veranstaltung 12 bleiben erhalten.
    2. **Gelingt.** Bestellung 900 wird gelöscht, wegen `ON DELETE CASCADE` auch ihre drei Tickets.

    Bewertet wird nach den Anforderungen aus e02-p009, unabhängig von der eigenen Lösung dort.
  rubric:
    - criterion: "a) INSERT nur mit kd_id, ohne best_id, best_datum und status"
      points: 1
    - criterion: "b) UPDATE kategorie SET preis = preis + 5 mit Bedingung kat_code = 'A'"
      points: 1
    - criterion: "b) Einschränkung auf Veranstaltungen 2026 in Dresden per Unterabfrage (IN oder EXISTS)"
      points: 1
    - criterion: "c1) abgewiesen, weil die Kaskade auf kategorie an NO ACTION von ticket scheitert (0,5); nichts gelöscht, auch nicht Kategorie A (0,5)"
      points: 1
    - criterion: "c2) gelingt, Bestellung 900 und ihre drei Tickets gelöscht (CASCADE)"
      points: 1
  space: lines:18
- id: e02-p013
  topic: t12
  status: reviewed
  reviews: [fach, aufgaben, leak]
  sources:
    - id: wp-sicht-datenbank
      ref: "Sichten"
    - id: firebird-30-language-reference
      ref: "Kap. 5 (CREATE VIEW); Kap. 13 Security (GRANT)"
  tags: [view, externes-schema, grant]
  type: sql-write
  difficulty: 1
  points: 2
  minutes: 2
  prompt: |-
    Es gelten aus dem Ticketschema (Aufgabe e02-p010) die Tabellen veranstaltung(va_id PK, titel, datum, st_id, k_id) und ticket(ticket_id PK, best_id, va_id, kat_code, barcode, preis_bezahlt, eingelassen). Die Rolle `r_abendkasse` existiert.

    Das Abendkassen-Personal soll für die Veranstaltungen des laufenden Tages nur Titel, Barcode, Kategoriecode und den Einlassstatus der Tickets sehen, keine Preise und keine anderen Tage.

    a) Lege dafür die Sicht `v_einlass` an. (1,5 P)

    b) Gib der Rolle Lesezugriff auf die Sicht. (0,5 P)
  solution: |-
    **a)**
    ```sql
    CREATE VIEW v_einlass AS
    SELECT v.titel, t.barcode, t.kat_code, t.eingelassen
    FROM ticket t
    JOIN veranstaltung v ON v.va_id = t.va_id
    WHERE v.datum = CURRENT_DATE;
    ```

    **b)**
    ```sql
    GRANT SELECT ON v_einlass TO r_abendkasse;
    ```
    Gleichwertig: `GRANT SELECT ON v_einlass TO ROLE r_abendkasse;`. Die Rolle braucht keine Rechte auf die Basistabellen, sofern der Eigentümer der Sicht diese Rechte hat.
  rubric:
    - criterion: "a) Join ticket–veranstaltung über va_id"
      points: 0.5
    - criterion: "a) nur titel, barcode, kat_code, eingelassen, ohne preis_bezahlt"
      points: 0.5
    - criterion: "a) Einschränkung auf den laufenden Tag (datum = CURRENT_DATE)"
      points: 0.5
    - criterion: "b) GRANT SELECT ON v_einlass TO [ROLE] r_abendkasse"
      points: 0.5
