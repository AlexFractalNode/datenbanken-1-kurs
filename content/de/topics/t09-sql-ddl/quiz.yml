    - text: "Die Spalte wird angelegt, die vorhandenen Zeilen enthalten NULL."
      correct: false
      explain: "Das würde NOT NULL verletzen. Firebird 3 weist die Anweisung deshalb ab."
    - text: "Die vorhandenen Zeilen werden gelöscht."
