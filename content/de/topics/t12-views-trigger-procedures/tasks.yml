- id: t12-p001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [view, with-check-option, aenderbare-sicht, datenschutz, vertiefung]
  type: sql-write
  difficulty: 2
  points: 12
  minutes: 12
  prompt: |-
    *Vertiefungsaufgabe (Umfang über einer typischen Einzelaufgabe).*

    Ein Laufverein verwaltet seine Mitglieder und Wettkampfergebnisse in Firebird 3:

    ```sql
    CREATE TABLE mitglied (
      mitglied_id   INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      vorname       VARCHAR(30) NOT NULL,
      nachname      VARCHAR(30) NOT NULL,
      email         VARCHAR(60) UNIQUE,
      telefon       VARCHAR(20),
      beitrag_monat NUMERIC(5,2) DEFAULT 15.00 NOT NULL
    );

    CREATE TABLE lauf (
      lauf_id     INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      bezeichnung VARCHAR(40) NOT NULL,
      datum       DATE NOT NULL,
      strecke_km  NUMERIC(4,1) NOT NULL
    );

    CREATE TABLE ergebnis (
      mitglied_id INTEGER NOT NULL REFERENCES mitglied (mitglied_id),
      lauf_id     INTEGER NOT NULL REFERENCES lauf (lauf_id),
      zeit_sek    INTEGER NOT NULL,
      PRIMARY KEY (mitglied_id, lauf_id)
    );
    ```

    a) Die Trainerinnen sollen eine Telefonliste bekommen: Schlüssel, Vor- und Nachname und Telefonnummer aller Mitglieder, **die eine Telefonnummer haben**. E-Mail und Beitrag sollen sie nicht sehen. Über die Liste darf niemand eine Zeile so ändern oder einfügen, dass sie danach keine Telefonnummer hat. Schreibe die Sicht `v_telefonliste`. (3 P)

    b) Entscheide für jede Anweisung, ob sie über deine Sicht ausgeführt wird, und begründe in einem Satz. Mitglied 4 hat eine Telefonnummer, Mitglied 9 auch und ist bei zwei Läufen gestartet. (4 P)

    1. `UPDATE v_telefonliste SET telefon = '0000 112233' WHERE mitglied_id = 4;`
    2. `UPDATE v_telefonliste SET telefon = NULL WHERE mitglied_id = 4;`
    3. `INSERT INTO v_telefonliste (vorname, nachname) VALUES ('Ida', 'Roth');`
    4. `DELETE FROM v_telefonliste WHERE mitglied_id = 9;`

    c) Schreibe die Sicht `v_laufstatistik`, die je Lauf die Bezeichnung, die Bestzeit in Sekunden und die Anzahl der Teilnehmenden zeigt. Begründe, warum diese Sicht nicht änderbar ist. (3 P)

    d) Nenne zwei Vorteile, die der Verein durch die Sichten aus a) und c) gegenüber direktem Tabellenzugriff hat. (2 P)
  solution: |-
    **a)**
    ```sql
    CREATE VIEW v_telefonliste AS
    SELECT mitglied_id, vorname, nachname, telefon
    FROM mitglied
    WHERE telefon IS NOT NULL
    WITH CHECK OPTION;
    ```
    Die Projektion verbirgt `email` und `beitrag_monat`, die Selektion zeigt nur Mitglieder mit Telefon, `WITH CHECK OPTION` verhindert Änderungen, durch die eine Zeile aus der Sicht herausfiele.

    **b)**
    1. **Wird ausgeführt.** Die Sicht liest aus einer Tabelle ohne Join, Aggregat und Ausdruck, ist also änderbar. Die Zeile hat danach weiter eine Telefonnummer.
    2. **Wird abgewiesen.** Nach der Änderung wäre `telefon IS NOT NULL` falsch, die Zeile fiele aus der Sicht. Das verhindert `WITH CHECK OPTION`.
    3. **Wird abgewiesen.** `telefon` fehlt und wäre NULL, die neue Zeile erfüllt die Sichtbedingung nicht (Check Option). Ohne Check Option würde die Zeile eingefügt, wäre aber in der Sicht unsichtbar.
    4. **Wird abgewiesen.** Das DELETE wirkt auf `mitglied`. Auf Mitglied 9 verweisen aber zwei Zeilen in `ergebnis`, und der Fremdschlüssel hat keine Löschaktion (NO ACTION). Ohne Ergebnisse würde das Mitglied gelöscht.

    Bewertung von b) mit Folgefehler: Hat jemand in a) eine andere Sicht geschrieben (z. B. ohne Check Option), werden die Antworten in b) an dieser eigenen Sicht gemessen. Ohne Check Option wären 2 und 3 dann folgerichtig „wird ausgeführt“ (die Zeile ist danach bzw. von Anfang an in der Sicht unsichtbar).

    Hinweis Firebird 3: Die Check Option prüft die Eingabe, bevor etwas an `mitglied` geht. Defaults und Trigger von `mitglied` können eine verletzende Eingabe also nicht mehr retten. Sichtspalten, die im INSERT fehlen, gibt Firebird bei Check Option als NULL weiter, ihre Defaults greifen dann nicht; ohne Check Option werden fehlende Spalten gar nicht weitergegeben, und die Defaults greifen.

    **c)**
    ```sql
    CREATE VIEW v_laufstatistik (bezeichnung, bestzeit_sek, teilnehmende) AS
    SELECT l.bezeichnung, MIN(e.zeit_sek), COUNT(e.mitglied_id)
    FROM lauf l
    LEFT JOIN ergebnis e ON e.lauf_id = l.lauf_id
    GROUP BY l.lauf_id, l.bezeichnung;
    ```
    Nicht änderbar: Die Sicht verbindet zwei Tabellen und gruppiert. Eine Zeile der Sicht fasst viele Ergebnisse zusammen. Bei `UPDATE … SET bestzeit_sek = 1800` wäre nicht festgelegt, welches Ergebnis sich ändern soll. (Ein innerer Join ist ebenfalls richtig; dann fehlen Läufe ohne Ergebnis.)

    **d)** zwei davon, z. B.:
    - **Datenschutz:** Die Trainerinnen bekommen Rechte nur auf `v_telefonliste` und sehen weder E-Mail noch Beitrag.
    - **Vereinfachung:** Die Statistik braucht keinen eigenen Join und kein GROUP BY mehr, ein `SELECT * FROM v_laufstatistik` genügt.
    - **Logische Datenunabhängigkeit:** Werden Telefonnummern später in eine eigene Tabelle ausgelagert, passt man nur die Sicht an; Programme, die `v_telefonliste` lesen, bleiben unverändert.
  rubric:
    - criterion: "a) Sicht liest nur aus `mitglied` mit den vier geforderten Spalten (keine E-Mail, kein Beitrag)"
      points: 1
    - criterion: "a) Bedingung `telefon IS NOT NULL` (nicht `<> NULL`)"
      points: 1
    - criterion: "a) `WITH CHECK OPTION` am Ende der Sichtdefinition"
      points: 1
    - criterion: "b) 1: ausgeführt, mit Begründung „einfache Sicht, Zeile bleibt sichtbar“ (b) wird an der eigenen Sicht aus a) bewertet, wenn die Antworten dazu folgerichtig sind)"
      points: 1
    - criterion: "b) 2: abgewiesen wegen Check Option (bzw. folgerichtig zur eigenen Sicht aus a))"
      points: 1
    - criterion: "b) 3: abgewiesen, weil `telefon` NULL wäre und die Check Option greift (bzw. folgerichtig zur eigenen Sicht aus a))"
      points: 1
    - criterion: "b) 4: abgewiesen wegen der Ergebniszeilen und des Fremdschlüssels ohne Löschaktion"
      points: 1
    - criterion: "c) korrekte Sicht mit MIN, COUNT und GROUP BY über Lauf (Join mit `ergebnis`)"
      points: 2
    - criterion: "c) Begründung: Join bzw. Gruppierung/Aggregat, keine eindeutige Zuordnung zu einer Basiszeile"
      points: 1
    - criterion: "d) zwei passende Vorteile mit Bezug auf die Sichten (je 1 P)"
      points: 2
  space: "lines:30"
- id: t12-p002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [trigger, before-insert, psql, exception, integritaet, check, assertion, vertiefung]
  type: sql-write
  difficulty: 3
  points: 12
  minutes: 14
  prompt: |-
    *Vertiefungsaufgabe (Umfang über einer typischen Einzelaufgabe).*

    In der Musikschul-Datenbank gibt es diese beiden Tabellen (Auszug):

    ```sql
    CREATE TABLE instrument (
      instrument_id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      bezeichnung   VARCHAR(30) NOT NULL UNIQUE,
      leihgebuehr   NUMERIC(8,2)         -- NULL = wird nicht verliehen
    );

    CREATE TABLE ausleihe (
      ausleihe_id   INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      instrument_id INTEGER NOT NULL REFERENCES instrument (instrument_id),
      schueler_id   INTEGER NOT NULL,
      inventar_nr   CHAR(8) NOT NULL,    -- z. B. 'VL-03'
      ausgabe       DATE NOT NULL,
      rueckgabe     DATE                 -- NULL = noch ausgeliehen
    );
    ```

    Bei jeder neuen Ausleihe sollen drei Regeln gelten:

    - (R1) Die Inventarnummer wird ohne Leerzeichen am Rand und in Großbuchstaben gespeichert (`' vl-03'` wird zu `'VL-03'`).
    - (R2) Ein Instrument, das nicht verliehen wird, darf nicht ausgeliehen werden.
    - (R3) Ein Inventarstück, das noch nicht zurückgegeben ist, darf nicht ein zweites Mal ausgeliehen werden. Die Inventarnummer bezeichnet ein Stück **schulweit eindeutig**.

    a) Lässt sich R2 deklarativ sichern, also ohne Trigger? Nenne die Möglichkeiten, die die SQL-Norm bzw. Firebird 3 dafür bieten, und begründe, warum sie R2 **in Firebird 3** nicht zuverlässig durchsetzen. (3 P)

    b) Schreibe einen Trigger, der alle drei Regeln beim Einfügen umsetzt. Du darfst Firebird PSQL, die SQL:2003-Form von Firebird oder die Standardform (`… ON ausleihe FOR EACH ROW …`, `IF … END IF`) verwenden. In Firebird sind die Exceptions schon angelegt:

    ```sql
    CREATE EXCEPTION ex_nicht_ausleihbar 'Dieses Instrument wird nicht verliehen.';
    CREATE EXCEPTION ex_schon_verliehen 'Dieses Inventarstück ist noch ausgeliehen.';
    ```

    Den isql-Rahmen `SET TERM` musst du nicht schreiben. (6 P)

    c) Dein Trigger ist ein Zeilentrigger. Was unterscheidet ihn von einem Anweisungstrigger, und warum braucht diese Aufgabe einen Zeilentrigger? (2 P)

    d) Warum muss R1 in einem BEFORE- und nicht in einem AFTER-Trigger stehen? (1 P)
  solution: |-
    **a)** Möglich sind:
    - **SQL-Norm:** `CREATE ASSERTION` mit einer Bedingung über beide Tabellen, z. B. „es gibt keine Ausleihe eines Instruments mit `leihgebuehr IS NULL`“. Eine Assertion wird nach der Norm bei jeder betroffenen Änderung geprüft, egal in welcher Tabelle, wäre also zuverlässig. Firebird 3 (und PostgreSQL) setzen Assertions aber nicht um.
    - **Firebird 3:** ein CHECK mit Unterabfrage an `ausleihe`, z. B. `CHECK (EXISTS (SELECT 1 FROM instrument i WHERE i.instrument_id = ausleihe.instrument_id AND i.leihgebuehr IS NOT NULL))`.

    Zuverlässig ist der CHECK nicht: Firebird prüft ihn nur, wenn die **eigene Zeile** in `ausleihe` eingefügt oder geändert wird. Setzt jemand später `instrument.leihgebuehr` eines verliehenen Instruments auf NULL, wird die Ausleihe nicht erneut geprüft und bleibt als Verstoß unbemerkt stehen. In Firebird wird R2 deshalb erst mit Triggern auf beiden Tabellen (`ausleihe` und `instrument`) zuverlässig. PostgreSQL verbietet Unterabfragen im CHECK ganz.

    Zusatz zu R3 (nicht gefragt): R3 betrifft nur eine Tabelle und lässt sich deklarativ über einen eindeutigen Index auf die offenen Ausleihen sichern, in PostgreSQL und SQLite als partieller Index `CREATE UNIQUE INDEX ux_ausleihe_offen ON ausleihe (inventar_nr) WHERE rueckgabe IS NULL`. Firebird 3 kennt keine partiellen Indexe.

    **b)** Firebird PSQL (der isql-Rahmen `SET TERM ^ ;` … `END^` … `SET TERM ; ^` ist zum Ausführen in isql nötig, wird aber nicht bewertet):
    ```sql
    CREATE TRIGGER trg_ausleihe_pruefen FOR ausleihe
    ACTIVE BEFORE INSERT POSITION 0
    AS
    BEGIN
      NEW.inventar_nr = UPPER(TRIM(NEW.inventar_nr));               -- R1

      IF (EXISTS (SELECT 1 FROM instrument i
                  WHERE i.instrument_id = NEW.instrument_id
                    AND i.leihgebuehr IS NULL)) THEN
        EXCEPTION ex_nicht_ausleihbar;                               -- R2

      IF (EXISTS (SELECT 1 FROM ausleihe a
                  WHERE a.inventar_nr = NEW.inventar_nr
                    AND a.rueckgabe IS NULL)) THEN
        EXCEPTION ex_schon_verliehen;                                -- R3
    END
    ```
    Gleichwertig in Standardform (Skizze):
    ```sql
    CREATE TRIGGER trg_ausleihe_pruefen
      BEFORE INSERT ON ausleihe
      REFERENCING NEW ROW AS neu
      FOR EACH ROW
    BEGIN ATOMIC
      SET neu.inventar_nr = UPPER(TRIM(neu.inventar_nr));
      IF EXISTS (SELECT 1 FROM instrument i
                 WHERE i.instrument_id = neu.instrument_id
                   AND i.leihgebuehr IS NULL) THEN
        SIGNAL SQLSTATE '45000';
      END IF;
      IF EXISTS (SELECT 1 FROM ausleihe a
                 WHERE a.inventar_nr = neu.inventar_nr
                   AND a.rueckgabe IS NULL) THEN
        SIGNAL SQLSTATE '45000';
      END IF;
    END
    ```
    Wirkung: Der Fehler bricht das INSERT ab, die Zeile wird nicht gespeichert, und die Anwendung bekommt die Meldung. R1 steht zuerst, damit R3 mit der normalisierten Nummer vergleicht. Auch die Firebird-SQL:2003-Form `CREATE TRIGGER trg_ausleihe_pruefen BEFORE INSERT ON ausleihe AS …` ist richtig. Für eine vollständige Absicherung von R3 bräuchte man zusätzlich UPDATE-Fälle (`BEFORE INSERT OR UPDATE`); verlangt war nur das Einfügen.

    **c)** Ein Zeilentrigger (`FOR EACH ROW`) läuft einmal je eingefügter Zeile und kennt deren Werte über `NEW`. Ein Anweisungstrigger (`FOR EACH STATEMENT`) läuft einmal je Anweisung, egal wie viele Zeilen sie betrifft. Entscheidend ist R1: Nur ein BEFORE-**Zeilen**trigger kann über `NEW` den Wert einer Zeile vor dem Speichern ändern. R2 und R3 könnte man nach der Norm auch in einem Anweisungstrigger prüfen, der über eine Übergangstabelle (`REFERENCING NEW TABLE AS …`) alle neuen Zeilen sieht. (Firebird kennt für DML ohnehin nur Zeilentrigger.)

    **d)** Nur vor dem Speichern lässt sich `NEW` ändern. In einem AFTER-Trigger ist die Zeile schon geschrieben und `NEW` nur lesbar.
  rubric:
    - criterion: "a) CHECK mit Unterabfrage (Firebird 3) und/oder ASSERTION (SQL-Norm) als deklarative Möglichkeit genannt"
      points: 1
    - criterion: "a) CHECK-Grenze erklärt: wird nur bei Einfügen/Ändern der eigenen Zeile in `ausleihe` geprüft, eine spätere Änderung von `instrument.leihgebuehr` bleibt unbemerkt"
      points: 1
    - criterion: "a) ASSERTION wäre nach der Norm zuverlässig, ist aber in Firebird 3 (und PostgreSQL) nicht umgesetzt (ersatzweise: PostgreSQL verbietet Unterabfragen im CHECK)"
      points: 1
    - criterion: "b) Triggerkopf: Tabelle `ausleihe`, BEFORE INSERT, zeilenweise; jede korrekte Schreibweise (PSQL, SQL:2003-Form, Standardform mit `FOR EACH ROW`) zählt, `ACTIVE` ist optional"
      points: 1
    - criterion: "b) R1: Inventarnummer über `NEW` mit `UPPER(TRIM(…))` normalisiert, vor den Prüfungen"
      points: 1
    - criterion: "b) R2: Prüfung über `instrument` mit `leihgebuehr IS NULL`"
      points: 1.5
    - criterion: "b) R3: Prüfung auf offene Ausleihe (`rueckgabe IS NULL`) mit gleicher (normalisierter) Inventarnummer"
      points: 1.5
    - criterion: "b) Verstoß bricht das Einfügen mit Fehler ab (`EXCEPTION …`, `SIGNAL` oder `RAISE EXCEPTION`)"
      points: 1
    - criterion: "c) Unterschied Zeilen- vs. Anweisungstrigger (einmal je Zeile mit NEW vs. einmal je Anweisung)"
      points: 1
    - criterion: "c) Begründung über R1 (nur ein BEFORE-Zeilentrigger kann NEW ändern); ein Hinweis, dass R2/R3 per Übergangstabelle auch im Anweisungstrigger gingen, ist ebenfalls richtig"
      points: 1
    - criterion: "d) `NEW` ist nur im BEFORE-Trigger änderbar"
      points: 1
  space: "lines:36"
- id: t12-p003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [index, zusammengesetzter-index, selektivitaet, kosten]
  type: explain
  difficulty: 2
  points: 8
  minutes: 8
  prompt: |-
    Ein Wetterdienst speichert Messwerte in Firebird 3:

    ```sql
    CREATE TABLE messwert (
      messwert_id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      station_id  INTEGER NOT NULL REFERENCES station (station_id),
      gemessen_am TIMESTAMP NOT NULL,
      temperatur  NUMERIC(4,1),
      regen_mm    NUMERIC(5,1),
      geprueft    BOOLEAN DEFAULT FALSE NOT NULL
    );
    ```

    Die Tabelle hat 40 Millionen Zeilen. 200 Stationen liefern alle zehn Minuten einen neuen Wert. Etwa die Hälfte der Zeilen ist noch nicht geprüft. Häufige Abfragen:

    - Q1: `… WHERE station_id = 17 AND gemessen_am BETWEEN TIMESTAMP '2025-03-01 00:00:00' AND TIMESTAMP '2025-03-07 23:59:59'`
    - Q2: `… WHERE geprueft = FALSE`
    - Q3: `… WHERE messwert_id = 123456`

    a) Schreibe einen Index, der Q1 möglichst gut unterstützt, und begründe die Reihenfolge der Spalten. (3 P)

    b) Warum braucht Q3 keinen zusätzlichen Index? (1 P)

    c) Lohnt sich ein Index auf `geprueft` für Q2? Begründe. (2 P)

    d) Jemand schlägt vor, einfach jede Spalte einzeln zu indizieren. Nenne zwei Gegenargumente. (2 P)
  solution: |-
    **a)**
    ```sql
    CREATE INDEX ix_messwert_station_zeit ON messwert (station_id, gemessen_am);
    ```
    `station_id` wird mit `=` eingeschränkt und steht deshalb vorn. Innerhalb einer Station sind die Einträge im Index nach `gemessen_am` sortiert, der Zeitraum ist also ein zusammenhängender Abschnitt, den das DBMS von Anfang bis Ende liest. Umgekehrt (`gemessen_am, station_id`) müsste es im Zeitraum die Einträge **aller** 200 Stationen durchgehen und Station 17 herausfiltern.

    (Firebird hat für den Fremdschlüssel `station_id` schon automatisch einen Index angelegt. Der hilft bei Q1 auch, aber schlechter: Er findet alle Messwerte der Station über alle Jahre, die Zeit muss danach noch gefiltert werden.)

    **b)** `messwert_id` ist der Primärschlüssel. Dafür legt das DBMS automatisch einen eindeutigen Index an.

    **c)** Eher nicht. Die Bedingung trifft etwa die Hälfte der Tabelle (geringe Selektivität). Über den Index müsste das DBMS 20 Millionen Zeilen einzeln anspringen, das Durchlesen der Tabelle ist dann meist billiger. Außerdem ändert sich `geprueft` laufend, jede Änderung müsste den Index mitpflegen.

    **d)** zwei davon:
    - Jeder Index muss bei jedem INSERT (hier 200 Zeilen alle zehn Minuten) und bei jeder Änderung der Spalte mitgepflegt werden, Schreiben wird langsamer.
    - Jeder Index belegt zusätzlichen Speicher, bei 40 Millionen Zeilen erheblich.
    - Einzelindexe helfen bei kombinierten Bedingungen wie Q1 schlechter als ein passender zusammengesetzter Index.
    - Indexe auf Spalten, nach denen nie gesucht wird (z. B. `regen_mm`), nützen gar nichts.
  rubric:
    - criterion: "a) `CREATE INDEX … ON messwert (station_id, gemessen_am)` syntaktisch korrekt"
      points: 1
    - criterion: "a) Begründung: Gleichheitsspalte zuerst, Bereich danach, Zeitraum liegt im Index zusammen"
      points: 2
    - criterion: "b) Primärschlüssel hat automatisch einen Index"
      points: 1
    - criterion: "c) nein, mit Begründung geringe Selektivität (etwa die Hälfte der Zeilen)"
      points: 2
    - criterion: "d) zwei stichhaltige Gegenargumente (je 1 P)"
      points: 2
  space: "lines:22"
- id: t12-p004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [datenunabhaengigkeit, view, index, ansi-sparc]
  type: define-example
  difficulty: 1
  points: 4
  minutes: 4
  prompt: |-
    Die Begriffe logische und physische Datenunabhängigkeit kennst du aus Thema t02. Hier geht es um ihre Werkzeuge.

    Eine Bäckerei-Kette liest an der Kasse aus der Sicht `v_kassenartikel (artikel_id, name, preis, allergene)`, die heute nur auf der Tabelle `artikel` beruht.

    a) Die Allergene sollen in eine eigene Tabelle `allergen` ausgelagert werden. Was muss man an der Sicht tun, damit das Kassenprogramm unverändert bleibt? Zu welcher Ebene der ANSI-SPARC-Architektur gehört die Sicht, und welche Art der Datenunabhängigkeit zeigt sich hier? (2 P)

    b) Für die häufige Suche nach der Strichcode-Nummer wird ein Index auf `artikel.ean` angelegt. Warum liefern danach alle Abfragen, auch die auf `v_kassenartikel`, genau dieselben Ergebnisse wie vorher? Zu welcher Ebene gehört der Index, und welche Art der Datenunabhängigkeit zeigt sich? (2 P)
  solution: |-
    **a)** Man definiert die Sicht neu (`CREATE OR ALTER VIEW` bzw. `CREATE OR REPLACE VIEW`), sodass sie `artikel` und `allergen` verbindet und weiterhin dieselben Spalten mit denselben Namen liefert. Die Sicht gehört zur **externen Ebene**; die Änderung betrifft das konzeptionelle Schema. Das ist **logische Datenunabhängigkeit**.

    **b)** Ein Index ändert nur den Zugriffsweg: Das DBMS findet die Zeilen schneller, aber Tabellen, Sichtdefinitionen und die Menge der gelieferten Zeilen bleiben unverändert. Der Index gehört zur **internen Ebene** (physischer Entwurf). Das ist **physische Datenunabhängigkeit**.
  rubric:
    - criterion: "a) Sicht neu definieren (Join mit `allergen`), gleiche Spalten nach außen"
      points: 1
    - criterion: "a) externe Ebene und logische Datenunabhängigkeit genannt"
      points: 1
    - criterion: "b) Index betrifft nur den Zugriffsweg, nicht Daten oder Schema"
      points: 1
    - criterion: "b) interne Ebene und physische Datenunabhängigkeit genannt"
      points: 1
  space: "lines:12"
- id: t12-p005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [integritaet, dynamische-integritaet, trigger, constraint]
  type: define-example
  difficulty: 2
  points: 4
  minutes: 4
  prompt: |-
    Ein **Kinoclub** verwaltet in einer Datenbank seine Vorstellungen (mit Eintrittspreis) und die Eintrittskarten (mit Status).

    a) Erkläre den Unterschied zwischen einer **statischen** und einer **dynamischen** Integritätsbedingung und gib für den Kinoclub je ein eigenes Beispiel an. Die statische Bedingung soll sich auf Werte **einer** Zeile beziehen. (2 P)

    b) Welche deiner beiden Bedingungen lässt sich deklarativ mit einem Constraint sichern, welche braucht einen Trigger? Begründe kurz. (2 P)
  solution: |-
    **a)** Eine **statische** Bedingung muss in jedem einzelnen Datenbankzustand gelten, z. B. „der Eintrittspreis einer Vorstellung ist nicht negativ“. Eine **dynamische** Bedingung betrifft den Übergang von einem Zustand in den nächsten und vergleicht alten und neuen Wert, z. B. „eine Karte durchläuft die Zustände nur vorwärts: ‚reserviert‘ → ‚bezahlt‘ → ‚entwertet‘; eine entwertete Karte wird nie wieder ‚bezahlt‘“.

    **b)** Die statische Bedingung geht deklarativ: `CHECK (preis >= 0)`. (Viele Lehrbücher setzen statisch mit deklarativ und dynamisch mit prozedural gleich; die Antwort passt zu beiden Sichtweisen.) Die dynamische braucht einen Trigger (z. B. `BEFORE UPDATE`), weil nur er den alten Wert (`OLD`) und den neuen Wert (`NEW`) gleichzeitig sieht. Ein CHECK prüft nur den neuen Zustand der Zeile.
  rubric:
    - criterion: "a) statisch (gilt in jedem Zustand) und dynamisch (Übergang alt → neu) richtig unterschieden"
      points: 1
    - criterion: "a) je ein passendes eigenes Beispiel aus dem Kinoclub"
      points: 1
    - criterion: "b) statische Bedingung als Constraint (z. B. CHECK) zugeordnet (folgerichtig zum eigenen Beispiel aus a): betrifft es doch mehrere Zeilen oder Tabellen, ist „braucht Trigger“ mit Begründung ebenfalls richtig)"
      points: 1
    - criterion: "b) dynamische Bedingung braucht Trigger, weil nur er OLD und NEW vergleicht"
      points: 1
  space: "lines:10"
