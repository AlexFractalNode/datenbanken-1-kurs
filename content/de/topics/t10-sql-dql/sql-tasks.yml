- id: t10-s016
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [left-join, count, coalesce, group-by]
  db: firma
  kind: query
  prompt: |-
    Gib für **jedes** Projekt, auch für Projekte ohne Team, die Teamgröße (`teamgroesse`) und die Summe der gebuchten Stunden (`stunden`) aus. Projekte ohne Mitarbeit sollen 0 Personen und 0 Stunden zeigen. Sortiere nach `projekt_id`.

    Spalten: `projekt_id`, `titel`, `teamgroesse`, `stunden`.
  solution: |-
    SELECT p.projekt_id, p.titel,
           COUNT(ma.mitarbeiter_id) AS teamgroesse,
           COALESCE(SUM(ma.stunden), 0) AS stunden
    FROM projekt p
    LEFT JOIN mitarbeit ma ON ma.projekt_id = p.projekt_id
    GROUP BY p.projekt_id, p.titel
    ORDER BY p.projekt_id;
  ordered: true
  hints:
    - "`COUNT(*)` würde beim Projekt ohne Team 1 zählen, weil der LEFT JOIN eine Zeile mit NULL erzeugt."
    - "`COUNT(spalte)` zählt nur Werte ungleich NULL."
    - "`SUM` über nur NULL ergibt NULL; `COALESCE` ersetzt es durch 0."
  paper_mode: write
- id: t10-s017
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [self-join, theta-join, paare]
  db: musikschule
  kind: query
  prompt: |-
    Für die Raumplanung werden alle **Paare verschiedener Kurse** gesucht, die demselben festen Raum zugeordnet sind. Jedes Paar soll **nur einmal** erscheinen, also nicht zusätzlich in umgekehrter Reihenfolge, und kein Kurs mit sich selbst. Als `kurs_1` steht jeweils der Kurs mit der **kleineren** `kurs_id`, als `kurs_2` der mit der größeren. Gib die Raum-ID und die Titel beider Kurse aus. Sortiere nach der ID des ersten, dann des zweiten Kurses.

    Spalten: `raum_id`, `kurs_1`, `kurs_2`.
  solution: |-
    SELECT k1.raum_id, k1.titel AS kurs_1, k2.titel AS kurs_2
    FROM kurs k1
    JOIN kurs k2 ON k2.raum_id = k1.raum_id
                AND k2.kurs_id > k1.kurs_id
    ORDER BY k1.kurs_id, k2.kurs_id;
  ordered: true
  hints:
    - "Die Tabelle `kurs` wird mit sich selbst verbunden: zwei Aliase, z. B. `k1` und `k2`."
    - "Mit `k2.kurs_id <> k1.kurs_id` käme jedes Paar zweimal vor. Ein Vergleich mit `>` lässt nur eine Richtung zu (Theta-Join)."
    - "Kurse ohne festen Raum (`raum_id` NULL) fallen von selbst heraus, weil `NULL = NULL` nicht TRUE ist."
  paper_mode: write
- id: t10-s018
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [self-join, vertretung]
  db: musikschule
  kind: query
  prompt: |-
    Vertretungsketten: Finde alle Paare von Vertretungen, bei denen die **vertretende** Lehrkraft der ersten Vertretung in einer **zweiten** Vertretung selbst vertreten wurde. Der Zeitraum spielt dabei keine Rolle: Die zweite Vertretung darf auch früher liegen als die erste. Gib die vertretene Lehrkraft der ersten Vertretung, deren Vertreter und den Vertreter des Vertreters aus. Sortiere nach der ID der ersten, dann der zweiten Vertretung.

    Spalten: `lehrkraft_id`, `vertreter_id`, `zweiter_vertreter_id`.

    Für die Vorhersage auf Papier: Die Tabelle `vertretung` enthält genau diese sechs Zeilen (ohne die Spalten `von`, `bis` und `grund`).

    | vertretung_id | lehrkraft_id | vertreter_id |
    | --- | --- | --- |
    | 1 | 1 | 2 |
    | 2 | 2 | 3 |
    | 3 | 4 | 7 |
    | 4 | 6 | 3 |
    | 5 | 8 | 1 |
    | 6 | 5 | 2 |
  solution: |-
    SELECT v1.lehrkraft_id, v1.vertreter_id, v2.vertreter_id AS zweiter_vertreter_id
