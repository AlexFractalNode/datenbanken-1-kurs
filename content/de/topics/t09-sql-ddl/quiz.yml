    - text: "Falsch"
      correct: true
      explain: "Richtig. Die Obergrenze sichert man mit einem CHECK ab, z. B. `CHECK (preis BETWEEN 0 AND 999.99)`. PostgreSQL würde 5000,00 schon wegen der Präzision abweisen."
- id: t09-q022
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [alter-table, umbenennen, firebird]
  type: single
  question: "In Firebird 3 gibt es eine Sicht `v_freie_zimmer`, deren Abfrage die Spalte `zimmer.betten` liest. Was passiert bei `ALTER TABLE zimmer ALTER COLUMN betten TO bettenzahl`?"
