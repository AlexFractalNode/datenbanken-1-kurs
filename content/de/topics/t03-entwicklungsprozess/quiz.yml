- id: t03-q015
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [phasenmodell, datendefinition, zuordnung]
  type: multi
  question: |-
    Für die Datenbank einer Jugendherberge werden folgende Festlegungen getroffen. Welche gehören im Kursstandard (sechs Phasen) zur **Datendefinition**?
  options:
    - text: "Die Spalte nachname wird als VARCHAR(60) NOT NULL angelegt."
      correct: true
      explain: "Tabellen mit DBMS-Datentypen und Integritätsbedingungen werden in der Datendefinition beschrieben."
    - text: "Es wird eine View belegung_heute für das Reinigungsteam angelegt, die keine Gastnamen enthält, und das Team erhält nur Leserechte darauf."
      correct: true
      explain: "Views und Rechte beschreiben externe Schemata. Auch sie gehören zur Datendefinition."
    - text: "Für die Suche nach Nachnamen wird ein Index angelegt."
      correct: false
      explain: "Ein Index ist ein Zugriffspfad auf der internen Ebene und gehört zum physischen Entwurf."
    - text: "Die Relation buchung wird so zerlegt, dass der Tarifpreis nicht in jeder Buchung steht."
      correct: false
      explain: "Das ist Normalisierung und gehört zum logischen Entwurf."
    - text: "CHECK (anzahl_gaeste BETWEEN 1 AND 60) wird für die Tabelle buchung festgelegt."
      correct: true
      explain: "Integritätsbedingungen werden in der Datendefinition mit der DDL des DBMS beschrieben."
