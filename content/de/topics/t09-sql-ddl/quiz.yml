- id: t09-q001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [sprachklassen]
  type: single
  question: "Zu welcher Sprachklasse gehört `ALTER TABLE kunde ADD geburtstag DATE`?"
  options:
    - text: "DDL"
      correct: true
      explain: "Die Anweisung ändert die Struktur der Tabelle, nicht ihren Inhalt. Strukturänderungen mit CREATE, ALTER und DROP sind DDL."
    - text: "DML"
      correct: false
      explain: "DML ändert Zeilen (INSERT, UPDATE, DELETE). Hier entsteht eine neue Spalte, also eine Schemaänderung."
    - text: "DCL"
      correct: false
      explain: "DCL vergibt und entzieht Rechte (GRANT, REVOKE)."
    - text: "TCL"
      correct: false
      explain: "TCL steuert Transaktionen (COMMIT, ROLLBACK)."
- id: t09-q002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [sprachklassen]
  type: multi
  question: "Welche der folgenden Anweisungen gehören zur DML (Data Manipulation Language)?"
  options:
    - text: "`INSERT INTO tier (name) VALUES ('Luna')`"
      correct: true
      explain: "INSERT fügt Zeilen ein und ändert damit den Inhalt."
    - text: "`DELETE FROM tier WHERE tier_id = 4`"
      correct: true
      explain: "DELETE entfernt Zeilen, also DML."
    - text: "`DROP TABLE tier`"
      correct: false
      explain: "DROP entfernt das Objekt selbst samt Struktur. Das ist DDL, auch wenn dabei alle Daten verloren gehen."
    - text: "`GRANT SELECT ON tier TO praktikant`"
      correct: false
      explain: "GRANT vergibt Rechte und gehört zur DCL."
    - text: "`UPDATE tier SET gewicht = 4.2 WHERE tier_id = 1`"
      correct: true
      explain: "UPDATE ändert Werte vorhandener Zeilen, also DML."
- id: t09-q003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [datentypen, numeric]
  type: single
  question: "Welcher Wert ist laut Deklaration (SQL-Standard, PostgreSQL) der größte, den eine Spalte vom Typ `NUMERIC(5,2)` aufnehmen kann?"
  options:
    - text: "999,99"
      correct: true
      explain: "5 Stellen insgesamt, davon 2 Nachkommastellen, also bleiben 3 Stellen vor dem Komma. Achtung: Firebird 3 erzwingt die Präzision nicht. Es speichert den Wert intern als ganze Zahl und nimmt auch größere Werte an. Eine echte Obergrenze sichert dort nur ein CHECK."
    - text: "99 999,99"
      correct: false
      explain: "Hier wurde die 5 als Zahl der Vorkommastellen gelesen. Die erste Zahl ist aber die Gesamtzahl der Stellen."
    - text: "99,999"
      correct: false
      explain: "Die zweite Zahl (2) gibt die Nachkommastellen an, nicht die Vorkommastellen."
    - text: "9 999 999,99"
      correct: false
      explain: "So viele Stellen erlaubt die Angabe (5,2) nicht."
- id: t09-q004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [datentypen, boolean, firebird]
  type: truefalse
  question: "In Firebird 3 gibt es keinen Datentyp BOOLEAN, man muss dafür `SMALLINT` oder `CHAR(1)` verwenden."
  options:
    - text: "Wahr"
      correct: false
      explain: "Das galt für ältere Versionen. Seit Firebird 3.0 gibt es BOOLEAN mit TRUE, FALSE und UNKNOWN."
    - text: "Falsch"
      correct: true
      explain: "Firebird 3 kennt BOOLEAN. Eine Spalte wie `aktiv BOOLEAN DEFAULT TRUE NOT NULL` ist gültig."
- id: t09-q005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [datentypen, zeichenketten]
  type: single
  question: "In eine Spalte `kuerzel CHAR(5)` wird der Wert `'AB'` eingefügt. Was steht danach gespeichert?"
  options:
    - text: "`'AB'` mit drei angehängten Leerzeichen"
      correct: true
      explain: "CHAR hat feste Länge, kürzere Werte werden mit Leerzeichen bis zur angegebenen Länge aufgefüllt."
    - text: "`'AB'` ohne Leerzeichen"
      correct: false
      explain: "So verhält sich VARCHAR. Bei CHAR wird aufgefüllt. Vergleiche wie `kuerzel = 'AB'` sind trotzdem wahr."
    - text: "Fehler, weil der Wert zu kurz ist"
      correct: false
      explain: "Zu kurz ist nie ein Fehler. Fehler gibt es nur, wenn ein Wert länger als die Spalte ist."
    - text: "`'AB'` mit drei vorangestellten Leerzeichen"
      correct: false
      explain: "Das Auffüllen geschieht rechts, nicht links."
- id: t09-q006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [constraints, unique, "null"]
  type: single
  question: "Die Spalte `email` einer Tabelle hat einen UNIQUE-Constraint, aber kein NOT NULL. Wie viele Zeilen dürfen in Firebird 3 und PostgreSQL `email = NULL` haben?"
  options:
    - text: "Beliebig viele"
      correct: true
      explain: "Für UNIQUE gelten zwei NULL-Werte nicht als gleich. Es gibt also keinen Konflikt zwischen ihnen. Das gilt hier, weil der Constraint nur eine Spalte hat. Bei mehrspaltigem UNIQUE mit teilweise NULL verhält sich Firebird 3 anders als PostgreSQL."
    - text: "Höchstens eine"
      correct: false
      explain: "Das wäre der Fall, wenn NULL wie ein normaler Wert verglichen würde. So verhält sich UNIQUE in Firebird 3 und PostgreSQL standardmäßig nicht."
    - text: "Keine, weil UNIQUE NULL verbietet"
      correct: false
      explain: "NULL verbietet nur NOT NULL bzw. der PRIMARY KEY. UNIQUE allein erlaubt NULL."
    - text: "Keine Zeile, sobald eine andere E-Mail doppelt vorkommt"
      correct: false
      explain: "Doppelte echte E-Mails werden schon beim Einfügen abgewiesen. Mit NULL-Werten hat das nichts zu tun."
- id: t09-q007
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [constraints, check, "null"]
  type: single
  question: "Eine Spalte ist als `rabatt SMALLINT CHECK (rabatt BETWEEN 0 AND 30)` definiert. Was passiert bei `INSERT`, wenn `rabatt` NULL ist?"
  options:
    - text: "Die Zeile wird angenommen."
      correct: true
      explain: "`NULL BETWEEN 0 AND 30` ergibt UNKNOWN. Ein CHECK weist nur ab, wenn die Bedingung FALSE ist."
    - text: "Die Zeile wird abgewiesen, weil NULL nicht zwischen 0 und 30 liegt."
      correct: false
      explain: "Typischer Irrtum. Für ein Verbot von NULL braucht die Spalte zusätzlich NOT NULL."
    - text: "Das DBMS setzt automatisch 0 ein."
      correct: false
      explain: "Das täte nur ein DEFAULT 0, und auch nur, wenn die Spalte im INSERT nicht genannt wird."
    - text: "Die Anweisung ist ungültig, weil CHECK nur mit NOT NULL erlaubt ist."
      correct: false
      explain: "CHECK und NOT NULL sind unabhängig voneinander."
- id: t09-q008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, firebird]
  type: single
  question: "Welche referenzielle Aktion akzeptiert Firebird 3 in `ON DELETE …` **nicht**?"
  options:
    - text: "`RESTRICT`"
      correct: true
      explain: "Firebird 3 kennt NO ACTION, CASCADE, SET NULL und SET DEFAULT. RESTRICT gibt es z. B. in PostgreSQL. In Firebird schreibt man NO ACTION oder lässt die Klausel weg."
    - text: "`NO ACTION`"
      correct: false
      explain: "NO ACTION ist in Firebird erlaubt und sogar der Standard ohne Angabe."
    - text: "`SET DEFAULT`"
      correct: false
      explain: "SET DEFAULT ist in Firebird 3 erlaubt."
    - text: "`CASCADE`"
      correct: false
      explain: "CASCADE ist in Firebird 3 erlaubt, bei ON DELETE und bei ON UPDATE."
- id: t09-q009
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, set-null]
  type: single
  question: |-
    Gegeben ist `spieler(spieler_id, name, team_id)` mit `team_id` NULL-fähig und `FOREIGN KEY (team_id) REFERENCES team (team_id) ON DELETE SET NULL`. Team 3 hat zwei Spieler. Was bewirkt `DELETE FROM team WHERE team_id = 3`?
  options:
    - text: "Team 3 wird gelöscht, die zwei Spieler bleiben mit `team_id = NULL` erhalten."
      correct: true
      explain: "SET NULL löst die Verbindung, statt die Kindzeilen zu löschen."
    - text: "Team 3 und die beiden Spieler werden gelöscht."
      correct: false
      explain: "Das wäre ON DELETE CASCADE."
    - text: "Das DELETE wird abgewiesen, weil noch Spieler auf Team 3 verweisen."
      correct: false
      explain: "Das wäre NO ACTION, also das Verhalten ohne Klausel."
    - text: "Team 3 wird gelöscht, die Spieler behalten `team_id = 3`."
      correct: false
      explain: "Das würde die referenzielle Integrität verletzen. Ein DBMS mit aktiver Fremdschlüsselprüfung lässt solche verwaisten Werte nicht zu. (Ist die Prüfung abgeschaltet, etwa in SQLite ohne `PRAGMA foreign_keys = ON`, entstehen sie tatsächlich.)"
- id: t09-q010
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, set-null, not-null]
  type: single
  question: "Eine FK-Spalte ist `NOT NULL` und hat `ON DELETE SET NULL`. Die Elternzeile mit Kindzeilen wird gelöscht. Was passiert?"
  options:
    - text: "Das DELETE scheitert mit Fehler, nichts wird geändert."
      correct: true
      explain: "SET NULL würde NOT NULL verletzen. Das DBMS weist deshalb die ganze Anweisung ab."
    - text: "Die Kindzeilen werden stattdessen gelöscht."
      correct: false
      explain: "Das DBMS wechselt nie selbst auf eine andere Aktion wie CASCADE."
    - text: "Die Kindzeilen erhalten trotzdem NULL, NOT NULL wird ignoriert."
      correct: false
      explain: "Referenzielle Aktionen setzen andere Constraints nicht außer Kraft."
    - text: "Die Tabelle lässt sich gar nicht erst so anlegen."
      correct: false
      explain: "Firebird und PostgreSQL nehmen die Definition an. Der Widerspruch zeigt sich erst beim Löschen."
- id: t09-q011
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [identity, firebird, dialekt]
  type: single
  question: "In Firebird 3 wird `id INTEGER GENERATED BY DEFAULT AS IDENTITY (START WITH 100) PRIMARY KEY` angelegt. Welche ID bekommt die erste Zeile, die ohne `id` eingefügt wird?"
  options:
    - text: "101"
      correct: true
      explain: "In Firebird 3 legt START WITH den Wert vor der ersten Nummer fest. Der Zähler steht auf 100, die erste ID ist 101."
    - text: "100"
      correct: false
      explain: "So verhält sich PostgreSQL (und der SQL-Standard). Firebird 3 weicht hier ab."
    - text: "1"
      correct: false
      explain: "1 wäre die erste ID ohne START WITH."
    - text: "0"
      correct: false
      explain: "0 ist der Anfangszustand einer Sequenz ohne START WITH. Vergeben wird erst der nächste Wert."
- id: t09-q012
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [sequenz, generator, firebird]
  type: multi
  question: "Mit welchen Ausdrücken holst du in Firebird 3 den nächsten Wert der Sequenz `seq_ticket` (Schrittweite 1)?"
  options:
    - text: "`NEXT VALUE FOR seq_ticket`"
      correct: true
      explain: "Die Form aus dem SQL-Standard, in Firebird empfohlen."
    - text: "`GEN_ID(seq_ticket, 1)`"
      correct: true
      explain: "Die klassische Firebird-Funktion. Der zweite Parameter ist die Schrittweite."
    - text: "`nextval('seq_ticket')`"
      correct: false
      explain: "Das ist die PostgreSQL-Funktion. Firebird kennt sie nicht."
    - text: "`GEN_ID(seq_ticket, 0)`"
      correct: false
      explain: "Mit Schritt 0 liest man nur den aktuellen Wert, ohne ihn zu erhöhen."
    - text: "`seq_ticket.NEXTVAL`"
      correct: false
      explain: "Diese Schreibweise stammt aus Oracle."
- id: t09-q013
