- id: t12-s011
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [view, unterabfrage, extremwert, korrelierte-unterabfrage]
  db: musikschule
  kind: ddl
  engines: [fb, pg]
  prompt: |-
    Für die Preisliste soll eine Sicht `v_spitzenkurs` je Niveau den teuersten Kurs zeigen, mit den Spalten `niveau`, `titel` und `gebuehr_monat`. Haben mehrere Kurse eines Niveaus dieselbe Höchstgebühr, erscheinen alle.

    Teste die Sicht danach mit einer Preisänderung: Die Kurse 1 („Klavier für Einsteiger“, Niveau Anfaenger) und 6 („Querflöte Mittelstufe“, Niveau Mittelstufe) kosten ab sofort 66,00 im Monat. Bisher ist im Niveau Anfaenger „Cello für Erwachsene“ mit 66,00 am teuersten, in der Mittelstufe „Klavier Mittelstufe“ mit 78,00, bei den Fortgeschrittenen „Jazz-Improvisation“ mit 85,00.

    Geprüft wird mit `SELECT niveau, titel, gebuehr_monat FROM v_spitzenkurs`. Sage das Ergebnis vorher.

    Überlege: Warum reicht `SELECT niveau, titel, MAX(gebuehr_monat) FROM kurs GROUP BY niveau` nicht?
  solution: |-
    CREATE VIEW v_spitzenkurs (niveau, titel, gebuehr_monat) AS
    SELECT k.niveau, k.titel, k.gebuehr_monat
    FROM kurs k
    WHERE k.gebuehr_monat = (SELECT MAX(k2.gebuehr_monat)
                             FROM kurs k2
                             WHERE k2.niveau = k.niveau);

    UPDATE kurs SET gebuehr_monat = 66.00 WHERE kurs_id IN (1, 6);

    -- Erwartet (vier Zeilen): Anfaenger / Klavier fuer Einsteiger / 66.00,
    -- Anfaenger / Cello fuer Erwachsene / 66.00 (Gleichstand, beide erscheinen),
    -- Mittelstufe / Klavier Mittelstufe / 78.00, Fortgeschritten / Jazz-Improvisation / 85.00.
    -- Querfloete Mittelstufe (66.00) erscheint nicht: 66 ist nur im Niveau Anfaenger das Maximum.
    -- Eine unkorrelierte Loesung mit IN (SELECT MAX(...) ... GROUP BY niveau) zeigte sie faelschlich.
    -- Die GROUP-BY-Variante ist ungueltig: titel ist weder gruppiert noch aggregiert,
    -- und MAX liefert nur den Wert, nicht die Zeile, zu der er gehoert.
  check: SELECT niveau, titel, gebuehr_monat FROM v_spitzenkurs
  dialect_note: "Gleiche Syntax in beiden Systemen. Die Sicht speichert keine Daten, deshalb zeigt sie die Preisänderung, obwohl sie vorher angelegt wurde."
  hints:
    - "Bestimme zuerst die Höchstgebühr je Niveau, dann die Kurse, die genau diese Gebühr haben."
    - "Die Unterabfrage bezieht sich mit `k2.niveau = k.niveau` auf die Zeile der äußeren Abfrage."
    - "Ein Aggregat liefert einen Wert, aber nicht die Zeile, aus der er stammt."
  paper_mode: write
