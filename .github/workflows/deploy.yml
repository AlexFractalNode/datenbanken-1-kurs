name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    # The same checks as on every push/PR; nothing is published unless they pass.
    # A push to main therefore runs them twice (ci.yml and here); accepted for a simple gate.
    # The Playwright smoke suite is not part of the gate: it runs in ci.yml for pushes and pull requests.
    uses: ./.github/workflows/ci.yml
    with:
      run_smoke: false

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Snapshots for the playground auto-check (PostgreSQL side only; this job has no Firebird).
      - name: Generate SQL snapshots for the playground (PostgreSQL)
        run: |
          npm ci
          uv run tools/sqltest.py --engines pg --write-snapshots web/src/data/sql-expected

      # PDFs and Anki decks built by the reused ci.yml (artifacts "pdf" and "anki", one folder each).
      # The downloads page publishes the files it finds in ./dist/pdf and ./dist/anki; without them it shows a note.
      - name: Download PDFs of the checks job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: pdf
          path: dist/pdf

      - name: Download Anki decks of the checks job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: anki
          path: dist/anki

      # Missing files: a warning for main (the page says "noch nicht verfügbar"), an error for a release tag.
      - name: Check PDFs and Anki decks for the downloads page
        env:
          REF: ${{ github.ref }}
        run: |
          missing=""
          compgen -G "dist/pdf/*.pdf" > /dev/null || missing="PDFs (dist/pdf)"
          compgen -G "dist/anki/*.apkg" > /dev/null || missing="${missing:+$missing, }Anki decks (dist/anki)"
          if [ -z "$missing" ]; then
            echo "Downloads: $(ls dist/pdf/*.pdf | wc -l) PDFs, $(ls dist/anki/*.apkg | wc -l) Anki decks"
          elif [[ "$REF" == refs/tags/* ]]; then
            echo "::error::Missing for the release build: $missing"
            exit 1
          else
            echo "::warning::Missing, the downloads page shows notes instead: $missing"
          fi

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    # Pages are published from main only; tag runs just build and release.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/typst
          key: typst-${{ runner.os }}-${{ hashFiles('tools/typst/**', 'tools/pdf.py') }}
          restore-keys: typst-${{ runner.os }}-

      - name: Validate with total minimum counts
        run: uv run tools/validate.py

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build PDFs, diagrams and Anki decks
        run: |
          node tools/render_diagrams.mjs --out dist/diagrams
          uv run tools/pdf.py --diagrams dist/diagrams
          uv run tools/anki_export.py --per-topic --diagrams dist/diagrams

      - name: Package zip
        run: |
          mkdir -p dist/package
          git archive --format=zip --prefix="datenbanken-1-kurs-${GITHUB_REF_NAME}/" \
            -o "dist/package/datenbanken-1-kurs-${GITHUB_REF_NAME}.zip" HEAD

      - name: Extract changelog section
        run: uv run tools/changelog_extract.py "$GITHUB_REF_NAME" --out dist/release-notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/anki/*.apkg
            dist/pdf/*.pdf
            dist/package/*.zip
