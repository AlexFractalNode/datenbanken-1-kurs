  engines: [fb]
  prompt: |-
    Die Kursplanung möchte die Zahl der aktiven (nicht abgemeldeten) Belegungen je Kurs ohne Zählabfrage ablesen. Dafür gibt es eine eigene Tabelle, die ein Trigger immer aktuell hält.

    1. Lege die Tabelle `kurs_belegt` an: `kurs_id` (Primärschlüssel, verweist auf `kurs`; wird ein Kurs gelöscht, verschwindet die Zeile) und `anzahl` (ganze Zahl, Pflicht).
    2. Fülle sie mit **einer** Anweisung für alle Kurse mit dem aktuellen Stand.
    3. Schreibe **einen** Trigger `trg_belegung_zaehlen` für `belegung`, der nach INSERT, UPDATE und DELETE die Zahl anpasst. Unterscheide die Ereignisse mit `INSERTING`, `UPDATING` und `DELETING`. Bedenke: Ein UPDATE kann eine Belegung abmelden.
    4. Teste mit drei Änderungen:
       - Schüler 11 meldet sich am 20.01.2025 zu Kurs 13 an (Rabatt 0).
       - Schüler 16 meldet sich zum 31.12.2024 von Kurs 6 ab.
       - Die Belegungen von Schüler 36 in Kurs 4 (schon abgemeldet) und von Schüler 26 in Kurs 1 (aktiv) werden gelöscht.

    Zur Selbstkontrolle lokal in Firebird (vergleicht für jeden Kurs den Wert in `kurs_belegt` mit einer frischen Zählung):

    ```sql
    SELECT k.kurs_id, s.anzahl,
           (SELECT COUNT(*) FROM belegung b
            WHERE b.kurs_id = k.kurs_id AND b.abgemeldet_am IS NULL) AS nachgezaehlt
    FROM kurs k
    LEFT JOIN kurs_belegt s ON s.kurs_id = k.kurs_id
    ```

    Die Abfrage vergleicht nur das Ergebnis. Ein Trigger mit Ereignisunterscheidung und die Reihenfolge Befüllen → Trigger → Test gehören zur Musterlösung.
  solution: |-
    CREATE TABLE kurs_belegt (
        kurs_id INTEGER NOT NULL PRIMARY KEY
                REFERENCES kurs (kurs_id) ON DELETE CASCADE,
        anzahl  INTEGER NOT NULL
    );

    INSERT INTO kurs_belegt (kurs_id, anzahl)
    SELECT k.kurs_id,
           (SELECT COUNT(*) FROM belegung b
            WHERE b.kurs_id = k.kurs_id
              AND b.abgemeldet_am IS NULL)
    FROM kurs k;

    SET TERM ^ ;

    CREATE TRIGGER trg_belegung_zaehlen FOR belegung
    ACTIVE AFTER INSERT OR UPDATE OR DELETE POSITION 0
    AS
    BEGIN
      IF (INSERTING OR UPDATING) THEN
        IF (NEW.abgemeldet_am IS NULL) THEN
          UPDATE kurs_belegt SET anzahl = anzahl + 1 WHERE kurs_id = NEW.kurs_id;
      IF (UPDATING OR DELETING) THEN
        IF (OLD.abgemeldet_am IS NULL) THEN
          UPDATE kurs_belegt SET anzahl = anzahl - 1 WHERE kurs_id = OLD.kurs_id;
    END^

    SET TERM ; ^

    INSERT INTO belegung (schueler_id, kurs_id, angemeldet_am, rabatt_prozent)
    VALUES (11, 13, DATE '2025-01-20', 0);

    UPDATE belegung SET abgemeldet_am = DATE '2024-12-31'
    WHERE schueler_id = 16 AND kurs_id = 6;

    DELETE FROM belegung WHERE schueler_id = 36 AND kurs_id = 4;

    DELETE FROM belegung WHERE schueler_id = 26 AND kurs_id = 1;

    -- Erwartet: 13 Zeilen, keine mit anzahl NULL, in jeder anzahl = nachgezaehlt.
    -- Wer die Startwerte per GROUP BY ueber belegung erzeugt, hat fuer Kurs 12 und 13
    -- keine Zeile (anzahl NULL), und die Anmeldung in Kurs 13 geht verloren. Geaendert haben sich
    -- Kurs 1 (4 auf 3), Kurs 6 (2 auf 1) und Kurs 13 (0 auf 1).
    -- Kurs 4 bleibt bei 4, weil die geloeschte Belegung schon abgemeldet war.
    -- Das UPDATE zaehlt die alte Fassung ab (OLD aktiv) und die neue nicht dazu (NEW abgemeldet).
  check: SELECT k.kurs_id, s.anzahl, (SELECT COUNT(*) FROM belegung b WHERE b.kurs_id = k.kurs_id AND b.abgemeldet_am IS NULL) AS nachgezaehlt FROM kurs k LEFT JOIN kurs_belegt s ON s.kurs_id = k.kurs_id
  dialect_note: "Nur Firebird (PSQL). Die Regel „UPDATE = alte Zeile abziehen, neue Zeile hinzuzählen“ deckt auch einen Wechsel des Kurses ab. Die geschachtelten IF sorgen dafür, dass `NEW` nur bei INSERT/UPDATE und `OLD` nur bei UPDATE/DELETE gelesen wird. PostgreSQL-Skizze (nicht getestet): eine Triggerfunktion, die `TG_OP` (`'INSERT'`, `'UPDATE'`, `'DELETE'`) abfragt, angehängt mit `AFTER INSERT OR UPDATE OR DELETE ON belegung FOR EACH ROW`."
  hints:
    - "Ein UPDATE lässt sich als „alte Zeile weg, neue Zeile dazu“ behandeln."
    - "Zähle nur Zeilen mit `abgemeldet_am IS NULL`, alte wie neue."
    - "Die Startwerte liefert `INSERT INTO … SELECT` mit einer Zählunterabfrage je Kurs."
  paper_mode: write
