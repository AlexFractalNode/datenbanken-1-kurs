name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      # deploy.yml passes false: publishing must not depend on the Playwright smoke suite.
      run_smoke:
        description: Run the Playwright smoke tests after the checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when reused, so deploy and ci runs do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      firebird:
        image: firebirdsql/firebird:3.0.14
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
        ports:
          - 3050:3050
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/3050'"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      # Never skip Firebird tests silently in CI.
      SQLTEST_REQUIRE_FB: "1"
      FB_HOST: 127.0.0.1
      FB_PORT: "3050"
      FB_USER: SYSDBA
      FB_PASSWORD: masterkey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Typst downloads packages on demand into its cache directory.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/typst
          key: typst-${{ runner.os }}-${{ hashFiles('tools/typst/**', 'tools/pdf.py') }}
          restore-keys: typst-${{ runner.os }}-

      - name: Leakguard over the changed commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            uv run tools/leakguard.py --range "origin/${BASE_REF}..HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # new branch, tag or unknown base: scan the whole history
            uv run tools/leakguard.py --history
          else
            uv run tools/leakguard.py --range "${BEFORE}..HEAD"
          fi

      - name: Install Firebird client library
        run: sudo apt-get update && sudo apt-get install -y libfbclient2

      - name: Install root Node dependencies (PGlite runner)
        run: npm ci

      # The playground compares results with snapshots of the PostgreSQL side. They are generated, not
      # committed (web/src/data/sql-expected is git-ignored) and must exist before the web build.
      # The Firebird side is cross-checked by the sqltest step of check.py below.
      - name: Generate SQL snapshots for the playground (PostgreSQL)
        run: uv run tools/sqltest.py --engines pg --write-snapshots web/src/data/sql-expected

      - name: Run all checks
        run: uv run tools/check.py --ci

      # check.py --ci builds dist/pdf (pdf step) and dist/anki (anki step). One artifact per folder with a
      # single path each: the artifact root is that folder, whether the other one exists or not, so
      # deploy.yml can download each into the same place again.
      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf
          path: dist/pdf
          if-no-files-found: ignore

      - name: Upload Anki decks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anki
          path: dist/anki
          if-no-files-found: ignore

  smoke:
    needs: checks
    # Runs on push and pull_request (inputs.run_smoke is null there) and when called with run_smoke: true.
    # toJSON: in GitHub expressions null == false, so a plain comparison would skip push runs too.
    if: ${{ toJSON(inputs.run_smoke) != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the site and serves it with `astro preview` itself.
      # Default content root: the web test fixture (states that need content are deterministic).
      - name: Playwright smoke tests (fixture content)
        working-directory: web
        run: npm run test:e2e

      # The same pages with the real course content (exam-01, exam-02, topic pages, glossary, documents).
      - name: Playwright smoke tests (real content)
        working-directory: web
        env:
          E2E_REAL: "1"
          CONTENT_ROOT: ../content
        run: npm run test:e2e
