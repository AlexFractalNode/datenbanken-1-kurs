- id: t07-p001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [fd, transitive-abhaengigkeit, 3nf]
  type: define-example
  difficulty: 1
  points: 6
  minutes: 7
  prompt: |-
    Erkläre die Begriffe **funktionale Abhängigkeit** und **transitive Abhängigkeit**.
    Gib ein **eigenes** Beispiel (nicht aus dem Kurstext) als Relation mit Schlüssel und konkreten FDs an, in dem eine transitive Abhängigkeit vorkommt. Begründe, warum die Relation nicht in 3NF ist, und gib die Zerlegung in 3NF mit Primär- und Fremdschlüsseln an.
  solution: |-
    - **Funktionale Abhängigkeit X → Y:** Haben zwei Tupel denselben X-Wert, haben sie auch denselben Y-Wert. Zu jedem X-Wert gibt es also genau einen (gleichwertig: höchstens einen) Y-Wert. Das gilt für alle zulässigen Ausprägungen, nicht nur für die gerade gespeicherten Daten.
    - **Transitive Abhängigkeit:** Z hängt transitiv von X ab, wenn X → Y und Y → Z gelten und das Zwischenglied Y kein Schlüssel(teil) ist, im einfachsten Fall ein Nichtschlüsselattribut. Die strengere Fassung verlangt zusätzlich ausdrücklich Y ↛ X und Z ∉ X ∪ Y. Beide Fassungen sind richtig.

    Beispiel (Musterlösung, andere passende Beispiele gleichwertig): Ein Instrumentenverleih speichert Leihvertrag(<u>VertragNr</u>, Beginn, InstrumentNr, Instrumentart).
    - VertragNr → Beginn, InstrumentNr (jeder Vertrag betrifft genau ein Instrument)
    - InstrumentNr → Instrumentart (Inventarnummer 88 ist immer ein Cello)
    - InstrumentNr ist Nichtschlüsselattribut; InstrumentNr ↛ VertragNr, denn dasselbe Instrument wird nacheinander oft verliehen.

    Begründung (eine der beiden Formulierungen genügt):
    - Das Nichtschlüsselattribut Instrumentart hängt über InstrumentNr transitiv vom Schlüssel VertragNr ab.
    - Für die FD InstrumentNr → Instrumentart ist InstrumentNr kein Superschlüssel und Instrumentart kein Primattribut.

    Folge: Die Instrumentart steht in jedem Vertrag erneut (Änderungsanomalie).

    3NF-Zerlegung:
    - Instrument(<u>InstrumentNr</u>, Instrumentart)
    - Leihvertrag(<u>VertragNr</u>, Beginn, InstrumentNr → Instrument)
  rubric:
    - criterion: "Funktionale Abhängigkeit korrekt erklärt (gleiche X-Werte erzwingen gleiche Y-Werte; „genau ein“ oder „höchstens ein“ Y-Wert je X-Wert gleichwertig)"
      points: 1
    - criterion: "Transitive Abhängigkeit korrekt definiert: Kette X → Y → Z über ein Zwischenglied Y, das kein Schlüssel(teil) ist; die Fassung mit zusätzlicher Bedingung Y ↛ X ist ebenso voll richtig"
      points: 1
    - criterion: "Eigenes Beispiel (nicht aus dem Kurstext) als Relation mit Schlüssel und konkreten, durch eine Geschäftsregel begründeten FDs"
      points: 1.5
    - criterion: "Das Beispiel enthält tatsächlich eine transitive Abhängigkeit (Zwischenattribut ist Nichtschlüsselattribut)"
      points: 0.5
    - criterion: "3NF-Verstoß begründet, entweder über „Nichtschlüsselattribut hängt transitiv vom Schlüssel ab“ oder über „Determinante kein Superschlüssel und abhängiges Attribut kein Primattribut“"
      points: 1
    - criterion: "Korrekte Zerlegung mit Primär- und Fremdschlüssel"
      points: 1
  space: lines:16
- id: t07-p002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [zerlegung, verlustfrei, abhaengigkeitserhaltung]
  type: define-example
  difficulty: 2
  points: 9
  minutes: 10
  prompt: |-
    Erkläre die Begriffe **verlustfreie Zerlegung** und **abhängigkeitserhaltende Zerlegung**.
    a) Zeige an einem **eigenen** Beispiel mit mindestens zwei konkreten Datenzeilen eine Zerlegung, die **nicht** verlustfrei ist. Gib alle entstehenden Scheintupel an und nenne eine verlustfreie Alternative.
    b) Nenne ein Kriterium, mit dem man bei einer Zerlegung in zwei Teile ohne Berechnung des Verbunds prüfen kann, ob sie verlustfrei ist. Wende es auf deine Alternative aus a) an.
    c) Zeige an einem eigenen Beispiel eine Zerlegung, die zwar verlustfrei, aber **nicht** abhängigkeitserhaltend ist. Erkläre, welches Problem dadurch entsteht.
  solution: |-
    - **Verlustfreie Zerlegung:** Der natürliche Verbund der Teilrelationen ergibt für jede zulässige Ausprägung wieder genau die Ausgangsrelation. Bei einer verlustbehafteten Zerlegung fehlen keine Tupel, sondern es entstehen zusätzliche Scheintupel (unechte Tupel).
    - **Abhängigkeitserhaltende Zerlegung:** Jede FD der Ausgangsrelation lässt sich nach der Zerlegung innerhalb der Teilrelationen prüfen, d. h. aus den FDs der Teile ist die ganze ursprüngliche FD-Menge herleitbar. (Die einfachere Fassung „jede FD liegt vollständig in einer Teilrelation“ ist ebenfalls richtig.)

    a) Beispiel (Musterlösung): Kurs(<u>KursNr</u>, Lehrer, Becken) mit KursNr → Lehrer, Becken. Ein Lehrer leitet mehrere Kurse.

    | KursNr | Lehrer | Becken |
    |---|---|---|
    | K4 | Berg | Becken 1 |
    | K9 | Berg | Becken 2 |

    Zerlegung in R1(KursNr, Lehrer) und R2(Lehrer, Becken): R1 ⋈ R2 liefert vier statt zwei Tupel, die Scheintupel sind (K4, Berg, Becken 2) und (K9, Berg, Becken 1). Welcher Kurs in welchem Becken stattfindet, ist nicht mehr erkennbar.
    Verlustfreie Alternative: R1(KursNr, Lehrer) und R2(KursNr, Becken).

    b) Kriterium: Die gemeinsamen Attribute R1 ∩ R2 müssen Superschlüssel mindestens eines der beiden Teile sein (sie bestimmen R1 oder R2 funktional). In der Alternative ist das gemeinsame Attribut KursNr, und KursNr ist Schlüssel beider Teile, also verlustfrei. In der falschen Zerlegung ist das gemeinsame Attribut Lehrer in keinem Teil Schlüssel.

    c) Beispiel (Musterlösung): Taucher(<u>TaucherNr</u>, Brevet, MaxTiefe) mit TaucherNr → Brevet und Brevet → MaxTiefe.
    Zerlegung in (TaucherNr, Brevet) und (TaucherNr, MaxTiefe): verlustfrei, weil TaucherNr Schlüssel beider Teile ist. Die FD Brevet → MaxTiefe liegt aber in keinem Teil und lässt sich aus den FDs der Teile nicht herleiten. Das DBMS kann nicht mehr verhindern, dass zwei Taucher:innen mit Brevet „1 Stern“ verschiedene Maximaltiefen erhalten.
    Richtig: (TaucherNr, Brevet) und (Brevet, MaxTiefe). Das ist verlustfrei und abhängigkeitserhaltend.
  rubric:
    - criterion: "Verlustfreie Zerlegung korrekt definiert (Verbund ergibt genau die Ausgangsrelation; Verlust bedeutet zusätzliche Scheintupel, nicht fehlende Tupel)"
      points: 1.5
    - criterion: "Abhängigkeitserhaltung korrekt definiert (jede FD in einer Teilrelation prüfbar bzw. aus den FDs der Teile herleitbar; beide Fassungen gleichwertig)"
      points: 1
    - criterion: "a) Eigenes Beispiel mit Ausgangsrelation, konkreten Zeilen und verlustbehafteter Zerlegung"
      points: 1
    - criterion: "a) Scheintupel vollständig und korrekt angegeben"
      points: 1.5
    - criterion: "a) Korrekte verlustfreie Alternative"
      points: 0.5
    - criterion: "b) Kriterium genannt (gemeinsame Attribute sind Superschlüssel mindestens eines Teils) und auf die Alternative angewandt"
      points: 1
    - criterion: "c) Eigenes verlustfreies Beispiel, in dem eine FD in keinem Teil mehr liegt; die verlorene FD ist benannt"
      points: 1.5
    - criterion: "c) Folge erklärt (Regel nicht mehr über Schlüssel durchsetzbar, Inkonsistenz möglich)"
      points: 1
  space: box:160
- id: t07-p003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [attributhuelle, schluessel, fd, vertiefung]
  type: normalize
  difficulty: 3
  points: 11
  minutes: 11
  prompt: |-
    **Vertiefung:** Attributhülle und systematische Schlüsselsuche gehen über das Minimum hinaus. Die Aufgabe trainiert sie gezielt; in den meisten Normalisierungsaufgaben lässt sich der Schlüssel direkt aus den Geschäftsregeln ablesen.

    Gegeben ist die Relation R(A, B, C, D, E, G) mit der FD-Menge
    F = { A B → C,  C → D,  D → A,  D E → B,  C → G }.

    a) Berechne die Attributhülle {C, E}⁺ schrittweise. Gib bei jedem Schritt die verwendete FD an.
    b) Bestimme **alle** Schlüsselkandidaten von R. Begründe, warum deine Liste vollständig ist und jeder Kandidat minimal ist.
    c) Gib alle Primattribute und alle Nichtschlüsselattribute an.
    d) Ist {A, B, C, E} ein Superschlüssel? Ist es ein Schlüsselkandidat? Begründe kurz.
    e) In welcher höchsten Normalform (1NF, 2NF oder 3NF) ist R? Atomare Werte darfst du voraussetzen. Begründe mit einer konkreten FD.
  solution: |-
    a) Start {C, E}.
    - C → D: {C, D, E}
    - C → G: {C, D, E, G}
    - D → A: {A, C, D, E, G}
    - D E → B: {A, B, C, D, E, G}
    - A B → C bringt nichts Neues. Ergebnis: {C, E}⁺ = {A, B, C, D, E, G}, alle Attribute.

    b) E steht auf keiner rechten Seite und muss daher in **jedem** Schlüssel enthalten sein. G steht nur rechts und nie links, gehört also zu keinem Schlüssel. {E}⁺ = {E} reicht nicht.
    Zweiermengen mit E:
    - {A, E}⁺ = {A, E} und {B, E}⁺ = {B, E}: nein
    - {C, E}⁺ = alle (siehe a): **Schlüsselkandidat**
    - {D, E}⁺: D → A ergibt {A, D, E}, D E → B ergibt {A, B, D, E}, A B → C ergibt {A, B, C, D, E}, C → G ergibt alle: **Schlüsselkandidat**

    Dreiermengen, die weder C noch D enthalten (sonst Obermenge eines gefundenen Schlüssels), bleiben nur {A, B, E}: A B → C, C → D, C → G ergibt alle Attribute. {A, E} und {B, E} reichen nicht, also ist {A, B, E} minimal und **Schlüsselkandidat**. Größere Mengen ohne C und D enthalten {A, B, E} und sind nicht minimal.
    Schlüsselkandidaten: **{C, E}, {D, E}, {A, B, E}**. {C, E} und {D, E} sind minimal, weil {C}, {D} und {E} allein nicht alles bestimmen.

    c) Primattribute: A, B, C, D, E. Nichtschlüsselattribut: G.

    d) {A, B, C, E} ist Superschlüssel, weil es {C, E} enthält und damit alles bestimmt. Es ist kein Schlüsselkandidat, weil man A und B weglassen kann (nicht minimal).

    e) Höchste Normalform ist die **1NF**. Die FD C → G zeigt, dass das Nichtschlüsselattribut G schon von C abhängt, einem echten Teil des Schlüsselkandidaten {C, E}. Diese partielle Abhängigkeit verletzt die 2NF.
  rubric:
    - criterion: "a) Hülle {C, E}⁺ vollständig und mit angegebenen FDs schrittweise berechnet"
      points: 2
    - criterion: "b) Begründung, dass E in jedem Schlüssel liegen muss (und G in keinem)"
      points: 1
    - criterion: "b) Alle drei Schlüsselkandidaten {C, E}, {D, E}, {A, B, E} gefunden und jeweils per Hülle belegt (je 1 Punkt)"
      points: 3
    - criterion: "b) Vollständigkeit und Minimalität nachvollziehbar begründet"
      points: 1
    - criterion: "c) Primattribute und Nichtschlüsselattribut korrekt"
      points: 1
    - criterion: "d) Superschlüssel ja, Schlüsselkandidat nein, mit Begründung"
      points: 1
    - criterion: "e) 1NF mit Verweis auf die partielle Abhängigkeit C → G von {C, E}"
      points: 2
  space: lines:22
- id: t07-p004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [anomalien, 1nf, 2nf, 3nf]
  type: normalize
  difficulty: 2
  points: 15
  minutes: 15
  prompt: |-
    Eine Tauchschule verwaltet ihre Kursbuchungen bisher in einer Tabelle:

    | TaucherNr | Name | Brevet | MaxTiefe | Kurse |
    |---|---|---|---|---|
    | 301 | Kern, Mia | 1 Stern | 20 m | K4 Nachttauchen (TB Tom Berg), bezahlt; K7 Wracktauchen (SA Sina Arslan), offen |
    | 302 | Vogt, Ilias | 2 Sterne | 30 m | K7 Wracktauchen (SA Sina Arslan), bezahlt |
    | 303 | Haas, Rena | 1 Stern | 20 m | K4 Nachttauchen (TB Tom Berg), bezahlt; K9 Strömungstauchen (TB Tom Berg), offen |

    Geschäftsregeln:
    - Jede:r Taucher:in hat genau eine aktuelle Brevetstufe. Die Stufe legt die erlaubte Maximaltiefe fest.
    - Jeder Kurs wird von genau einer Lehrkraft geleitet. Eine Lehrkraft (Kürzel eindeutig) kann mehrere Kurse leiten.
    - Der Zahlstatus (bezahlt/offen) gilt je Taucher:in und Kurs.
    - Taucher:innen sollen nach Nachname sortiert werden können.

    a) Nenne je ein **konkretes** Beispiel aus dieser Tabelle für eine Einfüge-, eine Änderungs- und eine Löschanomalie.
    b) Begründe, warum die Tabelle nicht in 1NF ist, und gib die Attribute der 1NF-Relation an.
    c) Gib eine vollständige Menge nicht-trivialer FDs mit minimaler linker Seite an, aus der sich alle weiteren FDs herleiten lassen, und bestimme den Schlüssel der 1NF-Relation.
    d) Überführe in die 2NF und begründe den Schritt.
    e) Überführe in die 3NF, begründe den Schritt und gib das Endergebnis mit Primär- und Fremdschlüsseln an.
  solution: |-
    a) Anomalien (je ein Beispiel genügt, andere passende gleichwertig):
    - Einfügeanomalie: Ein neuer Kurs K12 „Eistauchen“ mit Lehrkraft TB kann nicht gespeichert werden, solange niemand ihn gebucht hat. Ebenso lässt sich eine neue Stufe „3 Sterne, 40 m“ ohne passende:n Taucher:in nicht erfassen.
    - Änderungsanomalie: Tom Berg heißt künftig Tom Berg-Lind. Sein Name steht dreimal (301/K4, 303/K4, 303/K9). Wird eine Stelle vergessen, ist der Bestand inkonsistent.
    - Löschanomalie: Wird Ilias Vogt (302) gelöscht, geht die einzige Angabe verloren, dass „2 Sterne“ 30 m erlaubt.

    b) Die Spalte Kurse ist eine Wiederholungsgruppe (mehrere Kurse in einer Zelle). Außerdem sind die Kursangaben nicht atomar, und Name muss wegen der Sortierregel in Nachname und Vorname zerlegt werden. 1NF-Relation mit einer Zeile je Taucher:in und Kurs (fünf Zeilen):
    Buchung(TaucherNr, Nachname, Vorname, Brevet, MaxTiefe, KursNr, Kursbezeichnung, LehrerKürzel, Lehrername, Zahlstatus)

    c) FDs:
    - TaucherNr → Nachname, Vorname, Brevet
    - Brevet → MaxTiefe
    - KursNr → Kursbezeichnung, LehrerKürzel
    - LehrerKürzel → Lehrername
    - TaucherNr, KursNr → Zahlstatus

    Schlüssel: {TaucherNr, KursNr}. Beide stehen auf keiner rechten Seite, müssen also in jedem Schlüssel liegen. Ihre Hülle umfasst alle Attribute, sie sind damit der einzige Schlüsselkandidat.

    d) 2NF: Nachname, Vorname, Brevet und MaxTiefe hängen schon von TaucherNr allein ab, Kursbezeichnung, LehrerKürzel und Lehrername schon von KursNr allein. Das sind partielle Abhängigkeiten vom Schlüssel. Die Schlüsselteile werden mit ihren abhängigen Attributen ausgelagert:
    - Taucher(<u>TaucherNr</u>, Nachname, Vorname, Brevet, MaxTiefe)
    - Kurs(<u>KursNr</u>, Kursbezeichnung, LehrerKürzel, Lehrername)
    - Buchung(<u>TaucherNr → Taucher, KursNr → Kurs</u>, Zahlstatus)

    e) 3NF: In Taucher gilt TaucherNr → Brevet → MaxTiefe, in Kurs gilt KursNr → LehrerKürzel → Lehrername. Brevet und LehrerKürzel sind Nichtschlüsselattribute, die Abhängigkeiten sind transitiv. Auslagern:
    - Brevetstufe(<u>Brevet</u>, MaxTiefe)
    - Taucher(<u>TaucherNr</u>, Nachname, Vorname, Brevet → Brevetstufe)
    - Lehrkraft(<u>LehrerKürzel</u>, Lehrername)
    - Kurs(<u>KursNr</u>, Kursbezeichnung, LehrerKürzel → Lehrkraft)
    - Buchung(<u>TaucherNr → Taucher, KursNr → Kurs</u>, Zahlstatus)
  rubric:
    - criterion: "a) Je ein konkretes, zutreffendes Beispiel für Einfüge-, Änderungs- und Löschanomalie (je 1 Punkt)"
      points: 3
    - criterion: "b) Wiederholungsgruppe bzw. nicht atomare Werte als Grund genannt"
      points: 0.5
    - criterion: "b) Name mit Verweis auf die Sortierregel in Nachname und Vorname zerlegt"
      points: 0.5
    - criterion: "b) Vollständige, flache Attributliste der 1NF-Relation"
      points: 1
    - criterion: "c) FDs: je korrekte FD mit minimaler linker Seite 0,5 Punkte (höchstens 2,5); je falsche FD 0,5 Punkte Abzug, nicht unter 0"
      points: 2.5
    - criterion: "c) Schlüssel {TaucherNr, KursNr} korrekt (1 Punkt) und begründet, z. B. per Hülle oder „steht nie rechts“ (0,5 Punkte)"
      points: 1.5
    - criterion: "d) Partielle Abhängigkeiten von TaucherNr und von KursNr benannt"
      points: 1
    - criterion: "d) Korrekte Zerlegung in drei Relationen mit Schlüsseln"
      points: 2
    - criterion: "e) Beide transitiven Abhängigkeiten benannt (je 0,5 Punkte)"
      points: 1
    - criterion: "e) Korrektes Endergebnis (fünf Relationen) mit Primär- und Fremdschlüsseln"
      points: 2
  space: lines:32
- id: t07-p005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [anomalien, 1nf, 2nf, 3nf]
  type: normalize
  difficulty: 2
  points: 16
  minutes: 16
  prompt: |-
    Ein Fahrradkurierdienst hat seine Touren bisher so notiert. Leere Zellen bedeuten „wie in der Zeile darüber“:

    | TourNr | Datum | KurierNr | Kuriername | RadNr | Radtyp | StoppNr | Empfänger | Zone | Zuschlag |
    |---|---|---|---|---|---|---|---|---|---|
    | T81 | 02.06.2027 | K3 | Jana Pohl | R12 | Lastenrad | 1 | Blumen Kaya | Z1 | 0,00 € |
    |  |  |  |  |  |  | 2 | Kanzlei Röder | Z2 | 1,50 € |
    |  |  |  |  |  |  | 3 | Blumen Kaya | Z3 | 3,00 € |
    | T82 | 02.06.2027 | K5 | Emil Sauer | R07 | Rennrad | 1 | Apotheke am Tor | Z2 | 1,50 € |
    | T83 | 03.06.2027 | K3 | Jana Pohl | R07 | Rennrad | 1 | Kanzlei Röder | Z2 | 1,50 € |
    |  |  |  |  |  |  | 2 | Apotheke am Tor | Z2 | 1,50 € |

    Geschäftsregeln:
    - Jede Kurier:in hat eine eindeutige KurierNr und genau einen Namen. Jedes Rad hat eine eindeutige RadNr und einen festen Radtyp.
    - Eine Tour hat ein Datum und wird von genau einer Kurier:in mit genau einem Rad gefahren. Das Rad wird je Tour festgelegt: Eine Kurier:in kann auch am selben Tag auf verschiedenen Touren verschiedene Räder fahren.
    - Stopps werden je Tour ab 1 nummeriert.
    - Jeder Stopp hat einen Empfänger und liegt in einer Tarifzone. Der Zuschlag hängt nur von der Zone ab.
    - Ein Empfänger kann mehrere Filialen in verschiedenen Zonen haben.

    a) Nenne je ein konkretes Beispiel für eine Einfüge-, eine Änderungs- und eine Löschanomalie.
    b) Begründe, warum die Tabelle in dieser Form nicht in 1NF ist, und beschreibe die Überführung.
    c) Gib eine vollständige Menge nicht-trivialer FDs mit minimaler linker Seite an, aus der sich alle weiteren FDs herleiten lassen.
    d) Bestimme den Schlüssel der 1NF-Relation und belege ihn mit der Attributhülle.
    e) Überführe in die 2NF und begründe.
    f) Überführe in die 3NF, begründe und gib das Endergebnis mit Primär- und Fremdschlüsseln an.
  solution: |-
    a) Anomalien (andere passende Beispiele gleichwertig):
    - Einfügeanomalie: Eine neue Zone Z4 mit 4,50 € Zuschlag lässt sich erst eintragen, wenn ein Stopp dort liegt. Ebenso kann eine neue Kurier:in ohne Tour nicht erfasst werden.
    - Änderungsanomalie: Der Zuschlag für Z2 steigt auf 2,00 €. Er steht in vier Zeilen und muss überall geändert werden, sonst hat Z2 zwei Zuschläge.
    - Löschanomalie: Wird Tour T82 gelöscht, verschwindet auch jede Information über Kurier K5 Emil Sauer.

    b) Die Tourdaten stehen nur in der ersten Zeile einer Tour. Die Stopps bilden eine Wiederholungsgruppe zu jeder Tour, und die Folgezeilen sind ohne die Zeile darüber nicht interpretierbar. Überführung: Die leeren Zellen werden mit den Tourdaten aufgefüllt, sodass jede Zeile einen vollständigen Stopp beschreibt (sechs Zeilen).

    c) FDs:
    - TourNr → Datum, KurierNr, RadNr
    - KurierNr → Kuriername
    - RadNr → Radtyp
    - TourNr, StoppNr → Empfänger, Zone
    - Zone → Zuschlag

    Nicht gültig sind z. B. Empfänger → Zone (Filialen in mehreren Zonen), KurierNr → RadNr und auch KurierNr, Datum → RadNr (das Rad wird je Tour festgelegt).

    d) Schlüssel {TourNr, StoppNr}. Hülle: Start {TourNr, StoppNr}. TourNr → Datum, KurierNr, RadNr. KurierNr → Kuriername. RadNr → Radtyp. TourNr, StoppNr → Empfänger, Zone. Zone → Zuschlag. Ergebnis: alle zehn Attribute. TourNr⁺ = {TourNr, Datum, KurierNr, RadNr, Kuriername, Radtyp} und StoppNr⁺ = {StoppNr} reichen nicht, also ist der Schlüssel minimal. Beide Attribute stehen nie rechts, deshalb ist er der einzige Schlüsselkandidat.

    e) 2NF: Datum, KurierNr, Kuriername, RadNr und Radtyp hängen schon von TourNr allein ab (partiell). Zerlegung:
    - Tour(<u>TourNr</u>, Datum, KurierNr, Kuriername, RadNr, Radtyp)
    - Stopp(<u>TourNr → Tour, StoppNr</u>, Empfänger, Zone, Zuschlag)

    f) 3NF: In Tour gelten TourNr → KurierNr → Kuriername und TourNr → RadNr → Radtyp, beide transitiv. In Stopp gilt {TourNr, StoppNr} → Zone → Zuschlag. Auch die Relation mit dem vollen Schlüssel enthält also eine transitive Abhängigkeit. Endergebnis:
    - Kurier(<u>KurierNr</u>, Kuriername)
    - Rad(<u>RadNr</u>, Radtyp)
    - Tour(<u>TourNr</u>, Datum, KurierNr → Kurier, RadNr → Rad)
    - Tarifzone(<u>Zone</u>, Zuschlag)
    - Stopp(<u>TourNr → Tour, StoppNr</u>, Empfänger, Zone → Tarifzone)
  rubric:
    - criterion: "a) Je ein konkretes, zutreffendes Beispiel für Einfüge-, Änderungs- und Löschanomalie (je 1 Punkt)"
      points: 3
    - criterion: "b) Wiederholungsgruppe bzw. unvollständige Folgezeilen als Grund erkannt (1 Punkt) und Überführung durch Auffüllen beschrieben (1 Punkt)"
      points: 2
