- id: t08-q001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [projektion, multimenge]
  type: single
  question: |-
    Gegeben ist `Sitzung(mnr, tnr, objekt)` mit den Tupeln (1, T2, Saturn), (1, T3, Orionnebel), (2, T2, Mond), (3, T2, Saturn).
    Wie viele Tupel hat `π_{objekt}(Sitzung)`?
  options:
    - text: "3"
      correct: true
      explain: "Die Projektion liefert eine Menge. „Saturn“ entsteht zweimal, bleibt aber nur einmal: Saturn, Orionnebel, Mond."
    - text: "4"
      correct: false
      explain: "So viele Zeilen liefert `SELECT objekt FROM sitzung` in SQL ohne DISTINCT. In der Algebra werden Duplikate entfernt."
    - text: "1"
      correct: false
      explain: "Die Projektion reduziert die Spalten, nicht die Zeilen auf eine. Es bleiben alle verschiedenen Werte."
    - text: "2"
      correct: false
      explain: "Typischer Fehler: Der doppelte Wert Saturn wurde ganz gestrichen, statt ihn einmal zu behalten. Es bleiben aber alle drei verschiedenen Objekte."
- id: t08-q002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [natural-join, equi-join]
  type: single
  question: |-
    `Mitglied(mnr, name, stufe)` und `Sitzung(mnr, tnr, objekt)` werden mit dem **natürlichen Join** `Mitglied ⋈ Sitzung` verbunden. Welchen Grad (Anzahl der Attribute) hat das Ergebnis?
  options:
    - text: "5"
      correct: true
      explain: "Das gemeinsame Attribut mnr erscheint im natürlichen Join nur einmal: mnr, name, stufe, tnr, objekt."
    - text: "6"
      correct: false
      explain: "Das wäre der Grad eines Equi-Joins oder des Produkts mit Bedingung. Dort bleiben Mitglied.mnr und Sitzung.mnr beide erhalten."
    - text: "3"
      correct: false
      explain: "Der Join fügt die Attribute beider Relationen zusammen, er behält nicht nur die einer Seite (das wäre ein Semi-Join)."
    - text: "4"
      correct: false
      explain: "Zu wenig: Nur das gemeinsame Attribut fällt einmal weg, alle übrigen bleiben."
- id: t08-q003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [outer-join, "null"]
  type: multi
  question: |-
    Flohmarkt: `Stand(platz, betreiber)` enthält (A1, Kai), (A2, Rosa), (A3, Udo). `Anschluss(platz, watt)` enthält (A2, 500), (A3, 1000), (A4, 2000).
    Welche Aussagen über die natürlichen äußeren Joins über `platz` sind richtig?
  options:
    - text: "`Stand ⟕ Anschluss` hat 3 Tupel, darunter (A1, Kai, NULL)."
      correct: true
      explain: "A2 und A3 haben einen Partner, A1 bleibt als linkes partnerloses Tupel mit watt = NULL erhalten."
    - text: "`Stand ⟖ Anschluss` enthält das Tupel (A4, NULL, 2000)."
      correct: true
      explain: "A4 hat keinen Stand. Der Right Outer Join behält es; platz kommt aus Anschluss, betreiber wird mit NULL aufgefüllt."
    - text: "`Stand ⟗ Anschluss` hat 6 Tupel, weil beide Relationen je 3 Tupel haben."
      correct: false
      explain: "A2 und A3 werden zu je einem Tupel verbunden. Dazu kommen A1 und A4 als partnerlose Tupel: insgesamt 4."
    - text: "`Stand ⟕ Anschluss` und `Stand ⟖ Anschluss` sind gleich, weil beide 3 Tupel haben."
      correct: false
      explain: "Gleiche Kardinalität heißt nicht gleicher Inhalt: Links steht A1 mit NULL, rechts A4 mit NULL."
- id: t08-q004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [semi-join]
  type: single
  question: |-
    Verlag: `Autorin(anr, name)` enthält (1, Ilse), (2, Jana), (3, Kim). `Buch(isbn, anr)` enthält (B1, 2), (B2, 2), (B3, 3), (B4, 5).
    Was liefert der Semi-Join `Autorin ⋉ Buch`?
  options:
    - text: "2 Tupel mit den Attributen anr, name: (2, Jana), (3, Kim)"
      correct: true
      explain: "Behalten werden die Autorinnen mit mindestens einem Buch, nur mit ihren eigenen Attributen. Jana steht trotz zweier Bücher nur einmal da."
    - text: "3 Tupel mit den Attributen anr, name, isbn"
      correct: false
      explain: "Das ist der natürliche Join. Der Semi-Join behält nur die Attribute der linken Relation."
    - text: "3 Tupel mit den Attributen anr, name, Jana doppelt"
      correct: false
      explain: "Nach dem Wegprojizieren von isbn sind beide Jana-Tupel gleich und fallen zu einem zusammen."
    - text: "1 Tupel: (1, Ilse)"
      correct: false
      explain: "Das wäre der Anti-Join `Autorin ▷ Buch`, also die Autorinnen **ohne** Buch."
    - text: "3 Tupel mit den Attributen isbn, anr: B1, B2, B3"
      correct: false
      explain: "Das ist der rechte Semi-Join `Autorin ⋊ Buch`. ⋉ gibt Tupel der linken Relation aus."
