- id: t09-p001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [create-table, constraints, identity, reihenfolge, set-null, min-max]
  type: erm-to-sql
  difficulty: 2
  points: 14
  minutes: 14
  prompt: |-
    Eine Boulderhalle (Kletterhalle ohne Seil) speichert ihre Daten in Firebird 3. Gegeben ist ein ERM-Auszug: Kardinalitäten in Chen-Notation, dazu die (min,max)-Angaben, jeweils beim eigenen Entitätstyp.

    ```
    Entitätstypen
      Schrauber (schrauber_id, vorname, nachname, kuerzel)              -- Tabelle existiert
      Mitglied  (mitglied_id, vorname, nachname, email, beigetreten_am) -- Tabelle existiert
      Boulder   (boulder_id, farbe, grad, geschraubt_am, abgebaut_am)

    Beziehungstypen
      baut:    Schrauber 1 ─── n Boulder     Schrauber (0,n)   Boulder (1,1)
      begeht:  Mitglied  m ─── n Boulder     Mitglied  (0,n)   Boulder (0,n)
               Attribute von begeht: datum, versuche, geschafft
    ```

    Zusätzliche Regeln:
    - `farbe` nur `'gelb'`, `'gruen'`, `'blau'`, `'rot'` oder `'schwarz'`; `grad` ganze Zahl von 1 bis 8; `abgebaut_am` optional und nicht vor `geschraubt_am`. Alle übrigen Attribute von Boulder sind Pflicht.
    - Wird eine Schrauber:in gelöscht, sollen ihre Boulder erhalten bleiben, dann ohne Zuordnung.
    - begeht: Pro Mitglied, Boulder und Tag gibt es höchstens einen Eintrag. `versuche` mindestens 1, Standard 1; `geschafft` Standard „nein“; `datum`, `versuche` und `geschafft` sind Pflicht. Wird ein Mitglied gelöscht, verschwinden seine Begehungen. Ein Boulder mit Begehungen darf nicht gelöscht werden.
    - Alle Nummern vergibt die Datenbank automatisch.

    Bereits angelegt:
    ```sql
    CREATE TABLE schrauber (
      schrauber_id INTEGER GENERATED BY DEFAULT AS IDENTITY,
      vorname      VARCHAR(30) NOT NULL,
      nachname     VARCHAR(30) NOT NULL,
      kuerzel      VARCHAR(4)  NOT NULL,
      CONSTRAINT pk_schrauber PRIMARY KEY (schrauber_id),
      CONSTRAINT uq_schrauber_kuerzel UNIQUE (kuerzel)
    );
    CREATE TABLE mitglied (
      mitglied_id    INTEGER GENERATED BY DEFAULT AS IDENTITY,
      vorname        VARCHAR(30) NOT NULL,
      nachname       VARCHAR(30) NOT NULL,
      email          VARCHAR(80) NOT NULL,
      beigetreten_am DATE DEFAULT CURRENT_DATE NOT NULL,
      CONSTRAINT pk_mitglied PRIMARY KEY (mitglied_id),
      CONSTRAINT uq_mitglied_email UNIQUE (email)
    );
    ```

    a) Leite aus dem ERM-Auszug die Tabellen `boulder` und `begehung` ab und schreibe die `CREATE TABLE`-Anweisungen in Firebird-3-Syntax mit allen passenden Constraints. Benenne PRIMARY KEY-, FOREIGN KEY-, UNIQUE- und CHECK-Constraints mit `CONSTRAINT …`.
    b) In welcher Reihenfolge müssen alle vier Tabellen angelegt werden? Begründe in einem Satz.
    c) Aus Boulder (1,1) bei `baut` würdest du `schrauber_id NOT NULL` ableiten. Warum darfst du das hier trotzdem nicht?
  solution: |-
    **a)**
    ```sql
    CREATE TABLE boulder (
      boulder_id    INTEGER GENERATED BY DEFAULT AS IDENTITY,
      farbe         VARCHAR(7) NOT NULL,
      grad          SMALLINT   NOT NULL,
      geschraubt_am DATE       NOT NULL,
      abgebaut_am   DATE,
      schrauber_id  INTEGER,
      CONSTRAINT pk_boulder PRIMARY KEY (boulder_id),
      CONSTRAINT fk_boulder_schrauber FOREIGN KEY (schrauber_id)
        REFERENCES schrauber (schrauber_id) ON DELETE SET NULL,
      CONSTRAINT ck_boulder_farbe
        CHECK (farbe IN ('gelb', 'gruen', 'blau', 'rot', 'schwarz')),
      CONSTRAINT ck_boulder_grad CHECK (grad BETWEEN 1 AND 8),
      CONSTRAINT ck_boulder_abbau
        CHECK (abgebaut_am IS NULL OR abgebaut_am >= geschraubt_am)
    );

    CREATE TABLE begehung (
      mitglied_id INTEGER  NOT NULL,
      boulder_id  INTEGER  NOT NULL,
      datum       DATE     NOT NULL,
      versuche    SMALLINT DEFAULT 1 NOT NULL,
      geschafft   BOOLEAN  DEFAULT FALSE NOT NULL,
      CONSTRAINT pk_begehung PRIMARY KEY (mitglied_id, boulder_id, datum),
      CONSTRAINT fk_begehung_mitglied FOREIGN KEY (mitglied_id)
        REFERENCES mitglied (mitglied_id) ON DELETE CASCADE,
      CONSTRAINT fk_begehung_boulder FOREIGN KEY (boulder_id)
        REFERENCES boulder (boulder_id),
      CONSTRAINT ck_begehung_versuche CHECK (versuche >= 1)
    );
    ```
    Ableitung: `baut` ist 1:n, deshalb wandert `schrauber_id` als Fremdschlüssel in `boulder`. `begeht` ist m:n und wird zu einer eigenen Tabelle mit zwei Fremdschlüsseln, die Beziehungsattribute kommen dazu. Weil dasselbe Mitglied denselben Boulder an mehreren Tagen versuchen darf, gehört `datum` in den Schlüssel. `fk_begehung_boulder` braucht keine Aktion: Ohne Angabe gilt `NO ACTION`, das Löschen eines Boulders mit Begehungen wird also abgewiesen. `ck_boulder_abbau` geht auch ohne `abgebaut_am IS NULL OR`, weil ein CHECK bei NULL nicht abweist.

    Gleichwertig: ein künstlicher Schlüssel `begehung_id INTEGER GENERATED BY DEFAULT AS IDENTITY` als PRIMARY KEY zusammen mit `CONSTRAINT uq_begehung UNIQUE (mitglied_id, boulder_id, datum)`. Datentypen, Längen und Constraint-Namen dürfen abweichen. Für `farbe` passt `VARCHAR`. Bei `CHAR(7)` würde Firebird kürzere Werte mit Leerzeichen auffüllen, der IN-Vergleich klappt trotzdem.

    **b)** `schrauber` und `mitglied` (beliebig untereinander) → `boulder` → `begehung`. Eine Tabelle mit Fremdschlüssel kann erst angelegt werden, wenn die referenzierte Tabelle existiert: `boulder` verweist auf `schrauber`, `begehung` auf `mitglied` und `boulder`. (`mitglied` darf auch nach `boulder` kommen, muss aber vor `begehung` stehen.)

    **c)** Gefordert ist `ON DELETE SET NULL`. Beim Löschen einer Schrauber:in setzt das DBMS `schrauber_id` in ihren Bouldern auf NULL. Wäre die Spalte `NOT NULL`, würde jedes solche `DELETE` mit Fehler abgewiesen. Die Lösch-Regel hat hier Vorrang vor der Kardinalität. Dass beim Anlegen eines Boulders immer eine Schrauber:in angegeben wird, muss dann die Anwendung sicherstellen (oder ein Trigger).
  rubric:
    - criterion: "boulder: Identity-Spalte als PRIMARY KEY"
      points: 1
    - criterion: "boulder: farbe, grad und geschraubt_am NOT NULL, abgebaut_am NULL-fähig"
      points: 1
    - criterion: "boulder: FK auf schrauber mit ON DELETE SET NULL, schrauber_id NULL-fähig"
      points: 1.5
    - criterion: "boulder: CHECK für farbe (IN-Liste) und grad (1 bis 8)"
      points: 1
    - criterion: "boulder: CHECK abgebaut_am ≥ geschraubt_am (mit oder ohne IS NULL OR)"
      points: 1
    - criterion: "begehung: PK (mitglied_id, boulder_id, datum) als Tabellen-Constraint ODER künstlicher PK plus UNIQUE über diese drei Spalten"
      points: 1.5
    - criterion: "begehung: FK auf mitglied mit ON DELETE CASCADE, FK auf boulder ohne Aktion bzw. NO ACTION, beide FK-Spalten NOT NULL"
      points: 1.5
    - criterion: "begehung: versuche DEFAULT 1 NOT NULL mit CHECK ≥ 1, geschafft als Wahrheitswert (BOOLEAN oder gleichwertig) mit Default „nein“ und NOT NULL, DEFAULT jeweils vor NOT NULL"
      points: 1.5
    - criterion: "alle PRIMARY KEY-, FOREIGN KEY-, UNIQUE- und CHECK-Constraints mit CONSTRAINT … benannt (Namensschema frei)"
      points: 1
    - criterion: "b) gültige Reihenfolge aller vier Tabellen mit Begründung"
      points: 1.5
    - criterion: "c) Widerspruch NOT NULL ↔ SET NULL erkannt und erklärt"
      points: 1.5
  space: lines:34
- id: t09-p002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [create-table, domain, check, zusammengesetzter-schluessel, on-update, drop, dialekt]
  type: sql-write
  difficulty: 3
  points: 16
  minutes: 16
  prompt: |-
    Ein Laufverein richtet Volksläufe aus und nutzt Firebird 3. Diese Tabellen gibt es schon:

    ```sql
    CREATE TABLE lauf (
      lauf_id     INTEGER GENERATED BY DEFAULT AS IDENTITY,
      bezeichnung VARCHAR(60) NOT NULL,
      datum       DATE        NOT NULL,
      CONSTRAINT pk_lauf PRIMARY KEY (lauf_id),
      CONSTRAINT uq_lauf_bezeichnung UNIQUE (bezeichnung)
    );
    CREATE TABLE teilnehmer (
      teilnehmer_id INTEGER GENERATED BY DEFAULT AS IDENTITY,
      vorname       VARCHAR(30) NOT NULL,
      nachname      VARCHAR(30) NOT NULL,
      verein        VARCHAR(60),
      CONSTRAINT pk_teilnehmer PRIMARY KEY (teilnehmer_id)
    );
    ```

    Ergänzt werden sollen:
    - **Strecke**: gehört zu genau einem Lauf und wird innerhalb dieses Laufs durch ein Kürzel wie `'5K'` oder `'10K'` unterschieden. Startgebühr und Zeitlimit in Minuten (größer 0) sind Pflicht. Wird ein Lauf gelöscht, verschwinden seine Strecken.
    - **Anmeldung**: Eine Person startet bei einem Lauf auf **genau einer** seiner Strecken. Sie bekommt eine Startnummer (Pflicht), die innerhalb des Laufs eindeutig ist. Gespeichert werden der bezahlte Betrag (Pflicht, Standard 0) und die Nettozeit in Sekunden (optional, erst nach dem Lauf eingetragen, größer 0). Wird das Kürzel einer Strecke korrigiert, sollen die Anmeldungen mitziehen. Wird eine Person gelöscht, verschwinden ihre Anmeldungen.

    Geldbeträge (Startgebühr, bezahlter Betrag) haben zwei Nachkommastellen, liegen zwischen 0 und 9999,99 und sollen **auch in Firebird 3 wirksam** auf diesen Bereich begrenzt sein.

    a) Lege für die Geldbeträge eine Domäne `d_euro` an und schreibe die `CREATE TABLE`-Anweisungen für `strecke` und `anmeldung` in gültiger Reihenfolge.
    b) Begründe den Primärschlüssel von `anmeldung`.
    c) Es gibt Anmeldungen zu Lauf 1. Was passiert bei `DELETE FROM lauf WHERE lauf_id = 1`?
    d) Gib die Reihenfolge an, in der alle Objekte (Domäne und alle vier Tabellen) wieder gelöscht werden können.
  solution: |-
    **a)**
    ```sql
    CREATE DOMAIN d_euro AS NUMERIC(6,2) CHECK (VALUE BETWEEN 0 AND 9999.99);

    CREATE TABLE strecke (
      lauf_id       INTEGER    NOT NULL,
      kuerzel       VARCHAR(5) NOT NULL,
      startgebuehr  d_euro     NOT NULL,
      zeitlimit_min SMALLINT   NOT NULL,
      CONSTRAINT pk_strecke PRIMARY KEY (lauf_id, kuerzel),
      CONSTRAINT fk_strecke_lauf FOREIGN KEY (lauf_id)
        REFERENCES lauf (lauf_id) ON DELETE CASCADE,
      CONSTRAINT ck_strecke_limit CHECK (zeitlimit_min > 0)
    );

    CREATE TABLE anmeldung (
      lauf_id       INTEGER    NOT NULL,
      teilnehmer_id INTEGER    NOT NULL,
      kuerzel       VARCHAR(5) NOT NULL,
      startnummer   INTEGER    NOT NULL,
      bezahlt       d_euro     DEFAULT 0 NOT NULL,
      nettozeit_s   INTEGER,
      CONSTRAINT pk_anmeldung PRIMARY KEY (lauf_id, teilnehmer_id),
      CONSTRAINT uq_anmeldung_startnr UNIQUE (lauf_id, startnummer),
      CONSTRAINT fk_anmeldung_strecke FOREIGN KEY (lauf_id, kuerzel)
        REFERENCES strecke (lauf_id, kuerzel) ON UPDATE CASCADE,
      CONSTRAINT fk_anmeldung_teilnehmer FOREIGN KEY (teilnehmer_id)
        REFERENCES teilnehmer (teilnehmer_id) ON DELETE CASCADE,
      CONSTRAINT ck_anmeldung_zeit CHECK (nettozeit_s > 0)
    );
    ```
    Reihenfolge: Domäne → `strecke` → `anmeldung`. Die Domäne muss vor ihrer ersten Nutzung existieren, `strecke` vor dem Fremdschlüssel, der auf sie zeigt.

    **Zur Domäne:** Die Obergrenze steht im CHECK, weil Firebird 3 die Präzision nicht erzwingt. `NUMERIC(6,2)` allein nimmt dort auch 99 999,99 an, nur PostgreSQL würde das schon über die Präzision abweisen. Gleichwertig ist jede Präzision ab 6 mit zwei Nachkommastellen (z. B. `NUMERIC(8,2)`) mit demselben CHECK, ebenso `CHECK (VALUE >= 0 AND VALUE <= 9999.99)`. Eine Domäne nur mit `CHECK (VALUE >= 0)` begrenzt nach oben nur in PostgreSQL.

    `kuerzel NOT NULL` setzt „genau eine Strecke“ um: Ohne NOT NULL wäre eine Anmeldung ohne Strecke möglich, weil ein FK mit NULL nicht geprüft wird. `ck_anmeldung_zeit` lässt NULL durch, deshalb ist kein `IS NULL OR` nötig.

    **b)** „Genau eine Strecke je Person und Lauf“ heißt: (lauf_id, teilnehmer_id) kommt höchstens einmal vor und bestimmt die Strecke. Das Kürzel gehört deshalb **nicht** in den Schlüssel, sonst könnte sich dieselbe Person auf zwei Strecken desselben Laufs anmelden. Der FK auf `strecke` ist zusammengesetzt, weil der PK von `strecke` aus zwei Spalten besteht. `lauf_id` ist dabei Teil des PK und des FK zugleich. Gleichwertig ist ein künstlicher PK `anmeldung_id` (Identity) zusammen mit `UNIQUE (lauf_id, teilnehmer_id)`.

    **c)** Das DBMS will die Strecken von Lauf 1 per CASCADE mitlöschen. Auf diese Strecken verweisen aber Anmeldungen, und `fk_anmeldung_strecke` hat bei `ON DELETE` keine Aktion, also `NO ACTION`. Das Löschen der Strecken scheitert, damit scheitert die ganze Anweisung. Lauf und Strecken bleiben unverändert.

    **d)** Eine gültige Reihenfolge ist `anmeldung` → `strecke` → `lauf` → `teilnehmer` → `DROP DOMAIN d_euro`. Es gelten zwei Regeln. Kinder werden vor ihren Eltern gelöscht: `anmeldung` vor `strecke` und `teilnehmer`, `strecke` vor `lauf`. Und die Domäne fällt erst, wenn keine Spalte sie mehr nutzt, also nach `strecke` und `anmeldung`. Gleichwertig sind deshalb auch `anmeldung` → `teilnehmer` → `strecke` → `DROP DOMAIN d_euro` → `lauf` und andere Folgen, die beide Regeln einhalten.
  rubric:
    - criterion: "Domäne d_euro: NUMERIC mit 2 Nachkommastellen und CHECK mit Untergrenze 0 UND Obergrenze 9999,99 (jede ausreichende Präzision zählt; nur Präzision ohne Obergrenze im CHECK: 1 Punkt)"
      points: 2
    - criterion: "a) gültige Reihenfolge: Domäne vor den Tabellen, strecke vor anmeldung"
      points: 1
    - criterion: "strecke: PK (lauf_id, kuerzel), FK auf lauf mit ON DELETE CASCADE, CHECK zeitlimit_min > 0, Pflichtspalten NOT NULL"
      points: 2
    - criterion: "anmeldung: PK (lauf_id, teilnehmer_id) ODER künstlicher PK plus UNIQUE (lauf_id, teilnehmer_id); dazu UNIQUE (lauf_id, startnummer)"
      points: 2
    - criterion: "anmeldung: kuerzel NOT NULL (genau eine Strecke)"
      points: 1
    - criterion: "anmeldung: zusammengesetzter FK (lauf_id, kuerzel) → strecke mit ON UPDATE CASCADE, FK teilnehmer mit ON DELETE CASCADE"
      points: 2
    - criterion: "anmeldung: startnummer NOT NULL, bezahlt mit d_euro DEFAULT 0 NOT NULL, nettozeit NULL-fähig mit CHECK > 0"
      points: 1
    - criterion: "b) PK begründet (Kürzel nicht im Schlüssel)"
      points: 1.5
    - criterion: "c) Abbruch der ganzen Anweisung durch NO ACTION auf der zweiten Ebene erkannt"
      points: 2
    - criterion: "d) gültige Lösch-Reihenfolge: jede Kindtabelle vor ihrer Elterntabelle, Domäne erst nach strecke und anmeldung (jede Folge, die beides einhält)"
      points: 1.5
  space: lines:36
- id: t09-p003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, cascade, set-null, no-action, on-update]
  type: explain
  difficulty: 2
  points: 10
  minutes: 10
  prompt: |-
    Bei einem Hackathon gibt es diese vier Tabellen (Fremdschlüssel mit ihren Aktionen):

    ```
    team(team_id, teamname)
    person(person_id, vorname, team_id)   team_id NULL-fähig, FK → team ON DELETE SET NULL
    abgabe(abgabe_id, team_id, titel)     team_id NOT NULL,   FK → team ON DELETE CASCADE ON UPDATE CASCADE
    wertung(wertung_id, abgabe_id, punkte) abgabe_id NOT NULL, FK → abgabe (keine Aktion angegeben)
    ```

    Daten (Spalten in der Reihenfolge von oben):

    ```
    team:    (1, Bitwise), (2, NullPointer), (3, Overflow)
    person:  (10, Ada, 1), (11, Ben, 2), (12, Cem, 2), (13, Dana, 3)
    abgabe:  (100, 1, Mensa-App), (101, 2, Raumfinder), (102, 2, Raumfinder v2)
    wertung: (900, 100, 8), (901, 101, 6)
    ```

    Jede Teilaufgabe startet wieder mit diesen Daten. Gib jeweils an, ob die Anweisung gelingt, und welche Zeilen sich in welchen Tabellen wie ändern.

    a) `DELETE FROM team WHERE team_id = 3;`
    b) `DELETE FROM team WHERE team_id = 2;`
    c) `DELETE FROM wertung WHERE wertung_id = 901;` und danach `DELETE FROM team WHERE team_id = 2;`
    d) `UPDATE team SET team_id = 7 WHERE team_id = 1;`
    e) Welche einzige Änderung am Schema würde b) gelingen lassen, ohne dass vorher Wertungen von Hand gelöscht werden müssen und ohne dass die referenzielle Integrität verloren geht?
    f) Jemand schreibt in Firebird 3 `… REFERENCES abgabe (abgabe_id) ON DELETE RESTRICT`. Was passiert, und was schreibt man stattdessen?
  solution: |-
    **a)** Gelingt. Team 3 wird gelöscht. Dana (13) bleibt erhalten, ihre `team_id` wird NULL (SET NULL). Team 3 hat keine Abgaben, `abgabe` und `wertung` bleiben unverändert.

    **b)** Scheitert, **nichts** ändert sich. CASCADE würde die Abgaben 101 und 102 mitlöschen. Auf Abgabe 101 verweist aber Wertung 901, und der FK `wertung → abgabe` hat `NO ACTION`. Damit wird das Löschen von 101 abgewiesen und mit ihm die ganze Anweisung, auch das SET NULL bei Ben und Cem.

    **c)** Beide Anweisungen gelingen. Zuerst verschwindet Wertung 901. Danach werden Team 2 und per CASCADE die Abgaben 101 und 102 gelöscht. Ben (11) und Cem (12) bleiben mit `team_id = NULL` erhalten. Team 1, Ada, Abgabe 100 und Wertung 900 bleiben unverändert.

    **d)** Scheitert, nichts ändert sich. Für `abgabe` wäre das kein Problem (ON UPDATE CASCADE würde Abgabe 100 auf `team_id = 7` ändern). Der FK von `person` hat aber nur eine Löschregel, für Änderungen gilt `NO ACTION`. Ada verweist noch auf Team 1, also wird das UPDATE abgewiesen.

    **e)** Den FK `wertung → abgabe` mit `ON DELETE CASCADE` anlegen. Dann verschwinden bei b) auch Wertung 901 (und alle Wertungen zu 102). `SET NULL` scheitert hier an `abgabe_id NOT NULL`. Den FK ganz zu entfernen ließe b) zwar ebenfalls gelingen, Wertung 901 würde dann aber auf eine nicht mehr vorhandene Abgabe zeigen. Das gibt die referenzielle Integrität auf und zählt deshalb nicht.

    **f)** Firebird 3 kennt `RESTRICT` nicht, die Anweisung wird mit einem Syntaxfehler abgewiesen. Man schreibt `ON DELETE NO ACTION` oder lässt die Klausel weg. Das Ergebnis ist dasselbe: Löschen wird abgewiesen, solange Kindzeilen existieren.
  rubric:
    - criterion: "a) Team 3 gelöscht, Dana mit NULL, sonst nichts"
      points: 1.5
    - criterion: "b) Abbruch erkannt: NO ACTION auf wertung blockiert die Kaskade, ganze Anweisung ohne Wirkung"
      points: 2.5
    - criterion: "c) Team 2, Abgaben 101/102 gelöscht; Ben und Cem mit NULL"
      points: 2
    - criterion: "d) Scheitern wegen fehlender ON UPDATE-Regel bei person erkannt"
      points: 2
    - criterion: "e) ON DELETE CASCADE beim FK wertung → abgabe (Entfernen des FK zählt nicht)"
      points: 1
    - criterion: "f) RESTRICT in Firebird 3 nicht vorhanden, NO ACTION bzw. weglassen"
      points: 1
  space: lines:22
- id: t09-p004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [sprachklassen]
  type: define-example
  difficulty: 1
  points: 6
  minutes: 6
  prompt: |-
    Erkläre die SQL-Sprachklassen **DDL, DML, DQL, DCL** und **TCL**. Gib zu jeder Klasse in einem Satz ihren Zweck an und schreibe je eine **eigene** Beispielanweisung. Alle Beispiele sollen zu derselben, selbst gewählten kleinen Datenbank passen. Nenne außerdem eine Einteilung, bei der eine dieser Klassen in einer anderen aufgeht.
  solution: |-
    Beispiel (andere passende Beispiele gleichwertig): Datenbank einer Fahrschule.
    - **DDL** (*Data Definition Language*) legt die Struktur an, ändert oder löscht sie.
      `CREATE TABLE fahrstunde (stunde_id INTEGER NOT NULL PRIMARY KEY, datum DATE NOT NULL, dauer_min SMALLINT NOT NULL);`
    - **DML** (*Data Manipulation Language*) fügt Zeilen ein, ändert oder löscht sie.
      `UPDATE fahrstunde SET dauer_min = 90 WHERE stunde_id = 12;`
    - **DQL** (*Data Query Language*) liest Daten, ohne sie zu ändern.
      `SELECT datum, dauer_min FROM fahrstunde WHERE datum >= DATE '2025-04-01';`
    - **DCL** (*Data Control Language*) vergibt und entzieht Rechte.
      `GRANT SELECT ON fahrstunde TO buero;`
    - **TCL** (*Transaction Control Language*) steuert Transaktionen.
      `COMMIT;` bzw. `ROLLBACK;`

    Einteilungen, die alle als richtig gelten:
    - `SELECT` gehört zur DML (DML = Daten abfragen und ändern), eine eigene DQL gibt es dann nicht.
    - TCL ist keine eigene Klasse. Die Transaktionsbefehle stehen dann bei der DCL.
    - DCL ist weiter gefasst als die Rechtevergabe: Dazu gehören auch Integritätsregeln, Speicher- und Zugriffsstrukturen, Transaktionen und Datensicherung.
  rubric:
    - criterion: "DDL: Zweck und passende Anweisung (CREATE/ALTER/DROP)"
      points: 1
    - criterion: "DML: Zweck und passende Anweisung (INSERT/UPDATE/DELETE)"
      points: 1
    - criterion: "DQL: Zweck und passende SELECT-Anweisung"
      points: 1
    - criterion: "DCL: Zweck und passende Anweisung (GRANT/REVOKE; ein weiter gefasster DCL-Begriff mit passendem Beispiel zählt ebenfalls)"
      points: 1
    - criterion: "TCL: Zweck und passende Anweisung (COMMIT/ROLLBACK/SAVEPOINT)"
      points: 1
    - criterion: "Einteilungsvariante genannt (SELECT als Teil der DML, TCL als Teil der DCL oder nicht eigenständig)"
      points: 1
  space: lines:14
- id: t09-p005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [constraints, spalten-constraint, tabellen-constraint, default]
  type: define-example
  difficulty: 2
  points: 9
  minutes: 9
  prompt: |-
    a) Erkläre `NOT NULL`, `UNIQUE`, `PRIMARY KEY`, `CHECK` und `DEFAULT` jeweils in einem Satz und gib zu jedem eine **eigene** Spaltendefinition oder Tabellen-Constraint-Zeile in Firebird-3-Syntax an. Wähle dafür eine selbst ausgedachte Tabelle.
    b) Erkläre den Unterschied zwischen Spalten- und Tabellen-Constraint und nenne einen Fall, in dem nur der Tabellen-Constraint möglich ist.
    c) Worin unterscheidet sich `DEFAULT` grundsätzlich von den anderen vier Angaben?
  solution: |-
    Beispiel (andere gleichwertig): Tabelle `sitzplatz` eines Theaters.

    **a)**
    - `NOT NULL`: Die Spalte muss in jeder Zeile einen Wert haben. `reihe CHAR(1) NOT NULL`
    - `UNIQUE`: Kein Wert bzw. keine Wertkombination kommt zweimal vor. `CONSTRAINT uq_sitzplatz UNIQUE (saal_id, reihe, platz_nr)`
    - `PRIMARY KEY`: identifiziert jede Zeile eindeutig, nie NULL, höchstens einer je Tabelle. `CONSTRAINT pk_sitzplatz PRIMARY KEY (sitzplatz_id)`
    - `CHECK`: Bedingung, die jede Zeile erfüllen muss (UNKNOWN zählt nicht als Verstoß). `CONSTRAINT ck_sitzplatz_nr CHECK (platz_nr BETWEEN 1 AND 40)`
    - `DEFAULT`: Wert, der eingesetzt wird, wenn ein INSERT die Spalte nicht nennt. `barrierefrei BOOLEAN DEFAULT FALSE NOT NULL`

    **b)** Ein Spalten-Constraint steht in der Spaltendefinition und bezieht sich auf genau diese Spalte. Ein Tabellen-Constraint steht als eigener Eintrag nach den Spalten und kann mehrere Spalten nennen. Nur als Tabellen-Constraint geht alles, was mehrere Spalten betrifft: ein zusammengesetzter PK oder UNIQUE wie `uq_sitzplatz` oben, ein zusammengesetzter FK oder ein CHECK, der zwei Spalten vergleicht (z. B. `bis >= von`).

    **c)** Die anderen vier **verbieten** Werte bzw. Zeilen und können verletzt werden. Dann weist das DBMS die Änderung ab. `DEFAULT` verbietet nichts, sondern **liefert einen Ersatzwert**, wenn ein INSERT die Spalte weglässt. Er kann nie verletzt werden. Beide Einordnungen gelten als richtig, wenn der Unterschied genannt ist: DEFAULT als „kein Constraint im engeren Sinn“ (so führen ihn die Dokus von Firebird und PostgreSQL) oder DEFAULT als Spaltenbedingung unter den deklarativen Integritätsregeln.
  rubric:
    - criterion: "a) NOT NULL: Erklärung und eigenes Beispiel"
      points: 1
    - criterion: "a) UNIQUE: Erklärung und eigenes Beispiel"
      points: 1
    - criterion: "a) PRIMARY KEY: Erklärung und eigenes Beispiel"
      points: 1
    - criterion: "a) CHECK: Erklärung und eigenes Beispiel"
      points: 1
    - criterion: "a) DEFAULT: Erklärung und eigenes Beispiel (DEFAULT vor NOT NULL)"
      points: 1
    - criterion: "b) Unterschied Spalten-/Tabellen-Constraint korrekt erklärt"
      points: 1.5
    - criterion: "b) Fall genannt, der nur als Tabellen-Constraint geht (mehrere Spalten)"
      points: 1
    - criterion: "c) Unterschied erkannt: DEFAULT liefert einen Ersatzwert und kann nicht verletzt werden (Einordnung als Constraint oder Nicht-Constraint gleichwertig)"
      points: 1.5
  space: lines:16
- id: t09-p006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [domain, identity, sequenz]
  type: define-example
  difficulty: 2
  points: 8
  minutes: 8
  prompt: |-
    a) Erkläre, was eine **Domäne** (`CREATE DOMAIN`) ist, und gib ein **eigenes** Beispiel mit Default und CHECK an. Nenne einen Vorteil gegenüber einem CHECK, der in jeder Spalte einzeln steht.
    b) Erkläre den Unterschied zwischen einer **Identity-Spalte** und einer **Sequenz** (Generator). Gib zu beiden eine eigene Firebird-3-Anweisung an.
    c) Beschreibe einen Fall, in dem eine Sequenz besser passt als eine Identity-Spalte.
    d) Warum sind die von beiden vergebenen Nummern nicht lückenlos?
  solution: |-
    **a)** Eine Domäne ist ein benannter, selbst definierter Datentyp: Basistyp plus optional Default, NOT NULL und CHECK. Spalten nutzen sie wie einen eingebauten Typ.
    ```sql
    CREATE DOMAIN d_sterne AS SMALLINT DEFAULT 0 CHECK (VALUE BETWEEN 0 AND 5);
    ```
    (Bewertung mit 1 bis 5 Sternen, 0 = noch nicht bewertet.) Vorteil: Die Regel steht an einer Stelle. Alle Bewertungsspalten verhalten sich gleich, und eine Änderung per `ALTER DOMAIN` wirkt überall.

    **b)** Eine Identity-Spalte gehört fest zu einer Spalte. Das DBMS legt den Zähler intern an und füllt die Spalte, wenn ein INSERT sie weglässt.
    ```sql
    CREATE TABLE klausur (
      klausur_id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      fach       VARCHAR(30) NOT NULL
    );
    ```
    Eine Sequenz ist ein eigenes Schemaobjekt, das man ausdrücklich abfragt, z. B. im INSERT.
    ```sql
    CREATE SEQUENCE seq_beleg;
    INSERT INTO rechnung (beleg_nr, betrag) VALUES (NEXT VALUE FOR seq_beleg, 49.90);
    ```

    **c)** Wenn mehrere Tabellen einen gemeinsamen Nummernkreis brauchen, z. B. Rechnungen und Gutschriften mit fortlaufenden Belegnummern ohne Doppelungen. Oder wenn eine Nummer schon vor dem INSERT bekannt sein muss.

    **d)** Ein vergebener Wert wird nie zurückgegeben. Scheitert ein INSERT oder wird die Transaktion zurückgerollt, ist die Nummer trotzdem verbraucht. Sequenzen stehen bewusst außerhalb der Transaktionskontrolle, damit parallele Transaktionen nicht aufeinander warten müssen.
  rubric:
    - criterion: "a) Domäne korrekt erklärt"
      points: 1
    - criterion: "a) eigenes CREATE DOMAIN mit DEFAULT und CHECK (VALUE …) syntaktisch korrekt"
      points: 1.5
    - criterion: "a) Vorteil genannt (zentrale Definition, einheitlich änderbar)"
      points: 0.5
    - criterion: "b) Unterschied Identity (an Spalte gebunden, automatisch) und Sequenz (eigenes Objekt, ausdrücklich abgefragt)"
      points: 1.5
    - criterion: "b) je eine korrekte Firebird-Anweisung"
      points: 1.5
    - criterion: "c) passender Fall (gemeinsamer Nummernkreis o. Ä.)"
      points: 1
    - criterion: "d) Lücken durch nicht zurückgegebene Werte bei Fehler/Rollback erklärt"
      points: 1
  space: lines:18
- id: t09-p007
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [alter-table, not-null, check, umbenennen, firebird]
  type: sql-write
  difficulty: 2
  points: 11
  minutes: 11
  prompt: |-
    Eine Kantine nutzt Firebird 3 mit dieser Tabelle, die bereits 120 Gerichte enthält:

    ```sql
    CREATE TABLE gericht (
      gericht_id  INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      bezeichnung VARCHAR(40) NOT NULL,
      preis       NUMERIC(5,2) NOT NULL,
      kalorien    INTEGER
    );
    ```

    Schreibe die nötigen Anweisungen (bei Bedarf mit `UPDATE` oder `SELECT`). Die Teilaufgaben werden **in dieser Reihenfolge** nacheinander auf derselben Tabelle ausgeführt.

    a) Neue Pflichtspalte `vegan` (Wahrheitswert). Alle vorhandenen Gerichte gelten zunächst als nicht vegan, neue Gerichte ohne Angabe ebenfalls. Begründe, warum `ALTER TABLE gericht ADD vegan BOOLEAN NOT NULL` allein nicht reicht.
    b) `bezeichnung` soll bis zu 60 Zeichen aufnehmen.
    c) `preis` soll künftig `preis_eur` heißen. Gib die Firebird- und die PostgreSQL-Fassung an.
    d) Der Preis muss positiv sein (Constraint `ck_gericht_preis`). Worauf musst du in Firebird achten, bevor du den Constraint anlegst?
    e) Die Spalte `kalorien` wird nicht mehr gebraucht.
    f) Warum wäre es in Firebird 3 ein Problem, d) vor c) auszuführen? Wie ginge es dann?
  solution: |-
    **a)** Firebird 3 lehnt eine NOT-NULL-Spalte ohne Default ab, wenn die Tabelle schon Zeilen hat, denn die 120 Gerichte hätten keinen Wert. Am kürzesten ist ein Default in derselben Anweisung. Er füllt in Firebird 3 und PostgreSQL auch die vorhandenen Zeilen:
    ```sql
    ALTER TABLE gericht ADD vegan BOOLEAN DEFAULT FALSE NOT NULL;
    ```
    Gleichwertig ist der Weg in drei Schritten. Er ist nötig, wenn die alten Zeilen unterschiedliche Werte bekommen sollen:
    ```sql
    ALTER TABLE gericht ADD vegan BOOLEAN DEFAULT FALSE;
    UPDATE gericht SET vegan = FALSE WHERE vegan IS NULL;
    ALTER TABLE gericht ALTER COLUMN vegan SET NOT NULL;
    ```
    In Firebird muss das `ADD` committet sein, bevor das UPDATE die neue Spalte benutzen kann. `SET NOT NULL` gibt es in Firebird seit Version 3.0. Ältere Darstellungen sagen deshalb, NOT NULL lasse sich nicht nachträglich setzen.

    **b)**
    ```sql
    ALTER TABLE gericht ALTER COLUMN bezeichnung TYPE VARCHAR(60);
    ```
    Verlängern ist erlaubt. Verkürzen würde Firebird ablehnen.

    **c)** Firebird: `ALTER TABLE gericht ALTER COLUMN preis TO preis_eur;`
    PostgreSQL: `ALTER TABLE gericht RENAME COLUMN preis TO preis_eur;`

    **d)** Firebird prüft einen nachträglichen CHECK **nicht** gegen die vorhandenen Zeilen. Deshalb vorher nach Verstößen suchen und sie bereinigen:
    ```sql
    SELECT gericht_id, bezeichnung, preis_eur FROM gericht WHERE preis_eur <= 0;
    ALTER TABLE gericht ADD CONSTRAINT ck_gericht_preis CHECK (preis_eur > 0);
    ```
    (PostgreSQL prüft dagegen die vorhandenen Zeilen und lehnt den Constraint bei Verstößen ab.)

    **e)**
    ```sql
    ALTER TABLE gericht DROP kalorien;
    ```

    **f)** Firebird 3 benennt keine Spalte um, die in einem Constraint vorkommt. Nach d) steckt `preis` in `ck_gericht_preis`, das Umbenennen aus c) würde dann mit einem Fehler abgewiesen. In dieser Reihenfolge braucht man drei Schritte: `DROP CONSTRAINT ck_gericht_preis`, dann `ALTER COLUMN preis TO preis_eur`, dann den Constraint mit `preis_eur` neu anlegen. PostgreSQL passt den Constraint beim Umbenennen selbst an.
  rubric:
    - criterion: "a) Begründung: NOT NULL ohne Default scheitert an vorhandenen Zeilen"
      points: 1
    - criterion: "a) ADD vegan BOOLEAN DEFAULT FALSE NOT NULL oder Folge aus ADD mit DEFAULT, UPDATE der Altzeilen und SET NOT NULL"
      points: 2
    - criterion: "b) ALTER COLUMN … TYPE VARCHAR(60) korrekt"
      points: 1.5
    - criterion: "c) Firebird ALTER COLUMN … TO … und PostgreSQL RENAME COLUMN … TO …"
      points: 2
    - criterion: "d) Hinweis, dass Firebird Altdaten nicht prüft, mit Prüfabfrage"
      points: 1.5
    - criterion: "d) ADD CONSTRAINT ck_gericht_preis CHECK (preis_eur > 0) mit dem neuen Spaltennamen"
      points: 1
    - criterion: "e) DROP kalorien ohne COLUMN (Firebird) korrekt"
      points: 1
    - criterion: "f) Umbenennen einer Spalte im Constraint in Firebird 3 verboten; Constraint löschen, umbenennen, neu anlegen"
      points: 1
  space: lines:22
- id: t09-p008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [datentypen, dialekt, gleitkomma]
  type: explain
  difficulty: 1
  points: 7
  minutes: 7
  prompt: |-
    Für die Teilnehmerverwaltung eines Sprachkurs-Anbieters sollen folgende Angaben gespeichert werden. Wähle für jede einen passenden Firebird-3-Datentyp und begründe ihn in wenigen Worten.

    1. deutsche Postleitzahl
    2. Telefonnummer
    3. Kursgebühr in Euro
    4. Anzahl freier Plätze (höchstens 30)
    5. Geburtsdatum
    6. Beginn des Unterrichts am Tag (Uhrzeit)
    7. Zeitpunkt der Online-Anmeldung
    8. Newsletter abonniert ja/nein
    9. ausführliche Kursbeschreibung (mehrere Seiten Text)
    10. Ländercode nach ISO, immer zwei Buchstaben

    Gib zusätzlich an, bei welcher Angabe sich der Typ in PostgreSQL üblicherweise unterscheidet.

    Der Anbieter misst außerdem in seinen Räumen laufend die Lautstärke für eine Statistik. Welche Art von Zahltyp passt dafür, und warum wäre genau dieser Typ für Nr. 3 ungeeignet?
  solution: |-
    1. `CHAR(5)`: Code mit fester Länge, führende Null muss erhalten bleiben (keine Zahl)
    2. `VARCHAR(20)`: enthält `+`, Leerzeichen, führende Nullen, wird nicht berechnet
    3. `NUMERIC(7,2)`: exakte Festkommazahl für Geld, keine Gleitkommazahl
    4. `SMALLINT`: kleine ganze Zahl
    5. `DATE`: nur Datum
    6. `TIME`: nur Uhrzeit
    7. `TIMESTAMP`: Datum und Uhrzeit
    8. `BOOLEAN` (seit Firebird 3)
    9. `BLOB SUB_TYPE TEXT`: langer Text über die VARCHAR-Grenze hinaus
    10. `CHAR(2)`: immer genau zwei Zeichen

    PostgreSQL: Für die Kursbeschreibung nimmt man dort `TEXT` statt `BLOB SUB_TYPE TEXT`.
    Gleichwertig sind z. B. `DECIMAL` statt `NUMERIC` oder `INTEGER` statt `SMALLINT` bei Nr. 4.

    Lautstärke: ein **ungefährer** Typ wie `DOUBLE PRECISION` oder `FLOAT`. Er rechnet schnell und deckt große Bereiche ab, und bei Messwerten stört eine winzige Abweichung nicht. Für Geld ist er ungeeignet, weil er viele Dezimalbrüche (z. B. 0,10) nur näherungsweise speichert. Summen weichen dann um Rundungsreste vom exakten Betrag ab.
  rubric:
    - criterion: "Je Angabe passender Typ mit Begründung (je 0,5 Punkte)"
      points: 5
    - criterion: "PostgreSQL-Unterschied bei langem Text (TEXT) genannt"
      points: 1
    - criterion: "Ungefährer Typ (FLOAT/DOUBLE PRECISION) für Messwerte, Begründung Näherung statt exakter Dezimalwerte"
      points: 1
  space: lines:16
- id: t09-p009
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, set-default, set-null, cascade, no-action, on-update]
  type: define-example
  difficulty: 2
  points: 9
  minutes: 9
  prompt: |-
    a) Wähle ein **eigenes** kleines Beispiel aus einer Eltern- und einer Kindtabelle (je 2–3 Spalten, je 2–3 Zeilen) und gib die Zeilen an. Beschreibe für jede der vier Aktionen `NO ACTION`, `CASCADE`, `SET NULL` und `SET DEFAULT` bei `ON DELETE`, was nach dem Löschen einer bestimmten Elternzeile in beiden Tabellen steht.
    b) Was muss im Schema und in den Daten vorbereitet sein, damit `ON DELETE SET DEFAULT` gelingt? Schreibe die Definition der FK-Spalte, den FK-Constraint und die vorbereitende Anweisung in Firebird-3-Syntax.
    c) Was bewirken `ON UPDATE SET NULL` und `ON UPDATE SET DEFAULT` in deinem Beispiel, wenn sich der Schlüssel einer Elternzeile ändert? Was muss für `ON UPDATE SET NULL` an der FK-Spalte gelten?
  solution: |-
    Beispiel (andere gleichwertig): Ein Imkerverein verwaltet Bienenstände und Völker.

    ```
    stand(stand_id, ort):        (0, 'Sammelstand – noch offen'), (1, 'Obstwiese'), (2, 'Waldrand')
    volk(volk_id, name, stand_id): (10, 'Bienchen', 1), (11, 'Summer', 1), (12, 'Wabe', 2)
    ```
    Gelöscht wird `DELETE FROM stand WHERE stand_id = 1`.

    **a)**
    - `NO ACTION`: Das DELETE wird abgewiesen, weil die Völker 10 und 11 noch auf Stand 1 zeigen. Beide Tabellen bleiben unverändert.
    - `CASCADE`: Stand 1 und die Völker 10 und 11 werden gelöscht. Übrig sind die Stände 0 und 2 und das Volk 12.
    - `SET NULL`: Stand 1 wird gelöscht. Die Völker 10 und 11 bleiben mit `stand_id = NULL` (Spalte muss NULL-fähig sein).
    - `SET DEFAULT`: Stand 1 wird gelöscht. Die Völker 10 und 11 bekommen den Default `stand_id = 0` und zeigen auf den Sammelstand.

    **b)** Die FK-Spalte braucht einen Default, und die Elterntabelle braucht eine Platzhalter-Zeile mit genau diesem Schlüssel. Sonst verletzt der Default selbst den Fremdschlüssel, und das DELETE scheitert.
    ```sql
    INSERT INTO stand (stand_id, ort) VALUES (0, 'Sammelstand – noch offen');

    -- in CREATE TABLE volk:
    stand_id INTEGER DEFAULT 0 NOT NULL,
    CONSTRAINT fk_volk_stand FOREIGN KEY (stand_id)
        REFERENCES stand (stand_id) ON DELETE SET DEFAULT
    ```
    Ist `stand_id` eine Identity-Spalte, kollidiert die ausdrücklich eingefügte 0 nicht mit automatisch vergebenen Werten, weil diese bei 1 beginnen.

    **c)** Beispiel `UPDATE stand SET stand_id = 5 WHERE stand_id = 2`. Mit `ON UPDATE SET DEFAULT` (Definition aus b) bekommt Volk 12 den Wert 0. Der Stand heißt danach 5 und hat keine Völker mehr. Mit `ON UPDATE SET NULL` bekäme Volk 12 `stand_id = NULL`. Dafür muss die FK-Spalte aber NULL-fähig sein. Mit der Definition `NOT NULL` aus b) würde das UPDATE abgewiesen, und nichts ändert sich. (Mit `ON UPDATE CASCADE` würde Volk 12 stattdessen auf 5 zeigen.)
  rubric:
    - criterion: "a) eigenes Beispiel mit Eltern- und Kindtabelle und konkreten Zeilen"
      points: 1
    - criterion: "a) NO ACTION: Abweisung, keine Änderung"
      points: 1
    - criterion: "a) CASCADE: Elternzeile und zugehörige Kindzeilen gelöscht"
      points: 1
    - criterion: "a) SET NULL: Kindzeilen bleiben mit NULL"
      points: 1
    - criterion: "a) SET DEFAULT: Kindzeilen bleiben mit dem Default-Schlüssel"
      points: 1
    - criterion: "b) Default an der FK-Spalte, FK mit ON DELETE SET DEFAULT und Platzhalter-Elternzeile per INSERT"
      points: 2
    - criterion: "c) Wirkung von ON UPDATE SET NULL und ON UPDATE SET DEFAULT am Beispiel richtig beschrieben"
      points: 1.5
    - criterion: "c) für SET NULL muss die FK-Spalte NULL-fähig sein (sonst scheitert das UPDATE)"
      points: 0.5
  space: lines:24
- id: t09-p010
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [alter-table, primary-key, fremdschluessel, not-null, firebird]
  type: sql-write
  difficulty: 3
  points: 10
  minutes: 10
  prompt: |-
    Ein Tanzstudio hat zwei Tabellen aus einer Tabellenkalkulation übernommen, noch ganz ohne Schlüssel. Beide enthalten Daten.

    ```sql
    CREATE TABLE tanzkurs (
      kurs_nr INTEGER     NOT NULL,
      titel   VARCHAR(30) NOT NULL,
      stil    VARCHAR(20),
      preis   NUMERIC(6,2)
    );
    CREATE TABLE teilnahme (
      kurs_nr INTEGER     NOT NULL,
      person  VARCHAR(40) NOT NULL,
      bezahlt BOOLEAN
    );
    ```

    Zielstruktur:
    - `tanzkurs`: Primärschlüssel `kurs_nr`; die Spalte `stil` heißt künftig `tanzstil`; neue Pflichtspalte `max_paare` (ganze Zahl, Standard 10, auch für die vorhandenen Kurse); `preis` nie negativ (`ck_tanzkurs_preis`).
    - `teilnahme`: Primärschlüssel aus `kurs_nr` und `person`; `kurs_nr` verweist auf `tanzkurs`, wird ein Kurs gelöscht, verschwinden seine Teilnahmen; `bezahlt` wird Pflicht. Vorhandene NULL-Werte in `bezahlt` bedeuten „nicht bezahlt“.

    Die vorhandenen Daten sind sauber: In den künftigen Schlüsselspalten gibt es keine Duplikate, jede `kurs_nr` in `teilnahme` kommt auch in `tanzkurs` vor, und kein Preis ist negativ. Du arbeitest im Autocommit, d. h. jede Anweisung wird für sich festgeschrieben.

    a) Schreibe für jede Tabelle **eine** `ALTER TABLE`-Anweisung in Firebird-3-Syntax, die alle Änderungen dieser Tabelle auf einmal vornimmt. Ergänze nötige Vorbereitungen.
    b) In welcher Reihenfolge müssen die beiden `ALTER TABLE`-Anweisungen laufen? Begründe.
    c) Ein Kollege schlägt vor, in `teilnahme` statt des Primärschlüssels nur `UNIQUE (kurs_nr, person)` anzulegen. Nenne zwei Unterschiede zwischen beiden Lösungen.
  solution: |-
    **a)**
    ```sql
    ALTER TABLE tanzkurs
      ADD CONSTRAINT pk_tanzkurs PRIMARY KEY (kurs_nr),
      ALTER COLUMN stil TO tanzstil,
      ADD max_paare SMALLINT DEFAULT 10 NOT NULL,
      ADD CONSTRAINT ck_tanzkurs_preis CHECK (preis >= 0);

    UPDATE teilnahme SET bezahlt = FALSE WHERE bezahlt IS NULL;

    ALTER TABLE teilnahme
      ADD CONSTRAINT pk_teilnahme PRIMARY KEY (kurs_nr, person),
      ADD CONSTRAINT fk_teilnahme_kurs FOREIGN KEY (kurs_nr)
        REFERENCES tanzkurs (kurs_nr) ON DELETE CASCADE,
      ALTER COLUMN bezahlt SET NOT NULL;
    ```
    Die Teilbefehle stehen mit Komma in einer Anweisung, `ADD` steht ohne `COLUMN` und ohne Klammern. Umbenennen geht hier, weil `stil` in keinem Constraint vorkommt. Der Default bei `max_paare` füllt auch die vorhandenen Kurse. Das UPDATE muss vor `SET NOT NULL` laufen, weil Firebird dabei alle Zeilen prüft. Den neuen CHECK prüft Firebird nicht gegen die Altdaten. Laut Aufgabe sind sie sauber, sonst hätte man vorher mit `SELECT … WHERE preis < 0` gesucht. Der FK dagegen wird gegen die vorhandenen Zeilen geprüft. Gäbe es Teilnahmen zu unbekannten Kursen, müsste man diese vorher bereinigen.

    Ohne Autocommit gehört in Firebird nach jeder Anweisung ein `COMMIT`, denn dort lassen sich geänderte Objekte erst nach dem COMMIT benutzen. In PostgreSQL müsste das Umbenennen als eigene Anweisung `ALTER TABLE tanzkurs RENAME COLUMN stil TO tanzstil` stehen, weil sich `RENAME` dort nicht mit anderen Teilbefehlen kombinieren lässt. Constraint-Namen und der Typ von `max_paare` (`INTEGER` statt `SMALLINT`) dürfen abweichen. Mehrere einzelne `ALTER TABLE`-Anweisungen ergeben dieselbe Struktur, sind hier aber nicht gefragt.

    **b)** Erst `tanzkurs`, dann `teilnahme`. Ein Fremdschlüssel darf nur auf einen PRIMARY KEY oder UNIQUE zeigen. `pk_tanzkurs` muss also existieren, bevor `fk_teilnahme_kurs` angelegt wird.

    **c)** Zwei der folgenden Unterschiede:
    - Eine Tabelle hat höchstens einen PRIMARY KEY, aber beliebig viele UNIQUE-Constraints.
    - PRIMARY KEY verbietet NULL in den Schlüsselspalten. UNIQUE allein erlaubt NULL, hier schützt nur das vorhandene NOT NULL.
    - Der PK ist das Standardziel eines Fremdschlüssels ohne Spaltenliste (`REFERENCES teilnahme`) und markiert die Zeilenidentität. UNIQUE sichert nur einen Alternativschlüssel.
  rubric:
    - criterion: "a) je Tabelle eine ALTER TABLE-Anweisung mit Komma-getrennten Teilbefehlen, ADD ohne COLUMN und ohne Klammern"
      points: 1
    - criterion: "a) tanzkurs: ADD CONSTRAINT … PRIMARY KEY (kurs_nr)"
      points: 1
    - criterion: "a) tanzkurs: ALTER COLUMN stil TO tanzstil (Firebird-Form)"
      points: 1
    - criterion: "a) tanzkurs: ADD max_paare … DEFAULT 10 NOT NULL (DEFAULT vor NOT NULL) und CHECK preis >= 0"
      points: 1
    - criterion: "a) teilnahme: UPDATE der NULL-Werte in bezahlt vor SET NOT NULL"
      points: 1
    - criterion: "a) teilnahme: PK (kurs_nr, person) und FK auf tanzkurs mit ON DELETE CASCADE"
      points: 1.5
    - criterion: "a) teilnahme: ALTER COLUMN bezahlt SET NOT NULL"
      points: 1
    - criterion: "b) tanzkurs zuerst, weil das FK-Ziel PK/UNIQUE sein muss"
      points: 1
    - criterion: "c) zwei zutreffende Unterschiede PK ↔ UNIQUE (je 0,75 Punkte)"
      points: 1.5
  space: lines:22
