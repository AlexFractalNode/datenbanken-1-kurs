- id: t10-p001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [join, group-by, having, count-distinct, where-vs-having]
  type: sql-write
  difficulty: 2
  points: 8
  minutes: 8
  prompt: |-
    Eine Kletterhalle speichert ihre Mitglieder, Routen und Begehungen:

    - `mitglied(mitglied_id, name, tarif)`
    - `route(route_id, name, sektor, grad)` (`grad` ist eine ganze Zahl von 4 bis 9)
    - `begehung(mitglied_id, route_id, datum)` (`datum` ist vom Typ `DATE`; Fremdschlüssel auf `mitglied` und `route`; eine Route kann mehrfach begangen werden)

    a) Schreibe eine SQL-Abfrage (Firebird 3), die für jedes Mitglied, das **im Jahr 2025** mindestens **drei verschiedene** Routen im Sektor `'Nordwand'` begangen hat, den Namen, die Anzahl verschiedener Routen (`routen`) und den höchsten dabei gekletterten Grad (`hoechster_grad`) ausgibt. Sortiere nach `routen` absteigend, dann nach Name. (6 P)

    b) Begründe, warum die Bedingung zum Sektor ins `WHERE` gehört, die Bedingung „mindestens drei“ aber ins `HAVING`. (2 P)
  solution: |-
    a)

    ```sql
    SELECT m.name,
           COUNT(DISTINCT b.route_id) AS routen,
           MAX(r.grad) AS hoechster_grad
    FROM mitglied m
    JOIN begehung b ON b.mitglied_id = m.mitglied_id
    JOIN route r ON r.route_id = b.route_id
    WHERE r.sektor = 'Nordwand'
      AND b.datum BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY m.mitglied_id, m.name
    HAVING COUNT(DISTINCT b.route_id) >= 3
    ORDER BY routen DESC, m.name;
    ```

    Gleichwertig: `EXTRACT(YEAR FROM b.datum) = 2025` statt `BETWEEN`, ebenso die Komma-Schreibweise `FROM mitglied m, begehung b, route r WHERE b.mitglied_id = m.mitglied_id AND r.route_id = b.route_id AND …`. Ohne `DISTINCT` würden mehrfache Begehungen derselben Route mehrfach gezählt. `m.mitglied_id` gehört ins `GROUP BY`, damit zwei Mitglieder mit gleichem Namen nicht zusammenfallen.

    b) `WHERE` filtert **einzelne Zeilen**, bevor gruppiert wird. Ob eine Begehung im Sektor Nordwand liegt, lässt sich an jeder Zeile allein ablesen. „Mindestens drei Routen“ ist dagegen eine Eigenschaft einer **ganzen Gruppe** und braucht ein Aggregat. Aggregate gibt es erst nach dem `GROUP BY`, deshalb sind sie im `WHERE` verboten und gehören ins `HAVING`.
  rubric:
    - criterion: "Beide Joins über die richtigen Schlüsselspalten (mitglied–begehung–route); Komma-Schreibweise mit Bedingungen im WHERE gleichwertig"
      points: 2
    - criterion: "WHERE filtert Sektor und Jahr 2025 mit korrekten Grenzen"
      points: 1
    - criterion: "GROUP BY enthält m.mitglied_id und m.name (nur m.name allein: 0 P)"
      points: 1
    - criterion: "COUNT(DISTINCT route_id) und MAX(grad) korrekt verwendet"
      points: 1
    - criterion: "HAVING COUNT(DISTINCT …) >= 3"
      points: 0.5
    - criterion: "ORDER BY routen DESC, dann Name"
      points: 0.5
    - criterion: "b) Zeilenbedingung vor dem Gruppieren vs. Gruppenbedingung mit Aggregat danach; Aggregat im WHERE unzulässig"
      points: 2
  space: lines:22
- id: t10-p002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, korreliert, not-exists, having]
  type: sql-write
  difficulty: 3
  points: 9
  minutes: 10
  prompt: |-
    Eine Schulmensa verwaltet ihre Gerichte und Bestellungen:

    - `gericht(gericht_id, name, kategorie, preis)` (`kategorie` z. B. `'Hauptgericht'`, `'Dessert'`, `'Suppe'`)
    - `bestellung(bestellung_id, gericht_id, datum, menge)` (Fremdschlüssel `gericht_id`)

    Schreibe jeweils eine SQL-Abfrage (Firebird 3):

    a) Alle Gerichte, die **teurer sind als der Durchschnittspreis ihrer eigenen Kategorie**. Ausgabe: Name, Kategorie, Preis. (3 P)

    b) Alle Gerichte, die **im März 2025 kein einziges Mal** bestellt wurden. Verwende `NOT EXISTS`. Ausgabe: Name. (3 P)

    c) Alle Kategorien, in denen **jedes** Gericht mindestens 3,00 € kostet. Erkläre außerdem in einem Satz, warum `SELECT kategorie FROM gericht WHERE preis >= 3.00 GROUP BY kategorie` falsch ist. (3 P)
  solution: |-
    a) korrelierte Unterabfrage:

    ```sql
    SELECT g.name, g.kategorie, g.preis
    FROM gericht g
    WHERE g.preis > (SELECT AVG(g2.preis)
                     FROM gericht g2
                     WHERE g2.kategorie = g.kategorie);
    ```

    b) Die Datumsbedingung muss **in** der Unterabfrage stehen:

    ```sql
    SELECT g.name
    FROM gericht g
    WHERE NOT EXISTS (SELECT 1
                      FROM bestellung b
                      WHERE b.gericht_id = g.gericht_id
                        AND b.datum BETWEEN DATE '2025-03-01' AND DATE '2025-03-31');
    ```

    c)

    ```sql
    SELECT kategorie
    FROM gericht
    GROUP BY kategorie
    HAVING MIN(preis) >= 3.00;
    ```

    Gleichwertig: `SELECT DISTINCT g.kategorie FROM gericht g WHERE NOT EXISTS (SELECT 1 FROM gericht x WHERE x.kategorie = g.kategorie AND x.preis < 3.00)`.

    Die WHERE-Variante ist falsch, weil sie nur die billigen Gerichte entfernt. Jede Kategorie mit mindestens einem Gericht ab 3,00 € bleibt übrig, auch wenn sie daneben billigere Gerichte hat.
  rubric:
    - criterion: "a) Unterabfrage berechnet AVG und ist über die Kategorie mit der äußeren Zeile verknüpft"
      points: 2
    - criterion: "a) Vergleich mit > und verlangte Ausgabespalten"
      points: 1
    - criterion: "b) NOT EXISTS korreliert über gericht_id"
      points: 2
    - criterion: "b) Zeitraum März 2025 innerhalb der Unterabfrage mit korrekten Grenzen"
      points: 1
    - criterion: "c) Gruppierung nach Kategorie mit HAVING MIN(preis) >= 3.00 oder gleichwertiger NOT-EXISTS-Lösung"
      points: 2
    - criterion: "c) Begründung: WHERE entfernt nur einzelne billige Zeilen, nicht die ganze Kategorie"
      points: 1
  space: lines:28
- id: t10-p003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [ergebnis-vorhersagen, left-join, count, null-in-aggregaten, group-by-null]
  type: sql-predict
  difficulty: 2
  points: 8
  minutes: 8
  prompt: |-
    Ein Lauftreff erfasst Läuferinnen, Läufer und ihre Läufe. `zeit_min` ist NULL, wenn ein Lauf abgebrochen wurde.

    `laeufer`

    | lid | name | verein |
    | --- | --- | --- |
    | 1 | Anna | TSV |
    | 2 | Bodo | NULL |
    | 3 | Cleo | TSV |
    | 4 | Dana | LG Nord |

    `lauf`

    | lid | strecke_km | zeit_min |
    | --- | --- | --- |
    | 1 | 10 | 52 |
    | 1 | 5 | 24 |
    | 3 | 10 | NULL |
    | 4 | 21 | 118 |
    | 4 | 10 | 49 |

    Gib das vollständige Ergebnis jeder Abfrage als Tabelle an.

    **A** (4 P)

    ```sql
    SELECT l.name, COUNT(*) AS n_alle, COUNT(x.zeit_min) AS n_zeit,
           SUM(x.strecke_km) AS km
    FROM laeufer l
    LEFT JOIN lauf x ON x.lid = l.lid
    GROUP BY l.lid, l.name
    ORDER BY l.lid;
    ```

    **B** (2 P)

    ```sql
    SELECT verein, COUNT(*) AS anzahl
    FROM laeufer
    GROUP BY verein
    ORDER BY verein NULLS LAST;
    ```

    **C** (2 P) Gib das Ergebnis an und begründe, warum Bodo fehlt oder nicht fehlt.

    ```sql
    SELECT name FROM laeufer WHERE verein <> 'TSV';
    ```
  solution: |-
    **A**

    | name | n_alle | n_zeit | km |
    | --- | --- | --- | --- |
    | Anna | 2 | 2 | 15 |
    | Bodo | 1 | 0 | NULL |
    | Cleo | 1 | 0 | 10 |
    | Dana | 2 | 2 | 31 |

    Bodo hat keinen Lauf. Der LEFT JOIN erzeugt trotzdem **eine** Zeile mit NULL in allen `lauf`-Spalten. `COUNT(*)` zählt diese Zeile (1), `COUNT(x.zeit_min)` nicht (0), und `SUM` über nur NULL ergibt NULL, nicht 0. Cleos Lauf hat eine Strecke, aber keine Zeit.

    **B**

    | verein | anzahl |
    | --- | --- |
    | LG Nord | 1 |
    | TSV | 2 |
    | NULL | 1 |

    Beim Gruppieren bilden alle NULL-Werte **eine** gemeinsame Gruppe, obwohl `NULL = NULL` nicht wahr ist.

    **C**

    | name |
    | --- |
    | Dana |

    Für Bodo ergibt `NULL <> 'TSV'` UNKNOWN. `WHERE` behält nur Zeilen mit TRUE, Bodo fehlt also. Soll Bodo erscheinen: `WHERE verein <> 'TSV' OR verein IS NULL`.
  rubric:
    - criterion: "A: Zeile Anna korrekt (2, 2, 15)"
      points: 1
    - criterion: "A: Zeile Bodo korrekt (1, 0, NULL)"
      points: 1
    - criterion: "A: Zeile Cleo korrekt (1, 0, 10)"
      points: 1
    - criterion: "A: Zeile Dana korrekt (2, 2, 31)"
      points: 1
    - criterion: "B: Gruppenbildung korrekt, drei Gruppen inkl. NULL-Gruppe, alle Anzahlen richtig"
      points: 1
    - criterion: "B: Reihenfolge korrekt (LG Nord, TSV, NULL zuletzt)"
      points: 1
    - criterion: "C: Ergebnis nur Dana"
      points: 1
    - criterion: "C: Begründung über UNKNOWN, WHERE behält nur TRUE"
      points: 1
  space: lines:24
- id: t10-p004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [ergebnis-vorhersagen, join, not-exists, union, cross-join]
  type: sql-predict
  difficulty: 2
  points: 9
  minutes: 9
  prompt: |-
    Die Schach-AG einer Schule speichert Spielerinnen, Spieler und Partien. `ergebnis` ist `'W'` (Weiß gewinnt), `'S'` (Schwarz gewinnt) oder `'R'` (Remis).

    `spieler`

    | sid | name | jahrgang |
    | --- | --- | --- |
    | 1 | Ole | 2011 |
    | 2 | Pia | 2012 |
    | 3 | Rafi | 2011 |
    | 4 | Sina | 2013 |

    `partie`

    | pid | weiss | schwarz | ergebnis |
    | --- | --- | --- | --- |
    | 1 | 1 | 2 | W |
    | 2 | 2 | 3 | S |
    | 3 | 3 | 1 | R |
    | 4 | 1 | 3 | W |

    `weiss` und `schwarz` sind Fremdschlüssel auf `spieler.sid`. Bestimme die Ergebnisse; wo verlangt, begründe sie.

    a) (3 P)

    ```sql
    SELECT w.name AS weiss, s.name AS schwarz, p.ergebnis
    FROM partie p
    JOIN spieler w ON w.sid = p.weiss
    JOIN spieler s ON s.sid = p.schwarz
    WHERE p.ergebnis <> 'R'
    ORDER BY p.pid;
    ```

    b) Gib das Ergebnis an und begründe es in einem Satz. (2 P)

    ```sql
    SELECT sp.name
    FROM spieler sp
    WHERE NOT EXISTS (SELECT 1 FROM partie p WHERE p.weiss = sp.sid);
    ```

    c) Wie viele Zeilen liefert die folgende Abfrage, und wie viele wären es mit `UNION ALL`? (2 P)

    ```sql
    SELECT weiss AS sid FROM partie
    UNION
    SELECT schwarz FROM partie;
    ```

    d) Welche Zahl liefern die beiden Abfragen? (2 P)

    ```sql
    SELECT COUNT(*) FROM spieler, partie;
    SELECT COUNT(*) FROM spieler s, partie p WHERE s.jahrgang = 2011;
    ```
  solution: |-
    a)

    | weiss | schwarz | ergebnis |
    | --- | --- | --- |
    | Ole | Pia | W |
    | Pia | Rafi | S |
    | Ole | Rafi | W |

    Partie 3 ist ein Remis und fällt heraus. `spieler` wird zweimal mit verschiedenen Aliasen verbunden, einmal für Weiß, einmal für Schwarz.

    b) Nur **Sina**. Ole, Pia und Rafi haben mindestens einmal mit Weiß gespielt.

    c) `UNION` liefert **3** Zeilen (1, 2, 3), weil doppelte Zeilen entfernt werden. Sina (4) kommt in keiner Partie vor. Mit `UNION ALL` sind es **8** Zeilen (4 + 4).

    d) **16**: Die Komma-Schreibweise ohne Join-Bedingung ist ein kartesisches Produkt (4 · 4). **8**: Zwei Spieler haben Jahrgang 2011, jeder wird mit allen 4 Partien kombiniert. Die Bedingung verknüpft die Tabellen nicht miteinander.
  rubric:
    - criterion: "a) drei Zeilen, Remis-Partie fehlt"
      points: 1
    - criterion: "a) Namen für Weiß und Schwarz jeweils richtig zugeordnet, Reihenfolge nach pid"
      points: 2
    - criterion: "b) Ergebnis Sina"
      points: 1
    - criterion: "b) Begründung: alle anderen kommen als weiss vor"
      points: 1
    - criterion: "c) 3 Zeilen bei UNION"
      points: 1
    - criterion: "c) 8 Zeilen bei UNION ALL"
      points: 1
    - criterion: "d) 16 (kartesisches Produkt)"
      points: 1
    - criterion: "d) 8 (Filter ohne Verknüpfung)"
      points: 1
