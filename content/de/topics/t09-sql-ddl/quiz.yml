  question: "Welche Anweisung fügt in Firebird 3 der Tabelle `zimmer` zwei Spalten in **einer** Anweisung hinzu?"
  options:
    - text: "`ALTER TABLE zimmer ADD balkon BOOLEAN, ADD etage SMALLINT;`"
