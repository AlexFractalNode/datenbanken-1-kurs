    - text: "Die Sitzungen von Ada, weil sie beide Teleskope benutzt hat"
      correct: false
      explain: "„Hat beide benutzt“ betrifft zwei verschiedene Tupel. Das formuliert man mit ∩ über zwei Projektionen oder mit Division."
    - text: "Alle Sitzungen mit T2 oder T3"
      correct: false
      explain: "Das wäre die Bedingung mit ∨ statt ∧."
    - text: "Der Ausdruck ist ungültig."
      correct: false
      explain: "Er ist syntaktisch korrekt, nur ist die Bedingung für jedes Tupel falsch."
- id: t08-q008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [optimierung, umformung, vertiefung]
  type: multi
  question: |-
    (Vertiefung) Welche Umformungen sind **immer** äquivalent? (R, S beliebig, Bedingungen passend zu den Attributen; `Mitglied(mnr, name, stufe)`, `Sitzung(mnr, tnr, objekt)`)
  options:
    - text: "`σ_{a ∧ b}(R) = σ_{a}(σ_{b}(R))`"
      correct: true
      explain: "Kaskade der Selektion: Eine Konjunktion darf in hintereinander ausgeführte Selektionen zerlegt werden."
    - text: "`σ_{stufe='Profi'}(Mitglied ⋈ Sitzung) = σ_{stufe='Profi'}(Mitglied) ⋈ Sitzung`"
      correct: true
      explain: "Die Bedingung verwendet nur Attribute von Mitglied. Deshalb darf die Selektion vor den Join geschoben werden."
    - text: "`π_{X}(R − S) = π_{X}(R) − π_{X}(S)`"
      correct: false
      explain: "Gegenbeispiel R = {(a, 1)}, S = {(a, 2)}: links {(a)}, rechts ∅. π verteilt sich über ∪, nicht über −."
    - text: "`π_{name}(σ_{stufe='Profi'}(Mitglied)) = σ_{stufe='Profi'}(π_{name}(Mitglied))`"
      correct: false
      explain: "Rechts ist stufe nach der Projektion nicht mehr vorhanden, die Selektion ist dort nicht definiert. Tauschen darf man nur, wenn die Bedingungsattribute in der Projektionsliste stehen."
    - text: "`R ⋈ S = S ⋈ R`"
      correct: true
      explain: "Der natürliche Join ist kommutativ. Bei benannten Attributen spielt die Spaltenreihenfolge keine Rolle."
- id: t08-q009
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [sql, uebersetzung]
  type: single
  question: |-
    Musikschul-Datenbank, Tabelle `kurs(kurs_id, titel, niveau, …)`. Welche SQL-Anweisung entspricht **genau** `π_{titel}(σ_{niveau='Anfaenger'}(kurs))`?
  options:
    - text: "`SELECT DISTINCT titel FROM kurs WHERE niveau = 'Anfaenger';`"
      correct: true
      explain: "WHERE entspricht σ, die Spaltenliste π. DISTINCT sorgt für die Mengensemantik der Projektion."
    - text: "`SELECT titel FROM kurs WHERE niveau = 'Anfaenger';`"
      correct: false
      explain: "Ohne DISTINCT können gleiche Titel mehrfach erscheinen, denn titel ist kein Schlüssel. Das Ergebnis ist dann eine Multimenge."
    - text: "`SELECT * FROM kurs WHERE niveau = 'Anfaenger';`"
      correct: false
      explain: "Das ist nur die Selektion. Die Projektion auf titel fehlt."
    - text: "`SELECT DISTINCT niveau FROM kurs WHERE titel = 'Anfaenger';`"
      correct: false
      explain: "Index von σ und π vertauscht: Gefiltert wird nach niveau, ausgegeben wird titel."
