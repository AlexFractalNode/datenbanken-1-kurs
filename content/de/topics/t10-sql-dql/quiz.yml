- id: t10-q020
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, in, any, all, "null"]
  type: multi
  question: |-
    Eine Unterabfrage liefert die drei Werte 3, 8 und NULL. Welche Aussagen sind richtig?
  options:
    - text: "`5 IN (…)` ist UNKNOWN."
      correct: true
      explain: "IN entspricht `5 = 3 OR 5 = 8 OR 5 = NULL`, also FALSE OR FALSE OR UNKNOWN = UNKNOWN. Das Ergebnis ist nicht FALSE."
    - text: "`3 IN (…)` ist TRUE."
      correct: true
      explain: "Ein Treffer genügt: `3 = 3` ist TRUE, und TRUE entscheidet die OR-Kette."
    - text: "`10 > ALL (…)` ist TRUE, weil 10 größer als 3 und 8 ist."
      correct: false
      explain: "ALL entspricht einer AND-Kette: TRUE AND TRUE AND `10 > NULL` (UNKNOWN) = UNKNOWN. Im WHERE fiele die Zeile heraus."
    - text: "`1 > ALL (…)` ist FALSE."
      correct: true
      explain: "`1 > 3` ist FALSE, und FALSE entscheidet eine AND-Kette, egal was der NULL-Vergleich ergibt."
    - text: "`5 > ANY (…)` ist UNKNOWN, weil die Liste NULL enthält."
      correct: false
      explain: "`5 > 3` ist TRUE und entscheidet die OR-Kette. UNKNOWN entsteht nur, wenn kein Einzelvergleich entscheidet."
- id: t10-q021
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [funktionen, mathematik]
  type: single
  question: "Was liefern `ROUND(-2.5)`, `CEILING(-2.3)` und `FLOOR(-2.3)` (in dieser Reihenfolge) in Firebird 3?"
  options:
    - text: "−3, −2, −3"
      correct: true
      explain: "ROUND rundet eine genaue 5 vom Nullpunkt weg. CEILING geht zur nächsten ganzen Zahl Richtung +∞ (−2), FLOOR Richtung −∞ (−3)."
    - text: "−2, −3, −2"
      correct: false
      explain: "Hier wurden CEILING und FLOOR nach dem Betrag gedeutet. Bei negativen Zahlen ist −2 größer als −2,3, also das Ergebnis von CEILING."
    - text: "−2, −2, −3"
      correct: false
      explain: "CEILING und FLOOR stimmen, aber ROUND rundet −2,5 nicht Richtung +∞, sondern vom Nullpunkt weg auf −3."
    - text: "−3, −3, −2"
      correct: false
      explain: "Das vertauscht CEILING und FLOOR. CEILING liefert die kleinste ganze Zahl, die größer oder gleich dem Argument ist."
- id: t10-q022
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [like, literal, bezeichner]
  type: single
  question: "Welche Bedingung findet in Firebird 3 alle Zeilen, deren Spalte `ort` mit „Tal“ beginnt?"
  options:
    - text: "`ort LIKE 'Tal%'`"
      correct: true
      explain: "Zeichenketten stehen in einfachen Anführungszeichen, `%` steht für beliebig viele Zeichen."
    - text: "`ort LIKE \"Tal%\"`"
      correct: false
      explain: "Doppelte Anführungszeichen markieren in Firebird und PostgreSQL einen Bezeichner. Gesucht würde eine Spalte namens Tal%, und die Abfrage bricht mit einem Fehler ab."
    - text: "`ort LIKE 'Tal*'`"
      correct: false
      explain: "`*` ist in Firebird kein Platzhalter. Gefunden würde nur der Text „Tal*“ wörtlich. Der Stern als Platzhalter ist eine Konvention einzelner Desktop-Datenbanken."
    - text: "`ort = 'Tal%'`"
      correct: false
      explain: "Mit `=` gibt es keine Platzhalter; verglichen wird mit dem Text „Tal%“ wörtlich."
- id: t10-q023
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [extremwert, unterabfrage, first-skip]
  type: single
  question: |-
    Die Tabelle `produkt(name, preis)` enthält (Apfelsaft, 2.50), (Birnensaft, 3.10) und (Kirschsaft, 3.10). Verglichen werden
    (A) `SELECT name FROM produkt WHERE preis = (SELECT MAX(preis) FROM produkt)` und
    (B) `SELECT FIRST 1 name FROM produkt ORDER BY preis DESC`.
    Welche Aussage ist richtig?
  options:
    - text: "A liefert Birnensaft und Kirschsaft; B liefert nur eine der beiden Zeilen, und welche, ist nicht festgelegt."
      correct: true
      explain: "A gibt alle Zeilen mit dem Höchstwert aus. B schneidet nach einer Zeile ab; bei Gleichstand entscheidet nur eine weitere Sortierspalte, und die fehlt."
    - text: "Beide liefern Birnensaft und Kirschsaft."
      correct: false
      explain: "FIRST 1 begrenzt das Ergebnis auf genau eine Zeile, auch bei Gleichstand."
    - text: "Beide liefern nur Birnensaft, weil er zuerst eingefügt wurde."
      correct: false
      explain: "Die Einfügereihenfolge ist keine Sortierung. Ohne eindeutiges ORDER BY ist die Reihenfolge gleichwertiger Zeilen nicht festgelegt."
    - text: "A ist ein Fehler, weil MAX im WHERE verboten ist."
      correct: false
      explain: "Verboten ist ein Aggregat direkt im WHERE. In einer Unterabfrage ist MAX erlaubt; sie liefert hier den einzelnen Wert 3.10."
