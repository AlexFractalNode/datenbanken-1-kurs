  prompt: |-
    Eine Stadtteilbibliothek führt Medien (Medien-Nr., Titel, Jahr) mit den Subtypen Buch (Seiten) und Hörbuch (Laufzeit in min). Die Spezialisierung ist **disjunkt und partiell**: Zeitschriften sind nur Medien. Zusätzlich gibt es die rekursive 1:1-Beziehung „ist Fortsetzung von“ (jedes Medium hat höchstens einen direkten Vorgänger und höchstens eine direkte Fortsetzung).

    Beispieldaten:
    - Nr. 1 „Sturmflut“, 2019, Buch mit 320 Seiten
    - Nr. 2 „Nachtzug“, 2021, Hörbuch mit 410 min
    - Nr. 3 „Gartenjahr“, 2023, Zeitschrift
    - Nr. 4 „Funkenflug“, 2020, Buch mit 188 Seiten, Fortsetzung von Nr. 1

    a) Trage die vier Medien (ohne „ist Fortsetzung von“) in die Tabellen der **vertikalen Fragmentierung** (Class Table Inheritance) und der **Gesamttabelle** (Single Table Inheritance, Typ-Attribut `art` mit 'B', 'H', 'Z') ein. Zähle bei der Gesamttabelle die NULL-Werte.
    b) Trage die Daten in die Tabellen der **horizontalen Fragmentierung** (Concrete Table Inheritance) ein. Was fällt auf?
    c) Bilde „ist Fortsetzung von“ (i) als Fremdschlüssel in der Tabelle `medium` der vertikalen Variante und (ii) als eigene Relation ab. Gib jeweils die Tabelleninhalte für diese Spalte(n) an und vergleiche beide Lösungen kurz.
  solution: |-
    **a) Vertikal:**
    - medium(medien_nr, titel, jahr): (1, Sturmflut, 2019), (2, Nachtzug, 2021), (3, Gartenjahr, 2023), (4, Funkenflug, 2020)
    - buch(medien_nr → medium, seiten): (1, 320), (4, 188)
    - hoerbuch(medien_nr → medium, laufzeit_min): (2, 410)

    **Gesamttabelle:** medium(medien_nr, titel, jahr, art, seiten, laufzeit_min):
    - (1, Sturmflut, 2019, 'B', 320, NULL)
    - (2, Nachtzug, 2021, 'H', NULL, 410)
    - (3, Gartenjahr, 2023, 'Z', NULL, NULL)
    - (4, Funkenflug, 2020, 'B', 188, NULL)

    Das sind **5 NULL-Werte**.

    **b) Horizontal:**
    - buch(medien_nr, titel, jahr, seiten): (1, Sturmflut, 2019, 320), (4, Funkenflug, 2020, 188)
    - hoerbuch(medien_nr, titel, jahr, laufzeit_min): (2, Nachtzug, 2021, 410)

    Die Zeitschrift Nr. 3 hat **keinen Platz**, weil sie keinem Subtyp angehört (partiell). Man bräuchte eine zusätzliche Tabelle für Medien ohne Subtyp.

    **c)**
    (i) medium(…, vorgaenger_nr → medium) mit vorgaenger_nr UNIQUE: Nr. 1 → NULL, Nr. 2 → NULL, Nr. 3 → NULL, Nr. 4 → 1.
    (ii) fortsetzung(<u>medien_nr → medium</u>, vorgaenger_nr → medium) mit vorgaenger_nr NOT NULL UNIQUE: eine Zeile (4, 1).
    Vergleich: (i) kommt ohne Join aus, erzeugt hier aber 3 NULL-Werte. (ii) hat keine NULL-Werte und speichert nur vorhandene Fortsetzungen, braucht aber eine Tabelle und einen Join mehr.
  rubric:
    - criterion: "a) Vertikale Fragmentierung: alle Zeilen korrekt auf medium, buch, hoerbuch verteilt, Zeitschrift nur in medium"
      points: 2.5
    - criterion: "a) Gesamttabelle korrekt mit Typ-Attribut (2), 5 NULL-Werte gezählt (0,5)"
      points: 2.5
    - criterion: "b) Horizontale Tabellen korrekt gefüllt (1,5), fehlender Platz für die Zeitschrift erkannt und mit partiell begründet (1,5)"
      points: 3
    - criterion: "c) (i) FK-Spalte in medium mit UNIQUE und Inhalt (nur Nr. 4 gefüllt)"
      points: 1.5
    - criterion: "c) (ii) eigene Relation mit PK und UNIQUE, Inhalt (4, 1)"
      points: 1.5
    - criterion: "c) Vergleich: NULL-Werte (1) vs. zusätzliche Tabelle und Join (1)"
      points: 2
  space: box:250
- id: t06-p013
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [alter-table, rekursiv, m-n]
  type: erm-to-sql
  difficulty: 2
  points: 8
  minutes: 9
  prompt: |-
    Ein Wanderverein hat bereits die gefüllten Tabellen fuehrer(<u>fuehrer_nr</u> INTEGER, name) und tour(<u>tour_nr</u> INTEGER, titel, km). Das ER-Modell wird um zwei Beziehungen erweitert:

    1. Tourenführer:in 1 (0,n) —leitet— n (0,1) Tour
    2. Tour —setzt voraus— Tour, rekursiv m:n mit den Rollen „Tour“ und „Voraussetzung“ (z. B. setzt die Gletschertour die Klettersteigtour voraus)

    a) Ergänze Beziehung 1 in der bestehenden Tabelle mit `ALTER TABLE` (Firebird 3). Begründe, ob die neue Spalte `NOT NULL` sein kann.
    b) Bilde Beziehung 2 ab: Gib das Relationenschema in Kurzschreibweise und die `CREATE TABLE`-Anweisung an. Verhindere, dass eine Tour sich selbst voraussetzt.
    c) Warum lässt sich Beziehung 2 nicht wie Beziehung 1 als zusätzliche Spalte in `tour` abbilden?
  solution: |-
    **a)**
    ```sql
    ALTER TABLE tour ADD fuehrer_nr INTEGER;
    ALTER TABLE tour ADD CONSTRAINT fk_tour_fuehrer
      FOREIGN KEY (fuehrer_nr) REFERENCES fuehrer (fuehrer_nr);
    ```
    `NOT NULL` geht nicht. Fachlich hat Tour (0,1), eine Tour darf also ohne Leitung sein. Technisch sind außerdem alle vorhandenen Zeilen nach dem Hinzufügen NULL.

    **b)** tour_voraussetzung(<u>tour_nr → tour, voraussetzung_nr → tour</u>)
    ```sql
    CREATE TABLE tour_voraussetzung (
      tour_nr          INTEGER NOT NULL,
      voraussetzung_nr INTEGER NOT NULL,
      CONSTRAINT pk_tour_voraussetzung PRIMARY KEY (tour_nr, voraussetzung_nr),
      CONSTRAINT fk_tv_tour FOREIGN KEY (tour_nr) REFERENCES tour (tour_nr),
      CONSTRAINT fk_tv_voraussetzung FOREIGN KEY (voraussetzung_nr)
        REFERENCES tour (tour_nr),
      CONSTRAINT ck_tv_selbst CHECK (tour_nr <> voraussetzung_nr)
    );
    ```
    Beide FKs zeigen auf dieselbe Tabelle, die Spaltennamen folgen den Rollen.

    **c)** Eine Tour kann mehrere Voraussetzungen haben und Voraussetzung für mehrere Touren sein. Eine einzelne Spalte nimmt je Zeile nur **einen** Wert auf. Für m:n braucht man deshalb auch im rekursiven Fall eine Zwischentabelle.
  rubric:
    - criterion: "a) ADD-Spalte und ADD CONSTRAINT … FOREIGN KEY … REFERENCES korrekt"
      points: 2
    - criterion: "a) NOT NULL abgelehnt, mit (0,1) oder mit den bestehenden Zeilen begründet"
      points: 1
    - criterion: "b) Zwischentabelle mit zwei FKs auf tour, Rollennamen, PK aus beiden Spalten"
      points: 2.5
    - criterion: "b) CHECK gegen Selbstbezug, Syntax korrekt"
      points: 1
    - criterion: "c) Mehrere Werte je Zeile als Grund für die Zwischentabelle erklärt"
      points: 1.5
  space: lines:20
