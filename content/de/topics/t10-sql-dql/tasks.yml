- id: t10-p005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [dreiwertige-logik, "null", unknown, where, xor]
  type: 3vl
  difficulty: 2
  points: 10
  minutes: 10
  prompt: |-
    a) Vervollständige die Wahrheitstabellen der dreiwertigen Logik in SQL (T = TRUE, F = FALSE, U = UNKNOWN). XOR ist das exklusive Oder, definiert als `(a OR b) AND NOT (a AND b)`. (4 P)

    | AND | T | F | U |
    | --- | --- | --- | --- |
    | **T** | | | |
    | **F** | | | |
    | **U** | | | |

    | OR | T | F | U |
    | --- | --- | --- | --- |
    | **T** | | | |
    | **F** | | | |
    | **U** | | | |

    | XOR | T | F | U |
    | --- | --- | --- | --- |
    | **T** | | | |
    | **F** | | | |
    | **U** | | | |

    NOT T = ?, NOT F = ?, NOT U = ?

    b) Ein Gewächshaus speichert Messwerte. NULL bedeutet „kein Wert übertragen“.

    `sensor`

    | id | temp | status |
    | --- | --- | --- |
    | 1 | 18 | ok |
    | 2 | NULL | ok |
    | 3 | 25 | NULL |
    | 4 | NULL | NULL |
    | 5 | 31 | defekt |

    Welche `id`-Werte liefert `SELECT id FROM sensor WHERE …` mit der jeweiligen Bedingung? (4 P)

    1. `temp > 20 OR status = 'ok'`
    2. `NOT (temp > 20)`
    3. `temp > 20 AND status <> 'defekt'`
    4. `status IS NULL OR temp <= 20`

    c) Jemand behauptet: „`WHERE temp > 20` und `WHERE NOT (temp > 20)` liefern zusammen immer alle Zeilen.“ Nimm Stellung. Gib außerdem eine **dritte** WHERE-Bedingung an, die genau die Zeilen liefert, die in beiden Ergebnissen fehlen, und nenne deren `id`-Werte. (2 P)
  solution: |-
    a)

    | AND | T | F | U |
    | --- | --- | --- | --- |
    | **T** | T | F | U |
    | **F** | F | F | F |
    | **U** | U | F | U |

    | OR | T | F | U |
    | --- | --- | --- | --- |
    | **T** | T | T | T |
    | **F** | T | F | U |
    | **U** | T | U | U |

    | XOR | T | F | U |
    | --- | --- | --- | --- |
    | **T** | F | T | U |
    | **F** | T | F | U |
    | **U** | U | U | U |

    NOT T = F, NOT F = T, NOT U = U. Merkregel: F entscheidet AND, T entscheidet OR; sonst bleibt U ansteckend. Mit T = 1, U = ½, F = 0 ist AND das Minimum, OR das Maximum und NOT a = 1 − a. XOR ergibt sich durch Einsetzen in die Definition, z. B. U XOR T = (U OR T) AND NOT (U AND T) = T AND NOT U = T AND U = U. Sobald ein Operand U ist, bleibt XOR U.

    b) `WHERE` behält nur Zeilen, deren Bedingung **TRUE** ist; FALSE und UNKNOWN fallen heraus.

    1. id 1: F OR T = T; id 2: U OR T = T; id 3: T OR U = T; id 4: U OR U = U; id 5: T OR F = T → **1, 2, 3, 5**
    2. id 1: NOT F = T; ids 2 und 4: NOT U = U; ids 3 und 5: NOT T = F → **1**
    3. id 1: F; id 2: U AND T = U; id 3: T AND U = U; id 4: U; id 5: T AND F = F → **leeres Ergebnis**
    4. id 1: F OR T = T; id 2: F OR U = U; id 3: T; id 4: T; id 5: F OR F = F → **1, 3, 4**

    c) Falsch. Bei `temp` NULL sind beide Bedingungen UNKNOWN; die Zeilen 2 und 4 erscheinen in keinem der beiden Ergebnisse. Das Prinzip „p oder nicht p ist immer wahr“ gilt in der dreiwertigen Logik nicht. Die dritte Bedingung lautet `WHERE temp IS NULL` und liefert die `id`-Werte **2 und 4**. Erst alle drei Abfragen zusammen decken jede Zeile ab.
  rubric:
    - criterion: "a) AND-Tabelle: alle 9 Felder richtig 1 P, genau ein Fehler 0,5 P"
      points: 1
    - criterion: "a) OR-Tabelle: alle 9 Felder richtig 1 P, genau ein Fehler 0,5 P"
      points: 1
    - criterion: "a) XOR-Tabelle: alle 9 Felder richtig 1 P, genau ein Fehler 0,5 P"
      points: 1
    - criterion: "a) NOT-Werte richtig, insbesondere NOT U = U"
      points: 1
    - criterion: "b1) 1, 2, 3, 5"
      points: 1
    - criterion: "b2) nur 1"
      points: 1
    - criterion: "b3) leeres Ergebnis"
      points: 1
    - criterion: "b4) 1, 3, 4"
      points: 1
    - criterion: "c) Behauptung widerlegt mit Begründung über UNKNOWN bei NULL"
      points: 1
    - criterion: "c) dritte Bedingung `temp IS NULL` mit den id-Werten 2 und 4"
      points: 1
  space: lines:30
- id: t10-p006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [auswertungsreihenfolge, alias, having, ergebnisbegrenzung, darstellungsvarianten]
  type: explain
  difficulty: 2
  points: 8
  minutes: 8
  prompt: |-
    Gegeben ist folgende Abfrage auf die Mensa-Tabellen `gericht(gericht_id, name, kategorie, preis)` und `bestellung(bestellung_id, gericht_id, datum, menge)`:

    ```sql
    SELECT g.kategorie, SUM(b.menge) AS portionen
    FROM bestellung b
    JOIN gericht g ON g.gericht_id = b.gericht_id
    WHERE b.datum >= DATE '2025-03-01'
    GROUP BY g.kategorie
    HAVING SUM(b.menge) > 50
    ORDER BY portionen DESC;
    ```

    a) Bringe die Klauseln in die **logische Auswertungsreihenfolge** und beschreibe in je einem Halbsatz, was nach jedem Schritt vorliegt. Verwendest du eine andere Darstellung als die Standardsicht (SELECT direkt nach HAVING, danach ORDER BY), begründe kurz, was der Schritt SELECT in deiner Darstellung bedeutet. (4 P)

    b) Warum führt `WHERE portionen > 50` zu einem Fehler, `ORDER BY portionen` aber nicht? (2 P)

    c) Die Abfrage soll nur die **zwei** Kategorien mit den meisten Portionen liefern, z. B. mit `FETCH FIRST 2 ROWS ONLY` am Ende. An welcher Stelle der Auswertung wirkt diese Begrenzung, und warum ist das für das Ergebnis wichtig? (1 P)

    d) „Die Datenbank führt die Abfrage genau in dieser Reihenfolge aus.“ Stimmt das? (1 P)
  solution: |-
    a) Standardsicht (SQL-Standard, PostgreSQL):

    1. `FROM … JOIN`: Alle Bestellungen werden mit ihrem Gericht verbunden; es entsteht eine breite Zwischentabelle.
    2. `WHERE`: Nur Zeilen ab dem 1. März 2025 bleiben übrig.
    3. `GROUP BY`: Die verbliebenen Zeilen werden nach Kategorie zu Gruppen zusammengefasst.
    4. `HAVING`: Nur Gruppen mit mehr als 50 Portionen bleiben.
    5. `SELECT`: Je Gruppe werden Kategorie und Summe berechnet; erst jetzt entsteht der Alias `portionen`.
    6. `ORDER BY`: Das Ergebnis wird nach `portionen` absteigend sortiert.

    (Danach folgen ggf. `DISTINCT` direkt nach `SELECT` sowie die Ergebnisbegrenzung mit `FETCH`/`FIRST`.)

    Ebenfalls voll richtig sind, jeweils mit Begründung:
    - SELECT vor der Gruppierung (FROM → WHERE → SELECT → GROUP BY → HAVING → ORDER BY): SELECT steht dort für die Auswahl der Ausgabespalten; die Summe selbst kann erst nach dem Gruppieren berechnet werden.
    - SELECT ganz am Ende (FROM → WHERE → GROUP BY → HAVING → ORDER BY → SELECT): SELECT steht dort für die abschließende Projektion; sortiert wird auf der noch vollständigen Zwischentabelle.

    Das Ergebnis der Abfrage ist in allen Darstellungen dasselbe.

    b) `WHERE` wird in jeder Darstellung vor der SELECT-Liste ausgewertet und kennt den Alias `portionen` deshalb noch nicht. Im `ORDER BY` ist der Alias erlaubt: In der Standardsicht, weil ORDER BY nach SELECT kommt und der Alias dann existiert. In einer Darstellung mit SELECT am Ende, weil Firebird und PostgreSQL Aliase der SELECT-Liste im ORDER BY ausdrücklich zulassen.

    c) Nach `ORDER BY`, in der Standardsicht als letzter Schritt. Erst wird nach Portionen sortiert, dann werden die ersten zwei Zeilen genommen. Wirkte die Begrenzung vor dem Sortieren, käme irgendein Paar von Kategorien heraus und würde danach nur noch sortiert.

    d) Nein. Die Reihenfolge beschreibt nur die **Bedeutung** der Abfrage. Der Optimierer darf anders vorgehen (z. B. erst filtern, dann verbinden, oder einen Index nutzen), solange das Ergebnis gleich bleibt.
  rubric:
    - criterion: "a) FROM/JOIN zuerst, danach WHERE"
      points: 1
    - criterion: "a) GROUP BY vor HAVING, beide nach WHERE; ORDER BY nach HAVING"
      points: 1
    - criterion: "a) SELECT direkt nach HAVING (Standardsicht) oder eine andere Stelle mit passender Begründung (vor GROUP BY: Spaltenauswahl; am Ende: abschließende Projektion); ohne Begründung bei abweichender Darstellung 0 P"
      points: 1
    - criterion: "a) Zwischenergebnis je Schritt sinnvoll beschrieben"
      points: 1
    - criterion: "b) WHERE wird vor der SELECT-Liste ausgewertet, der Alias ist dort unbekannt"
      points: 1
    - criterion: "b) Alias im ORDER BY erlaubt, begründet passend zur eigenen Darstellung (ORDER BY nach SELECT oder ausdrückliche Erlaubnis der Systeme)"
      points: 1
    - criterion: "c) Begrenzung nach ORDER BY, mit Begründung"
      points: 1
    - criterion: "d) logische Bedeutung, nicht physischer Ablauf; Optimierer darf umordnen"
      points: 1
  space: lines:22
- id: t10-p007
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [inner-join, left-join, full-join, eigenes-beispiel]
  type: define-example
  difficulty: 1
  points: 8
  minutes: 8
  prompt: |-
    Erkläre den Unterschied zwischen **INNER JOIN** und **LEFT OUTER JOIN**. Lege dazu zwei **eigene** kleine Tabellen mit je drei Zeilen an (nicht aus dem Kurstext), bei denen mindestens eine Zeile links keinen Partner rechts hat. Gib für beide Join-Arten die Abfrage und das Ergebnis an. Nenne außerdem in einem Satz, wofür ein FULL OUTER JOIN zusätzlich gut ist.
  solution: |-
    Musterlösung (andere passende Beispiele gleichwertig): Sportverein

    `trainer(tid, name)`: (1, Ada), (2, Ben), (3, Cem)

    `gruppe(gid, bezeichnung, tid)`: (10, Bambini, 1), (11, Jugend, 1), (12, Senioren, NULL)

    ```sql
    SELECT t.name, g.bezeichnung
    FROM trainer t
    JOIN gruppe g ON g.tid = t.tid;
    ```

    INNER JOIN: (Ada, Bambini), (Ada, Jugend). Nur Paare mit erfüllter Bedingung; Ben und Cem fehlen, ebenso die Senioren.

    ```sql
    SELECT t.name, g.bezeichnung
    FROM trainer t
    LEFT JOIN gruppe g ON g.tid = t.tid;
    ```

    LEFT JOIN: (Ada, Bambini), (Ada, Jugend), (Ben, NULL), (Cem, NULL). Jede Zeile der linken Tabelle bleibt erhalten; fehlt ein Partner, werden die rechten Spalten mit NULL aufgefüllt.

    FULL OUTER JOIN behält zusätzlich die Zeilen der rechten Tabelle ohne Partner, hier also (NULL, Senioren).
  rubric:
    - criterion: "INNER JOIN korrekt erklärt (nur Paare mit erfüllter Bedingung)"
      points: 1
    - criterion: "LEFT JOIN korrekt erklärt (alle linken Zeilen, fehlender Partner mit NULL)"
      points: 1
    - criterion: "Eigene Tabellen mit je drei Zeilen, mindestens eine linke Zeile ohne Partner"
      points: 1
    - criterion: "INNER-JOIN-Abfrage syntaktisch korrekt, Join-Bedingung über den Fremdschlüssel"
      points: 1
    - criterion: "LEFT-JOIN-Abfrage syntaktisch korrekt, linke Tabelle richtig gewählt"
      points: 1
    - criterion: "Ergebnis des INNER JOIN zum eigenen Beispiel korrekt"
      points: 1
    - criterion: "Ergebnis des LEFT JOIN korrekt, inkl. NULL beim fehlenden Partner"
      points: 1
    - criterion: "FULL OUTER JOIN: zusätzlich rechte Zeilen ohne Partner"
      points: 1
