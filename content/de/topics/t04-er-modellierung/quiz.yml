  question: |-
    Ein Feuerwehrverein erfasst alle Mitglieder. Ein Mitglied kann Atemschutzgeräteträger:in, Maschinist:in oder beides sein. Fördermitglieder haben keine dieser Funktionen, werden aber auch als Mitglied gespeichert. Welche Eigenschaften hat die Spezialisierung von `Mitglied` in `Atemschutzgeräteträger:in` und `Maschinist:in`?
