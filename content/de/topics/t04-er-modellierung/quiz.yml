      correct: false
      explain: "Disjunkt würde „beides“ verbieten, total würde Fördermitglieder ohne Subtyp verbieten."
    - text: "überlappend und total"
      correct: false
      explain: "Total passt nicht, weil Fördermitglieder zu keinem Subtyp gehören."
    - text: "disjunkt und partiell"
      correct: false
      explain: "Disjunkt passt nicht, weil ein Mitglied beide Funktionen zugleich haben darf."
