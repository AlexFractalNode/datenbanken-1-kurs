- id: t07-p006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [anomalien, schluessel, 2nf, 3nf, notationsvariante]
  type: normalize
  difficulty: 3
  points: 22
  minutes: 23
  prompt: |-
    Die Kasse eines Clubs mit einem Konzertsaal führt diese Verkaufsliste:

    | TicketNr | KonzertNr | Veranstaltung | Reihe | Platz | Kategorie | Preis | Kundenmail |
    |---|---|---|---|---|---|---|---|
    | 9001 | K12 | Nachtfalter, 14.03.2027 | 1 | 4 | A | 48 € | lena@example.org |
    | 9002 | K12 | Nachtfalter, 14.03.2027 | 1 | 5 | A | 48 € | lena@example.org |
    | 9003 | K12 | Nachtfalter, 14.03.2027 | 6 | 2 | B | 32 € | jo@example.org |
    | 9004 | K15 | Die Brausepulver, 21.03.2027 | 1 | 4 | A | 48 € | jo@example.org |
    | 9005 | K15 | Die Brausepulver, 21.03.2027 | 9 | 11 | C | 22 € | ali@example.org |

    Geschäftsregeln:
    - Ein Ticket gilt für genau einen Platz (Reihe, Platz) bei genau einem Konzert und wird an genau eine Kundenmail verkauft.
    - Jeder Platz kann je Konzert nur einmal verkauft werden.
    - Ein Konzert hat eine Band und ein Datum. An einem Tag kann es mehrere Konzerte geben (Früh- und Spätshow); auch dieselbe Band kann am selben Tag zweimal spielen.
    - Die Kategorie hängt nur von der Reihe ab. Eine Kategorie umfasst mehrere Reihen (z. B. gehören die Reihen 1 bis 3 zu A). Jede Kategorie hat in der Saison einen festen Preis.
    - Die Kasse wertet die Verkäufe getrennt nach Band und nach Datum aus.

    a) Begründe, warum die Tabelle nicht in 1NF ist, und gib die Attribute der 1NF-Relation an.
    b) Nenne je ein konkretes Beispiel für eine Einfüge-, eine Änderungs- und eine Löschanomalie.
    c) Gib eine vollständige Menge nicht-trivialer FDs mit minimaler linker Seite an, aus der sich alle weiteren FDs herleiten lassen.
    d) Bestimme **alle** Schlüsselkandidaten mit Attributhülle und gib Primattribute und Nichtschlüsselattribute an.
    e) Ein Kollege meint: „TicketNr ist der Primärschlüssel und besteht nur aus einem Attribut, also ist die Tabelle nach der 1NF automatisch in 2NF.“ Ordne die Aussage ein: Unter welcher Voraussetzung bzw. nach welcher Fassung der 2NF-Definition stimmt sie, und was gilt hier nach der Definition über alle Schlüsselkandidaten? Überführe die Relation anschließend nach dieser Definition in die 2NF.
    f) Überführe in die 3NF und gib das Endergebnis mit Primärschlüsseln, Fremdschlüsseln und Alternativschlüssel an.
  solution: |-
    a) Die Spalte Veranstaltung ist nicht atomar, sie enthält Band und Datum. Weil die Kasse getrennt nach Band und nach Datum auswertet, müssen beide eigene Attribute sein. 1NF-Relation:
    Ticket(TicketNr, KonzertNr, Band, Datum, Reihe, Platz, Kategorie, Preis, Kundenmail)

    b) Anomalien (andere passende Beispiele gleichwertig):
    - Einfügeanomalie: Konzert K18 ist geplant, aber noch ist kein Ticket verkauft. Ohne TicketNr kann das Konzert nicht erfasst werden.
    - Änderungsanomalie: Der Preis der Kategorie A steigt auf 52 €. Er muss in drei Zeilen (9001, 9002, 9004) geändert werden.
    - Löschanomalie: Ticket 9005 wird storniert und gelöscht. Damit ist die einzige Angabe verloren, dass Reihe 9 zur Kategorie C gehört und C 22 € kostet.

    c) FDs:
    - TicketNr → KonzertNr, Reihe, Platz, Kundenmail
    - KonzertNr, Reihe, Platz → TicketNr
    - KonzertNr → Band, Datum
    - Reihe → Kategorie
    - Kategorie → Preis

    Nicht gültig sind z. B. Datum → KonzertNr und Band, Datum → KonzertNr (mehrere Konzerte am Tag, auch von derselben Band).

    d) TicketNr⁺: TicketNr → KonzertNr, Reihe, Platz, Kundenmail. KonzertNr → Band, Datum. Reihe → Kategorie. Kategorie → Preis. Ergebnis: alle Attribute.
    {KonzertNr, Reihe, Platz}⁺: zuerst TicketNr, danach wie oben alle Attribute. Kein Teil reicht: {KonzertNr, Reihe}⁺ = {KonzertNr, Reihe, Band, Datum, Kategorie, Preis} ohne Platz, TicketNr und Kundenmail, die übrigen Zweierkombinationen bestimmen noch weniger.
    Vollständigkeit: TicketNr lässt sich nur über {KonzertNr, Reihe, Platz} herleiten, und KonzertNr, Reihe und Platz lassen sich nur über TicketNr herleiten. Jeder Superschlüssel enthält also TicketNr oder alle drei.
    Schlüsselkandidaten: **{TicketNr}** und **{KonzertNr, Reihe, Platz}**.
    Primattribute: TicketNr, KonzertNr, Reihe, Platz. Nichtschlüsselattribute: Band, Datum, Kategorie, Preis, Kundenmail.

    e) Einordnung:
    - Die Aussage gibt eine verbreitete Faustregel wieder, die aus der Fassung der 2NF über den **Primärschlüssel** folgt. Sie stimmt, wenn der einattributige Primärschlüssel der **einzige** Schlüsselkandidat ist.
    - Hier gibt es aber einen zweiten, zusammengesetzten Schlüsselkandidaten {KonzertNr, Reihe, Platz}. Nach der Definition über **alle** Schlüsselkandidaten hängen Band und Datum schon von KonzertNr ab, Kategorie und Preis schon von Reihe, also jeweils von einem echten Teil dieses Kandidaten. Die Relation ist damit nicht in 2NF.
    - Wer die Primärschlüssel-Fassung verwendet, stuft die Relation als 2NF ein. Dieselben Abhängigkeiten erscheinen dann als transitive Abhängigkeiten (TicketNr → KonzertNr → Band, TicketNr → Reihe → Kategorie) und werden bei der 3NF ausgelagert. Das Endergebnis in f) ist in beiden Fassungen gleich.

    2NF nach der Definition über alle Schlüsselkandidaten:
    - Konzert(<u>KonzertNr</u>, Band, Datum)
    - Sitzreihe(<u>Reihe</u>, Kategorie, Preis)
    - Ticket(<u>TicketNr</u>, KonzertNr → Konzert, Reihe → Sitzreihe, Platz, Kundenmail)

    f) In Sitzreihe gilt Reihe → Kategorie → Preis, und laut Geschäftsregel Kategorie ↛ Reihe (eine Kategorie umfasst mehrere Reihen; die Beispieldaten allein könnten das nicht belegen). Kategorie ist Nichtschlüsselattribut, die Abhängigkeit ist transitiv. Konzert und Ticket sind bereits in 3NF: Ihre Determinanten sind Schlüsselkandidaten. Endergebnis:
    - Konzert(<u>KonzertNr</u>, Band, Datum)
    - Preisklasse(<u>Kategorie</u>, Preis)
    - Sitzreihe(<u>Reihe</u>, Kategorie → Preisklasse)
    - Ticket(<u>TicketNr</u>, KonzertNr → Konzert, Reihe → Sitzreihe, Platz, Kundenmail) mit Alternativschlüssel (KonzertNr, Reihe, Platz), z. B. als UNIQUE-Bedingung
  rubric:
    - criterion: "a) Nicht atomares Attribut Veranstaltung erkannt und mit der Auswertungsregel begründet"
      points: 1
    - criterion: "a) Veranstaltung in Band und Datum zerlegt, vollständige Attributliste"
      points: 1
    - criterion: "b) Je ein konkretes, zutreffendes Beispiel für Einfüge-, Änderungs- und Löschanomalie (je 1 Punkt)"
      points: 3
    - criterion: "c) FD KonzertNr, Reihe, Platz → TicketNr angegeben"
      points: 1
    - criterion: "c) Übrige vier FDs je 0,5 Punkte; je falsche FD (z. B. Band, Datum → KonzertNr) 0,5 Punkte Abzug, nicht unter 0"
      points: 2
    - criterion: "d) Beide Schlüsselkandidaten mit Hülle belegt"
      points: 2
    - criterion: "d) Vollständigkeit (keine weiteren Kandidaten) und Minimalität begründet"
      points: 1
    - criterion: "d) Primattribute und Nichtschlüsselattribute korrekt"
      points: 1
    - criterion: "e) Gültigkeitsbereich der Faustregel genannt (Primärschlüssel-Fassung bzw. Primärschlüssel einziger Schlüsselkandidat)"
      points: 1
    - criterion: "e) Nach der Definition über alle Schlüsselkandidaten: zweiter Kandidat und partielle Abhängigkeiten konkret benannt"
      points: 1
    - criterion: "e) Korrekte 2NF-Zerlegung (Konzert, Sitzreihe, Ticket je 1 Punkt)"
      points: 3
    - criterion: "f) Transitive Abhängigkeit Reihe → Kategorie → Preis benannt (1 Punkt) und mit der Regel Kategorie ↛ Reihe begründet (1 Punkt)"
      points: 2
    - criterion: "f) Endergebnis mit Primär- und Fremdschlüsseln (2 Punkte) und Alternativschlüssel (KonzertNr, Reihe, Platz) (1 Punkt)"
      points: 3
  space: lines:40
- id: t07-p007
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [2nf, 3nf, bcnf, schluessel, ausblick]
  type: explain
  difficulty: 2
  points: 8
  minutes: 8
  prompt: |-
    Bestimme für jede Relation die Schlüsselkandidaten und die **höchste** erfüllte Normalform (1NF, 2NF oder 3NF). Atomare Werte darfst du voraussetzen. Begründe jeweils mit einer konkreten FD. Bei Relation 4 beantwortest du zusätzlich eine Ausblick-Frage zur BCNF.

    1. Röstung(ChargeNr, Röstdatum, SortenNr, Sortenname) mit ChargeNr → Röstdatum, SortenNr und SortenNr → Sortenname
    2. Lagerbestand(LagerNr, SortenNr, Menge_kg, Lagerort) mit LagerNr, SortenNr → Menge_kg und LagerNr → Lagerort
    3. Rad(RadNr, Rahmennummer, Radtyp, Wartungsintervall) mit RadNr → Rahmennummer, Radtyp und Rahmennummer → RadNr und Radtyp → Wartungsintervall
    4. Einlass(KonzertNr, Tor, Ordner) mit KonzertNr, Tor → Ordner und KonzertNr, Ordner → Tor (je Konzert steht eine Ordner:in an genau einem Tor, bei anderen Konzerten auch an anderen). Ausblick: Ist die Relation auch in BCNF?
  solution: |-
    1. Schlüssel {ChargeNr}. Einattributig und einziger Kandidat, also 2NF. ChargeNr → SortenNr → Sortenname ist transitiv (SortenNr ist Nichtschlüsselattribut, SortenNr ↛ ChargeNr, weil eine Sorte oft geröstet wird). **Höchste Normalform: 2NF.**
    2. Schlüssel {LagerNr, SortenNr}. Lagerort hängt schon von LagerNr ab, einem echten Teil des Schlüssels (partiell). **Höchste Normalform: 1NF.**
    3. Schlüsselkandidaten {RadNr} und {Rahmennummer}. Beide einattributig, also 2NF. Rahmennummer → RadNr ist unproblematisch, weil Rahmennummer Schlüsselkandidat ist. Radtyp → Wartungsintervall verletzt aber die 3NF: Radtyp ist kein Superschlüssel, Wartungsintervall kein Primattribut (transitiv: RadNr → Radtyp → Wartungsintervall). **Höchste Normalform: 2NF.**
    4. Schlüsselkandidaten {KonzertNr, Tor} und {KonzertNr, Ordner}. Alle Attribute sind Primattribute, also **3NF**. Ausblick BCNF: Beide Determinanten sind Schlüsselkandidaten, also ist die Relation auch in **BCNF**. (Ordner → Tor gilt nicht, weil eine Ordner:in bei verschiedenen Konzerten an verschiedenen Toren stehen kann.)
  rubric:
    - criterion: "1. Schlüssel und 2NF mit transitiver Abhängigkeit über SortenNr begründet"
      points: 2
    - criterion: "2. Schlüssel und 1NF mit partieller Abhängigkeit LagerNr → Lagerort begründet"
      points: 2
    - criterion: "3. Beide Schlüsselkandidaten erkannt (0,5 Punkte), 2NF wegen einattributiger Kandidaten (0,5 Punkte), 3NF-Verstoß durch Radtyp → Wartungsintervall (1 Punkt)"
      points: 2
    - criterion: "4. Beide Schlüsselkandidaten erkannt und 3NF begründet (alle Attribute prim)"
      points: 1.5
    - criterion: "4. Ausblick: BCNF, weil beide Determinanten Schlüsselkandidaten sind"
      points: 0.5
  space: lines:16
- id: t07-p008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [anomalien]
  type: define-example
  difficulty: 1
  points: 7
  minutes: 7
  prompt: |-
    Erläutere **Einfüge-, Änderungs- und Löschanomalie** an einem **selbst gewählten** Beispiel (nicht aus dem Kurstext).
    a) Skizziere eine nicht normalisierte Tabelle (Spaltenköpfe und mindestens drei Datenzeilen), in der Redundanz auftritt.
    b) Beschreibe jede der drei Anomalien allgemein in einem Satz und zeige sie an einer konkreten Zeile oder einem konkreten Wert deiner Tabelle.
    c) Nenne die gemeinsame Ursache der Anomalien und gib an, in welche Relationen du die Tabelle zerlegen würdest.
  solution: |-
    Beispiel (Musterlösung, andere passende Szenarien gleichwertig): Eine Probenraumvermietung speichert alle Buchungen in einer Tabelle, Schlüssel ist BuchungNr.

    | BuchungNr | Datum | RaumNr | Raumgröße | BandNr | Bandname |
    |---|---|---|---|---|---|
    | 701 | 10.05.2027 | P1 | 20 m² | B4 | Funkenflug |
    | 702 | 11.05.2027 | P2 | 35 m² | B4 | Funkenflug |
    | 703 | 11.05.2027 | P1 | 20 m² | B9 | Mondschaukel |

    b) Anomalien:
    - **Einfügeanomalie:** Ein Sachverhalt lässt sich nicht speichern, solange ein anderer fehlt. Der neue Raum P3 (50 m²) kann nicht eingetragen werden, solange er nicht gebucht ist, denn ohne Buchung fehlt der Schlüsselwert BuchungNr.
    - **Änderungsanomalie:** Eine mehrfach gespeicherte Tatsache muss an allen Stellen geändert werden. Benennt sich B4 in „Funkenregen“ um, müssen die Zeilen 701 und 702 geändert werden; wird eine vergessen, hat B4 zwei Namen.
    - **Löschanomalie:** Beim Löschen gehen ungewollt andere Informationen verloren. Wird Buchung 702 storniert und gelöscht, ist die einzige Angabe verloren, dass P2 35 m² groß ist.

    c) Ursache: In einer Tabelle stecken mehrere voneinander unabhängige Sachverhalte (Buchung, Raum, Band). Dadurch werden Raum- und Banddaten redundant gespeichert. Zerlegung:
    - Raum(<u>RaumNr</u>, Raumgröße)
    - Band(<u>BandNr</u>, Bandname)
    - Buchung(<u>BuchungNr</u>, Datum, RaumNr → Raum, BandNr → Band)
  rubric:
    - criterion: "a) Eigene Tabelle mit mindestens drei Zeilen, in der dieselbe Tatsache mehrfach gespeichert ist"
      points: 1
    - criterion: "b) Einfügeanomalie allgemein beschrieben (0,5 Punkte) und an der eigenen Tabelle konkret gezeigt (1 Punkt)"
      points: 1.5
    - criterion: "b) Änderungsanomalie allgemein beschrieben (0,5 Punkte) und an der eigenen Tabelle konkret gezeigt (1 Punkt)"
      points: 1.5
    - criterion: "b) Löschanomalie allgemein beschrieben (0,5 Punkte) und an der eigenen Tabelle konkret gezeigt (1 Punkt)"
      points: 1.5
    - criterion: "c) Ursache genannt (mehrere unabhängige Sachverhalte in einer Tabelle, Redundanz)"
      points: 0.5
    - criterion: "c) Sinnvolle Zerlegung mit Primär- und Fremdschlüsseln"
      points: 1
  space: lines:18
- id: t07-p009
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [denormalisierung]
  type: define-example
  difficulty: 2
  points: 6
  minutes: 6
  prompt: |-
    Erläutere den Begriff **Denormalisierung**.
    a) Nenne zwei Gründe für eine Denormalisierung und zeige an einem **eigenen** Beispiel eine sinnvolle Denormalisierung (Schema vorher und nachher).
    b) Nenne drei Risiken bzw. Nachteile.
    c) Nenne eine Alternative, die Lesezugriffe beschleunigt, ohne das Schema redundant zu machen.
    d) In einer Rechnungsposition wird der Einzelpreis zum Kaufzeitpunkt gespeichert. Ist das eine Denormalisierung? Begründe kurz.
  solution: |-
    **Denormalisierung** ist die bewusste, begründete Rücknahme einer Normalisierung: Nachdem der Entwurf vollständig normalisiert ist, werden im physischen Entwurf an ausgewählten Stellen Daten wieder redundant gespeichert.

    a) Gründe (zwei genügen): schnellere Lesezugriffe, weil häufige Abfragen weniger Verbunde brauchen; vorberechnete Summen oder Zählwerte für Berichte und Auswertungen; einfachere Abfragen für reine Lese-Auswertungen.
    Beispiel (Musterlösung): Ein Kurierdienst hat normalisiert Tour(<u>TourNr</u>, Datum, KurierNr → Kurier) und Stopp(<u>TourNr → Tour, StoppNr</u>, Empfänger, Zone → Tarifzone). Die Disposition zeigt ständig die Zahl der Stopps je Tour. Nachher: Tour(<u>TourNr</u>, Datum, KurierNr → Kurier, AnzahlStopps). AnzahlStopps ist redundant, weil es sich aus Stopp zählen lässt.

    b) Risiken (drei genügen): Anomalien kehren zurück (AnzahlStopps passt nicht mehr zu den Stopps, wenn eine Anpassung vergessen wird); die Kopie muss synchron gehalten werden, z. B. per Trigger; Schreibzugriffe und Massenänderungen werden langsamer; mehr Speicherbedarf; zusätzlicher Dokumentationsaufwand.

    c) Ein Index auf Stopp(TourNr) oder eine materialisierte Sicht mit der Stoppzahl je Tour.

    d) Nein. Der Preis zum Kaufzeitpunkt ist eine eigene Tatsache: ArtikelNr → Kaufpreis gilt nicht, weil sich der Listenpreis später ändern kann. Es wird keine Normalform verletzt, auch wenn manche Darstellungen das als bewusste Abweichung bezeichnen.
  rubric:
    - criterion: "Definition: bewusste Rücknahme nach vollständiger Normalisierung, gezielte Redundanz"
      points: 1
    - criterion: "a) Zwei plausible Gründe (je 0,5 Punkte)"
      points: 1
    - criterion: "a) Eigenes Beispiel mit Schema vorher und nachher, redundantes Attribut erkennbar"
      points: 1.5
    - criterion: "b) Drei zutreffende Risiken (je 0,5 Punkte)"
      points: 1.5
    - criterion: "c) Index oder materialisierte Sicht genannt"
      points: 0.5
    - criterion: "d) Nein, weil der Preis zum Kaufzeitpunkt eine eigene Tatsache ist (FD zum aktuellen Preis gilt nicht)"
      points: 0.5
  space: lines:14
- id: t07-p010
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [volle-abhaengigkeit, partielle-abhaengigkeit, 2nf]
  type: define-example
  difficulty: 1
  points: 6
  minutes: 6
  prompt: |-
    Erkläre die Begriffe **voll funktionale Abhängigkeit** und **partielle Abhängigkeit**.
    Gib eine **eigene** Relation (nicht aus dem Kurstext) mit zusammengesetztem Schlüssel an, in der beide Arten vorkommen. Nenne je eine FD und begründe die Einstufung mit einer Geschäftsregel. Gib an, welche Normalform verletzt ist, und zerlege die Relation so, dass die partielle Abhängigkeit verschwindet.
  solution: |-
    - **Voll funktionale Abhängigkeit:** Y ist voll funktional abhängig von X, wenn X → Y gilt und keine echte Teilmenge von X schon Y bestimmt. (Manche Texte schreiben dafür einen Doppelpfeil X ⇒ Y; jede erklärte Schreibweise ist in Ordnung.)
    - **Partielle Abhängigkeit:** X → Y gilt, aber schon ein echter Teil von X bestimmt Y. Das setzt eine Determinante aus mindestens zwei Attributen voraus.

    Beispiel (Musterlösung, andere passende Beispiele gleichwertig): Ein Chor erfasst Probenbesuch(<u>SängerNr, ProbeNr</u>, Stimmlage, Probendatum, Anwesenheit).
    - SängerNr, ProbeNr → Anwesenheit ist **voll**: Eine Person besucht viele Proben, eine Probe hat viele Teilnehmende; erst beide zusammen legen fest, ob die Person bei dieser Probe da war.
    - SängerNr, ProbeNr → Stimmlage ist **partiell**: Jede Person singt in einer festen Stimmlage, also gilt schon SängerNr → Stimmlage. (Ebenso ProbeNr → Probendatum.)

    Verletzt ist die **2NF**: Ein Nichtschlüsselattribut hängt von einem echten Teil des Schlüssels ab.

    Zerlegung:
    - Sänger(<u>SängerNr</u>, Stimmlage)
    - Probe(<u>ProbeNr</u>, Probendatum)
    - Probenbesuch(<u>SängerNr → Sänger, ProbeNr → Probe</u>, Anwesenheit)
  rubric:
    - criterion: "Voll funktionale Abhängigkeit korrekt definiert (X → Y, keine echte Teilmenge von X bestimmt Y)"
      points: 1
    - criterion: "Partielle Abhängigkeit korrekt definiert (schon ein echter Teil der Determinante bestimmt Y)"
      points: 1
    - criterion: "Eigene Relation mit zusammengesetztem Schlüssel und konkreten FDs"
      points: 1
    - criterion: "Volle Abhängigkeit an einer FD begründet (warum kein Teil des Schlüssels reicht)"
      points: 0.5
    - criterion: "Partielle Abhängigkeit an einer FD begründet (welcher Teil reicht)"
      points: 0.5
    - criterion: "2NF als verletzte Normalform genannt"
      points: 0.5
    - criterion: "Korrekte Zerlegung mit Primär- und Fremdschlüsseln"
      points: 1.5
  space: lines:14
- id: t07-p011
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [2nf, 3nf, kurzaufgabe]
  type: normalize
  difficulty: 1
  points: 8
  minutes: 8
  prompt: |-
    Zwei Kurzaufgaben: jeweils Normalform definieren und eine kleine Tabelle in diese Normalform bringen.

    a) Definiere die **2NF**. Bringe die folgende Relation in die 2NF. Schlüssel ist {SortenNr, PrüferNr}. Jede Kaffeesorte hat einen festen Namen, und jede:r Prüfer:in vergibt je Sorte genau eine Note.

    | SortenNr | PrüferNr | Sortenname | Note |
    |---|---|---|---|
    | S12 | P1 | Bergnebel | 2 |
    | S12 | P2 | Bergnebel | 1 |
    | S15 | P1 | Rotblüte | 3 |

    b) Definiere die **3NF**. Bringe die folgende Relation in die 3NF. Schlüssel ist KurierNr. Jede Kurier:in ist genau einem Bezirk zugeteilt, und jeder Bezirk hat genau eine Bezirksleitung.

    | KurierNr | Kuriername | Bezirk | Bezirksleitung |
    |---|---|---|---|
    | K3 | Jana Pohl | Nord | Ruth Lenz |
    | K5 | Emil Sauer | Süd | Can Öztürk |
    | K8 | Lio Brandt | Nord | Ruth Lenz |
  solution: |-
    a) **2NF:** Die Relation ist in 1NF, und jedes Nichtschlüsselattribut hängt voll von jedem Schlüsselkandidaten ab, also nicht schon von einem echten Teil davon. (Die Fassung über den Primärschlüssel ist hier gleichwertig, weil {SortenNr, PrüferNr} der einzige Schlüsselkandidat ist.)
    Sortenname hängt schon von SortenNr allein ab (partiell), Note voll vom ganzen Schlüssel. Zerlegung:
    - Sorte(<u>SortenNr</u>, Sortenname) mit den Zeilen (S12, Bergnebel), (S15, Rotblüte)
    - Verkostung(<u>SortenNr → Sorte, PrüferNr</u>, Note) mit den Zeilen (S12, P1, 2), (S12, P2, 1), (S15, P1, 3)

    b) **3NF:** Die Relation ist in 2NF, und kein Nichtschlüsselattribut hängt transitiv von einem Schlüsselkandidaten ab. Gleichwertig: Für jede nicht-triviale FD X → A ist X Superschlüssel oder A Primattribut.
    Die Relation ist in 2NF (einattributiger, einziger Schlüssel). Es gilt KurierNr → Bezirk → Bezirksleitung; Bezirk ist Nichtschlüsselattribut, und Bezirk ↛ KurierNr (in Nord fahren K3 und K8). Bezirksleitung hängt also transitiv vom Schlüssel ab. Zerlegung:
    - Zustellbezirk(<u>Bezirk</u>, Bezirksleitung) mit den Zeilen (Nord, Ruth Lenz), (Süd, Can Öztürk)
    - Kurier(<u>KurierNr</u>, Kuriername, Bezirk → Zustellbezirk)
