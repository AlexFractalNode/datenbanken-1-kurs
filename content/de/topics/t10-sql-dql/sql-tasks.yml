- id: t10-s013
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [group-by, having, avg, min, null-in-aggregaten, dialekt]
  db: musikschule
  kind: query
  prompt: |-
    Erstelle eine Kursübersicht je **Instrumentenfamilie**, aber nur für Familien mit **mindestens zwei** Kursen. Berücksichtigt werden nur Kurse mit Instrument. Gib aus:
    - `familie`,
    - `kurse`: Anzahl der Kurse,
    - `durchschnitt`: durchschnittliche Monatsgebühr dieser Kurse, auf **zwei Nachkommastellen gerundet**,
    - `guenstigste_leihe`: die niedrigste Leihgebühr unter den Instrumenten dieser Kurse. Ist keines davon ausleihbar (Leihgebühr NULL), **soll hier NULL stehen, nicht 0**.

    Spalten: `familie`, `kurse`, `durchschnitt`, `guenstigste_leihe`.
  solution: |-
    SELECT i.familie,
           COUNT(*) AS kurse,
           CAST(AVG(CAST(k.gebuehr_monat AS NUMERIC(12,4))) AS NUMERIC(12,2)) AS durchschnitt,
           MIN(i.leihgebuehr) AS guenstigste_leihe
    FROM kurs k
    JOIN instrument i ON i.instrument_id = k.instrument_id
    GROUP BY i.familie
    HAVING COUNT(*) >= 2;
  ordered: false
  dialect_note: "Firebird schneidet `AVG` über `NUMERIC(8,2)` auf zwei Stellen ab, PostgreSQL rechnet genau. Erst auf vier Stellen rechnen und dann auf `NUMERIC(12,2)` umwandeln liefert in beiden Systemen denselben gerundeten Wert. Gleichwertig ist `ROUND(AVG(k.gebuehr_monat * 1.0000), 2)`. Nicht gleichwertig sind in Firebird `ROUND(AVG(k.gebuehr_monat), 2)` oder ein einfacher CAST: AVG hat dort schon auf zwei Stellen abgeschnitten, und Runden danach ändert nichts mehr (Familie Blas: 54.66 statt 54.67). In PostgreSQL wären beide Formen richtig."
  hints:
    - "`MIN`, `SUM` und `AVG` übergehen NULL-Werte; besteht eine Gruppe nur aus NULL, ist das Ergebnis NULL. Genau das ist hier verlangt, also kein `COALESCE`."
    - "Kurse ohne Instrument (Musiktheorie, Chor) fallen durch den inneren Join heraus."
    - "„Mindestens zwei Kurse“ ist eine Bedingung an die Gruppe und gehört ins HAVING."
  paper_mode: write
- id: t10-s014
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [inner-join, mehrfach-join, alias]
  db: musikschule
  kind: query
  prompt: |-
    Teilnehmerliste für den Kurs mit dem Titel `'Violine Grundkurs'`: Gib für jede Belegung Vor- und Nachname der Schülerin bzw. des Schülers, den Kurstitel und den Nachnamen der unterrichtenden Lehrkraft (`lehrkraft_name`) aus. Sortiere nach Nachname der Schülerin bzw. des Schülers, bei Gleichstand nach Personen-ID.

    Spalten: `vorname`, `nachname`, `titel`, `lehrkraft_name`.
  solution: |-
    SELECT ps.vorname, ps.nachname, k.titel, pl.nachname AS lehrkraft_name
    FROM belegung b
    JOIN kurs k ON k.kurs_id = b.kurs_id
    JOIN person ps ON ps.person_id = b.schueler_id
    JOIN person pl ON pl.person_id = k.lehrkraft_id
    WHERE k.titel = 'Violine Grundkurs'
    ORDER BY ps.nachname, ps.person_id;
  ordered: true
  hints:
    - "Die Namen stehen in `person`, sowohl für Schüler als auch für Lehrkräfte."
    - "Du brauchst `person` deshalb zweimal, mit zwei verschiedenen Aliasen."
  paper_mode: write
