- id: e02-p014
  topic: t13
  status: reviewed
  reviews: [fach, aufgaben, leak]
  sources:
    - id: wp-java-database-connectivity
      ref: "Einleitung (einheitliche Java-API, Treiber je DBMS)"
    - id: wp-open-database-connectivity
      ref: "Einleitung (standardisierte Schnittstelle, Treiber je DBMS)"
  tags: [jdbc, treiber, schnittstelle, dbms-wechsel]
  type: explain
  difficulty: 1
  points: 2
  minutes: 2
  prompt: |-
    Die Einlass-App von „Klangwerk“ ist in Java geschrieben und greift über JDBC auf die Firebird-Datenbank zu (`Connection`, `PreparedStatement`, `ResultSet`). Später soll die Datenbank auf PostgreSQL umziehen.

    a) Welche Aufgabe hat der JDBC-Treiber? (0,5 P)

    b) Nenne zwei Dinge, die an der App für den Umzug geändert werden müssen, und eines, das bleiben kann. (1,5 P)
  solution: |-
    **a)** Der Treiber setzt die einheitlichen JDBC-Aufrufe in die Kommunikation mit einem bestimmten DBMS um. Jedes DBMS hat seinen eigenen Treiber, die Anwendung programmiert nur gegen die gemeinsame API.

    **b)**
    - **Ändern** (zwei davon):
      - den Treiber, also den Firebird-JDBC-Treiber durch den PostgreSQL-JDBC-Treiber ersetzen,
      - die Verbindungsangaben (URL, ggf. Benutzer und Passwort),
      - dialektspezifisches SQL im Programmcode, z. B. `SELECT FIRST 10 …` durch `… FETCH FIRST 10 ROWS ONLY` bzw. `LIMIT 10` ersetzen.
    - **Bleiben** (eines davon):
      - der Programmcode gegen die JDBC-API (Verbindung aufbauen, `PreparedStatement` mit `?`-Platzhaltern, Ergebnis über `ResultSet` lesen),
      - Anweisungen in Standard-SQL, das beide Systeme verstehen.
  rubric:
    - criterion: "a) Treiber übersetzt die einheitliche API für ein bestimmtes DBMS, ein Treiber je DBMS"
      points: 0.5
    - criterion: "b) zwei zutreffende Änderungen, z. B. Treiber, Verbindungs-URL, dialektspezifisches SQL (je 0,5)"
      points: 1
    - criterion: "b) etwas, das bleibt: Code gegen die JDBC-API bzw. Standard-SQL"
      points: 0.5
  space: lines:8
