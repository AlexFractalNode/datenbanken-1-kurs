    - "Die Verbindung lautet: Vertreter in v1 = vertretene Lehrkraft in v2."
  paper_mode: predict
- id: t10-s019
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [union, mengenoperationen, order-by]
  db: musikschule
  kind: query
  prompt: |-
    Erstelle eine Liste aller Personen aus **Talhausen** mit ihrer Rolle: Lehrkräfte mit der Rolle `'Lehrkraft'`, Schülerinnen und Schüler mit der Rolle `'Schüler'`. Wer beides ist, erscheint zweimal. Kombiniere zwei Abfragen mit `UNION` und sortiere nach Nachname, Vorname und Rolle.

    Spalten: `nachname`, `vorname`, `rolle`.
  solution: |-
    SELECT p.nachname, p.vorname, 'Lehrkraft' AS rolle
    FROM person p
    JOIN lehrkraft l ON l.person_id = p.person_id
    WHERE p.ort = 'Talhausen'
    UNION
    SELECT p.nachname, p.vorname, 'Schüler'
    FROM person p
    JOIN schueler s ON s.person_id = p.person_id
    WHERE p.ort = 'Talhausen'
    ORDER BY 1, 2, 3;
  ordered: true
  dialect_note: "Spaltennummern im ORDER BY einer UNION sind sicher und portabel. PostgreSQL erlaubt auch die Spaltennamen der ersten Teilabfrage. Firebird 3 lehnt Namen und Aliase dort ab und akzeptiert nur Spaltennummern."
  hints:
    - "Beide Teilabfragen brauchen gleich viele Spalten mit verträglichen Typen."
    - "Die Spaltennamen kommen aus der ersten Teilabfrage."
    - "Das ORDER BY steht einmal ganz am Ende und gilt für das Gesamtergebnis. `UNION` entfernt gleiche Zeilen: Gäbe es zwei verschiedene Personen mit gleichem Namen und gleicher Rolle, erschienen sie nur einmal. Wer das ausschließen will, gibt zusätzlich `person_id` aus."
  paper_mode: write
- id: t10-s020
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [unterabfrage, in]
  db: musikschule
  kind: query
  prompt: |-
    Wer hat zurzeit ein Instrument ausgeliehen, das **noch nicht zurückgegeben** wurde? Jede Person soll **nur einmal** erscheinen, auch wenn sie mehrere offene Ausleihen hat. Löse die Aufgabe mit einer Unterabfrage und `IN`.

    Spalten: `person_id`, `vorname`, `nachname`.
  solution: |-
    SELECT p.person_id, p.vorname, p.nachname
    FROM person p
    WHERE p.person_id IN (SELECT a.schueler_id
                          FROM ausleihe a
