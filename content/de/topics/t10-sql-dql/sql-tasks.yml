- id: t10-s010
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [stringfunktionen, substring, position, konkatenation]
  db: firma
  kind: query
  prompt: |-
    Für neue Türschilder der Abteilung mit `abteilung_id = 4` werden zwei Texte gebraucht:
    - `kuerzel`: erster Buchstabe des Vornamens, dann Punkt und Leerzeichen, dann der Nachname in Großbuchstaben (z. B. `X. MUSTER`),
    - `benutzer`: der Teil der E-Mail-Adresse **vor** dem `@`.

    Sortiere nach `mitarbeiter_id`. Spalten: `mitarbeiter_id`, `kuerzel`, `benutzer`.
  solution: |-
    SELECT mitarbeiter_id,
           SUBSTRING(vorname FROM 1 FOR 1) || '. ' || UPPER(nachname) AS kuerzel,
           SUBSTRING(email FROM 1 FOR POSITION('@' IN email) - 1) AS benutzer
    FROM mitarbeiter
    WHERE abteilung_id = 4
    ORDER BY mitarbeiter_id;
  ordered: true
  hints:
    - "`||` hängt Zeichenketten aneinander."
    - "`POSITION('@' IN email)` liefert die Stelle des @-Zeichens; davor liegen eine Stelle weniger Zeichen. Fehlt das `@`, liefert POSITION 0, die Länge wäre −1 und die Abfrage bräche ab. Hier hat jede Adresse ein `@`."
    - "`SUBSTRING(x FROM start FOR laenge)` funktioniert in Firebird und PostgreSQL gleich."
  paper_mode: write
- id: t10-s011
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [datumsfunktionen, extract, join, order-by]
  db: musikschule
  kind: query
  prompt: |-
    Welche **abgeschlossenen** Ausleihen dauerten **mehr als 100 Tage**? Gib die Ausleih-ID, die Instrumentbezeichnung, die Inventarnummer ohne Leerzeichen am Ende, die Dauer in Tagen (`rueckgabe` minus `ausgabe`) als `tage` und das Rückgabejahr als `rueckgabe_jahr` aus. Längste Ausleihe zuerst, bei Gleichstand nach Ausleih-ID.

    Spalten: `ausleihe_id`, `bezeichnung`, `inventar_nr`, `tage`, `rueckgabe_jahr`.
  solution: |-
    SELECT a.ausleihe_id, i.bezeichnung, TRIM(a.inventar_nr) AS inventar_nr,
           a.rueckgabe - a.ausgabe AS tage,
           EXTRACT(YEAR FROM a.rueckgabe) AS rueckgabe_jahr
    FROM ausleihe a
    JOIN instrument i ON i.instrument_id = a.instrument_id
    WHERE a.rueckgabe IS NOT NULL
      AND a.rueckgabe - a.ausgabe > 100
    ORDER BY tage DESC, a.ausleihe_id;
  ordered: true
  dialect_note: "Die Differenz zweier DATE-Werte ergibt in beiden Systemen die Zahl der Tage. Firebird kennt zusätzlich `DATEDIFF(DAY FROM a TO b)`, PostgreSQL nicht."
  hints:
    - "Datum minus Datum ergibt die Anzahl der Tage."
    - "Im WHERE ist der Alias `tage` noch unbekannt; schreibe den Ausdruck dort aus. Im ORDER BY darfst du den Alias verwenden."
    - "`inventar_nr` ist `CHAR(8)` und wird mit Leerzeichen aufgefüllt; `TRIM` entfernt sie."
  paper_mode: write
- id: t10-s012
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [group-by, having, where-vs-having, count]
  db: musikschule
  kind: query
  prompt: |-
    Welche Kurse haben mindestens **fünf aktive** Belegungen? Aktiv ist eine Belegung ohne Abmeldedatum. Gib Kurs-ID, Titel und die Anzahl aktiver Belegungen als `aktive` aus.

    Spalten: `kurs_id`, `titel`, `aktive`.
  solution: |-
    SELECT k.kurs_id, k.titel, COUNT(*) AS aktive
    FROM kurs k
    JOIN belegung b ON b.kurs_id = k.kurs_id
    WHERE b.abgemeldet_am IS NULL
    GROUP BY k.kurs_id, k.titel
    HAVING COUNT(*) >= 5;
  ordered: false
  hints:
    - "Die Bedingung „ohne Abmeldung“ betrifft einzelne Zeilen und gehört deshalb ins WHERE."
    - "Die Bedingung „mindestens fünf“ betrifft Gruppen und gehört ins HAVING."
    - "Jede nicht aggregierte Spalte der SELECT-Liste muss im GROUP BY stehen."
