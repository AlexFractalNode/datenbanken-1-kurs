  type: single
  question: |-
    In **MC-Notation** ist gegeben: `Landkreis —1— umfasst —m— Gemeinde`. Welche (min,max)-Angaben entsprechen dem?
  options:
    - text: "Landkreis (1,n), Gemeinde (1,1)"
      correct: true
      explain: "In MC heißt m „mindestens eins“: Jeder Landkreis umfasst mindestens eine Gemeinde, also (1,n) beim Landkreis. Die 1 bedeutet genau eins: Jede Gemeinde liegt in genau einem Landkreis, also (1,1)."
    - text: "Landkreis (0,*), Gemeinde (0,1)"
      correct: false
      explain: "Das wäre die Lesart „überall min = 0“ mancher Quellen für reine Chen-Angaben. Hier ist ausdrücklich die MC-Notation gegeben, deren Symbole Untergrenzen tragen."
    - text: "Landkreis (1,1), Gemeinde (1,*)"
      correct: false
      explain: "Die Angaben wurden nicht auf die Gegenseite getauscht."
    - text: "Landkreis (0,*), Gemeinde (1,1)"
      correct: false
      explain: "So läse man eine reine Chen-Angabe 1:n nach Kursstandard. In der MC-Notation bedeutet ein unmarkiertes m aber mindestens eins; für „auch keine Gemeinde“ müsste mc stehen."
