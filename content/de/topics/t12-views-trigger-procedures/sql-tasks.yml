  prompt: |-
    Änderungen am Instrumentenbestand sollen lückenlos protokolliert werden, mit Aktionsart und Leihgebühr vorher und nachher.

    1. Lege die Tabelle `instrument_log` an: `log_id` (Identity, Primärschlüssel), `aktion` (ein Zeichen, Pflicht, nur `'I'`, `'U'` oder `'D'`), `instrument_id`, `bezeichnung` (bis 30 Zeichen), `gebuehr_alt`, `gebuehr_neu` (je `NUMERIC(8,2)`) und `geaendert_am` (Zeitstempel, Pflicht, Standard jetzt).
    2. Schreibe **einen** Trigger `trg_instrument_log` für `instrument`, der nach INSERT, UPDATE und DELETE je Zeile einen Eintrag schreibt. Bei INSERT bleibt `gebuehr_alt` leer, bei DELETE `gebuehr_neu`.
    3. Teste mit drei Änderungen: Das Saxophon (Familie Blas, Leihgebühr 16,00) kommt dazu, die Leihgebühr des Violoncellos wird von 25,00 auf 18,00 gesenkt, und die Ukulele (Leihgebühr 6,00) wird aus dem Bestand gelöscht.

    Sage vorher, was diese Abfrage liefert (`mit_id` ist 1, wenn ein Schlüssel protokolliert wurde):

    ```sql
    SELECT aktion, bezeichnung, gebuehr_alt, gebuehr_neu,
           CASE WHEN instrument_id IS NULL THEN 0 ELSE 1 END AS mit_id
    FROM instrument_log
    ```

    Die Abfrage vergleicht nur das Ergebnis. Ein **einziger** Trigger mit Ereignisunterscheidung über `INSERTING`, `UPDATING` und `DELETING` gehört zur Musterlösung.
  solution: |-
    CREATE TABLE instrument_log (
        log_id        INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        aktion        CHAR(1) NOT NULL CHECK (aktion IN ('I', 'U', 'D')),
        instrument_id INTEGER,
        bezeichnung   VARCHAR(30),
        gebuehr_alt   NUMERIC(8,2),
        gebuehr_neu   NUMERIC(8,2),
        geaendert_am  TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL
    );

    SET TERM ^ ;

    CREATE TRIGGER trg_instrument_log FOR instrument
    ACTIVE AFTER INSERT OR UPDATE OR DELETE POSITION 0
    AS
    BEGIN
      IF (INSERTING) THEN
        INSERT INTO instrument_log (aktion, instrument_id, bezeichnung, gebuehr_alt, gebuehr_neu)
        VALUES ('I', NEW.instrument_id, NEW.bezeichnung, NULL, NEW.leihgebuehr);
      ELSE IF (UPDATING) THEN
        INSERT INTO instrument_log (aktion, instrument_id, bezeichnung, gebuehr_alt, gebuehr_neu)
        VALUES ('U', NEW.instrument_id, NEW.bezeichnung, OLD.leihgebuehr, NEW.leihgebuehr);
      ELSE
        INSERT INTO instrument_log (aktion, instrument_id, bezeichnung, gebuehr_alt, gebuehr_neu)
        VALUES ('D', OLD.instrument_id, OLD.bezeichnung, OLD.leihgebuehr, NULL);
    END^

    SET TERM ; ^

    INSERT INTO instrument (bezeichnung, familie, leihgebuehr)
    VALUES ('Saxophon', 'Blas', 16.00);

    UPDATE instrument SET leihgebuehr = 18.00 WHERE bezeichnung = 'Violoncello';

    DELETE FROM instrument WHERE bezeichnung = 'Ukulele';

    -- Erwartet:
    -- (I, Saxophon, NULL, 16.00, 1), (U, Violoncello, 25.00, 18.00, 1), (D, Ukulele, 6.00, NULL, 1).
    -- mit_id 0 im DELETE-Fall hiesse: der Schluessel wurde aus NEW statt aus OLD gelesen.
  check: SELECT aktion, bezeichnung, gebuehr_alt, gebuehr_neu, CASE WHEN instrument_id IS NULL THEN 0 ELSE 1 END AS mit_id FROM instrument_log
  dialect_note: "Nur Firebird (PSQL). Bei DELETE gibt es nur `OLD`, deshalb stammen Schlüssel und Bezeichnung dort aus `OLD`. Die Ukulele lässt sich löschen, weil sie weder unterrichtet noch ausgeliehen wird. PostgreSQL-Skizze (nicht getestet): Triggerfunktion mit `IF TG_OP = 'INSERT' THEN … ELSIF TG_OP = 'UPDATE' THEN … ELSE … END IF; RETURN NULL;`, angehängt mit `AFTER INSERT OR UPDATE OR DELETE ON instrument FOR EACH ROW`."
  hints:
    - "`INSERTING`, `UPDATING` und `DELETING` sind Boolesche Variablen im Trigger."
    - "In PSQL schreibt man `IF (…) THEN anweisung; ELSE anweisung;`, auch verschachtelt als `ELSE IF`."
    - "Bei einem AFTER-Trigger ist die Identity-Nummer der neuen Zeile schon vergeben."
