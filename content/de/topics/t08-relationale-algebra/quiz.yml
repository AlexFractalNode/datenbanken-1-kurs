- id: t08-q006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [differenz, anfrage-formulieren]
  type: single
  question: |-
    Welcher Ausdruck liefert die Nummern der Mitglieder, die noch **nie** eine Sitzung hatten?
  options:
    - text: "`π_{mnr}(Mitglied) − π_{mnr}(Sitzung)`"
      correct: true
      explain: "Alle Mitgliedsnummern minus die, die in Sitzung vorkommen. Beide Seiten haben nur das Attribut mnr und sind damit vereinigungsverträglich."
    - text: "`π_{mnr}(Sitzung) − π_{mnr}(Mitglied)`"
      correct: false
      explain: "Die Differenz ist nicht kommutativ. So entstünden die Mitgliedsnummern aus Sitzung, zu denen kein Mitglied existiert. Bei korrekten Fremdschlüsseln ist das die leere Menge."
    - text: "`π_{mnr}(σ_{tnr=NULL}(Mitglied ⋈ Sitzung))`"
      correct: false
      explain: "Im inneren Join fehlen partnerlose Mitglieder ganz. Außerdem ist ein Vergleich `= NULL` nie wahr."
    - text: "`Mitglied − Sitzung`"
      correct: false
      explain: "Die beiden Relationen haben verschiedene Attribute und sind nicht vereinigungsverträglich."
- id: t08-q007
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [selektion, anfrage-formulieren]
  type: single
  question: |-
    Gegeben ist `Sitzung(mnr, tnr, objekt)` mit den Tupeln (1, T2, Saturn), (1, T3, Orionnebel), (2, T2, Mond), (3, T2, Saturn). Mitglied 1 heißt Ada.
