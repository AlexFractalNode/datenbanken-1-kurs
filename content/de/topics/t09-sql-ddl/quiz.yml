      explain: "Für eine Spalte ohne solchen Constraint wäre das richtig. Die UNIQUE-Bindung verhindert hier die Änderung."
    - text: "Die Spalte wird verlängert und der UNIQUE-Constraint automatisch entfernt."
      correct: false
      explain: "DDL entfernt Constraints nie stillschweigend."
    - text: "Fehler, weil Firebird `TYPE` nicht kennt und `MODIFY` verlangt."
      correct: false
      explain: "`ALTER COLUMN … TYPE …` ist die richtige Firebird-Syntax. `MODIFY` stammt aus MySQL/Oracle."
- id: t09-q020
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [constraints, unique, "null", dialekt]
  type: single
  question: |-
    Eine Tabelle `einteilung(helfer_id, schicht_id, posten)` hat `CONSTRAINT uq_einteilung UNIQUE (schicht_id, posten)`, `posten` ist NULL-fähig. Sie enthält schon die Zeile `(1, 5, NULL)`. Nun wird `(2, 5, NULL)` eingefügt. Was passiert in Firebird 3 und in PostgreSQL?
  options:
    - text: "Firebird 3 weist die Zeile ab, PostgreSQL nimmt sie an."
      correct: true
      explain: "Firebird 3 sieht ein Duplikat, wenn in beiden Zeilen dieselben Schlüsselspalten NULL sind und die übrigen gleiche Werte haben (hier `schicht_id = 5`). PostgreSQL wertet jede Kombination mit einer NULL als verschieden."
    - text: "Beide nehmen die Zeile an, weil NULL nie gleich NULL ist."
      correct: false
      explain: "Das gilt bei einspaltigem UNIQUE. Bei mehrspaltigem UNIQUE mit teilweise NULL weicht Firebird 3 ab."
    - text: "Beide weisen die Zeile ab."
      correct: false
      explain: "PostgreSQL nimmt sie an. Nur mit `UNIQUE NULLS NOT DISTINCT` würde PostgreSQL sie abweisen."
    - text: "PostgreSQL weist die Zeile ab, Firebird 3 nimmt sie an."
      correct: false
      explain: "Genau umgekehrt. In Firebird 3 sind nur vollständig leere Schlüssel mehrfach erlaubt."
- id: t09-q021
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [datentypen, numeric, firebird, dialekt]
