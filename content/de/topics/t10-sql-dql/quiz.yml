  question: |-
    Wahr oder falsch: `kurs NATURAL JOIN termin` verbindet die Tabellen nur über `kurs_id`, wenn beide Tabellen die Spalten `kurs_id` **und** `raum_id` enthalten.
  options:
    - text: "Wahr"
      correct: false
