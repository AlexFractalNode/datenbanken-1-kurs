- id: t03-p005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [informationsanforderung, verarbeitungsanforderung, klassifizieren]
  type: explain
  difficulty: 1
  points: 5
  minutes: 5
  prompt: |-
    Für die Datenbank einer Jugendherberge liegen folgende Anforderungen vor. Ordne jede als **Informationsanforderung (I)** oder **Verarbeitungsanforderung (V)** ein.
    1. Jedes Zimmer hat eine Nummer, eine Bettenzahl und liegt auf genau einer Etage.
    2. Beim Check-in sucht das Personal die Buchung über den Nachnamen, die Antwort kommt in höchstens 3 Sekunden.
    3. Eine Buchung umfasst ein oder mehrere Zimmer.
    4. Die Herbergsleitung erhält jeden Montag eine Belegungsübersicht für die Woche.
    5. Die Zahl der Gäste einer Buchung liegt zwischen 1 und 60.
    6. Nur die Rezeption darf Buchungen stornieren.
    7. Zu jedem Gast werden Name, Geburtsdatum und, falls vorhanden, die Schulklasse gespeichert.
    8. Bei der Abreise berechnet das System den Rechnungsbetrag aus Nächten und Tarif.

    Begründe zusätzlich, warum Anforderung 5 trotz ihres Regelcharakters in dieselbe Gruppe gehört wie Anforderung 1.
  solution: |-
    1. I (Objekt, Attribute, Kardinalität)
    2. V (Suchvorgang mit Antwortzeit)
    3. I (Kardinalität der Beziehung Buchung–Zimmer)
    4. V (regelmäßige Auswertung)
    5. I (Integritätsbedingung: Wertebereich)
    6. V (Berechtigung für eine Operation)
    7. I (Attribute, darunter ein optionales)
    8. V (Berechnung eines abgeleiteten Werts; der Betrag wird berechnet, nicht als Grunddatum erhoben)

    Begründung zu 5: Wie Anforderung 1 beschreibt sie, welche Zustände des **gespeicherten Bestands** zulässig sind. Sie ist eine Integritätsbedingung (Wertebereich), die später als Constraint (z. B. `CHECK`) umgesetzt wird. Ein Vorgang, eine Häufigkeit oder eine Antwortzeit kommt darin nicht vor.
  rubric:
    - criterion: "Korrekte Einordnung je Anforderung (je 0,5)"
      points: 4
    - criterion: "Begründung zu 5: beschreibt zulässige Zustände des Bestands bzw. Integritätsbedingung, kein Vorgang"
      points: 1
  space: lines:10
- id: t03-p006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [anforderungsspezifikation, tabellenform, anforderungsanalyse]
  type: explain
  difficulty: 2
  points: 8
  minutes: 10
  prompt: |-
    Ein Schachverein möchte seine Vereinsturniere verwalten. Aus den Gesprächen ist bekannt:
    - Zu jeder Spieler:in werden eine vom Verein vergebene Spielernummer, der Name, das Geburtsjahr und, falls vorhanden, die Elo-Zahl (1000 bis 2900) gespeichert. Der Verein hat etwa 80 Spieler:innen, rund ein Drittel hat eine Elo-Zahl.
    - Ein Turnier hat eine Bezeichnung, ein Startdatum und eine Bedenkzeit. Pro Jahr finden etwa 6 Turniere statt.
    - Spieler:innen melden sich zu Turnieren an, je Turnier 10 bis 40 Personen. Eine Spieler:in kann an beliebig vielen Turnieren teilnehmen.
    - Ein Turnier hat etwa 7 Runden. Nach jeder Runde gibt die Turnierleitung alle Ergebnisse ein und druckt die aktuelle Tabelle aus. Das soll in unter 5 Sekunden gehen.
    - Einmal im Jahr wird je Spieler:in die Zahl der gespielten Partien ausgewertet.

    Erstelle die Anforderungsspezifikation in Tabellenform:
    a) Objektbeschreibung für **Spieler:in** mit den Spalten Typ/Länge, Wertebereich/Regel, Mehrfachwerte, Belegungsgrad, identifizierend.
    b) Beziehungsbeschreibung für **meldet sich an** mit den Spalten beteiligte Objekte, Kardinalität, Attribute, Mengengerüst.
    c) Vorgangsbeschreibung für die beiden Vorgänge **Rundenergebnisse eingeben und Tabelle drucken** und **Jahresauswertung** mit den Spalten Auslöser und Häufigkeit, Dringlichkeit, gelesene/geänderte Daten, Umfang je Ausführung.
    Gleichwertige Spaltennamen (z. B. „Anzahl Werte“ statt „Mehrfachwerte“, „Muss/Kann“ statt Belegungsgrad, „Priorität“ statt Dringlichkeit) sind erlaubt. Fehlende Angaben darfst du sinnvoll annehmen, kennzeichne sie dann als Annahme.
  solution: |-
    a) Objekt Spieler:in (ca. 80):

    | Attribut | Typ, Länge | Wertebereich/Regel | Mehrfachwerte | Belegung | identifizierend |
    |---|---|---|---|---|---|
    | Spielernummer | Ganzzahl, 4 (Annahme) | vom Verein vergeben, eindeutig | nein (bzw. 1) | 100 % (Muss) | ja |
    | Name | Zeichenkette, 60 (Annahme) | keine Angabe im Text | nein (bzw. 1) | 100 % (Muss) | nein |
    | Geburtsjahr | Ganzzahl, 4 | keine Angabe im Text; z. B. 1920 bis aktuelles Jahr (Annahme) | nein (bzw. 1) | 100 % (Muss) | nein |
    | Elo-Zahl | Ganzzahl, 4 | 1000 bis 2900 | nein (bzw. 0 bis 1) | ca. 33 % (Kann) | nein |

    Für Typangaben sind fachliche („Zahl“, „Text“) wie allgemeine Typnamen („Ganzzahl“, „Zeichenkette“) richtig. Mehrfachwerte dürfen als ja/nein oder als Anzahl bzw. Spanne angegeben werden.

    b) Beziehung meldet sich an:

    | beteiligte Objekte | Kardinalität | Attribute | Mengengerüst |
    |---|---|---|---|
    | Spieler:in, Turnier | m:n; je Turnier 10 bis 40 Spieler:innen, je Spieler:in beliebig viele Turniere | laut Text keine (Anmeldedatum als gekennzeichnete Annahme zulässig) | 6 Turniere × 10 bis 40 = 60 bis 240 Anmeldungen pro Jahr |

    c) Vorgänge:

    | Vorgang | Auslöser und Häufigkeit | Dringlichkeit | gelesene/geänderte Daten | Umfang je Ausführung |
    |---|---|---|---|---|
    | Rundenergebnisse eingeben und Tabelle drucken | Ende jeder Runde, ca. 7 je Turnier, ca. 42 pro Jahr | hoch (Annahme, begründet durch Turnierbetrieb und unter 5 s) | Turnier, Anmeldungen, Partien der Runde mit Ergebnis, Spieler:innen (Name) | 5 bis 20 Partien je Runde, Tabelle mit 10 bis 40 Zeilen |
    | Jahresauswertung | Jahresende, 1-mal pro Jahr | niedrig (Annahme: keine Zeitvorgabe im Text) | Spieler:innen, Partien des Jahres | alle Partien eines Jahres, grob 6 × 7 × bis 20 = bis 840 (Annahme: jede Person spielt jede Runde) |

    Begründete abweichende Dringlichkeiten sind ebenfalls richtig.
  rubric:
    - criterion: "a) Je Attribut (4) korrekte Zeile: Typ/Länge plausibel (fachliche oder allgemeine Typnamen), Wertebereich bzw. Regel aus dem Text (ohne Textangabe: leer, „keine“ oder gekennzeichnete Annahme), Mehrfachwerte (ja/nein oder Anzahl/Spanne), Belegung (Prozent oder Muss/Kann) und Identifikation richtig (je Zeile 0,75; je falscher Angabe −0,25, je Zeile min. 0)"
      points: 3
    - criterion: "b) Beteiligte Objekte und Kardinalität m:n mit den Grenzen 10 bis 40 je Turnier"
      points: 1
    - criterion: "b) Attribute (keine bzw. gekennzeichnete Annahme) und Mengengerüst aus den Angaben abgeleitet (je 0,5)"
      points: 1
    - criterion: "c) Je Vorgang Auslöser/Häufigkeit (0,5), gelesene/geänderte Daten (0,5) sowie Dringlichkeit und Umfang (0,5); abweichende Spaltennamen gleichwertig, begründete abweichende Dringlichkeit richtig"
      points: 3
  space: box:160
