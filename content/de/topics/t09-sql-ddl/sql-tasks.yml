- id: t09-s001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [create-table, constraints, identity, fremdschluessel]
  db: musikschule
  kind: ddl
  prompt: |-
    Die Musikschule will Instrumentalprüfungen erfassen. Lege die Tabelle `pruefung` an:

    - `pruefung_id`: ganze Zahl, Identity-Spalte, Primärschlüssel
    - `schueler_id`: Pflicht, verweist auf `schueler` (`person_id`). Wird ein Schüler gelöscht, verschwinden seine Prüfungen mit.
    - `instrument_id`: Pflicht, verweist auf `instrument`. Ein Instrument mit Prüfungen darf nicht gelöscht werden.
    - `datum`: Pflicht
    - `stufe`: Pflicht, ganze Zahl von 1 bis 6
    - `punkte`: optional (wird erst nach der Prüfung eingetragen), 0 bis 100
    - `bestanden`: Wahrheitswert, Pflicht, Standard „nein“

    Dieselbe Person legt am selben Tag höchstens eine Prüfung auf demselben Instrument ab. Benenne alle Tabellen-Constraints mit `CONSTRAINT …`.

    (Die automatische Prüfung kontrolliert nur, ob Tabelle und Spalten existieren. Ob deine Constraints vollständig sind, vergleichst du selbst mit der Musterlösung.)
  solution: |-
    CREATE TABLE pruefung (
        pruefung_id   INTEGER GENERATED BY DEFAULT AS IDENTITY,
        schueler_id   INTEGER NOT NULL,
        instrument_id INTEGER NOT NULL,
        datum         DATE NOT NULL,
        stufe         SMALLINT NOT NULL,
        punkte        SMALLINT,
        bestanden     BOOLEAN DEFAULT FALSE NOT NULL,
        CONSTRAINT pk_pruefung PRIMARY KEY (pruefung_id),
        CONSTRAINT fk_pruefung_schueler FOREIGN KEY (schueler_id)
            REFERENCES schueler (person_id) ON DELETE CASCADE,
        CONSTRAINT fk_pruefung_instrument FOREIGN KEY (instrument_id)
            REFERENCES instrument (instrument_id),
        CONSTRAINT uq_pruefung UNIQUE (schueler_id, instrument_id, datum),
        CONSTRAINT ck_pruefung_stufe CHECK (stufe BETWEEN 1 AND 6),
        CONSTRAINT ck_pruefung_punkte CHECK (punkte BETWEEN 0 AND 100)
    );
  check: SELECT pruefung_id, schueler_id, instrument_id, datum, stufe, punkte, bestanden FROM pruefung
  dialect_note: "In Firebird muss `DEFAULT` vor `NOT NULL` stehen. PostgreSQL akzeptiert beide Reihenfolgen, die Lösung läuft dort unverändert. Der mehrspaltige UNIQUE-Constraint liegt nur auf NOT-NULL-Spalten und verhält sich deshalb in beiden Systemen gleich."
  hints:
    - "„Darf nicht gelöscht werden“ ist das Standardverhalten (`NO ACTION`); du musst dafür keine Aktion angeben."
    - "Die Regel „höchstens eine Prüfung je Person, Instrument und Tag“ ist ein UNIQUE-Constraint über drei Spalten."
    - "`punkte` bleibt NULL-fähig. Ein CHECK lässt NULL durch."
  paper_mode: write
- id: t09-s002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [alter-table, check, "null"]
  db: musikschule
  kind: ddl
  prompt: |-
    Für die Raumplanung soll in `raum` die Fläche in Quadratmetern gespeichert werden. Füge die optionale Spalte `flaeche_qm` vom Typ `NUMERIC(5,1)` hinzu. Lege danach in einer eigenen Anweisung den benannten Constraint `ck_raum_flaeche` an, der nur positive Flächen erlaubt.

    Sage vorher: Was liefert danach `SELECT COUNT(*) AS raeume, COUNT(flaeche_qm) AS mit_flaeche FROM raum`? (Die Tabelle enthält sechs Räume.)
  solution: |-
    ALTER TABLE raum ADD flaeche_qm NUMERIC(5,1);
    ALTER TABLE raum ADD CONSTRAINT ck_raum_flaeche CHECK (flaeche_qm > 0);
  check: SELECT COUNT(*) AS raeume, COUNT(flaeche_qm) AS mit_flaeche FROM raum
  dialect_note: "Firebird kennt bei `ADD` kein Schlüsselwort `COLUMN`. PostgreSQL erlaubt `ADD COLUMN`, akzeptiert aber auch die Firebird-Form. PostgreSQL prüft den neuen CHECK gegen die vorhandenen Zeilen, Firebird nicht. Hier ist das egal, weil alle Werte NULL sind."
  hints:
    - "Eine neu angelegte Spalte ohne DEFAULT ist in allen vorhandenen Zeilen NULL."
    - "`COUNT(*)` zählt Zeilen, `COUNT(spalte)` nur Zeilen, in denen die Spalte nicht NULL ist."
    - "Ein CHECK mit NULL ergibt UNKNOWN, und das gilt nicht als Verstoß."
  paper_mode: predict
- id: t09-s003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [domain, create-table, identity, default]
  db: firma
  kind: ddl
  prompt: |-
    Die Firma will Weiterbildungen erfassen. Lege zuerst zwei Domänen an:

    - `d_kosten`: `NUMERIC(8,2)`, nie negativ
    - `d_anteil` (Anteil der Kosten, den die Firma fördert, in Prozent): `SMALLINT`, Standardwert 0, nur Werte von 0 bis 100

    Lege dann die Tabelle `weiterbildung` an: `weiterbildung_id` (Identity, Primärschlüssel), `mitarbeiter_id` (Pflicht, verweist auf `mitarbeiter`; wird jemand gelöscht, verschwinden seine Weiterbildungen), `thema` (Text bis 60 Zeichen, Pflicht), `beginn` (Datum, Pflicht), `ende` (Datum, optional, nicht vor `beginn`), `kosten` (Domäne `d_kosten`, Pflicht) und `foerderquote` (Domäne `d_anteil`, Pflicht).

    Trage zum Schluss für Mitarbeiter 3 die Weiterbildung „Datenschutz-Grundlagen“ ab dem 10.03.2025 mit Kosten von 450,00 € ein. Gib dabei keine Förderquote an.

    Sage vorher: Welche Förderquote steht danach in der neuen Zeile?

    (Die automatische Prüfung zeigt nur die eingefügte Zeile und damit, ob der Domänen-Default greift. Ob die übrigen Constraints vollständig sind, vergleichst du selbst mit der Musterlösung.)
  solution: |-
    CREATE DOMAIN d_kosten AS NUMERIC(8,2) CHECK (VALUE >= 0);

    CREATE DOMAIN d_anteil AS SMALLINT DEFAULT 0
        CHECK (VALUE BETWEEN 0 AND 100);

    CREATE TABLE weiterbildung (
        weiterbildung_id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        mitarbeiter_id   INTEGER NOT NULL,
        thema            VARCHAR(60) NOT NULL,
        beginn           DATE NOT NULL,
        ende             DATE,
        kosten           d_kosten NOT NULL,
        foerderquote     d_anteil NOT NULL,
        CONSTRAINT fk_wb_mitarbeiter FOREIGN KEY (mitarbeiter_id)
            REFERENCES mitarbeiter (mitarbeiter_id) ON DELETE CASCADE,
        CONSTRAINT ck_wb_zeitraum CHECK (ende IS NULL OR ende >= beginn)
    );

    INSERT INTO weiterbildung (mitarbeiter_id, thema, beginn, kosten)
    VALUES (3, 'Datenschutz-Grundlagen', DATE '2025-03-10', 450.00);
  check: SELECT weiterbildung_id, mitarbeiter_id, thema, kosten, foerderquote FROM weiterbildung
  dialect_note: "Grundform von `CREATE DOMAIN` und Vererbung des Domänen-Defaults sind in beiden Systemen gleich. Firebird 3 erlaubt je Domäne nur einen CHECK ohne Namen. PostgreSQL erlaubt auch `CONSTRAINT name CHECK (…)`, das wäre in Firebird ein Syntaxfehler. Die Prüfung zeigt die eingefügte Zeile und damit, ob der Domänen-Default greift. Die übrigen Constraints vergleichst du selbst mit der Musterlösung."
  hints:
    - "In der Domäne steht der geprüfte Wert als `VALUE` im CHECK."
    - "`NOT NULL` schreibst du an die Spalte, nicht in die Domäne. So bleibt die Domäne auch für optionale Spalten nutzbar. Default und CHECK erbt die Spalte von der Domäne."
    - "Die Domänen müssen vor der Tabelle existieren. Lässt das INSERT eine Spalte weg, greift der Default der Domäne."
  paper_mode: write
- id: t09-s004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [alter-table, unique, "null"]
  db: firma
  kind: ddl
  prompt: |-
    Jede Person in `mitarbeiter` soll eine optionale Telefon-Durchwahl bekommen. Zwei Personen dürfen nie dieselbe Durchwahl haben. Füge die Spalte `durchwahl` (`VARCHAR(10)`) hinzu und lege danach den Constraint `uq_mitarbeiter_durchwahl` an.

    Sage vorher: Was liefert danach `SELECT COUNT(*) AS gesamt, COUNT(durchwahl) AS mit_durchwahl, COUNT(DISTINCT durchwahl) AS verschieden FROM mitarbeiter`? (Die Tabelle enthält 29 Personen.) Warum scheitert der UNIQUE-Constraint nicht daran, dass die neue Spalte in allen Zeilen leer ist?
  solution: |-
    ALTER TABLE mitarbeiter ADD durchwahl VARCHAR(10);
    ALTER TABLE mitarbeiter ADD CONSTRAINT uq_mitarbeiter_durchwahl UNIQUE (durchwahl);
  check: SELECT COUNT(*) AS gesamt, COUNT(durchwahl) AS mit_durchwahl, COUNT(DISTINCT durchwahl) AS verschieden FROM mitarbeiter
  dialect_note: "Einen UNIQUE-Constraint nachträglich auf eine bestehende Spalte zu legen, geht in Firebird 3 und PostgreSQL, sofern die vorhandenen Werte keine Duplikate enthalten. Manche Darstellungen halten das für unmöglich, weil die Altdaten die Regel verletzen könnten. In diesem Fall scheitert der Befehl, sonst gelingt er. Der Constraint ist einspaltig, deshalb sind die 29 NULL-Werte in beiden Systemen erlaubt. Bei einem mehrspaltigen UNIQUE mit teilweise NULL würde Firebird 3 abweichen."
  hints:
    - "Alle 29 Zeilen haben nach dem `ADD` den Wert NULL in `durchwahl`."
    - "Für ein einspaltiges UNIQUE gelten zwei NULL-Werte nicht als gleich, in Firebird wie in PostgreSQL."
    - "`COUNT(DISTINCT x)` ignoriert NULL ebenfalls."
  paper_mode: predict
- id: t09-s005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [sequenz, generator, firebird]
  db: musikschule
  kind: ddl
  engines: [fb]
  prompt: |-
    Quittungsnummern für Barzahlungen sollen über alle Zahlungen hinweg fortlaufend vergeben werden. Lege dafür die Sequenz `seq_quittung` mit Standardeinstellungen an.

    Sage vorher: Welchen Wert liefert anschließend `SELECT NEXT VALUE FOR seq_quittung AS nr FROM RDB$DATABASE`?
  solution: |-
    CREATE SEQUENCE seq_quittung;
  check: SELECT NEXT VALUE FOR seq_quittung AS nr FROM RDB$DATABASE
  dialect_note: "Bewusst nur Firebird: Die Aufgabe übt die Firebird-Abfrage mit `NEXT VALUE FOR` und `RDB$DATABASE`, und eine Prüfabfrage, die in beiden Systemen läuft, gibt es dafür nicht. In PostgreSQL legt man die Sequenz genauso an und holt den nächsten Wert mit `SELECT nextval('seq_quittung')`. Das Ergebnis ist dort ebenfalls 1. `CREATE GENERATOR seq_quittung` ist in Firebird ein gleichwertiges älteres Synonym, `GEN_ID(seq_quittung, 1)` liefert ebenfalls den nächsten Wert."
  hints:
    - "Ohne `START WITH` steht eine neue Firebird-Sequenz auf 0. Die Schrittweite ist 1."
    - "`NEXT VALUE FOR` erhöht zuerst und gibt dann den neuen Wert zurück."
  paper_mode: predict
- id: t09-s006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [identity, start-with, default, check]
  db: musikschule
  kind: ddl
  prompt: |-
    Räume werden zeitweise gesperrt. Lege die Tabelle `raumsperre` an:

    - `raumsperre_id`: Identity-Spalte und Primärschlüssel. Die **erste** vergebene Nummer soll 1001 sein.
    - `raum_id`: Pflicht, verweist auf `raum`; wird ein Raum gelöscht, verschwinden seine Sperren
    - `von`, `bis`: Datumswerte, Pflicht, `bis` nicht vor `von`
    - `grund`: Text bis 40 Zeichen, Pflicht, Standardwert `'Renovierung'`

    Trage danach die erste Sperre ein: Raum 1 vom 01.07.2025 bis 31.07.2025. Gib weder eine Nummer noch einen Grund an.

    Schreibe die Firebird-3-Fassung und überlege, was in PostgreSQL anders ist.
  solution: |-
    CREATE TABLE raumsperre (
        raumsperre_id INTEGER GENERATED BY DEFAULT AS IDENTITY (START WITH 1000) PRIMARY KEY,
        raum_id       INTEGER NOT NULL REFERENCES raum (raum_id) ON DELETE CASCADE,
        von           DATE NOT NULL,
        bis           DATE NOT NULL,
        grund         VARCHAR(40) DEFAULT 'Renovierung' NOT NULL,
        CONSTRAINT ck_raumsperre_zeitraum CHECK (bis >= von)
    );

    INSERT INTO raumsperre (raum_id, von, bis)
    VALUES (1, DATE '2025-07-01', DATE '2025-07-31');
  solution_pg: |-
    CREATE TABLE raumsperre (
        raumsperre_id INTEGER GENERATED BY DEFAULT AS IDENTITY (START WITH 1001) PRIMARY KEY,
        raum_id       INTEGER NOT NULL REFERENCES raum (raum_id) ON DELETE CASCADE,
        von           DATE NOT NULL,
        bis           DATE NOT NULL,
        grund         VARCHAR(40) DEFAULT 'Renovierung' NOT NULL,
        CONSTRAINT ck_raumsperre_zeitraum CHECK (bis >= von)
    );

    INSERT INTO raumsperre (raum_id, von, bis)
    VALUES (1, DATE '2025-07-01', DATE '2025-07-31');
  check: SELECT raumsperre_id, raum_id, von, bis, grund FROM raumsperre
  dialect_note: "In Firebird 3 ist `START WITH n` der Wert **vor** der ersten Nummer, die erste Nummer ist also n + 1. In PostgreSQL ist `START WITH n` die erste Nummer selbst. Deshalb steht dort 1001. Die Prüfung zeigt die vergebene Nummer: Mit falschem oder fehlendem Startwert erscheint 1000, 1002 oder 1 statt 1001."
  hints:
    - "Die Startangabe steht in Klammern direkt hinter `AS IDENTITY`."
    - "Lies nach, ob `START WITH` in Firebird 3 die erste Nummer oder den Wert davor festlegt."
    - "`DEFAULT` vor `NOT NULL` schreiben. Im INSERT nennst du nur `raum_id`, `von` und `bis`."
  paper_mode: write
- id: t09-s007
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [alter-table, alter-column, umbenennen]
  db: firma
  kind: ddl
  prompt: |-
    In `abteilung` reicht die Länge von `standort` nicht mehr. Ändere den Typ auf `VARCHAR(50)` und benenne die Spalte danach in `ort` um. Schreibe zwei Anweisungen.
  solution: |-
    ALTER TABLE abteilung ALTER COLUMN standort TYPE VARCHAR(50);
    ALTER TABLE abteilung ALTER COLUMN standort TO ort;
  solution_pg: |-
    ALTER TABLE abteilung ALTER COLUMN standort TYPE VARCHAR(50);
    ALTER TABLE abteilung RENAME COLUMN standort TO ort;
  check: SELECT abteilung_id, ort FROM abteilung WHERE ort = 'Nordstadt'
  dialect_note: "Den Typ ändern beide Systeme mit `ALTER COLUMN … TYPE …`. Umbenennen heißt in Firebird `ALTER COLUMN alt TO neu`, in PostgreSQL `RENAME COLUMN alt TO neu`. Firebird lehnt Typänderungen ab, bei denen Daten verloren gehen könnten (z. B. kürzer machen), und ändert keine Spalten, die in einem PRIMARY KEY, UNIQUE oder FOREIGN KEY stecken. Umbenennen verweigert Firebird 3 für Spalten, die in einem Constraint (auch CHECK), einem Trigger, einer Prozedur oder einer Sicht vorkommen. Bei `standort` ist beides nicht der Fall. PostgreSQL passt Constraints beim Umbenennen selbst an."
  hints:
    - "Verlängern ist erlaubt, Verkürzen lehnt Firebird ab."
    - "Für das Umbenennen gibt es in Firebird kein `RENAME`, sondern `ALTER COLUMN … TO …`."
  paper_mode: write
- id: t09-s008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [create-table, rekursiv, zusammengesetzter-schluessel, check]
  db: musikschule
  kind: ddl
  prompt: |-
    Manche Kurse setzen andere Kurse voraus (z. B. „Gitarre Mittelstufe“ setzt „Gitarre Anfänger“ voraus). Ein Kurs kann mehrere Voraussetzungen haben und selbst Voraussetzung für mehrere Kurse sein. Lege die Tabelle `kurs_voraussetzung` mit den Spalten `kurs_id` und `voraussetzung_id` an:

    - Beide verweisen auf `kurs`. Wird einer der beiden Kurse gelöscht, verschwindet der Eintrag.
    - Jedes Paar darf nur einmal vorkommen.
    - Ein Kurs darf nicht sich selbst voraussetzen.

    Benenne alle Constraints.

    (Die automatische Prüfung kontrolliert nur, ob Tabelle und Spalten existieren. Ob deine Constraints vollständig sind, vergleichst du selbst mit der Musterlösung.)
  solution: |-
    CREATE TABLE kurs_voraussetzung (
        kurs_id          INTEGER NOT NULL,
        voraussetzung_id INTEGER NOT NULL,
        CONSTRAINT pk_kurs_voraussetzung PRIMARY KEY (kurs_id, voraussetzung_id),
        CONSTRAINT fk_kv_kurs FOREIGN KEY (kurs_id)
            REFERENCES kurs (kurs_id) ON DELETE CASCADE,
        CONSTRAINT fk_kv_voraussetzung FOREIGN KEY (voraussetzung_id)
            REFERENCES kurs (kurs_id) ON DELETE CASCADE,
        CONSTRAINT ck_kv_selbst CHECK (voraussetzung_id <> kurs_id)
    );
  check: SELECT k.kurs_id, COUNT(v.voraussetzung_id) AS anzahl FROM kurs k LEFT JOIN kurs_voraussetzung v ON v.kurs_id = k.kurs_id GROUP BY k.kurs_id
  hints:
    - "Das ist eine rekursive m:n-Beziehung: eine Zwischentabelle mit zwei Fremdschlüsseln auf dieselbe Tabelle."
    - "Ein zusammengesetzter Primärschlüssel geht nur als Tabellen-Constraint."
  paper_mode: write
- id: t09-s009
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [alter-table, primary-key, fremdschluessel, unique, set-null]
  db: firma
  kind: ddl
  prompt: |-
    Für die Tiefgarage der Firma hat ein Kollege eine Tabelle angelegt, aber noch ohne Schlüssel. Führe zuerst seine Anweisung aus:

    ```sql
    CREATE TABLE stellplatz (
        platz_nr       SMALLINT NOT NULL,
        ebene          VARCHAR(10),
        mitarbeiter_id INTEGER
    );
    ```

    Überführe die Tabelle danach mit **einer einzigen** `ALTER TABLE`-Anweisung in diese Zielstruktur:

    - Primärschlüssel `platz_nr` (`pk_stellplatz`)
    - `mitarbeiter_id` verweist auf `mitarbeiter`. Wird die Person gelöscht, wird der Platz frei (`fk_stellplatz_mitarbeiter`).
    - Jede Person hat höchstens einen Platz (`uq_stellplatz_mitarbeiter`).
    - neue Pflichtspalte `e_ladung` (Wahrheitswert, Standard „nein“)
    - `ebene` bis 20 Zeichen

    Trage zum Schluss Platz 12 auf der Ebene `'Untergeschoss 1'` für Mitarbeiter 4 ein, ohne `e_ladung` anzugeben.

    (Die automatische Prüfung zeigt nur die eingefügte Zeile. Sie erkennt die verlängerte Spalte `ebene` und den Default von `e_ladung`. Ob PK, FK und UNIQUE vorhanden sind und ob alles in **einer** Anweisung steht, vergleichst du selbst mit der Musterlösung.)
  solution: |-
    CREATE TABLE stellplatz (
        platz_nr       SMALLINT NOT NULL,
        ebene          VARCHAR(10),
        mitarbeiter_id INTEGER
    );

    ALTER TABLE stellplatz
        ADD CONSTRAINT pk_stellplatz PRIMARY KEY (platz_nr),
        ADD CONSTRAINT fk_stellplatz_mitarbeiter FOREIGN KEY (mitarbeiter_id)
            REFERENCES mitarbeiter (mitarbeiter_id) ON DELETE SET NULL,
        ADD CONSTRAINT uq_stellplatz_mitarbeiter UNIQUE (mitarbeiter_id),
        ADD e_ladung BOOLEAN DEFAULT FALSE NOT NULL,
        ALTER COLUMN ebene TYPE VARCHAR(20);

    INSERT INTO stellplatz (platz_nr, ebene, mitarbeiter_id) VALUES (12, 'Untergeschoss 1', 4);
  check: SELECT platz_nr, ebene, mitarbeiter_id, e_ladung FROM stellplatz
  dialect_note: "Mehrere Teilbefehle mit Komma, `ADD` ohne `COLUMN` und `ALTER COLUMN … TYPE` funktionieren in beiden Systemen gleich. Firebird 3 legt den Primärschlüssel nur auf Spalten an, die schon NOT NULL sind. Das ist bei `platz_nr` erfüllt. Der UNIQUE-Constraint ist einspaltig, mehrere freie Plätze ohne Person sind deshalb in beiden Systemen erlaubt."
  hints:
    - "Die Teilbefehle (`ADD CONSTRAINT …`, `ADD spalte …`, `ALTER COLUMN …`) trennst du mit Komma."
    - "„Der Platz wird frei“ heißt `ON DELETE SET NULL`; `mitarbeiter_id` bleibt dafür NULL-fähig."
    - "Bei der neuen Spalte steht `DEFAULT` vor `NOT NULL`."
  paper_mode: write
