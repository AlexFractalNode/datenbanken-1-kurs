    - text: "In Chen-Notation sind nur ternäre Beziehungen erlaubt, wenn mehr als zwei Entitätstypen vorkommen."
      correct: false
      explain: "Chen erlaubt beides. Die Wahl richtet sich nach der Bedeutung der Tatsache."
