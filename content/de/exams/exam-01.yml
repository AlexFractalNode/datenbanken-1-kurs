title: "Probeklausur 1: Kleingartenverein „Lindenwiese“"
minutes: 90
tasks:
- id: e01-p001
  topic: t01
  status: reviewed
  reviews: [fach, aufgaben, leak]
  sources:
    - id: oer-informatik-datenbanken
      ref: "DBMS: https://oer-informatik.de/dbms (Aufgaben eines DBMS)"
    - id: watt-database-design-2e
      ref: "Kap. 3 Characteristics and Benefits of a Database"
    - id: wp-datenbank
      ref: "Aufgaben/Funktionen eines DBMS"
  tags: [dbms-anforderungen, codd, transfer, dateiablage]
  type: explain
  difficulty: 1
  points: 4
  minutes: 4
  prompt: |-
    Der Kleingartenverein „Lindenwiese“ veranstaltet eine Jungpflanzenbörse: Mitglieder bieten Setzlinge an, andere Mitglieder reservieren sie. Bisher liegt dafür **eine** Tabellenkalkulationsdatei auf einem gemeinsamen Netzlaufwerk im Vereinsheim. Alle Mitglieder dürfen sie öffnen und bearbeiten. Wer zuletzt speichert, überschreibt die Datei; ältere Fassungen werden nicht aufbewahrt.

    Nenne **vier** der Anforderungen an ein DBMS nach Codd, die diese Lösung nicht erfüllt. Beschreibe zu jeder ein **konkretes** Problem, das in der Börse auftreten kann, und wie ein DBMS es verhindert. Integration, Operationen und Katalog zählen hier nicht.
  solution: |-
    Vier der folgenden (andere passende Fälle sind gleichwertig):

    - **Konsistenzüberwachung (Integritätssicherung):** In der Spalte Stückzahl steht „ein paar“ oder −3, oder jemand reserviert ein Angebot, das es nicht gibt. Ein DBMS weist solche Werte über Datentypen, `CHECK` und Fremdschlüssel ab.
    - **Zugriffskontrolle:** Jedes Mitglied kann fremde Angebote und Reservierungen ändern oder löschen. Ein DBMS vergibt Rechte je Benutzer bzw. Rolle, z. B. darf nur die Börsenleitung Angebote löschen.
    - **Benutzersichten:** Alle sehen alle Spalten, also auch E-Mail-Adressen und Telefonnummern der anderen. Ein DBMS bietet Sichten, die z. B. nur Pflanze, Stückzahl und Namen der Anbieter:in zeigen.
    - **Transaktionen:** Ein Mitglied tauscht seine Reservierung von Tomaten gegen Paprika: alte Zeile löschen, neue eintragen. Stürzt der Rechner nach dem Löschen ab, ist die alte Reservierung weg und die neue fehlt. Ein DBMS führt beides ganz oder gar nicht aus (`COMMIT`/`ROLLBACK`).
    - **Synchronisation (Mehrbenutzerbetrieb):** Zwei Mitglieder haben die Datei gleichzeitig geöffnet und tragen je eine Reservierung ein. Wer zuletzt speichert, überschreibt die Datei, die andere Reservierung ist verloren. Ein DBMS isoliert gleichzeitige Vorgänge, sodass beide Änderungen erhalten bleiben.
    - **Datensicherung (Recovery):** Ein Mitglied speichert versehentlich eine leere Fassung oder die Datei wird beim Speichern beschädigt. Ohne aufbewahrte Fassungen ist der Bestand verloren. Ein DBMS stellt mit Sicherung und Protokoll den letzten bestätigten Stand wieder her.

    Synchronisation und Datensicherung zählen nur mit einem konkreten Fehlerfall wie oben, denn manche Werkzeuge bieten dafür Teilersatz (Zusammenführen, Versionsverlauf), den es hier ausdrücklich nicht gibt.
  rubric:
    - criterion: "je Anforderung (höchstens vier gewertet): passender Name (0,5) und konkretes Börsenproblem samt Wirkung des DBMS (0,5)"
      points: 4
  space: lines:12
- id: e01-p002
  topic: t02
  status: reviewed
  reviews: [fach, aufgaben, leak]
  sources:
    - id: wp-ansi-sparc-architektur
      ref: "Drei-Ebenen-Architektur, Datenunabhängigkeit"
    - id: wp-datenunabhaengigkeit
      ref: "logische und physische Datenunabhängigkeit"
    - id: wp-hierarchisches-datenbankmodell
      ref: "Aufbau: Baum, Eltern-Kind-Beziehung, n:m über Redundanz oder virtuelle Eltern-Kind-Beziehungen"
