- id: t08-q011
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [sql, durchschnitt, firebird]
  type: multi
  question: |-
    Musikschul-Datenbank: Gesucht sind die Instrumentnummern, die sowohl in `kurs` als auch in `ausleihe` vorkommen, also `π_{instrument_id}(kurs) ∩ π_{instrument_id}(ausleihe)`. Mehrere Kurse können dasselbe Instrument haben; `ausleihe.instrument_id` ist NOT NULL. Welche Anweisungen liefern in **Firebird 3** genau dieses Ergebnis?
  options:
    - text: "`SELECT DISTINCT k.instrument_id FROM kurs k WHERE EXISTS (SELECT 1 FROM ausleihe a WHERE a.instrument_id = k.instrument_id);`"
      correct: true
      explain: "Der Durchschnitt als Semi-Join: Kurs-Instrumente mit mindestens einer Ausleihe. DISTINCT stellt die Mengensemantik her."
    - text: "`SELECT DISTINCT k.instrument_id FROM kurs k WHERE k.instrument_id IN (SELECT a.instrument_id FROM ausleihe a);`"
      correct: true
      explain: "IN ist die zweite übliche Ausweichform für ∩ in Firebird 3. Kurse ohne Instrument (NULL) fallen heraus. Das deckt sich mit ∩ nur, weil `ausleihe.instrument_id` NOT NULL ist; enthalten beide Seiten NULL, weichen INTERSECT und die Ausweichformen ab."
    - text: "`SELECT instrument_id FROM kurs INTERSECT SELECT instrument_id FROM ausleihe;`"
      correct: false
      explain: "In PostgreSQL korrekt. Firebird 3 kennt INTERSECT nicht und meldet einen Syntaxfehler."
    - text: "`SELECT instrument_id FROM kurs UNION SELECT instrument_id FROM ausleihe;`"
      correct: false
      explain: "Das ist die Vereinigung (∪): Instrumente, die unterrichtet **oder** ausgeliehen werden."
