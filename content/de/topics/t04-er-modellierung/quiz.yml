- id: t04-q001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [kardinalitaet, chen]
  type: single
  question: |-
    Gegeben ist in reiner Chen-Notation: `Imker:in —1— betreut —n— Bienenvolk`. Welche Aussage ist richtig?
  options:
    - text: "Ein Bienenvolk wird von höchstens einer Imker:in betreut, eine Imker:in kann viele Völker betreuen."
      correct: true
      explain: "Chen liest man gegenüber: Die 1 bei Imker:in gilt für ein Volk, das n bei Bienenvolk gilt für eine Imker:in."
    - text: "Eine Imker:in betreut genau ein Bienenvolk, ein Volk kann von vielen Imker:innen betreut werden."
      correct: false
      explain: "Das ist die typische Verwechslung: Die Zahl wird hier dem eigenen Typ zugeordnet statt dem gegenüberliegenden."
    - text: "Jede Imker:in muss mindestens ein Volk betreuen."
      correct: false
      explain: "Die Chen-Angabe selbst enthält keine Untergrenze. Nach Kursstandard bekommt die Master-Seite einer 1:n-Beziehung ohne weitere Angaben (0,*), eine Pflicht für die Imker:in folgt also nicht."
    - text: "Ein Bienenvolk darf ohne Imker:in sein, denn eine 1 in reiner Chen-Notation ist nur eine Obergrenze."
      correct: false
      explain: "Die 1 ist tatsächlich nur eine Obergrenze. Nach Kursstandard gehört die Detail-Seite einer 1:n-Beziehung ohne weitere Angaben aber zu genau einem Master: Bienenvolk (1,1). Dass ein Volk ohne Imker:in sein darf, müsste ausdrücklich angegeben sein (Text oder MC-Symbol c)."
- id: t04-q002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [kardinalitaet, umrechnung]
  type: single
  question: |-
    Chen: `Kletterwand —1— hat —n— Route`. Zusätzlich gilt: Jede Route befindet sich an genau einer Wand, eine Wand kann (noch) ohne Routen sein. Welche (min,max)-Angaben sind korrekt?
  options:
    - text: "Kletterwand (0,n), Route (1,1)"
      correct: true
      explain: "Eine Wand nimmt an 0 bis n hat-Beziehungen teil, eine Route an genau einer. Das max bei Wand (n) ist die Chen-Angabe bei Route, das max bei Route (1) die Chen-Angabe bei Wand."
    - text: "Kletterwand (1,1), Route (0,n)"
      correct: false
      explain: "Hier wurden die Chen-Angaben ohne Tausch übernommen. (min,max) steht aber beim eigenen Typ."
    - text: "Kletterwand (1,n), Route (1,1)"
      correct: false
      explain: "Die Obergrenzen stimmen, aber eine Wand darf laut Text ohne Routen sein, also min = 0."
    - text: "Kletterwand (0,1), Route (0,n)"
      correct: false
      explain: "Vertauscht und mit falschen Untergrenzen: Jede Route hat genau eine Wand."
- id: t04-q003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [kardinalitaet, umrechnung]
  type: single
  question: |-
    In einer Gärtnerei gilt in (min,max)-Notation: `Pflanze (1,1) — steht in — (1,n) Gewächshaus`. Wie lautet die Beziehung in Chen-Notation?
  options:
    - text: "Gewächshaus 1 : n Pflanze (die 1 steht bei Gewächshaus, das n bei Pflanze)"
      correct: true
      explain: "Das max bei Pflanze (1) wandert zum Gewächshaus, das max bei Gewächshaus (n) wandert zur Pflanze."
    - text: "Pflanze 1 : n Gewächshaus (die 1 steht bei Pflanze, das n bei Gewächshaus)"
      correct: false
      explain: "Die Obergrenzen wurden auf ihrer Seite belassen. Bei Chen müssen sie auf die Gegenseite."
    - text: "Pflanze n : m Gewächshaus"
      correct: false
      explain: "Eine Pflanze steht in höchstens einem Gewächshaus (max 1), also ist es keine m:n-Beziehung."
    - text: "Pflanze 1 : 1 Gewächshaus, weil beide Untergrenzen 1 sind"
      correct: false
      explain: "Für die Chen-Kardinalität zählen die Obergrenzen, nicht die Untergrenzen."
- id: t04-q004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [schluessel]
  type: multi
  question: |-
    Entitätstyp `Route` mit den Attributen Routen-ID, Wand-Nr., Routen-Nr., Name, Schwierigkeit. Eindeutig sind: Routen-ID allein und die Kombination (Wand-Nr., Routen-Nr.). Namen können sich wiederholen, auch an derselben Wand. Welche Attributmengen sind **Superschlüssel**?
  options:
    - text: "{Routen-ID}"
      correct: true
      explain: "Routen-ID ist eindeutig, also Superschlüssel (und sogar minimal). Wegen dieser eigenen ID ist Route hier ein starker Entitätstyp. Ohne sie wäre Route ein schwacher Typ mit partiellem Schlüssel Routen-Nr."
    - text: "{Routen-ID, Name}"
      correct: true
      explain: "Enthält einen eindeutigen Teil. Ein Superschlüssel darf überflüssige Attribute enthalten."
    - text: "{Wand-Nr., Routen-Nr., Schwierigkeit}"
      correct: true
      explain: "Enthält die eindeutige Kombination (Wand-Nr., Routen-Nr.), also Superschlüssel, aber nicht minimal."
    - text: "{Wand-Nr., Name}"
      correct: false
      explain: "Namen können sich an derselben Wand wiederholen, die Kombination ist also nicht eindeutig."
