    - text: "Die Spalte wird umbenannt, die Sicht wird stillschweigend gelöscht."
      correct: false
      explain: "DDL entfernt abhängige Objekte in Firebird nie stillschweigend."
    - text: "Syntaxfehler, Firebird kennt nur `RENAME COLUMN`."
      correct: false
      explain: "`ALTER COLUMN alt TO neu` ist die Firebird-Syntax. `RENAME COLUMN` ist die PostgreSQL-Form."
- id: t09-q023
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, set-default]
  type: single
  question: |-
    `artikel.kategorie_id INTEGER DEFAULT 0 NOT NULL` hat `FOREIGN KEY (kategorie_id) REFERENCES kategorie (kategorie_id) ON DELETE SET DEFAULT`. In `kategorie` gibt es **keine** Zeile mit `kategorie_id = 0`. Was passiert bei `DELETE FROM kategorie WHERE kategorie_id = 4`, wenn Artikel zu Kategorie 4 existieren?
  options:
    - text: "Das DELETE scheitert, nichts wird geändert."
