- id: t11-p001
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [insert, insert-select, update, delete, reihenfolge]
  type: sql-write
  difficulty: 2
  points: 11
  minutes: 11
  prompt: |-
    Die Redaktion einer Schülerzeitung verwaltet ihre Artikel in Firebird 3:

    ```sql
    CREATE TABLE ausgabe (
      ausgabe_id   INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      titel        VARCHAR(40) NOT NULL UNIQUE,
      erscheint_am DATE NOT NULL
    );

    CREATE TABLE autor (
      autor_id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      vorname  VARCHAR(30) NOT NULL,
      nachname VARCHAR(30) NOT NULL,
      klasse   VARCHAR(3)  NOT NULL,
      email    VARCHAR(60) UNIQUE
    );

    CREATE TABLE artikel (
      artikel_id   INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      ausgabe_id   INTEGER NOT NULL REFERENCES ausgabe (ausgabe_id),
      autor_id     INTEGER REFERENCES autor (autor_id) ON DELETE SET NULL,
      ueberschrift VARCHAR(80) NOT NULL,
      zeichen      INTEGER NOT NULL,
      status       VARCHAR(12) DEFAULT 'Entwurf' NOT NULL
                   CHECK (status IN ('Entwurf', 'Lektorat', 'fertig'))
    );
    ```

    Schreibe die Anweisungen in Firebird-3-Syntax. Schlüsselwerte, die du nicht kennst, darfst du nicht als Zahl hinschreiben.

    a) Mara Klein aus der Klasse 9b schreibt neu mit, E-Mail `mara.klein@schule.example`.
    b) Mara liefert für die Ausgabe „Sommer 2025“ den Artikel „Neue Fahrradständer“ mit 2400 Zeichen. Der Status soll der Default sein.
    c) Alle Artikel der Ausgabe „Sommer 2025“, die noch im Status `'Entwurf'` sind, gehen ins Lektorat.
    d) Alle Artikel mit mehr als 5000 Zeichen werden um 10 % gekürzt (ganze Zeichen genügen).
    e) Artikel ohne Autor, die noch im Status `'Entwurf'` sind, werden gelöscht.
    f) Warum scheitert ein INSERT in `artikel`, wenn die zugehörige Ausgabe noch nicht angelegt ist?
  solution: |-
    **a)**
    ```sql
    INSERT INTO autor (vorname, nachname, klasse, email)
    VALUES ('Mara', 'Klein', '9b', 'mara.klein@schule.example');
    ```
    `autor_id` fehlt in der Spaltenliste, die Datenbank vergibt sie.

    **b)**
    ```sql
    INSERT INTO artikel (ausgabe_id, autor_id, ueberschrift, zeichen)
    SELECT g.ausgabe_id, a.autor_id, 'Neue Fahrradständer', 2400
    FROM ausgabe g
    CROSS JOIN autor a
    WHERE g.titel = 'Sommer 2025'
      AND a.email = 'mara.klein@schule.example';
    ```
    Ebenfalls richtig: `VALUES ((SELECT ausgabe_id FROM ausgabe WHERE titel = 'Sommer 2025'), (SELECT autor_id FROM autor WHERE email = 'mara.klein@schule.example'), 'Neue Fahrradständer', 2400)`. Die Unterabfragen liefern höchstens eine Zeile, weil `titel` und `email` UNIQUE sind. Solange Ausgabe und Autorin existieren, ist das Ergebnis dasselbe. Nur wenn ein Nachschlagen nichts findet, verhalten sich die Varianten verschieden: `INSERT … SELECT` fügt dann keine Zeile ein. Die VALUES-Variante setzt NULL ein, bei `autor_id` still (die Spalte ist NULL-fähig), bei `ausgabe_id` mit Abweisung wegen NOT NULL. `status` fehlt in der Spaltenliste und bekommt `'Entwurf'`.

    **c)**
    ```sql
    UPDATE artikel
    SET status = 'Lektorat'
    WHERE status = 'Entwurf'
      AND ausgabe_id = (SELECT ausgabe_id FROM ausgabe WHERE titel = 'Sommer 2025');
    ```

    **d)**
    ```sql
    UPDATE artikel
    SET zeichen = zeichen * 9 / 10
    WHERE zeichen > 5000;
    ```
    `zeichen * 9 / 10` ist eine ganzzahlige Division, das Ergebnis bleibt `INTEGER`. `zeichen * 0.9` wäre ebenso richtig, beim Speichern wird dann gerundet.

    **e)**
    ```sql
    DELETE FROM artikel
    WHERE autor_id IS NULL
      AND status = 'Entwurf';
    ```
    `autor_id = NULL` wäre falsch, der Vergleich ergibt UNKNOWN und trifft keine Zeile.

    **f)** `artikel.ausgabe_id` ist ein NOT-NULL-Fremdschlüssel auf `ausgabe`. Beim INSERT prüft das DBMS, ob der Wert in `ausgabe` vorkommt. Gibt es die Ausgabe noch nicht, ist die referenzielle Integrität verletzt und das INSERT wird abgewiesen. Deshalb fügt man zuerst die Elternzeile (`ausgabe`, `autor`) ein und dann die Kindzeile (`artikel`).
  rubric:
    - criterion: "a) INSERT mit Spaltenliste ohne autor_id, Werte passend"
      points: 1.5
    - criterion: "b) Schlüssel per INSERT … SELECT oder Unterabfragen über titel und email ermittelt, keine geratenen Zahlen"
      points: 2
    - criterion: "b) status weggelassen, damit der Default greift; Spaltenliste und Werte passen zusammen"
      points: 1
    - criterion: "c) UPDATE mit SET status = 'Lektorat', Bedingung auf Entwurf und Unterabfrage für die Ausgabe"
      points: 2
    - criterion: "d) SET zeichen = zeichen * 9 / 10 (oder * 0.9) mit WHERE zeichen > 5000"
      points: 1.5
    - criterion: "e) DELETE mit autor_id IS NULL (nicht = NULL) und status = 'Entwurf'"
      points: 1.5
    - criterion: "f) Fremdschlüsselprüfung beim Einfügen erklärt, Reihenfolge Eltern vor Kind"
      points: 1.5
  space: lines:28
- id: t11-p002
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [insert-select, update, unterabfrage, check, rekursiv, vertiefung]
  type: sql-write
  difficulty: 3
  points: 13
  minutes: 14
  prompt: |-
    Vertiefung (umfangreiche Übung). Gegeben ist ein Ausschnitt einer Firmendatenbank (Firebird 3). Die Nummern sind Identity-Spalten.

    ```
    abteilung (abteilung_id, bezeichnung UNIQUE, standort, leiter_id UNIQUE → mitarbeiter)
    mitarbeiter (mitarbeiter_id, vorname, nachname, email UNIQUE, eintritt, gehalt,
                 provision, abteilung_id → abteilung, vorgesetzter_id → mitarbeiter)
                 CHECK (vorgesetzter_id <> mitarbeiter_id)
    projekt (projekt_id, titel UNIQUE, abteilung_id NOT NULL → abteilung,
             startdatum, enddatum, budget)
    mitarbeit (mitarbeiter_id → mitarbeiter, projekt_id → projekt, stunden, rolle)
    ```

    Die Firma gründet eine Abteilung für Qualitätssicherung. Schreibe die Anweisungen in Firebird-3-Syntax. Keine Schlüsselwerte als Zahl hinschreiben, außer sie sind angegeben.

    a) Lege die Abteilung „Qualität“ am Standort „Westpark“ an, zunächst ohne Leitung.
    b) Alle Mitarbeitenden, die in mindestens einem Projekt die Rolle `'Test'` haben, wechseln in die neue Abteilung. Ihre Provision entfällt (NULL). Schreibe **eine** Anweisung.
    c) Die Leitung übernimmt die Person mit der E-Mail `dirk.ebert@firma.example`. Sie hat in einem Projekt die Rolle `'Test'`, ist also nach b) selbst Mitglied der neuen Abteilung, und leitet bisher keine andere Abteilung.
    d) Alle Mitglieder der neuen Abteilung bekommen die Leitung als Vorgesetzte. Achte auf den CHECK-Constraint und begründe kurz, warum deine Anweisung ihn einhält.
    e) Lege das Projekt „Testautomatisierung“ an (verantwortlich: Qualität, Start 01.04.2025, Budget noch offen). Trage danach mit **einer** Anweisung alle Mitglieder der Abteilung Qualität mit 0 Stunden und der Rolle `'Test'` in dieses Projekt ein.
  solution: |-
    **a)**
    ```sql
    INSERT INTO abteilung (bezeichnung, standort)
    VALUES ('Qualität', 'Westpark');
    ```
    `leiter_id` fehlt und wird NULL.

    **b)**
    ```sql
    UPDATE mitarbeiter
    SET abteilung_id = (SELECT abteilung_id FROM abteilung WHERE bezeichnung = 'Qualität'),
        provision    = NULL
    WHERE mitarbeiter_id IN (SELECT mitarbeiter_id FROM mitarbeit WHERE rolle = 'Test');
    ```
    Wer in mehreren Projekten testet, steht mehrfach in der Unterabfrage. Für `IN` ist das egal, die Person wird einmal geändert.

    **c)**
    ```sql
    UPDATE abteilung
    SET leiter_id = (SELECT mitarbeiter_id FROM mitarbeiter
                     WHERE email = 'dirk.ebert@firma.example')
    WHERE bezeichnung = 'Qualität';
    ```

    **d)**
    ```sql
    UPDATE mitarbeiter
    SET vorgesetzter_id = (SELECT leiter_id FROM abteilung WHERE bezeichnung = 'Qualität')
    WHERE abteilung_id = (SELECT abteilung_id FROM abteilung WHERE bezeichnung = 'Qualität')
      AND mitarbeiter_id <> (SELECT leiter_id FROM abteilung WHERE bezeichnung = 'Qualität');
    ```
    Die Leitung ist nach b) selbst Mitglied der Abteilung. Ohne die letzte Bedingung bekäme sie sich selbst als Vorgesetzte. Das verletzt `CHECK (vorgesetzter_id <> mitarbeiter_id)`, und die **ganze** Anweisung würde abgewiesen, auch für alle anderen Mitglieder.

    **e)**
    ```sql
    INSERT INTO projekt (titel, abteilung_id, startdatum)
    SELECT 'Testautomatisierung', abteilung_id, DATE '2025-04-01'
    FROM abteilung
    WHERE bezeichnung = 'Qualität';

    INSERT INTO mitarbeit (mitarbeiter_id, projekt_id, stunden, rolle)
    SELECT m.mitarbeiter_id, p.projekt_id, 0, 'Test'
    FROM mitarbeiter m
    JOIN projekt p ON p.abteilung_id = m.abteilung_id
    WHERE p.titel = 'Testautomatisierung';
    ```
    `budget` und `enddatum` fehlen und werden NULL. Das erste INSERT darf auch `VALUES ('Testautomatisierung', (SELECT …), DATE '2025-04-01')` verwenden.
  rubric:
    - criterion: "a) INSERT mit Spaltenliste, ohne abteilung_id und leiter_id"
      points: 1
    - criterion: "b) ein UPDATE mit zwei Zuweisungen (abteilung_id per Unterabfrage, provision = NULL)"
      points: 1.5
    - criterion: "b) WHERE mitarbeiter_id IN (Unterabfrage auf mitarbeit mit rolle = 'Test')"
      points: 1.5
    - criterion: "c) UPDATE abteilung mit Unterabfrage über die E-Mail, WHERE auf die neue Abteilung"
      points: 2
    - criterion: "d) Vorgesetzte per Unterabfrage gesetzt, nur Mitglieder der neuen Abteilung"
      points: 1.5
    - criterion: "d) Leitung selbst in der WHERE-Bedingung ausgenommen"
      points: 1
    - criterion: "d) Begründung: sonst vorgesetzter_id = mitarbeiter_id, CHECK verletzt, ganze Anweisung abgewiesen"
      points: 1
    - criterion: "e) Projekt ohne Zahlen-ID angelegt (INSERT … SELECT oder Unterabfrage), budget weggelassen"
      points: 1.5
    - criterion: "e) INSERT … SELECT in mitarbeit mit Join auf das neue Projekt, 0 Stunden und Rolle 'Test'"
      points: 2
  space: lines:32
- id: t11-p003
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [referenzielle-aktionen, set-default, set-null, cascade, no-action, on-update]
  type: explain
  difficulty: 3
  points: 12
  minutes: 12
  prompt: |-
    Ein Stadtlauf verwaltet seine Anmeldungen in diesen Tabellen (Fremdschlüssel mit ihren Aktionen):

    ```
    verein(verein_id, name)
    startblock(block_id, bezeichnung)
    laeufer(laeufer_id, name, verein_id, block_id)
      verein_id NULL-fähig,            FK → verein     ON DELETE SET NULL    ON UPDATE CASCADE
      block_id  NOT NULL, DEFAULT 0,   FK → startblock ON DELETE SET DEFAULT ON UPDATE SET DEFAULT
    zeit(zeit_id, laeufer_id, sekunden)
      laeufer_id NOT NULL,             FK → laeufer    ON DELETE CASCADE
    helfer(helfer_id, name, verein_id)
      verein_id NOT NULL,              FK → verein     ON DELETE SET NULL    (ON UPDATE nicht angegeben)
    ```

    Daten:

    ```
    verein:     (1, LG Nord), (2, TV Süd), (3, SC Ost)
    startblock: (0, noch offen), (1, A), (2, B), (3, C)
    laeufer:    (10, Ida, 1, 1), (11, Jan, 2, 2), (12, Kim, NULL, 2), (13, Lou, 3, 3)
    zeit:       (100, 10, 2410), (101, 11, 2575), (102, 13, 2390)
    helfer:     (50, Mo, 2)
    ```

    Jede Teilaufgabe startet wieder mit diesen Daten. Gib an, ob die Anweisung gelingt, welche Zeilen sich in welchen Tabellen wie ändern, und begründe kurz mit der jeweiligen Aktion.

    a) `DELETE FROM startblock WHERE block_id = 2;`
    b) `DELETE FROM verein WHERE verein_id = 3;` Was geschieht mit Zeit 102?
    c) `DELETE FROM verein WHERE verein_id = 2;`
    d) `UPDATE verein SET verein_id = 4 WHERE verein_id = 1;`
    e) `UPDATE verein SET verein_id = 8 WHERE verein_id = 2;`
    f) `UPDATE startblock SET block_id = 6 WHERE block_id = 3;` Welchen Startblock hat Lou danach?
    g) `UPDATE startblock SET block_id = 9 WHERE block_id = 0;` und danach `DELETE FROM startblock WHERE block_id = 1;`
  solution: |-
    **a)** Gelingt. Block 2 wird gelöscht. Jan (11) und Kim (12) bleiben und bekommen `block_id = 0` (SET DEFAULT). Das klappt, weil es den Platzhalterblock 0 gibt. `zeit` und alle anderen Tabellen bleiben unverändert.

    **b)** Gelingt. Verein 3 wird gelöscht, Lou (13) bleibt mit `verein_id = NULL` (SET NULL). Zeit 102 bleibt unverändert: SET NULL löscht Lou nicht, deshalb greift das CASCADE von `zeit` gar nicht. Kein Helfer gehört zu Verein 3.

    **c)** Scheitert, **nichts** ändert sich. Für Jan wäre SET NULL kein Problem. Helfer Mo (50) gehört aber auch zu Verein 2, und dort würde SET NULL die Spalte `helfer.verein_id` auf NULL setzen, obwohl sie NOT NULL ist. Damit wird die ganze Anweisung abgewiesen, auch Jan behält Verein 2. (SET NULL auf einer NOT-NULL-Spalte ist ein Entwurfsfehler. Passend wäre hier NO ACTION.)

    **d)** Gelingt. LG Nord hat danach den Schlüssel 4, und Ida (10) übernimmt per ON UPDATE CASCADE `verein_id = 4`. Für `helfer` gilt beim Ändern NO ACTION, aber kein Helfer verweist auf Verein 1. Deshalb gibt es nichts abzuweisen.

    **e)** Scheitert, nichts ändert sich. Mo verweist auf Verein 2, und für `helfer` gilt ON UPDATE NO ACTION. Auch Jans CASCADE auf 8 findet deshalb nicht statt.

    **f)** Gelingt. Block C hat danach den Schlüssel 6. Lou (13) übernimmt den neuen Wert **nicht**, sondern bekommt per ON UPDATE SET DEFAULT `block_id = 0` und steht damit im Platzhalterblock „noch offen“. Block 6 hat danach keine Läufer.

    **g)** Die erste Anweisung gelingt: Der Platzhalter „noch offen“ bekommt den Schlüssel 9. Weil niemand in Block 0 steht, ändert die Aktion keine Läuferzeile. Der Default der Spalte bleibt aber 0, und eine Zeile mit `block_id = 0` gibt es jetzt nicht mehr. Die zweite Anweisung scheitert deshalb: SET DEFAULT würde Ida (10) auf Block 0 setzen, das verletzt den Fremdschlüssel. Block 1 und Ida bleiben unverändert. Wer den Platzhalter umbenennt, muss also auch den Default anpassen.
  rubric:
    - criterion: "a) Gelingt, Jan und Kim auf Block 0, Platzhalterzeile als Voraussetzung genannt"
      points: 1.5
    - criterion: "b) Gelingt, Lou mit verein_id NULL; Zeit 102 bleibt, weil SET NULL die Kette beendet"
      points: 1.5
    - criterion: "c) Abbruch durch SET NULL auf der NOT-NULL-Spalte bei helfer; auch Jan unverändert"
      points: 2
    - criterion: "d) Gelingt, Ida auf 4 (CASCADE); NO ACTION bei helfer greift nicht, weil keine Zeile verweist"
      points: 1.5
    - criterion: "e) Abbruch durch ON UPDATE NO ACTION bei helfer, keine Änderung bei Jan"
      points: 1.5
    - criterion: "f) Gelingt, Lou auf Block 0 (SET DEFAULT, nicht 6)"
      points: 1.5
    - criterion: "g) Erste Anweisung gelingt, ohne eine Läuferzeile zu ändern (Block 0 war leer)"
      points: 1
    - criterion: "g) Zweite Anweisung scheitert, weil es den Default-Schlüssel 0 nicht mehr gibt; Ida und Block 1 unverändert"
      points: 1.5
  space: lines:24
- id: t11-p004
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [insert, update, delete, truncate, drop]
  type: define-example
  difficulty: 1
  points: 7
  minutes: 7
  prompt: |-
    a) Erkläre die drei DML-Anweisungen `INSERT`, `UPDATE` und `DELETE` in je einem Satz und schreibe zu jeder eine **eigene** Beispielanweisung. Alle Beispiele sollen zu derselben, selbst gewählten Tabelle passen. Gib die Tabelle mit ihren Spalten kurz an.
    b) Was ist der Unterschied zwischen `DELETE FROM t`, `TRUNCATE TABLE t` und `DROP TABLE t`? Nenne für jede Anweisung, was danach von `t` übrig ist. Ordne `DELETE` und `DROP TABLE` der DDL bzw. DML zu. Nenne außer dem Tempo zwei weitere Unterschiede zwischen `TRUNCATE` (in PostgreSQL) und `DELETE`.
  solution: |-
    Beispiel (andere gleichwertig): Tabelle `pflanze (pflanze_id, name, standort, giessen_alle_tage)` eines Schulgartens, `pflanze_id` ist eine Identity-Spalte.

    **a)**
    - `INSERT` fügt neue Zeilen ein.
      `INSERT INTO pflanze (name, standort, giessen_alle_tage) VALUES ('Basilikum', 'Beet 2', 2);`
    - `UPDATE` ändert Werte in vorhandenen Zeilen, die die WHERE-Bedingung erfüllen.
      `UPDATE pflanze SET giessen_alle_tage = 3 WHERE standort = 'Gewächshaus';`
    - `DELETE` entfernt Zeilen, die die WHERE-Bedingung erfüllen.
      `DELETE FROM pflanze WHERE name = 'Basilikum';`

    **b)**
    - `DELETE FROM t` (DML) löscht alle Zeilen einzeln. Die Tabelle mit Spalten, Constraints und Rechten bleibt leer zurück. Referenzielle Aktionen und Trigger wirken für jede Zeile.
    - `TRUNCATE TABLE t` leert die Tabelle ebenfalls, aber auf einen Schlag und meist schneller. Die Struktur bleibt. Weitere Unterschiede zu `DELETE` (zwei genügen):
      - kein WHERE möglich, es wird immer alles geleert,
      - keine `ON DELETE`-Trigger und keine zeilenweisen referenziellen Aktionen,
      - abgewiesen, sobald Fremdschlüssel anderer Tabellen auf `t` zeigen; mit `CASCADE` werden diese Tabellen vollständig mitgeleert,
      - der Identity-Zähler läuft in PostgreSQL weiter, außer mit `RESTART IDENTITY` (MariaDB/MySQL setzen ihn dagegen zurück).

      Zusatzinformation ohne Punkte, weil sie kein Unterschied von TRUNCATE in PostgreSQL ist: Firebird 3 kennt `TRUNCATE` gar nicht.
    - `DROP TABLE t` (DDL) entfernt die Tabelle selbst samt Daten, Constraints und Indexen. Danach gibt es `t` nicht mehr.
  rubric:
    - criterion: "a) INSERT, UPDATE, DELETE je korrekt erklärt (je 0,5 Punkte)"
      points: 1.5
    - criterion: "a) drei passende, syntaktisch korrekte eigene Beispiele zu einer gemeinsamen Tabelle"
      points: 2
    - criterion: "b) DELETE: Zeilen weg, Struktur bleibt, DML"
      points: 1
    - criterion: "b) TRUNCATE: Struktur bleibt (0,5) und zwei richtige weitere Unterschiede zu DELETE in PostgreSQL (je 0,5; der Hinweis auf Firebird 3 zählt nicht)"
      points: 1.5
    - criterion: "b) DROP: Tabelle selbst entfernt, DDL"
      points: 1
  space: lines:16
- id: t11-p005
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [identity, returning, transaktion, commit, rollback, vertiefung]
  type: define-example
  difficulty: 2
  points: 8
  minutes: 8
  prompt: |-
    Vertiefung (RETURNING und Transaktionen gehen über die Grundform der DML hinaus).

    a) Erkläre, wie eine Identity-Spalte beim Einfügen ihren Wert bekommt, und warum man ihn im INSERT nicht selbst angeben sollte.
    b) Nach dem Einfügen braucht die Anwendung die neue ID, um eine abhängige Zeile anzulegen. Zeige an einem **eigenen** Beispiel mit zwei Tabellen zwei Wege, wie man an die ID kommt, einmal mit `RETURNING`. Welche Einschränkung hat `RETURNING` in Firebird 3?
    c) Erkläre an deinem Beispiel aus b), was eine Transaktion ist und wozu `COMMIT` und `ROLLBACK` dienen.
  solution: |-
    Beispiel (andere gleichwertig): Ein Sportverein legt ein Turnier und die Startplätze dazu an.
    ```sql
    turnier (turnier_id IDENTITY PK, name UNIQUE, datum)
    startplatz (startplatz_id IDENTITY PK, turnier_id NOT NULL → turnier, mannschaft)
    ```

    **a)** Lässt das INSERT die Identity-Spalte weg, holt das DBMS den nächsten Wert aus dem internen Zähler und trägt ihn ein. Ein selbst eingetragener Wert schiebt den Zähler nicht weiter. Erreicht der Zähler später diesen Wert, scheitert ein INSERT am Primärschlüssel. Außerdem müsste man vorher wissen, welche Nummer frei ist, und das klappt bei parallelen Zugriffen nicht zuverlässig.

    **b)** Weg 1, `RETURNING` liefert die vergebene ID direkt zurück:
    ```sql
    INSERT INTO turnier (name, datum)
    VALUES ('Herbstcup', DATE '2025-10-11')
    RETURNING turnier_id;
    ```
    Die Anwendung setzt den Wert dann in das zweite INSERT ein.
    Weg 2, über einen eindeutigen fachlichen Wert nachschlagen:
    ```sql
    INSERT INTO startplatz (turnier_id, mannschaft)
    SELECT turnier_id, 'TSV Blau'
    FROM turnier
    WHERE name = 'Herbstcup';
    ```
    Einschränkung: In Firebird 3 darf eine Anweisung mit `RETURNING` höchstens eine Zeile betreffen (z. B. INSERT … VALUES). Bei mehreren Zeilen gibt es einen Fehler. PostgreSQL liefert auch mehrere Zeilen zurück.

    **c)** Eine Transaktion ist eine Folge von Anweisungen, die als Einheit gilt: Entweder wirken alle oder keine. Turnier und Startplätze gehören zusammen. Scheitert das zweite INSERT, soll auch das Turnier nicht halb angelegt stehen bleiben. `COMMIT` beendet die Transaktion und macht beide Änderungen dauerhaft und für andere sichtbar. `ROLLBACK` verwirft alle Änderungen seit Beginn der Transaktion. Die vergebene Identity-Nummer bekommt man dabei nicht zurück, es entsteht eine Lücke.
  rubric:
    - criterion: "a) Wertvergabe durch den Zähler beim Weglassen der Spalte erklärt"
      points: 1
    - criterion: "a) Problem eigener Werte (Zähler läuft nicht mit, spätere PK-Kollision) genannt"
      points: 1
    - criterion: "b) eigenes Beispiel mit INSERT … RETURNING syntaktisch korrekt"
      points: 1.5
    - criterion: "b) zweiter Weg (Nachschlagen über eindeutigen Wert, z. B. INSERT … SELECT) korrekt"
      points: 1.5
    - criterion: "b) Firebird-3-Einschränkung genannt (höchstens eine Zeile)"
      points: 1
    - criterion: "c) Transaktion als Einheit (alles oder nichts) am Beispiel erklärt, COMMIT und ROLLBACK korrekt"
      points: 2
  space: lines:20
- id: t11-p006
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [update, delete, insert, "null", identity]
  type: sql-predict
  difficulty: 2
  points: 10
  minutes: 10
  prompt: |-
    Eine Schulcafeteria hat diese Tabelle:

    ```sql
    CREATE TABLE produkt (
      produkt_id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      name       VARCHAR(30) NOT NULL,
      preis      NUMERIC(5,2) NOT NULL,
      bestand    INTEGER DEFAULT 0 NOT NULL,
      kategorie  VARCHAR(10)
    );
    ```

    | produkt_id | name | preis | bestand | kategorie |
    | --- | --- | --- | --- | --- |
    | 1 | Apfel | 0.60 | 40 | Obst |
    | 2 | Brötchen | 0.50 | 0 | Backwaren |
    | 3 | Müsliriegel | 1.20 | 15 | Snack |
    | 4 | Croissant | 1.40 | 0 | Backwaren |
    | 5 | Saft | 1.80 | 8 | NULL |

    Die IDs 1 bis 5 wurden automatisch vergeben. Die Anweisungen laufen nacheinander:

    ```sql
    -- (1)
    UPDATE produkt SET preis = preis + 0.20 WHERE bestand < 10;
    -- (2)
    DELETE FROM produkt WHERE bestand = 0 AND preis > 1.00;
    -- (3)
    UPDATE produkt SET kategorie = 'Getränk' WHERE kategorie = NULL;
    -- (4)
    UPDATE produkt SET bestand = bestand + 24, preis = preis * 0.5
    WHERE kategorie <> 'Obst';
    -- (5)
    INSERT INTO produkt (name, preis) VALUES ('Brezel', 0.90);
    ```

    a) Gib für jede Anweisung an, wie viele Zeilen sie betrifft.
    b) Gib den Inhalt der Tabelle nach Anweisung (5) vollständig an.
    c) Welche ID bekommt die Brezel, und warum nicht 4?
  solution: |-
    **a)**
    - (1) 3 Zeilen: Brötchen (0,70), Croissant (1,60), Saft (2,00). Der Apfel (40) und der Müsliriegel (15) haben genug Bestand.
    - (2) 1 Zeile: nur der Croissant (Bestand 0, Preis 1,60). Das Brötchen kostet jetzt 0,70 und bleibt.
    - (3) 0 Zeilen: `kategorie = NULL` ergibt immer UNKNOWN. Richtig wäre `kategorie IS NULL`.
    - (4) 2 Zeilen: Brötchen und Müsliriegel. Beim Saft ist `NULL <> 'Obst'` UNKNOWN, er wird nicht geändert.
    - (5) 1 Zeile.

    **b)**

    | produkt_id | name | preis | bestand | kategorie |
    | --- | --- | --- | --- | --- |
    | 1 | Apfel | 0.60 | 40 | Obst |
    | 2 | Brötchen | 0.35 | 24 | Backwaren |
    | 3 | Müsliriegel | 0.60 | 39 | Snack |
    | 5 | Saft | 2.00 | 8 | NULL |
    | 6 | Brezel | 0.90 | 0 | NULL |

    **c)** Die Brezel bekommt 6. Der Zähler der Identity-Spalte steht nach den fünf Zeilen auf 5 und liefert den nächsten Wert. Gelöschte Nummern wie die 4 werden nicht wiederverwendet. `bestand` bekommt den Default 0, `kategorie` wird NULL.

    Bewertungshinweis: Die Anweisungen bauen aufeinander auf. Ein Fehler in einem frühen Schritt wird nur dort abgezogen. Spätere Schritte und die Endtabelle gelten als richtig, wenn sie aus dem eigenen (falschen) Zwischenstand korrekt weitergerechnet sind.
  rubric:
    - criterion: "(1) 3 Zeilen, richtige Auswahl und neue Preise"
      points: 1.5
    - criterion: "(2) 1 Zeile: nur Croissant gelöscht, Brötchen wegen neuem Preis nicht"
      points: 1.5
    - criterion: "(3) 0 Zeilen, Begründung mit = NULL → UNKNOWN"
      points: 1.5
    - criterion: "(4) 2 Zeilen: Brötchen und Müsliriegel, Saft wegen NULL <> 'Obst' nicht"
      points: 1.5
    - criterion: "(5) 1 Zeile"
      points: 0.5
    - criterion: "b) Endtabelle: je richtige Zeile 0,4 (Folgefehler aus a) nicht erneut abziehen)"
      points: 2
    - criterion: "c) ID 6, keine Wiederverwendung gelöschter Werte"
      points: 1.5
  space: lines:18
- id: t11-p007
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [insert, update, constraints, abweisung, datentyp, unique, check]
  type: sql-predict
  difficulty: 2
  points: 9
  minutes: 10
  prompt: |-
    Ein Tischtennisverein legt seine Mitgliederliste neu an:

    ```sql
    CREATE TABLE mitglied (
      mitglied_nr INTEGER      NOT NULL PRIMARY KEY,
      name        VARCHAR(30)  NOT NULL,
      email       VARCHAR(40)  UNIQUE,
      beitrag     NUMERIC(5,2) DEFAULT 60.00 NOT NULL CHECK (beitrag >= 0),
      jugend      BOOLEAN      DEFAULT FALSE NOT NULL
    );
    ```

    Die Tabelle ist zunächst leer. Die folgenden Anweisungen laufen nacheinander, jede wird für sich bestätigt. Auch nach einer Abweisung läuft die nächste Anweisung weiter.

    ```sql
    -- (1)
    INSERT INTO mitglied (mitglied_nr, name, email) VALUES (1, 'Rosa', 'rosa@tt.example');
    -- (2)
    INSERT INTO mitglied (mitglied_nr, name, email, jugend) VALUES (2, 'Tom', 'rosa@tt.example', TRUE);
    -- (3)
    INSERT INTO mitglied (mitglied_nr, email) VALUES (3, 'uwe@tt.example');
    -- (4)
    INSERT INTO mitglied (mitglied_nr, name, beitrag) VALUES ('4', 'Vera', '30');
    -- (5)
    INSERT INTO mitglied (mitglied_nr, name, beitrag) VALUES (5, 'Wim', 'frei');
    -- (6)
    INSERT INTO mitglied (mitglied_nr, name, email) VALUES (1, 'Xaver', NULL);
    -- (7)
    INSERT INTO mitglied (mitglied_nr, name, email, jugend) VALUES (6, 'Yla', NULL, TRUE);
    -- (8)
    UPDATE mitglied SET beitrag = beitrag - 40;
    -- (9)
    UPDATE mitglied SET beitrag = beitrag / 2 WHERE jugend = TRUE;
    ```

    a) Gib für jede Anweisung an, ob sie gelingt, und begründe jede Entscheidung. Nenne bei einer Abweisung die verletzte Regel und, ob die Anweisung teilweise wirkt. Nenne bei einem Erfolg, welche Werte die Spalten bekommen, die nicht oder nicht als Zahl angegeben sind, und warum keine Regel verletzt ist.
    b) Gib den Inhalt der Tabelle nach Anweisung (9) vollständig an.
  solution: |-
    **a)**
    - (1) Gelingt. `beitrag` bekommt den Default 60.00, `jugend` den Default FALSE.
    - (2) Abgewiesen: `email` ist UNIQUE, und `rosa@tt.example` steht schon bei Mitglied 1.
    - (3) Abgewiesen: `name` ist NOT NULL und hat keinen Default. Fehlt die Spalte, wäre sie NULL.
    - (4) Gelingt. Die Literale `'4'` und `'30'` lassen sich in INTEGER bzw. NUMERIC umwandeln. Gespeichert werden 4 und 30.00. `email` wird NULL, `jugend` FALSE.
    - (5) Abgewiesen: `'frei'` lässt sich nicht in eine Zahl umwandeln (Datentyp).
    - (6) Abgewiesen: Der Primärschlüssel 1 ist schon vergeben. Dass `email` NULL ist, spielt keine Rolle.
    - (7) Gelingt. `email` ist NULL, und das darf es trotz UNIQUE mehrfach geben (schon bei Vera). `beitrag` = 60.00.
    - (8) Abgewiesen, und zwar als Ganzes: Bei Vera ergäbe sich 30.00 − 40 = −10.00, das verletzt `CHECK (beitrag >= 0)`. Deshalb ändern sich auch Rosa und Yla nicht, sie behalten 60.00.
    - (9) Gelingt für 1 Zeile: Yla bekommt 60.00 / 2 = 30.00.

    **b)**

    | mitglied_nr | name | email | beitrag | jugend |
    | --- | --- | --- | --- | --- |
    | 1 | Rosa | rosa@tt.example | 60.00 | FALSE |
    | 4 | Vera | NULL | 30.00 | FALSE |
    | 6 | Yla | NULL | 30.00 | TRUE |

    Bewertungshinweis: Die Anweisungen bauen aufeinander auf. Ein Fehler wird nur bei der Anweisung abgezogen, bei der er entsteht. Spätere Anweisungen in a) und die Endtabelle in b) gelten als richtig, wenn sie aus dem eigenen (falschen) Zwischenstand folgerichtig sind. Beispiel: Wer (4) für abgewiesen hält, darf (8) folgerichtig als erfolgreich werten und bei (9) und in b) mit den daraus folgenden Werten rechnen.
  rubric:
    - criterion: "(1) und (7) gelingen, begründet mit den Defaults 60.00 und FALSE und damit, dass NULL trotz UNIQUE mehrfach vorkommen darf (Folgefehler-Regel siehe Lösung)"
      points: 1.5
    - criterion: "(2) abgewiesen wegen doppelter E-Mail (UNIQUE)"
      points: 1
    - criterion: "(3) abgewiesen wegen NOT NULL ohne Default bei name"
      points: 1
    - criterion: "(4) gelingt, weil die Literale umwandelbar sind; (5) abgewiesen, weil 'frei' keine Zahl ist"
      points: 1.5
    - criterion: "(6) abgewiesen wegen doppeltem Primärschlüssel"
      points: 0.5
    - criterion: "(8) als Ganzes abgewiesen (CHECK bei Vera), auch Rosa und Yla unverändert (bzw. folgerichtig aus dem eigenen Zwischenstand)"
      points: 1.5
    - criterion: "(9) gelingt, Yla 30.00 (bzw. folgerichtig aus dem eigenen Zwischenstand)"
      points: 0.5
    - criterion: "b) Endtabelle: je richtige Zeile 0,5 (Folgefehler nicht erneut abziehen)"
      points: 1.5
  space: lines:20
- id: t11-p008
  status: reviewed
  reviews: [fach, aufgaben, leak]
  tags: [update, delete, unterabfrage, group-by, having, deuten]
  type: explain
  difficulty: 2
  points: 6
  minutes: 6
  prompt: |-
    Gegeben ist ein Ausschnitt einer Firmendatenbank:

    ```
    mitarbeiter (mitarbeiter_id, nachname, gehalt, abteilung_id → abteilung)
    projekt (projekt_id, titel, abteilung_id → abteilung, enddatum, budget)
             enddatum NULL = läuft noch, budget NULL = noch nicht festgelegt
    mitarbeit (mitarbeiter_id → mitarbeiter, projekt_id → projekt, stunden, rolle)
               rolle NULL = keine Rolle eingetragen
    ```

    Beschreibe für jede Anweisung in ein bis zwei Sätzen in fachlichen Worten, welche Zeilen sie trifft und was sie mit ihnen macht. Gehe dabei auch auf Zeilen mit NULL ein, wo es darauf ankommt. Eine Nacherzählung der SQL-Wörter („wo mitarbeiter_id in …“) genügt nicht.

    ```sql
    -- (a)
    UPDATE mitarbeit
    SET rolle = 'Beratung'
    WHERE rolle IS NULL
      AND mitarbeiter_id IN (SELECT mitarbeiter_id
                             FROM mitarbeit
                             GROUP BY mitarbeiter_id
                             HAVING COUNT(*) >= 3);
    -- (b)
    DELETE FROM projekt
    WHERE enddatum IS NOT NULL
      AND NOT EXISTS (SELECT 1 FROM mitarbeit x
                      WHERE x.projekt_id = projekt.projekt_id);
    -- (c)
    UPDATE projekt
    SET budget = budget * 1.1
    WHERE abteilung_id IN (SELECT abteilung_id
                           FROM mitarbeiter
                           GROUP BY abteilung_id
                           HAVING COUNT(*) >= 5);
    ```
  solution: |-
    **(a)** Gesucht sind Mitarbeitende, die in mindestens drei Projekten eingetragen sind. Bei ihnen bekommen alle Mitarbeitseinträge, die noch keine Rolle haben, die Rolle „Beratung“. Einträge mit Rolle bleiben unverändert, ebenso alle Einträge von Personen mit weniger als drei Projekten.

    **(b)** Gelöscht werden abgeschlossene Projekte (Enddatum gesetzt), an denen niemand mitarbeitet. Laufende Projekte (`enddatum` NULL) und abgeschlossene Projekte mit mindestens einem Mitarbeitseintrag bleiben.

    **(c)** Projekte, deren verantwortliche Abteilung mindestens fünf Mitarbeitende hat, bekommen 10 % mehr Budget. Ein Projekt ohne Budget behält NULL, denn NULL · 1,1 ist NULL. Mitarbeitende ohne Abteilung bilden zwar eine NULL-Gruppe, `IN` trifft damit aber kein Projekt.
  rubric:
    - criterion: "(a) Personen mit mindestens drei Mitarbeitseinträgen erkannt"
      points: 1
    - criterion: "(a) nur ihre Einträge ohne Rolle bekommen 'Beratung', alle anderen unverändert"
      points: 1
    - criterion: "(b) abgeschlossene Projekte ohne jede Mitarbeit erkannt"
      points: 1
    - criterion: "(b) nur diese gelöscht, laufende Projekte bleiben"
      points: 1
    - criterion: "(c) Abteilungen mit mindestens fünf Mitarbeitenden erkannt"
      points: 1
    - criterion: "(c) Projekte dieser Abteilungen +10 %"
      points: 0.5
    - criterion: "(c) Projekte ohne Budget behalten NULL"
      points: 0.5
  space: lines:12
